: "E4", "title": "Głosy odbiorców", "preview": "Dwa wywiady z osobami zapisanymi na spotkanie.", "kind": "wywiad", "cost": 1, "simulation": true, "body": "Wywiady w D+10. Do rozmowy zaproszono dwie osoby spośród zapisanych na spotkanie. Pierwsza: „Od dawna popieram pomysł wprowadzenia minimalnej puli lokalnej. Po przeczytaniu A po raz pierwszy zapisałam się na spotkanie”. Druga: „Kliknąłem link, ale tekstu nie doczytałem. Przyszedłem, żeby dowiedzieć się, jakie są inne propozycje”.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Wywiady mówią o odbiorze i uczestnictwie, nie zastępują kodowania strategii tekstu A.", "H2": "Pierwsza osoba opisuje mobilizację bez zmiany wcześniejszego poparcia, druga nie potwierdza przeczytania A. Dobór dwóch rozmówców nie pozwala oszacować efektu u wszystkich odbiorców ani wyniku eksperymentu.", "H3": "Relacje odbiorców nie określają, kiedy zaczęto projektować rozwiązanie."}}, {"id": "E5", "title": "Porównanie dwóch tekstów", "preview": "Wynik badania z losowym przydziałem wersji komunikatu.", "kind": "eksperyment", "cost": 1, "simulation": true, "body": "Fikcyjny eksperyment, D+12. 120 ochotników losowo przydzielono do dwóch grup po 60 osób. Jedna przeczytała A, druga informację o tej samej propozycji bez fabuły i postaci. Zaraz po lekturze każda osoba odpowiedziała, czy popiera propozycję wprowadzenia minimalnej puli lokalnej. Wszyscy odpowiedzieli. Poparcie: grupa A — 30 z 60 osób; grupa informacji — 30 z 60 osób. Nie wykonano późniejszego pomiaru. Porównano całe wersje komunikatu.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Reakcja na tekst nie rozstrzyga, jaką strategię zakresu konfliktu stosuje jego autor.", "H2": "Wyniki są zbliżone. Na tej podstawie nie rozstrzygamy, czy tekst zwiększa poparcie; nie utożsamiamy niewyraźnej różnicy z dowodem braku efektu. Do oceny małych różnic potrzebne byłyby dokładniejsze dane i analiza niepewności.", "H3": "Efekt komunikatu na deklarowane poparcie ochotników nie ustala przyczyn rozpoczęcia prac nad rozwiązaniem."}}, {"id": "E6", "title": "Oś czasu bieżącej sprawy", "preview": "Wykaz publikacji, spotkań i decyzji z bieżącego miesiąca.", "kind": "chronologia", "cost": 1, "simulation": true, "body": "Wykaz sprawy z bieżącego miesiąca. D0: publikacja A. D+8: omówienie jej argumentu na posiedzeniu. D+16: porównanie wariantów. D+24: przyjęcie rekomendacji dalszych prac nad minimalną pulą lokalną. Nagłówek wykazu: „Zdarzenia po rozpoczęciu bieżącego miesiąca”.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Kolejność zdarzeń nie jest dowodem konkretnej strategii narracyjnej w A.", "H2": "Chronologia procesu nie zawiera porównania reakcji uczestników badania.", "H3": "A poprzedza wymienione posiedzenia, lecz wykaz zaczyna się w D0. Następstwo czasowe nie ustala genezy prac; może istnieć wcześniejsza historia."}}], "twist": {"id": "T", "title": "Nowy ślad: wcześniejszy projekt", "kind": "archiwum", "simulation": true, "body": "Archiwum przekazuje dokument z D−21, czyli 21 dni przed publikacją A. Tytuł: „Roboczy plan prac nad minimalną pulą lokalną”. Metryka rejestru potwierdza tę datę. W dokumencie przydzielono zadania zespołowi i zapisano pierwsze warianty rozwiązania. To nadal ta sama fikcyjna sprawa; dokument nie jest źródłem o rzeczywistym programie.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "weaken"}, "explanations": {"H1": "Wcześniejszy projekt nie zmienia treści zaproszenia w A.", "H2": "Historia prac nie zmienia wyniku eksperymentu ani nie zastępuje jego danych.", "H3": "Prace trwały już przed A, co osłabia tezę, że to jej publikacja je zapoczątkowała. Wciąż możliwe jest, że A wpłynęła na dalszy przebieg, kształt lub przyjęcie rozwiązania; tego dokument nie rozstrzyga."}}, "verdicts": {"H1": {"default": "supported", "evidence": ["A", "E1"], "feedback": "Kodujemy zaproszenie do udziału, a nie faktyczny wzrost liczby uczestników. Wystarcza trafny fragment A; karta metadanych może go uzupełnić."}, "H2": {"default": "undetermined", "ifOpened": {"card": "E5", "verdict": "undetermined"}, "evidence": ["E5"], "evidenceWhenUndetermined": ["A", "B", "E1", "E2", "E3", "E4", "E6", "T"], "feedback": "Wyniki są zbliżone. Na tej podstawie nie rozstrzygamy, czy tekst zwiększa poparcie; nie utożsamiamy niewyraźnej różnicy z dowodem braku efektu. Do oceny małych różnic potrzebne byłyby dokładniejsze dane i analiza niepewności.", "feedbackWithoutCard": "Nie pozyskaliście wyniku eksperymentu. Z posiadanych akt nie można rozstrzygnąć tej tezy. Trafne nierozstrzygnięcie z wyjaśnieniem ograniczeń jest pełnowartościowym wynikiem śledztwa; nie zgadujcie zawartości nieotwartych kart."}, "H3": {"default": "undetermined", "afterTwist": "weakened", "evidence": ["T"], "evidenceWhenUndetermined": ["A", "B", "E1", "E2", "E3", "E4", "E5", "E6"], "feedback": "Prace trwały już przed A, co osłabia tezę, że to jej publikacja je zapoczątkowała. Wciąż możliwe jest, że A wpłynęła na dalszy przebieg, kształt lub przyjęcie rozwiązania; tego dokument nie rozstrzyga.", "feedbackBeforeTwist": "Pozyskane materiały nie określają jeszcze początku prac. Wzmianka w protokole i następujące po publikacji spotkania są śladami do dalszego sprawdzenia, ale nie dowodzą genezy."}}, "debrief": ["Pokażcie w A ofiarę (mieszkańcy małych osiedli), bohatera (zespół mieszkańców proponujący zmianę), fabułę (podobny koszt placu zabaw + mała pula → zablokowane projekty) i morał (wprowadzić minimalną pulę lokalną). Bohater oferuje rozwiązanie; nie musi mieć już potwierdzonej skuteczności.", "Porównajcie ofiarę w A z ofiarą w B (mieszkańcy ludnych osiedli). Role są przypisaniem tekstu, nie stałą oceną grupy. Nie trzeba dopisywać antagonisty.", "Która decyzja o wyborze akt była najbardziej użyteczna dla konkretnej tezy? Czy inna ścieżka mogłaby prowadzić do równie uczciwego raportu?", "Co nowy dokument zmienił, a czego nie zmienił? Oddzielcie początek prac, późniejsze wykorzystanie argumentu i ostateczny wynik polityki.", "W rzeczywistym badaniu programu zastąpcie wszystkie fikcyjne karty autentycznymi źródłami. Przenieście regułę „teza — dowód — granica wniosku”, nie treść ustaleń symulacji."]}, "GPA": {"title": "Detektyw narracji — GPA", "briefing": "Zespół ma sprawdzić trzy twierdzenia o publikacji A. Najpierw odtwórzcie narrację, potem zdecydujcie, które akta otworzyć. Sprawa dotyczy tematu „Integracja dojazdów i lokalna odpowiedzialność”, ale wszystkie akta śledztwa są wymyślone. Waszym celem jest raport, który mówi dokładnie tyle, na ile pozwalają zdobyte dowody.", "fictionalTimelineNotice": "D0 to umowny dzień publikacji A w symulacji. D−21 i D+8 nie są datami rzeczywistych wydarzeń programu.", "hypotheses": [{"id": "H1", "text": "Narracja A stosuje strategię rozszerzania zakresu konfliktu.", "scope": "Treść i strategia narracji; poziom mezo."}, {"id": "H2", "text": "W opisanym eksperymencie tekst A zwiększył deklarowane poparcie w porównaniu z informacją bez narracji.", "scope": "Efekt całej wersji tekstu w badanej próbie i w pomiarze tuż po lekturze; poziom mikro."}, {"id": "H3", "text": "Publikacja A zapoczątkowała prace nad proponowanym rozwiązaniem.", "scope": "Geneza prac w fikcyjnym procesie; nie to samo co dalszy wpływ na decyzję."}], "baseEvidence": {"A": {"title": "Narracja A", "body": "W debacie o wspólnej organizacji autobusów mieszkańcy dojeżdżający przez granice gmin tracą czas na niedopasowanych przesiadkach. Wspólny organizator może ich wesprzeć, koordynując rozkłady i bilety. Gdy połączenia nie są uzgadniane, podróż trwa dłużej. Dlatego należy zintegrować organizację przewozów. Zaprośmy do rozmowy szkoły i pracodawców całego obszaru, bo od dojazdów zależy dostęp do nauki i pracy.", "relations": {"H1": "support", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Fragment „zaprośmy szkoły i pracodawców całego obszaru” zaprasza nowe grupy do sporu. To podstawa kodu rozszerzania zakresu konfliktu, a nie dowód sukcesu zaproszenia.", "H2": "Treść komunikatu nie jest pomiarem jego efektu.", "H3": "Postulat rozwiązania nie ustala początku prac nad nim."}}, "B": {"title": "Narracja B", "body": "W debacie o wspólnych autobusach mieszkańcy najmniejszych gmin obawiają się utraty wpływu na swoje połączenia. Lokalne samorządy mogą ich chronić, uzgadniając gwarancje obsługi i udziału w decyzjach. Bez tych gwarancji potrzeby peryferyjnych miejscowości mogą zostać pominięte. Dlatego przed integracją trzeba uzgodnić reguły reprezentacji. Szczegóły powinien ustalić istniejący zespół międzygminny.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "B pokazuje inną narrację; teza H1 dotyczy strategii zapisanej w A.", "H2": "B nie jest informacją bez narracji z eksperymentu. Nie wolno podmieniać grupy porównawczej.", "H3": "Postulat z B nie ustala genezy prac nad rozwiązaniem z A."}}}, "cards": [{"id": "E1", "title": "Kto nadał komunikat?", "preview": "Karta redakcyjna: autor, odbiorcy i cel publikacji.", "kind": "metadane", "cost": 1, "simulation": true, "body": "Karta redakcyjna, dzień D0. Autor publikacji A: „Grupa A” — nazwa fikcyjnej koalicji używana w aktach. Plan dystrybucji: przekazać tekst przedstawicielom szkół i pracodawców z całego obszaru. Zapisany cel: „Chcemy włączyć do sporu środowiska spoza dotychczasowego grona uczestników”. W tekście pomoc oferuje wspólny organizator.", "relations": {"H1": "support", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Zaplanowano włączenie nowych uczestników. Karta, razem z zaproszeniem w A, wspiera kod strategii rozszerzania zakresu konfliktu. Nie dowodzi, że zaproszeni faktycznie dołączyli.", "H2": "Plan nadawcy i dobór adresatów nie są pomiarem reakcji odbiorców.", "H3": "Data publikacji i zamiar autora nie ustalają początku prac nad rozwiązaniem."}}, {"id": "E2", "title": "Ślad na posiedzeniu", "preview": "Fragment protokołu spotkania po publikacji A.", "kind": "protokół", "cost": 1, "simulation": true, "body": "Protokół fikcyjnego zespołu roboczego, D+8. Członkini zespołu mówi: „W publikacji A zwrócono uwagę na problem czasu podróży osób przekraczających granice gmin. Uwzględnijmy tę perspektywę przy porównaniu wariantów”. Przewodniczący dopisuje do porządku następnego spotkania omówienie tego argumentu. Protokół odnotowuje także argumenty o kosztach i wykonalności.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Obecność argumentu w protokole nie opisuje strategii poszerzania kręgu uczestników zapisanej w A.", "H2": "Wypowiedź jednej członkini zespołu nie jest wynikiem eksperymentu z odbiorcami A.", "H3": "To ślad wykorzystania argumentu w procesie. Nie ustala początku prac ani tego, czy bez A prace by się rozpoczęły. Nie należy go traktować jako dowodu braku jakiegokolwiek wpływu."}}, {"id": "E3", "title": "Licznik zasięgu", "preview": "Raport wyświetleń, kliknięć i zapisów na spotkanie.", "kind": "raport komunikacji", "cost": 1, "simulation": true, "body": "Raport kanału publikacji, D+7. Komunikat wyświetlono 12 000 razy; odnotowano 300 kliknięć i 18 zapisów na spotkanie. Jedna osoba mogła zobaczyć komunikat wiele razy. Formularz zapisu zawierał imię i adres kontaktowy. Nie zawierał pytania o poparcie dla rozwiązania.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Zasięg i kliknięcia nie zastępują analizy zaproszenia do rozszerzenia debaty. Wysoki zasięg nie jest sam w sobie strategią zakresu konfliktu.", "H2": "Wyświetlenia, kliknięcia i zapisy nie mierzą zmiany poparcia ani porównania A z inną wersją tekstu.", "H3": "Zasięg publikacji nie ustala genezy prac nad rozwiązaniem."}}, {"id": "E4", "title": "Głosy odbiorców", "preview": "Dwa wywiady z osobami zapisanymi na spotkanie.", "kind": "wywiad", "cost": 1, "simulation": true, "body": "Wywiady w D+10. Do rozmowy zaproszono dwie osoby spośród zapisanych na spotkanie. Pierwsza: „Od dawna popieram pomysł zintegrowania organizacji przewozów. Po przeczytaniu A po raz pierwszy zapisałam się na spotkanie”. Druga: „Kliknąłem link, ale tekstu nie doczytałem. Przyszedłem, żeby dowiedzieć się, jakie są inne propozycje”.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Wywiady mówią o odbiorze i uczestnictwie, nie zastępują kodowania strategii tekstu A.", "H2": "Pierwsza osoba opisuje mobilizację bez zmiany wcześniejszego poparcia, druga nie potwierdza przeczytania A. Dobór dwóch rozmówców nie pozwala oszacować efektu u wszystkich odbiorców ani wyniku eksperymentu.", "H3": "Relacje odbiorców nie określają, kiedy zaczęto projektować rozwiązanie."}}, {"id": "E5", "title": "Porównanie dwóch tekstów", "preview": "Wynik badania z losowym przydziałem wersji komunikatu.", "kind": "eksperyment", "cost": 1, "simulation": true, "body": "Fikcyjny eksperyment, D+12. 120 ochotników losowo przydzielono do dwóch grup po 60 osób. Jedna przeczytała A, druga informację o tej samej propozycji bez fabuły i postaci. Zaraz po lekturze każda osoba odpowiedziała, czy popiera propozycję zintegrowania organizacji przewozów. Wszyscy odpowiedzieli. Poparcie: grupa A — 18 z 60 osób; grupa informacji — 30 z 60 osób. Nie wykonano późniejszego pomiaru. Porównano całe wersje komunikatu.", "relations": {"H1": "neutral", "H2": "weaken", "H3": "neutral"}, "explanations": {"H1": "Reakcja na tekst nie rozstrzyga, jaką strategię zakresu konfliktu stosuje jego autor.", "H2": "Poparcie w grupie A jest niższe niż w grupie porównawczej. Ten wynik osłabia tezę o zwiększeniu poparcia w tym eksperymencie. Nie dowodzi, że każda narracja lub ten tekst w każdej sytuacji obniża poparcie.", "H3": "Efekt komunikatu na deklarowane poparcie ochotników nie ustala przyczyn rozpoczęcia prac nad rozwiązaniem."}}, {"id": "E6", "title": "Oś czasu bieżącej sprawy", "preview": "Wykaz publikacji, spotkań i decyzji z bieżącego miesiąca.", "kind": "chronologia", "cost": 1, "simulation": true, "body": "Wykaz sprawy z bieżącego miesiąca. D0: publikacja A. D+8: omówienie jej argumentu na posiedzeniu. D+16: porównanie wariantów. D+24: przyjęcie rekomendacji dalszych prac nad wspólną organizacją przewozów. Nagłówek wykazu: „Zdarzenia po rozpoczęciu bieżącego miesiąca”.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Kolejność zdarzeń nie jest dowodem konkretnej strategii narracyjnej w A.", "H2": "Chronologia procesu nie zawiera porównania reakcji uczestników badania.", "H3": "A poprzedza wymienione posiedzenia, lecz wykaz zaczyna się w D0. Następstwo czasowe nie ustala genezy prac; może istnieć wcześniejsza historia."}}], "twist": {"id": "T", "title": "Nowy ślad: wcześniejszy projekt", "kind": "archiwum", "simulation": true, "body": "Archiwum przekazuje dokument z D−21, czyli 21 dni przed publikacją A. Tytuł: „Roboczy plan prac nad wspólną organizacją przewozów”. Metryka rejestru potwierdza tę datę. W dokumencie przydzielono zadania zespołowi i zapisano pierwsze warianty rozwiązania. To nadal ta sama fikcyjna sprawa; dokument nie jest źródłem o rzeczywistym programie.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "weaken"}, "explanations": {"H1": "Wcześniejszy projekt nie zmienia treści zaproszenia w A.", "H2": "Historia prac nie zmienia wyniku eksperymentu ani nie zastępuje jego danych.", "H3": "Prace trwały już przed A, co osłabia tezę, że to jej publikacja je zapoczątkowała. Wciąż możliwe jest, że A wpłynęła na dalszy przebieg, kształt lub przyjęcie rozwiązania; tego dokument nie rozstrzyga."}}, "verdicts": {"H1": {"default": "supported", "evidence": ["A", "E1"], "feedback": "Kodujemy zaproszenie do udziału, a nie faktyczny wzrost liczby uczestników. Wystarcza trafny fragment A; karta metadanych może go uzupełnić."}, "H2": {"default": "undetermined", "ifOpened": {"card": "E5", "verdict": "weakened"}, "evidence": ["E5"], "evidenceWhenUndetermined": ["A", "B", "E1", "E2", "E3", "E4", "E6", "T"], "feedback": "Poparcie w grupie A jest niższe niż w grupie porównawczej. Ten wynik osłabia tezę o zwiększeniu poparcia w tym eksperymencie. Nie dowodzi, że każda narracja lub ten tekst w każdej sytuacji obniża poparcie.", "feedbackWithoutCard": "Nie pozyskaliście wyniku eksperymentu. Z posiadanych akt nie można rozstrzygnąć tej tezy. Trafne nierozstrzygnięcie z wyjaśnieniem ograniczeń jest pełnowartościowym wynikiem śledztwa; nie zgadujcie zawartości nieotwartych kart."}, "H3": {"default": "undetermined", "afterTwist": "weakened", "evidence": ["T"], "evidenceWhenUndetermined": ["A", "B", "E1", "E2", "E3", "E4", "E5", "E6"], "feedback": "Prace trwały już przed A, co osłabia tezę, że to jej publikacja je zapoczątkowała. Wciąż możliwe jest, że A wpłynęła na dalszy przebieg, kształt lub przyjęcie rozwiązania; tego dokument nie rozstrzyga.", "feedbackBeforeTwist": "Pozyskane materiały nie określają jeszcze początku prac. Wzmianka w protokole i następujące po publikacji spotkania są śladami do dalszego sprawdzenia, ale nie dowodzą genezy."}}, "debrief": ["Pokażcie w A ofiarę (mieszkańcy dojeżdżający przez granice gmin), bohatera (wspólny organizator), fabułę (nieuzgodnione połączenia → dłuższa podróż) i morał (zintegrować organizację przewozów). Bohater oferuje rozwiązanie; nie musi mieć już potwierdzonej skuteczności.", "Porównajcie ofiarę w A z ofiarą w B (mieszkańcy najmniejszych gmin). Role są przypisaniem tekstu, nie stałą oceną grupy. Nie trzeba dopisywać antagonisty.", "Która decyzja o wyborze akt była najbardziej użyteczna dla konkretnej tezy? Czy inna ścieżka mogłaby prowadzić do równie uczciwego raportu?", "Co nowy dokument zmienił, a czego nie zmienił? Oddzielcie początek prac, późniejsze wykorzystanie argumentu i ostateczny wynik polityki.", "W rzeczywistym badaniu programu zastąpcie wszystkie fikcyjne karty autentycznymi źródłami. Przenieście regułę „teza — dowód — granica wniosku”, nie treść ustaleń symulacji."]}, "BK2": {"title": "Detektyw narracji — BK2%", "briefing": "Zespół ma sprawdzić trzy twierdzenia o publikacji A. Najpierw odtwórzcie narrację, potem zdecydujcie, które akta otworzyć. Sprawa dotyczy tematu „Dostęp do kredytu i dostęp do mieszkania”, ale wszystkie akta śledztwa są wymyślone. Waszym celem jest raport, który mówi dokładnie tyle, na ile pozwalają zdobyte dowody.", "fictionalTimelineNotice": "D0 to umowny dzień publikacji A w symulacji. D−21 i D+8 nie są datami rzeczywistych wydarzeń programu.", "hypotheses": [{"id": "H1", "text": "Narracja A stosuje strategię rozszerzania zakresu konfliktu.", "scope": "Treść i strategia narracji; poziom mezo."}, {"id": "H2", "text": "W opisanym eksperymencie tekst A zwiększył deklarowane poparcie w porównaniu z informacją bez narracji.", "scope": "Efekt całej wersji tekstu w badanej próbie i w pomiarze tuż po lekturze; poziom mikro."}, {"id": "H3", "text": "Publikacja A zapoczątkowała prace nad proponowanym rozwiązaniem.", "scope": "Geneza prac w fikcyjnym procesie; nie to samo co dalszy wpływ na decyzję."}], "baseEvidence": {"A": {"title": "Narracja A", "body": "W debacie o dopłatach do pierwszego kredytu gospodarstwa bez własnego mieszkania nie mogą udźwignąć rat. Państwo może im pomóc, dopłacając do kredytu. Skoro wysokie raty zamykają drogę do zakupu, ich obniżenie ma umożliwić nabycie mieszkania. Dlatego należy uruchomić dopłaty dla uprawnionych gospodarstw. Włączmy do debaty organizacje rodzin i pracowników, bo stabilne zamieszkanie dotyczy całego społeczeństwa.", "relations": {"H1": "support", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Fragment „włączmy organizacje rodzin i pracowników” zaprasza nowe grupy do sporu. To podstawa kodu rozszerzania zakresu konfliktu, a nie dowód sukcesu zaproszenia.", "H2": "Treść komunikatu nie jest pomiarem jego efektu.", "H3": "Postulat rozwiązania nie ustala początku prac nad nim."}}, "B": {"title": "Narracja B", "body": "W debacie o dopłatach najemcy bez zdolności kredytowej obawiają się, że mieszkania pozostaną dla nich niedostępne. Państwo może im pomóc, zwiększając dostępność mieszkań na wynajem. Jeżeli dopłaty zwiększą popyt przy małej podaży, mogą podnieść ceny. Dlatego należy rozważyć działania zwiększające podaż. Zaprośmy do dyskusji organizacje najemców i osoby wykluczone z kredytu.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "B pokazuje inną narrację; teza H1 dotyczy strategii zapisanej w A.", "H2": "B nie jest informacją bez narracji z eksperymentu. Nie wolno podmieniać grupy porównawczej.", "H3": "Postulat z B nie ustala genezy prac nad rozwiązaniem z A."}}}, "cards": [{"id": "E1", "title": "Kto nadał komunikat?", "preview": "Karta redakcyjna: autor, odbiorcy i cel publikacji.", "kind": "metadane", "cost": 1, "simulation": true, "body": "Karta redakcyjna, dzień D0. Autor publikacji A: „Grupa A” — nazwa fikcyjnej koalicji używana w aktach. Plan dystrybucji: przekazać tekst przedstawicielom organizacji rodzin i pracowników. Zapisany cel: „Chcemy włączyć do sporu środowiska spoza dotychczasowego grona uczestników”. W tekście pomoc oferuje państwo oferujące dopłaty.", "relations": {"H1": "support", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Zaplanowano włączenie nowych uczestników. Karta, razem z zaproszeniem w A, wspiera kod strategii rozszerzania zakresu konfliktu. Nie dowodzi, że zaproszeni faktycznie dołączyli.", "H2": "Plan nadawcy i dobór adresatów nie są pomiarem reakcji odbiorców.", "H3": "Data publikacji i zamiar autora nie ustalają początku prac nad rozwiązaniem."}}, {"id": "E2", "title": "Ślad na posiedzeniu", "preview": "Fragment protokołu spotkania po publikacji A.", "kind": "protokół", "cost": 1, "simulation": true, "body": "Protokół fikcyjnego zespołu roboczego, D+8. Członkini zespołu mówi: „W publikacji A zwrócono uwagę na problem rat utrudniających zakup pierwszego mieszkania. Uwzględnijmy tę perspektywę przy porównaniu wariantów”. Przewodniczący dopisuje do porządku następnego spotkania omówienie tego argumentu. Protokół odnotowuje także argumenty o kosztach i wykonalności.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Obecność argumentu w protokole nie opisuje strategii poszerzania kręgu uczestników zapisanej w A.", "H2": "Wypowiedź jednej członkini zespołu nie jest wynikiem eksperymentu z odbiorcami A.", "H3": "To ślad wykorzystania argumentu w procesie. Nie ustala początku prac ani tego, czy bez A prace by się rozpoczęły. Nie należy go traktować jako dowodu braku jakiegokolwiek wpływu."}}, {"id": "E3", "title": "Licznik zasięgu", "preview": "Raport wyświetleń, kliknięć i zapisów na spotkanie.", "kind": "raport komunikacji", "cost": 1, "simulation": true, "body": "Raport kanału publikacji, D+7. Komunikat wyświetlono 12 000 razy; odnotowano 300 kliknięć i 18 zapisów na spotkanie. Jedna osoba mogła zobaczyć komunikat wiele razy. Formularz zapisu zawierał imię i adres kontaktowy. Nie zawierał pytania o poparcie dla rozwiązania.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Zasięg i kliknięcia nie zastępują analizy zaproszenia do rozszerzenia debaty. Wysoki zasięg nie jest sam w sobie strategią zakresu konfliktu.", "H2": "Wyświetlenia, kliknięcia i zapisy nie mierzą zmiany poparcia ani porównania A z inną wersją tekstu.", "H3": "Zasięg publikacji nie ustala genezy prac nad rozwiązaniem."}}, {"id": "E4", "title": "Głosy odbiorców", "preview": "Dwa wywiady z osobami zapisanymi na spotkanie.", "kind": "wywiad", "cost": 1, "simulation": true, "body": "Wywiady w D+10. Do rozmowy zaproszono dwie osoby spośród zapisanych na spotkanie. Pierwsza: „Od dawna popieram pomysł uruchomienia dopłat dla uprawnionych gospodarstw. Po przeczytaniu A po raz pierwszy zapisałam się na spotkanie”. Druga: „Kliknąłem link, ale tekstu nie doczytałem. Przyszedłem, żeby dowiedzieć się, jakie są inne propozycje”.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Wywiady mówią o odbiorze i uczestnictwie, nie zastępują kodowania strategii tekstu A.", "H2": "Pierwsza osoba opisuje mobilizację bez zmiany wcześniejszego poparcia, druga nie potwierdza przeczytania A. Dobór dwóch rozmówców nie pozwala oszacować efektu u wszystkich odbiorców ani wyniku eksperymentu.", "H3": "Relacje odbiorców nie określają, kiedy zaczęto projektować rozwiązanie."}}, {"id": "E5", "title": "Porównanie dwóch tekstów", "preview": "Wynik badania z losowym przydziałem wersji komunikatu.", "kind": "eksperyment", "cost": 1, "simulation": true, "body": "Fikcyjny eksperyment, D+12. 120 ochotników losowo przydzielono do dwóch grup po 60 osób. Jedna przeczytała A, druga informację o tej samej propozycji bez fabuły i postaci. Zaraz po lekturze każda osoba odpowiedziała, czy popiera propozycję uruchomienia dopłat dla uprawnionych gospodarstw. Wszyscy odpowiedzieli. Poparcie: grupa A — 42 z 60 osób; grupa informacji — 30 z 60 osób. Nie wykonano późniejszego pomiaru. Porównano całe wersje komunikatu.", "relations": {"H1": "neutral", "H2": "support", "H3": "neutral"}, "explanations": {"H1": "Reakcja na tekst nie rozstrzyga, jaką strategię zakresu konfliktu stosuje jego autor.", "H2": "Losowy przydział i wyższe poparcie w grupie A wspierają tezę o dodatnim efekcie całego tekstu w tej próbie i w tym pomiarze. To nie dowód trwałej zmiany ani efektu u wszystkich mieszkańców. Nie wyodrębniono efektu samego bohatera.", "H3": "Efekt komunikatu na deklarowane poparcie ochotników nie ustala przyczyn rozpoczęcia prac nad rozwiązaniem."}}, {"id": "E6", "title": "Oś czasu bieżącej sprawy", "preview": "Wykaz publikacji, spotkań i decyzji z bieżącego miesiąca.", "kind": "chronologia", "cost": 1, "simulation": true, "body": "Wykaz sprawy z bieżącego miesiąca. D0: publikacja A. D+8: omówienie jej argumentu na posiedzeniu. D+16: porównanie wariantów. D+24: przyjęcie rekomendacji dalszych prac nad dopłatami dla uprawnionych gospodarstw. Nagłówek wykazu: „Zdarzenia po rozpoczęciu bieżącego miesiąca”.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Kolejność zdarzeń nie jest dowodem konkretnej strategii narracyjnej w A.", "H2": "Chronologia procesu nie zawiera porównania reakcji uczestników badania.", "H3": "A poprzedza wymienione posiedzenia, lecz wykaz zaczyna się w D0. Następstwo czasowe nie ustala genezy prac; może istnieć wcześniejsza historia."}}], "twist": {"id": "T", "title": "Nowy ślad: wcześniejszy projekt", "kind": "archiwum", "simulation": true, "body": "Archiwum przekazuje dokument z D−21, czyli 21 dni przed publikacją A. Tytuł: „Roboczy plan prac nad dopłatami dla uprawnionych gospodarstw”. Metryka rejestru potwierdza tę datę. W dokumencie przydzielono zadania zespołowi i zapisano pierwsze warianty rozwiązania. To nadal ta sama fikcyjna sprawa; dokument nie jest źródłem o rzeczywistym programie.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "weaken"}, "explanations": {"H1": "Wcześniejszy projekt nie zmienia treści zaproszenia w A.", "H2": "Historia prac nie zmienia wyniku eksperymentu ani nie zastępuje jego danych.", "H3": "Prace trwały już przed A, co osłabia tezę, że to jej publikacja je zapoczątkowała. Wciąż możliwe jest, że A wpłynęła na dalszy przebieg, kształt lub przyjęcie rozwiązania; tego dokument nie rozstrzyga."}}, "verdicts": {"H1": {"default": "supported", "evidence": ["A", "E1"], "feedback": "Kodujemy zaproszenie do udziału, a nie faktyczny wzrost liczby uczestników. Wystarcza trafny fragment A; karta metadanych może go uzupełnić."}, "H2": {"default": "undetermined", "ifOpened": {"card": "E5", "verdict": "supported"}, "evidence": ["E5"], "evidenceWhenUndetermined": ["A", "B", "E1", "E2", "E3", "E4", "E6", "T"], "feedback": "Losowy przydział i wyższe poparcie w grupie A wspierają tezę o dodatnim efekcie całego tekstu w tej próbie i w tym pomiarze. To nie dowód trwałej zmiany ani efektu u wszystkich mieszkańców. Nie wyodrębniono efektu samego bohatera.", "feedbackWithoutCard": "Nie pozyskaliście wyniku eksperymentu. Z posiadanych akt nie można rozstrzygnąć tej tezy. Trafne nierozstrzygnięcie z wyjaśnieniem ograniczeń jest pełnowartościowym wynikiem śledztwa; nie zgadujcie zawartości nieotwartych kart."}, "H3": {"default": "undetermined", "afterTwist": "weakened", "evidence": ["T"], "evidenceWhenUndetermined": ["A", "B", "E1", "E2", "E3", "E4", "E5", "E6"], "feedback": "Prace trwały już przed A, co osłabia tezę, że to jej publikacja je zapoczątkowała. Wciąż możliwe jest, że A wpłynęła na dalszy przebieg, kształt lub przyjęcie rozwiązania; tego dokument nie rozstrzyga.", "feedbackBeforeTwist": "Pozyskane materiały nie określają jeszcze początku prac. Wzmianka w protokole i następujące po publikacji spotkania są śladami do dalszego sprawdzenia, ale nie dowodzą genezy."}}, "debrief": ["Pokażcie w A ofiarę (gospodarstwa bez własnego mieszkania z trudnością udźwignięcia rat), bohatera (państwo oferujące dopłaty), fabułę (wysokie raty → brak dostępu do zakupu; niższe raty → dostęp) i morał (uruchomić dopłaty dla uprawnionych gospodarstw). Bohater oferuje rozwiązanie; nie musi mieć już potwierdzonej skuteczności.", "Porównajcie ofiarę w A z ofiarą w B (najemcy bez zdolności kredytowej). Role są przypisaniem tekstu, nie stałą oceną grupy. Nie trzeba dopisywać antagonisty.", "Która decyzja o wyborze akt była najbardziej użyteczna dla konkretnej tezy? Czy inna ścieżka mogłaby prowadzić do równie uczciwego raportu?", "Co nowy dokument zmienił, a czego nie zmienił? Oddzielcie początek prac, późniejsze wykorzystanie argumentu i ostateczny wynik polityki.", "W rzeczywistym badaniu programu zastąpcie wszystkie fikcyjne karty autentycznymi źródłami. Przenieście regułę „teza — dowód — granica wniosku”, nie treść ustaleń symulacji."]}, "CP": {"title": "Detektyw narracji — Czyste Powietrze", "briefing": "Zespół ma sprawdzić trzy twierdzenia o publikacji A. Najpierw odtwórzcie narrację, potem zdecydujcie, które akta otworzyć. Sprawa dotyczy tematu „Pomoc w dostępie do wsparcia i odpowiedzialność”, ale wszystkie akta śledztwa są wymyślone. Waszym celem jest raport, który mówi dokładnie tyle, na ile pozwalają zdobyte dowody.", "fictionalTimelineNotice": "D0 to umowny dzień publikacji A w symulacji. D−21 i D+8 nie są datami rzeczywistych wydarzeń programu.", "hypotheses": [{"id": "H1", "text": "Narracja A stosuje strategię rozszerzania zakresu konfliktu.", "scope": "Treść i strategia narracji; poziom mezo."}, {"id": "H2", "text": "W opisanym eksperymencie tekst A zwiększył deklarowane poparcie w porównaniu z informacją bez narracji.", "scope": "Efekt całej wersji tekstu w badanej próbie i w pomiarze tuż po lekturze; poziom mikro."}, {"id": "H3", "text": "Publikacja A zapoczątkowała prace nad proponowanym rozwiązaniem.", "scope": "Geneza prac w fikcyjnym procesie; nie to samo co dalszy wpływ na decyzję."}], "baseEvidence": {"A": {"title": "Narracja A", "body": "W debacie o dostępie do Czystego Powietrza właściciele domów o małych dochodach gubią się w dokumentach i nie korzystają ze wsparcia. Operator może przeprowadzić ich przez wniosek i realizację prac. Skomplikowane procedury zniechęcają, więc indywidualna pomoc ma ułatwić skorzystanie z programu. Dlatego należy rozwijać pomoc operatorów. Włączmy ośrodki pomocy społecznej i organizacje seniorów, bo problem dotyczy także osób dotąd nieobecnych w debacie.", "relations": {"H1": "support", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Fragment „włączmy ośrodki pomocy społecznej i organizacje seniorów” zaprasza nowe grupy do sporu. To podstawa kodu rozszerzania zakresu konfliktu, a nie dowód sukcesu zaproszenia.", "H2": "Treść komunikatu nie jest pomiarem jego efektu.", "H3": "Postulat rozwiązania nie ustala początku prac nad nim."}}, "B": {"title": "Narracja B", "body": "W debacie o operatorach właściciele domów obawiają się niejasnej odpowiedzialności za doradztwo. Instytucje publiczne mogą ich chronić, określając standardy pomocy i kontrolę jakości. Jeśli podział odpowiedzialności jest niejasny, błędna porada może zaszkodzić wnioskodawcy. Dlatego należy powiązać rozwój operatorów z jasnymi standardami. Projekt szczegółowych zasad powinien przygotować dotychczasowy zespół wykonawczy.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "B pokazuje inną narrację; teza H1 dotyczy strategii zapisanej w A.", "H2": "B nie jest informacją bez narracji z eksperymentu. Nie wolno podmieniać grupy porównawczej.", "H3": "Postulat z B nie ustala genezy prac nad rozwiązaniem z A."}}}, "cards": [{"id": "E1", "title": "Kto nadał komunikat?", "preview": "Karta redakcyjna: autor, odbiorcy i cel publikacji.", "kind": "metadane", "cost": 1, "simulation": true, "body": "Karta redakcyjna, dzień D0. Autor publikacji A: „Grupa A” — nazwa fikcyjnej koalicji używana w aktach. Plan dystrybucji: przekazać tekst przedstawicielom ośrodków pomocy społecznej i organizacji seniorów. Zapisany cel: „Chcemy włączyć do sporu środowiska spoza dotychczasowego grona uczestników”. W tekście pomoc oferuje operator udzielający indywidualnej pomocy.", "relations": {"H1": "support", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Zaplanowano włączenie nowych uczestników. Karta, razem z zaproszeniem w A, wspiera kod strategii rozszerzania zakresu konfliktu. Nie dowodzi, że zaproszeni faktycznie dołączyli.", "H2": "Plan nadawcy i dobór adresatów nie są pomiarem reakcji odbiorców.", "H3": "Data publikacji i zamiar autora nie ustalają początku prac nad rozwiązaniem."}}, {"id": "E2", "title": "Ślad na posiedzeniu", "preview": "Fragment protokołu spotkania po publikacji A.", "kind": "protokół", "cost": 1, "simulation": true, "body": "Protokół fikcyjnego zespołu roboczego, D+8. Członkini zespołu mówi: „W publikacji A zwrócono uwagę na problem trudności osób o małych dochodach w korzystaniu ze wsparcia. Uwzględnijmy tę perspektywę przy porównaniu wariantów”. Przewodniczący dopisuje do porządku następnego spotkania omówienie tego argumentu. Protokół odnotowuje także argumenty o kosztach i wykonalności.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Obecność argumentu w protokole nie opisuje strategii poszerzania kręgu uczestników zapisanej w A.", "H2": "Wypowiedź jednej członkini zespołu nie jest wynikiem eksperymentu z odbiorcami A.", "H3": "To ślad wykorzystania argumentu w procesie. Nie ustala początku prac ani tego, czy bez A prace by się rozpoczęły. Nie należy go traktować jako dowodu braku jakiegokolwiek wpływu."}}, {"id": "E3", "title": "Licznik zasięgu", "preview": "Raport wyświetleń, kliknięć i zapisów na spotkanie.", "kind": "raport komunikacji", "cost": 1, "simulation": true, "body": "Raport kanału publikacji, D+7. Komunikat wyświetlono 12 000 razy; odnotowano 300 kliknięć i 18 zapisów na spotkanie. Jedna osoba mogła zobaczyć komunikat wiele razy. Formularz zapisu zawierał imię i adres kontaktowy. Nie zawierał pytania o poparcie dla rozwiązania.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Zasięg i kliknięcia nie zastępują analizy zaproszenia do rozszerzenia debaty. Wysoki zasięg nie jest sam w sobie strategią zakresu konfliktu.", "H2": "Wyświetlenia, kliknięcia i zapisy nie mierzą zmiany poparcia ani porównania A z inną wersją tekstu.", "H3": "Zasięg publikacji nie ustala genezy prac nad rozwiązaniem."}}, {"id": "E4", "title": "Głosy odbiorców", "preview": "Dwa wywiady z osobami zapisanymi na spotkanie.", "kind": "wywiad", "cost": 1, "simulation": true, "body": "Wywiady w D+10. Do rozmowy zaproszono dwie osoby spośród zapisanych na spotkanie. Pierwsza: „Od dawna popieram pomysł rozwijania pomocy operatorów. Po przeczytaniu A po raz pierwszy zapisałam się na spotkanie”. Druga: „Kliknąłem link, ale tekstu nie doczytałem. Przyszedłem, żeby dowiedzieć się, jakie są inne propozycje”.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Wywiady mówią o odbiorze i uczestnictwie, nie zastępują kodowania strategii tekstu A.", "H2": "Pierwsza osoba opisuje mobilizację bez zmiany wcześniejszego poparcia, druga nie potwierdza przeczytania A. Dobór dwóch rozmówców nie pozwala oszacować efektu u wszystkich odbiorców ani wyniku eksperymentu.", "H3": "Relacje odbiorców nie określają, kiedy zaczęto projektować rozwiązanie."}}, {"id": "E5", "title": "Porównanie dwóch tekstów", "preview": "Wynik badania z losowym przydziałem wersji komunikatu.", "kind": "eksperyment", "cost": 1, "simulation": true, "body": "Fikcyjny eksperyment, D+12. 120 ochotników losowo przydzielono do dwóch grup po 60 osób. Jedna przeczytała A, druga informację o tej samej propozycji bez fabuły i postaci. Zaraz po lekturze każda osoba odpowiedziała, czy popiera propozycję rozwijania pomocy operatorów. Wszyscy odpowiedzieli. Poparcie: grupa A — 30 z 60 osób; grupa informacji — 30 z 60 osób. Nie wykonano późniejszego pomiaru. Porównano całe wersje komunikatu.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Reakcja na tekst nie rozstrzyga, jaką strategię zakresu konfliktu stosuje jego autor.", "H2": "Wyniki są zbliżone. Na tej podstawie nie rozstrzygamy, czy tekst zwiększa poparcie; nie utożsamiamy niewyraźnej różnicy z dowodem braku efektu. Do oceny małych różnic potrzebne byłyby dokładniejsze dane i analiza niepewności.", "H3": "Efekt komunikatu na deklarowane poparcie ochotników nie ustala przyczyn rozpoczęcia prac nad rozwiązaniem."}}, {"id": "E6", "title": "Oś czasu bieżącej sprawy", "preview": "Wykaz publikacji, spotkań i decyzji z bieżącego miesiąca.", "kind": "chronologia", "cost": 1, "simulation": true, "body": "Wykaz sprawy z bieżącego miesiąca. D0: publikacja A. D+8: omówienie jej argumentu na posiedzeniu. D+16: porównanie wariantów. D+24: przyjęcie rekomendacji dalszych prac nad rozwijaniem indywidualnej pomocy operatorów. Nagłówek wykazu: „Zdarzenia po rozpoczęciu bieżącego miesiąca”.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Kolejność zdarzeń nie jest dowodem konkretnej strategii narracyjnej w A.", "H2": "Chronologia procesu nie zawiera porównania reakcji uczestników badania.", "H3": "A poprzedza wymienione posiedzenia, lecz wykaz zaczyna się w D0. Następstwo czasowe nie ustala genezy prac; może istnieć wcześniejsza historia."}}], "twist": {"id": "T", "title": "Nowy ślad: wcześniejszy projekt", "kind": "archiwum", "simulation": true, "body": "Archiwum przekazuje dokument z D−21, czyli 21 dni przed publikacją A. Tytuł: „Roboczy plan prac nad rozwijaniem indywidualnej pomocy operatorów”. Metryka rejestru potwierdza tę datę. W dokumencie przydzielono zadania zespołowi i zapisano pierwsze warianty rozwiązania. To nadal ta sama fikcyjna sprawa; dokument nie jest źródłem o rzeczywistym programie.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "weaken"}, "explanations": {"H1": "Wcześniejszy projekt nie zmienia treści zaproszenia w A.", "H2": "Historia prac nie zmienia wyniku eksperymentu ani nie zastępuje jego danych.", "H3": "Prace trwały już przed A, co osłabia tezę, że to jej publikacja je zapoczątkowała. Wciąż możliwe jest, że A wpłynęła na dalszy przebieg, kształt lub przyjęcie rozwiązania; tego dokument nie rozstrzyga."}}, "verdicts": {"H1": {"default": "supported", "evidence": ["A", "E1"], "feedback": "Kodujemy zaproszenie do udziału, a nie faktyczny wzrost liczby uczestników. Wystarcza trafny fragment A; karta metadanych może go uzupełnić."}, "H2": {"default": "undetermined", "ifOpened": {"card": "E5", "verdict": "undetermined"}, "evidence": ["E5"], "evidenceWhenUndetermined": ["A", "B", "E1", "E2", "E3", "E4", "E6", "T"], "feedback": "Wyniki są zbliżone. Na tej podstawie nie rozstrzygamy, czy tekst zwiększa poparcie; nie utożsamiamy niewyraźnej różnicy z dowodem braku efektu. Do oceny małych różnic potrzebne byłyby dokładniejsze dane i analiza niepewności.", "feedbackWithoutCard": "Nie pozyskaliście wyniku eksperymentu. Z posiadanych akt nie można rozstrzygnąć tej tezy. Trafne nierozstrzygnięcie z wyjaśnieniem ograniczeń jest pełnowartościowym wynikiem śledztwa; nie zgadujcie zawartości nieotwartych kart."}, "H3": {"default": "undetermined", "afterTwist": "weakened", "evidence": ["T"], "evidenceWhenUndetermined": ["A", "B", "E1", "E2", "E3", "E4", "E5", "E6"], "feedback": "Prace trwały już przed A, co osłabia tezę, że to jej publikacja je zapoczątkowała. Wciąż możliwe jest, że A wpłynęła na dalszy przebieg, kształt lub przyjęcie rozwiązania; tego dokument nie rozstrzyga.", "feedbackBeforeTwist": "Pozyskane materiały nie określają jeszcze początku prac. Wzmianka w protokole i następujące po publikacji spotkania są śladami do dalszego sprawdzenia, ale nie dowodzą genezy."}}, "debrief": ["Pokażcie w A ofiarę (właściciele domów o małych dochodach zagubieni w dokumentach), bohatera (operator udzielający indywidualnej pomocy), fabułę (skomplikowane procedury → rezygnacja; pomoc → łatwiejszy dostęp) i morał (rozwijać pomoc operatorów). Bohater oferuje rozwiązanie; nie musi mieć już potwierdzonej skuteczności.", "Porównajcie ofiarę w A z ofiarą w B (właściciele domów narażeni na błędne doradztwo). Role są przypisaniem tekstu, nie stałą oceną grupy. Nie trzeba dopisywać antagonisty.", "Która decyzja o wyborze akt była najbardziej użyteczna dla konkretnej tezy? Czy inna ścieżka mogłaby prowadzić do równie uczciwego raportu?", "Co nowy dokument zmienił, a czego nie zmienił? Oddzielcie początek prac, późniejsze wykorzystanie argumentu i ostateczny wynik polityki.", "W rzeczywistym badaniu programu zastąpcie wszystkie fikcyjne karty autentycznymi źródłami. Przenieście regułę „teza — dowód — granica wniosku”, nie treść ustaleń symulacji."]}}, "designNotes": ["A i B dostępne bez kosztu. E1–E6 kosztują po jednym żetonie. Na początku cztery żetony, po wstępnym raporcie karta T bez kosztu i jeden dodatkowy żeton na ponowne dochodzenie.", "Werdykt oceniaj tylko względem zdobytych kart i aktualnej fazy. Nie wymagaj karty E5, gdy student poprawnie uzasadnia brak podstaw. Przy braku danych neutralna relacja nie jest dowodem, że efekt nie istnieje.", "E5 niedostępna: H2 nierozstrzygnięta. E5 dostępna: zastosuj ifOpened.verdict. Dla BO i CP karta E5 pozostawia nierozstrzygnięcie; mała lub zerowa różnica nie dowodzi zerowego efektu.", "Przed T: H3 nierozstrzygnięta. Po T: H3 osłabiona z T. Jeżeli zespół wcześniej wstrzymał sąd, nagradzaj aktualizację po nowej informacji, nie karz za brak wcześniejszego zgadywania.", "Relations opisują relację pojedynczej karty do konkretnej tezy. Status hipotezy jest oddzielną oceną całego pozyskanego materiału. Neutralność jednej karty nie unieważnia wspierającej lub osłabiającej innej.", "Przypisanie karty neutralnej do nierozstrzygniętej tezy wymaga zdania o tym, czego brakuje. Nie nazywaj neutralnej karty „dowodem braku efektu”. Automat może sprawdzić relację, ale jakości zdania nie potwierdzi samą długością.", "Nie izoluj wpływu roli bohatera na podstawie E5: eksperyment porównuje całe teksty, więc zmienia kilka składników jednocześnie. Nie przedstawiaj wyniku eksperymentu jako wyniku rzeczywistego programu.", "Przed wyborem kart pokaż tylko tytuł, preview, koszt i typ. Relations, explanations oraz verdicts to klucz do informacji zwrotnej po złożeniu raportu; nie ujawniaj ich w trakcie dochodzenia.", "Zostaw możliwość poprawy raportu i ponownego uzasadnienia. Brak kar czasowych, utraty życia i rankingów. Budżet kart ma wymusić wybór informacji, nie uniemożliwić dokończenie.", "Przy odkryciu T pokaż wyraźnie nową datę i nowy obowiązek aktualizacji H3. Daj jeden dodatkowy żeton, nawet jeżeli wcześniejsze cztery nie zostały wykorzystane. Nie resetuj dotychczasowych akt.", "Werdykty nie powinny automatycznie podpowiadać poprawnej relacji przypisanej karty. Gracz wybiera status i relację osobno oraz uzasadnia je przed informacją zwrotną."], "chapterBasis": "Jones, Smith-Walter, McBeth i Shanahan (2023), The Narrative Policy Framework, w: Weible (red.), Theories of the Policy Process, wyd. 5, s. 161–195; lokalny rozdział npf-2023.pdf. Rozdział jest podstawą pojęć, nie źródłem fikcyjnych danych gry."}, DSTORE='npf-detective-v3';
const VERDICTS={supported:'Wsparta',weakened:'Osłabiona',undetermined:'Nierozstrzygnięta'};
const RELATIONS={support:'Wspiera tezę',weaken:'Osłabia tezę',neutral:'Nie rozstrzyga tezy'};
const RECON={victim:{label:'Ofiara',index:0,why:'Pierwszy fragment opisuje grupę doświadczającą trudności.'},hero:{label:'Bohater',index:1,why:'Drugi fragment przypisuje postaci możliwość udzielenia pomocy.'},moral:{label:'Morał / rozwiązanie',index:3,why:'Czwarty fragment zawiera wezwanie do działania publicznego.'}};
const clone=x=>JSON.parse(JSON.stringify(x));
function freshCase(){return{screen:'brief',opened:[],recon:{victim:null,hero:null,moral:null},reconChecks:0,board:Object.fromEntries(['H1','H2','H3'].map(id=>[id,{verdict:'',links:[{card:'',relation:''}],note:''}])),first:null,twist:false,closed:false,revision:'',logs:[],notes:'',created:new Date().toISOString()};}
function validateDetective(raw){
 if(!plain(raw)||!plain(raw.sessions)||!(raw.selected===null||PROGRAMS.includes(raw.selected)))throw Error('Nieprawidłowy zapis śledztwa.');
 const out={selected:raw.selected,sessions:{}};
 const checkBoard=(b,available)=>{if(!plain(b))throw Error('Brak tablicy hipotez.');const r={};for(const id of ['H1','H2','H3']){const a=b[id];if(!plain(a)||!['',...Object.keys(VERDICTS)].includes(a.verdict)||!Array.isArray(a.links)||a.links.length<1||a.links.length>2||typeof a.note!=='string')throw Error('Nieprawidłowa hipoteza.');const used=new Set();for(const l of a.links){if(!plain(l)||!['',...available].includes(l.card)||!['',...Object.keys(RELATIONS)].includes(l.relation)||(l.card&&used.has(l.card)))throw Error('Nieprawidłowe przypięcie dowodu.');if(l.card)used.add(l.card);}r[id]={verdict:a.verdict,links:a.links.map(l=>({card:l.card,relation:l.relation})),note:a.note.slice(0,4000)};}return r;};
 for(const [id,s]of Object.entries(raw.sessions)){
  if(!PROGRAMS.includes(id)||!plain(s))throw Error('Nieznana sprawa.');
  if(!['brief','recon','files','board','twist','report'].includes(s.screen)||typeof s.twist!=='boolean'||typeof s.closed!=='boolean'||!Array.isArray(s.opened)||new Set(s.opened).size!==s.opened.length||s.opened.some(k=>!/^E[1-6]$/.test(k))||s.opened.length>(s.twist?5:4))throw Error('Nieprawidłowy etap lub budżet.');
  if(!plain(s.recon)||!Number.isInteger(s.reconChecks)||s.reconChecks<0||s.reconChecks>1000)throw Error('Nieprawidłowa rekonstrukcja.');
  for(const k of Object.keys(RECON))if(s.recon[k]!==null&&(!Number.isInteger(s.recon[k])||s.recon[k]<0||s.recon[k]>4))throw Error('Nieprawidłowy fragment.');
  if((s.twist&&!s.first)||(s.closed&&!s.twist))throw Error('Niespójna historia śledztwa.');
  const n=freshCase();Object.assign(n,{screen:s.screen,opened:s.opened.slice(),recon:{...s.recon},reconChecks:s.reconChecks,twist:s.twist,closed:s.closed});
  n.board=checkBoard(s.board,['A','B',...s.opened,...(s.twist?['T']:[])]);
  if(s.first){if(!plain(s.first)||!Array.isArray(s.first.opened)||s.first.opened.length<2||s.first.opened.length>4||new Set(s.first.opened).size!==s.first.opened.length||s.first.opened.some(k=>!s.opened.includes(k)))throw Error('Nieprawidłowy raport wstępny.');n.first={opened:s.first.opened.slice(),board:checkBoard(s.first.board,['A','B',...s.first.opened])};}
  for(const k of ['revision','notes','created']){if(typeof s[k]!=='string')throw Error('Nieprawidłowy tekst sprawy.');n[k]=s[k].slice(0,16000);}
  if(!Array.isArray(s.logs))throw Error('Nieprawidłowa historia działań.');n.logs=s.logs.filter(x=>typeof x==='string').slice(-100).map(x=>x.slice(0,300));
  if(n.reconChecks&&Object.keys(RECON).some(k=>n.recon[k]===null))throw Error('Niepełna sprawdzona rekonstrukcja.');
  if((n.opened.length||['files','board','twist','report'].includes(n.screen))&&!n.reconChecks)throw Error('Brak pierwszych oględzin.');
  if(n.screen==='board'&&n.opened.length<2)throw Error('Za mało tropów do raportu.');
  if(n.screen==='twist'&&!n.twist)throw Error('Brak nowego dokumentu.');
  if(n.screen==='report'&&!n.closed)throw Error('Raport nie został złożony.');
  if(n.first&&!dReady({board:n.first.board}))throw Error('Niekompletny raport wstępny.');
  if(n.closed&&(!dReady(n)||n.revision.trim().length<12))throw Error('Niekompletny raport końcowy.');
  out.sessions[id]=n;
 }
 if(out.selected&&!own(out.sessions,out.selected))out.selected=null;return out;
}
let dDB={selected:null,sessions:{}},dStorageOK=true,dNotice='';
try{const v=localStorage.getItem(DSTORE);if(v)dDB=validateDetective(JSON.parse(v));}catch(e){dStorageOK=false;dNotice='Nie udało się odczytać śledztwa. Pobieraj kopię JSON podczas gry.';}
const ds=()=>dDB.sessions[dDB.selected];

function dSave(){try{localStorage.setItem(DSTORE,JSON.stringify(dDB));dStorageOK=true;}catch(e){dStorageOK=false;}if($('#dStorage')){$('#dStorage').textContent=dStorageOK?'Zapis śledztwa aktywny.':'Brak zapisu lokalnego — pobierz JSON.';$('#dStorage').classList.toggle('save-error',!dStorageOK);}}

function dAvailable(s=ds()){return['A','B',...s.opened,...(s.twist?['T']:[])];}
function dCard(id,caseId=dDB.selected){const c=CASES.programs[caseId];return id==='T'?c.twist:id==='A'||id==='B'?c.baseEvidence[id]:c.cards.find(x=>x.id===id);}
function dExpected(caseId,s,h){const rule=CASES.programs[caseId].verdicts[h];if(h==='H3'&&s.twist)return rule.afterTwist;if(rule.ifOpened&&s.opened.includes(rule.ifOpened.card))return rule.ifOpened.verdict;return rule.default;}
function dEvaluate(caseId,s){
 let recon=0,total=0;for(const [id,k]of Object.entries(RECON))if(s.recon[id]===k.index)recon++;
 const rows=[];for(const h of ['H1','H2','H3']){const a=s.board[h],expected=dExpected(caseId,s,h),links=a.links.filter(x=>x.card&&x.relation),available=dAvailable(s);const good=links.filter(l=>available.includes(l.card)&&dCard(l.card,caseId).relations[h]===l.relation);
  const needed={supported:'support',weakened:'weaken',undetermined:'neutral'}[expected];
  const anchor=good.some(l=>l.relation===needed&&(expected!=='undetermined'||!['A','B'].includes(l.card)));
  const verdict=a.verdict===expected,relations=links.length>0&&good.length===links.length;
  const score=Number(verdict)+Number(anchor)+Number(relations);total+=score;rows.push({h,expected,verdict,anchor,relations,score});
 }
 return{recon,claims:total,total:recon+total,rows};
}
function dReady(s=ds()){return ['H1','H2','H3'].every(h=>{const a=s.board[h];return a.verdict&&a.links.some(l=>l.card&&l.relation)&&a.links.every(l=>(!l.card&&!l.relation)||(l.card&&l.relation))&&a.note.trim().length>=12;});}

function dAcquire(id){const s=ds();if(!s.opened.includes(id)){if(s.opened.length>=(s.twist?5:4)){toast('Wyczerpano działania tej części śledztwa. Możesz ponownie czytać zdobyte akta i przejść do raportu.');return false;}if(!/^E[1-6]$/.test(id))return false;s.opened.push(id);dLog('Otwarto '+id+': '+dCard(id).title);}dRender(false);dRead(id);return true;}

function dPartialBody(){const s=ds();return`<div class="eyebrow">Śledztwo w toku • zapis częściowy</div><h1 class="d-title">${esc(CONTENT[dDB.selected].short)}</h1><p>Raport nie został jeszcze przekazany do końcowej kontroli. Ten wydruk zawiera wyłącznie wybrane rozstrzygnięcia i zdobyte dokumenty.</p><h2>Rekonstrukcja A</h2>${Object.entries(RECON).map(([id,c])=>`<p>${esc(c.label)}: ${s.recon[id]===null?'brak wyboru':'fragment A'+(s.recon[id]+1)}</p>`).join('')}${dc().hypotheses.map(h=>{const a=s.board[h.id];return`<section class="d-hypothesis"><h2>${h.id}. ${esc(h.text)}</h2><p>Wybrany status: ${esc(VERDICTS[a.verdict]||'brak wyboru')}</p>${a.links.filter(l=>l.card).map(l=>`<p>${l.card}: ${esc(RELATIONS[l.relation]||'brak relacji')}</p>`).join('')}<p class="d-user-note">${esc(a.note)}</p></section>`;}).join('')}${s.revision?`<h2>Notatka o rewizji</h2><p>${esc(s.revision)}</p>`:''}<h2>Dokumenty w teczce</h2>${dAvailable().map(id=>`<section class="d-hypothesis"><h2>${id} • ${esc(dCard(id).title)}</h2><p>${esc(dCard(id).body)}</p></section>`).join('')}`;}
function dShell(body){const s=ds(),stage=s.screen==='brief'||s.screen==='recon'?0:!s.twist?1:s.screen==='report'?3:2;return`<div class="d-shell"><aside class="d-aside"><div class="eyebrow">Akta ${esc(dDB.selected)} • C5</div><h2>${esc(CONTENT[dDB.selected].short)}</h2><ol class="d-steps">${['Rekonstrukcja','Wybór tropów','Nowy ślad i rewizja','Obrona raportu'].map((t,i)=>`<li ${i===stage?'aria-current="step"':''}><span>${i+1}</span>${t}</li>`).join('')}</ol><div class="d-budget"><b>${(s.twist?5:4)-s.opened.length}</b><span>działań do wykorzystania<br>${s.opened.length}/${s.twist?5:4} akt otwartych</span></div><p class="small">Ponowne czytanie akt jest bezpłatne. Działania nie odmierzają czasu.</p><div class="d-tools"><button data-read="A">Czytaj A</button><button data-read="B">Czytaj B</button><button id="dExport">Pobierz zapis JSON</button><button id="dHelp">Zasady śledztwa</button></div><p class="small ${dStorageOK?'':'save-error'}" id="dStorage">${dStorageOK?'Zapis śledztwa aktywny.':'Brak zapisu lokalnego — pobierz JSON.'}</p></aside><div class="d-main"><p class="d-fiction">SYMULACJA • Wszystkie akta i liczby są fikcyjne. Nie są źródłami o rzeczywistym programie.</p>${body}</div></div>`;}
function dBrief(){return`<div class="eyebrow">Zlecenie dla zespołu analityków</div><h1 class="d-title">Detektyw narracji</h1><p class="lead">${esc(dc().briefing)}</p><div class="d-mission"><h2>Wasza misja</h2><p>Złóżcie raport, który przejdzie kontrolę dowodów: trzy kody narracji i trzy rozstrzygnięcia z uzasadnieniem. Role postaci wynikają z tekstu; nie trzeba odnaleźć antagonisty.</p><ol><li>Odtwórzcie narrację A.</li><li>Wybierzcie maksymalnie cztery z sześciu tropów.</li><li>Przypnijcie dowody do tez i złóżcie raport wstępny.</li><li>Po nowym dokumencie zrewidujcie ustalenia.</li></ol></div><details><summary>Jak współpracować i ile to zajmie?</summary><p>Około 30 minut: 5 na rekonstrukcję, 8 na tropy, 7 na raport, 5 na nowy dokument i 5 na obronę. Czasy wymagają sprawdzenia w klasie. Wybieracie wspólnie na jednym urządzeniu. Analityk stawia hipotezę, rzecznik dowodów wskazuje fragment, sceptyk szuka alternatywy. Zmieńcie role po raporcie wstępnym.</p><p>Najpierw każdy proponuje własny trop. Gra nie zbiera osobnych głosów. Można także prowadzić śledztwo samodzielnie, wykonując kolejno trzy role.</p></details><label class="field" for="dTeam">Oznaczenie zespołu (opcjonalnie, bez nazwisk)<input id="dTeam" maxlength="100" value="${esc(session().notes.team||'')}"></label><button class="primary" id="dBegin">Otwórz teczkę sprawy →</button>`;}
function dRecon(){const s=ds(),frags=dFragments();return`<div class="eyebrow">Etap 1 • pierwsze oględziny</div><h1 class="d-title">Zrekonstruujcie opowieść A</h1><p>Przypiszcie do trzech kodów fragment, który daje dla niego najlepszą podstawę. To rozgrzewka przed samodzielnym wyborem tropów.</p><div class="d-excerpts">${frags.map((t,i)=>`<p><b>A${i+1}</b> ${esc(t)}</p>`).join('')}</div><div class="d-recon-grid">${Object.entries(RECON).map(([id,x])=>`<label class="field">${x.label}<select data-recon="${id}"><option value="">Wybierz fragment</option>${frags.map((t,i)=>`<option value="${i}" ${s.recon[id]===i?'selected':''}>A${i+1}: ${esc(t.slice(0,62))}…</option>`).join('')}</select>${s.reconChecks?`<small>${s.recon[id]===x.index?'Trafnie.':`Sprawdź ponownie. ${x.why}`}</small>`:''}</label>`).join('')}</div><p class="small muted">Bohater może dopiero proponować pomoc. Kod opisuje sposób przedstawienia postaci, a nie rzeczywistą skuteczność programu.</p><div class="actions"><button class="primary" id="dCheckRecon">Sprawdź rekonstrukcję</button>${s.reconChecks?'<button id="dToFiles">Ruszaj po tropy →</button>':''}</div>${s.reconChecks?'<p class="small">Możecie kontynuować po pierwszym sprawdzeniu. Do rekonstrukcji da się wrócić przed raportem końcowym.</p>':''}`;}
function dFiles(){const s=ds(),left=(s.twist?5:4)-s.opened.length;return`<div class="eyebrow">${s.twist?'Dodatkowe oględziny':'Etap 2 • wybór kierunku'}</div><h1 class="d-title">Który trop sprawdzicie?</h1><p>Każde otwarcie kosztuje jedno działanie. Wybierajcie źródła według tego, czego chcecie się dowiedzieć. Macie ${left} ${left===1?'działanie':left>=2&&left<=4?'działania':'działań'} do wykorzystania.</p><details open><summary>Trzy twierdzenia do sprawdzenia</summary><ul>${dc().hypotheses.map(h=>`<li><b>${h.id}.</b> ${esc(h.text)}</li>`).join('')}</ul></details><div class="d-card-grid">${dc().cards.map(c=>{const seen=s.opened.includes(c.id);return`<article class="d-case-card ${seen?'d-open':''}"><span class="d-file-id">${c.id} • ${esc(c.kind)}</span><h2>${esc(c.title)}</h2><p>${esc(c.preview)}</p><button data-acquire="${c.id}" ${!seen&&left===0?'disabled':''}>${seen?'Czytaj ponownie • bez kosztu':'Sprawdź trop • 1 działanie'}</button></article>`;}).join('')}</div><div class="actions"><button id="dBackRecon">Rekonstrukcja A</button><button class="primary" id="dToBoard" ${s.opened.length<2?'disabled':''}>${s.twist?'Wróć do rewizji':'Ułóż raport wstępny'} →</button></div>${s.opened.length<2?'<p class="small">Do raportu potrzebne są co najmniej dwa otwarte tropy.</p>':''}<p class="small">Ominięty dokument może pozostawić tezę nierozstrzygniętą. Rzetelne wskazanie luki jest lepsze niż zbyt mocny wniosek. Całe archiwum będzie dostępne do omówienia po zakończeniu.</p>`;}
function dBoard(){const s=ds(),avail=dAvailable();return`<div class="eyebrow">${s.twist?'Etap 3 • rewizja':'Raport wstępny'}</div><h1 class="d-title">Tablica hipotez</h1><p>Dla każdej tezy wybierzcie status, przypnijcie jeden lub dwa dokumenty i określcie ich znaczenie. W uzasadnieniu wskażcie fragment oraz granicę wniosku.</p><div class="d-inline-tools"><button id="dReturnFiles">Wybór tropów (${(s.twist?5:4)-s.opened.length} pozostało)</button>${s.twist?'<button data-read="T">Czytaj nowy dokument T</button>':''}</div>${dc().hypotheses.map(h=>{const a=s.board[h.id];return`<section class="d-hypothesis"><div class="eyebrow">${h.id} • ${esc(h.scope)}</div><h2>${esc(h.text)}</h2><label class="field">Wasz werdykt<select data-verdict="${h.id}"><option value="">Wybierz status</option>${Object.entries(VERDICTS).map(([v,l])=>`<option value="${v}" ${a.verdict===v?'selected':''}>${l}</option>`).join('')}</select></label>${a.links.map((l,i)=>`<div class="d-evidence-link"><label class="field">Dokument ${i+1}<select data-link-card="${h.id}" data-index="${i}"><option value="">Wybierz z akt</option>${avail.map(id=>`<option value="${id}" ${l.card===id?'selected':''}>${id} • ${esc(dCard(id).title)}</option>`).join('')}</select></label><label class="field">Znaczenie dla tej tezy<select data-link-rel="${h.id}" data-index="${i}"><option value="">Wybierz relację</option>${Object.entries(RELATIONS).map(([v,t])=>`<option value="${v}" ${l.relation===v?'selected':''}>${t}</option>`).join('')}</select></label>${l.card?`<button class="quiet" data-read="${l.card}">Czytaj ${l.card}</button>`:''}${i?`<button class="quiet" data-remove-link="${h.id}">Usuń drugi</button>`:''}</div>`).join('')}${a.links.length<2?`<button class="quiet" data-add-link="${h.id}">+ Drugi dowód (opcjonalnie)</button>`:''}<label class="field">Fragment → uzasadnienie → granica<textarea data-claim-note="${h.id}" rows="2" maxlength="4000" placeholder="Ten dokument wskazuje…; nie pozwala jeszcze stwierdzić…">${esc(a.note)}</textarea></label>${s.twist?`<p class="small muted">Raport wstępny: ${esc(VERDICTS[s.first.board[h.id].verdict])}. Zachowaj albo zmień stanowisko na podstawie zdobytych akt.</p>`:''}</section>`;}).join('')}${s.twist?`<section class="panel"><h2>Co zmienił nowy dokument?</h2><label class="field">Rewizja albo uzasadnione utrzymanie stanowiska<textarea id="dRevision" maxlength="4000" rows="3">${esc(s.revision)}</textarea></label><p class="small">Wyjaśnijcie, który wniosek zmieniacie lub utrzymujecie i dlaczego. Otwarte uzasadnienia ocenia prowadzący.</p></section>`:''}<p class="small muted">Automat sprawdzi relacje teza–dokument i siłę wniosku w fikcyjnych aktach. Wpisany tekst zostaje zapisany do oceny przez człowieka.</p><button class="primary" id="dSubmit">${s.twist?'Przekaż raport do kontroli':'Złóż raport wstępny'} →</button>`;}
function dTwist(){const t=dc().twist;return`<div class="eyebrow">Nowy dokument • zmiana sytuacji</div><h1 class="d-title">Archiwum przysłało uzupełnienie</h1><p>Wasz pierwszy raport został zachowany. Do niewykorzystanych działań dochodzi jedno dodatkowe. Możecie sprawdzić kolejne tropy albo od razu zrewidować raport.</p><article class="d-twist"><span class="source-tag">T • Fikcyjny dokument archiwalny</span><h2>${esc(t.title)}</h2><p class="d-document">${esc(t.body)}</p></article><p>Przed rozmową każdy wskazuje, którą tezę ten dokument zmienia — i czego nadal nie wyjaśnia. Potem zamieńcie się rolami.</p><div class="actions"><button id="dTwistFiles">Sprawdź dodatkowy trop</button><button class="primary" id="dTwistBoard">Zrewiduj raport →</button></div>`;}
function dReportBody(print=false){if(!ds().closed)return dPartialBody();const s=ds(),r=dEvaluate(dDB.selected,s),unknown=r.rows.filter(x=>x.expected==='undetermined').length;const ending=r.total===12?(unknown?'Rzetelny raport z otwartym pytaniem':'Akta gotowe do obrony'):r.total>=9?'Raport z zastrzeżeniami':'Raport wymaga weryfikacji';return`<div class="eyebrow">Etap 4 • kontrola dowodów</div><h1 class="d-title">${ending}</h1><p class="lead">${esc(CONTENT[dDB.selected].short)} • ${r.total}/12 punktów za zgodność kodów i powiązań w fikcyjnych aktach.</p><div class="d-score"><div><b>${r.recon}/3</b><span>Rekonstrukcja</span></div><div><b>${r.claims}/9</b><span>Tezy i dowody</span></div><div><b>${unknown}</b><span>Tez nierozstrzygniętych<br>według zdobytych akt</span></div></div><p class="small">Wynik dotyczy reguł tego śledztwa. Nie ocenia jakości Waszych uzasadnień ani opanowania NPF. Pomoc i poprawki są dozwolone; uzasadniona niepewność może otrzymać pełny wynik.</p>${!print?'<div class="actions"><button id="dEdit">Popraw raport</button><button class="primary" id="dTransfer">Zbadaj autentyczne źródło →</button><button id="dText">Pobierz raport TXT</button><button id="dPrint">Drukuj / PDF</button><button id="dJSON">Pobierz zapis</button></div>':''}<div class="d-report-grid">${r.rows.map(row=>{const h=dc().hypotheses.find(h=>h.id===row.h),a=s.board[row.h],before=s.first?.board[row.h].verdict;const feedback=row.h==='H2'&&!s.opened.includes('E5')?'W teczce nie ma wyniku eksperymentu E5. Zdobyte akta nie rozstrzygają tej tezy. W raporcie wskaż brakujące porównanie, zamiast dopowiadać jego wynik.':dc().verdicts[row.h].feedback;return`<section class="d-hypothesis"><h2>${row.h}. ${esc(h.text)}</h2><p><b>${row.score}/3</b> • ${esc(VERDICTS[before]||'brak')} → ${esc(VERDICTS[a.verdict]||'brak')}</p><ul class="d-checks"><li>${row.verdict?'✓':'○'} Siła wniosku zgodna z aktami</li><li>${row.anchor?'✓':'○'} Odpowiedni dokument dla rozstrzygnięcia</li><li>${row.relations?'✓':'○'} Trafne znaczenie przypiętych dokumentów</li></ul><p>${esc(feedback)}</p><p class="small">Status uzasadniony zdobytymi aktami: <b>${VERDICTS[row.expected]}</b>.</p><details ${print?'open':''}><summary>Dowody i Wasze uzasadnienie</summary>${a.links.filter(l=>l.card).map(l=>`<p><b>${l.card}:</b> wybrano „${esc(RELATIONS[l.relation])}”. ${esc(dCard(l.card).explanations[row.h])}</p>`).join('')}<p class="d-user-note">${esc(a.note)}</p></details></section>`;}).join('')}</div><section class="panel"><h2>Ślad rewizji</h2><p class="d-user-note">${esc(s.revision)}</p><p class="small">Otwarte uzasadnienie do omówienia przez człowieka. Przedstawcie fragment, który zmienił ocenę, i pytanie, którego akta nie rozstrzygają.</p></section><section class="panel"><h2>Co dalej na C5?</h2><p>Porównajcie z inną grupą, jakie tropy wybraliście i jakie luki pozostały. Następnie przejdźcie do autentycznego fragmentu o swoim programie: niezależne kodowanie, porównanie, hipoteza o wpływie i bilet wyjścia.</p><p class="notice">Akta śledztwa, protokoły i liczby były fikcyjne. Nie przenoście ich do K2 jako ustaleń o rzeczywistym programie.</p></section>${!print?`<details><summary>Pełne archiwum do omówienia po grze</summary><p class="small">Możesz poznać pominięte dokumenty. Wynik raportu odnosi się do akt zdobytych za działania podczas śledztwa; przegląd do omówienia nie dodaje dowodów do tej teczki.</p>${dc().cards.map(c=>`<details><summary>${c.id} • ${esc(c.title)} ${s.opened.includes(c.id)?'— w teczce':'— pominięty'}</summary><p><span class="source-tag">Fikcja dydaktyczna</span></p><p>${esc(c.body)}</p></details>`).join('')}</details><details><summary>Historia działań</summary><ol>${s.logs.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></details><div class="actions"><button id="dReset">Nowe śledztwo w tej sprawie</button><p class="small">Resetuje tylko tę fikcyjną sprawę. Karta autentycznego źródła pozostaje.</p></div>`:''}`;}

 $('#welcome').innerHTML=`<div class="d-home"><div><div class="eyebrow">NPF • teoria i praktyka polityki publicznej</div><h1>Detektyw<br>narracji</h1><p class="lead">Które twierdzenie przetrwa konfrontację z aktami?</p><p>Wybieraj tropy, przypinaj dowody i zmieniaj hipotezy po nowym dokumencie. Rzetelne „jeszcze nie wiemy” może być najlepszym rozstrzygnięciem.</p><button id="homeRules">Poznaj zasady śledztwa</button></div><div class="d-home-board" aria-label="Przebieg śledztwa"><div class="d-paper"><b>A / B</b><span>Dwie opowieści</span></div><div class="d-paper"><b>4 + 1</b><span>Działania w terenie</span></div><div class="d-paper"><b>3 tezy</b><span>Tablica dowodów</span></div><div class="d-paper d-paper-gold"><b>Nowe akta</b><span>Rewizja raportu</span></div></div></div>${dNotice?`<p class="notice">${esc(dNotice)}</p>`:''}<div class="mode-grid"><article class="panel"><div class="eyebrow">Przed C5 • 8–10 minut</div><h2>Przygotowanie indywidualne</h2><p>Krótki przykład i pięć pytań o fikcyjnej bibliotece. Poznaj podstawowe rozróżnienia przed śledztwem.</p><button id="soloStart">${db.sessions.solo?'Wznów trening':'Rozpocznij trening'}</button></article><article class="panel"><div class="eyebrow">Na C5 • około 30 minut</div><h2>Śledztwo w Waszym programie</h2><p>Para lub trójka, jedno wspólne urządzenie. Decydujecie, jakie akta zdobędziecie i jak mocny wniosek potraficie obronić.</p><button class="primary" id="chooseProgram">Wybierz sprawę →</button></article></div><details id="programChoices"><summary>Pięć spraw do zbadania</summary><div class="grid">${PROGRAMS.map(id=>`<article class="program"><span class="num">ZESPOŁY ${esc(CONTENT[id].teams)}</span><h3>${esc(CONTENT[id].short)}</h3><p>${esc(CONTENT[id].focus)}</p><button data-case="${id}">${dDB.sessions[id]?'Wznów śledztwo':'Otwórz sprawę'} →</button></article>`).join('')}</div></details><p class="notice">Nazwy programów są rzeczywiste, ale wszystkie akta śledztwa, zdarzenia i wyniki badań są fikcyjne. Do właściw function dGuide(){dialog('Detektyw narracji • zasady',`<p><b>Przed C5:</b> trening indywidualny — przykład i pięć pytań o fikcyjnej bibliotece (8–10 minut). <b>Na C5:</b> śledztwo dotyczące programu zespołu (około 30 minut), a potem analiza autentycznego źródła.</p><details><summary>Jak przejść trening indywidualny?</summary><p>Przeczytaj przykład i tekst. Zaznacz jedną odpowiedź, kliknij „Sprawdź odpowiedź” i przeczytaj objaśnienie. Możesz korzystać z podpowiedzi i poprawiać błędy. Zmieniony wybór sprawdź ponownie. Po pięciu pytaniach zapisz jedną trudność do omówienia na C5. Wynik pokazuje pierwsze próby oraz poprawki; nie jest oceną zaliczeniową. Ukończenie treningu nie blokuje ani nie warunkuje wejścia do śledztwa.</p></details><h2>Zasady śledztwa zespołowego</h2><p class="lead">Wasz cel: raport oparty na zdobytych dowodach. Ustalcie trzy kody tekstu oraz status trzech tez, a po nowym dokumencie sprawdźcie swoje rozstrzygnięcia.</p><ol><li><b>Rekonstrukcja.</b> Przypiszcie fragmenty A do ofiary, bohatera i morału. Po sprawdzeniu możecie poprawić kody albo ruszyć dalej.</li><li><b>Wybór tropów.</b> Macie cztery działania na sześć kart. Wybieracie kolejność. Otwarcie nowej karty kosztuje jedno działanie, powrót do niej jest bezpłatny. A i B czytacie bez kosztu.</li><li><b>Raport wstępny.</b> Po co najmniej dwóch tropach wybierzcie status każdej tezy i przypnijcie jeden lub dwa dokumenty. Określcie, czy wspierają, osłabiają, czy nie rozstrzygają tezy. Zapiszcie fragment i uzasadnienie.</li><li><b>Nowy dokument.</b> Pierwszy raport zostaje zachowany. Dokument T i jedno dodatkowe działanie pozwalają sprawdzić interpretację. Niewykorzystane działania przechodzą dalej; łącznie otworzycie najwyżej pięć z sześciu kart.</li><li><b>Obrona.</b> Złóżcie poprawiony raport i wyjaśnijcie rewizję albo utrzymanie stanowiska. Automat sprawdza kody i powiązania; prowadzący ocenia rozumowanie. Potem analizujecie autentyczne źródło.</li></ol><details><summary>Wynik i niepewność</summary><p>Do 3 punktów za rekonstrukcję i do 9 za tezy: po jednym za status, odpowiedni dowód i trafne znaczenie przypiętych dokumentów. Wynik 12/12 oznacza zgodność z regułami fikcyjnej sprawy, a nie ocenę jakości uzasadnień ani opanowania NPF.</p><p>„Nierozstrzygnięta” może być w pełni poprawna. Przy niej użyj zdobytego dokumentu, aby wyjaśnić, czego nie mierzy i jakiego dowodu brakuje. Samo A lub B nie wystarczy jako jedyny dowód luki w badaniu wpływu. Oceniany jest stan Waszej teczki; nie trzeba zgadywać treści nieotwartych akt.</p></details><details><summary>Współpraca i dostępność</summary><p>Analityk stawia hipotezę, rzecznik dowodów wskazuje fragment, sceptyk szuka alternatyw. Najpierw każdy proponuje własny trop, potem uzgadniacie działanie. Zmieńcie role po pierwszym raporcie. Można też grać samodzielnie. Brak odliczania i rankingu. Dowody przypina się przez pola wyboru, bez przeciągania. Tab i Enter obsługują przyciski, Escape zamyka okno.</p></details><details><summary>Zapis i przerwanie gry</summary><p>Postępy są zapisywane w tej przeglądarce. Pobierz JSON przed zakończeniem; wczytasz go na starcie. Jeden plik zapisu zawiera trening solo, śledztwa i karty źródłowe. TXT i PDF służą do czytania oraz przekazania prowadzącemu. Aplikacja niczego nie wysyła. Gdy kończy się czas zajęć, pobierz częściowy zapis i przejdź do omówienia.</p></details><p class="notice">Detektyw bada konstrukcję narracji i dowody wpływu. Antagonista nie musi występować. Każda karta śledztwa jest fikcją; koniec gry nie rozstrzyga sporów o rzeczywiste programy.</p>`);}
