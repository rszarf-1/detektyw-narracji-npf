y szkoły i pracodawców całego obszaru, bo od dojazdów zależy dostęp do nauki i pracy.", "b": "W debacie o wspólnych autobusach mieszkańcy najmniejszych gmin obawiają się utraty wpływu na swoje połączenia. Lokalne samorządy mogą ich chronić, uzgadniając gwarancje obsługi i udziału w decyzjach. Bez tych gwarancji potrzeby peryferyjnych miejscowości mogą zostać pominięte. Dlatego przed integracją trzeba uzgodnić reguły reprezentacji. Szczegóły powinien ustalić istniejący zespół międzygminny.", "setting": "debata o wspólnej organizacji autobusów między gminami", "victim": "mieszkańcy dojeżdżający przez granice gmin", "hero": "wspólny organizator", "plot": "nieuzgodnione połączenia → dłuższa podróż", "moral": "zintegrować organizację przewozów", "bVictim": "mieszkańcy najmniejszych gmin", "cause": "niedopasowane przesiadki", "expansion": "zaprośmy szkoły i pracodawców całego obszaru", "warning": "Statut i uchwała opisują rozwiązanie instytucjonalne; same nie pokazują reakcji odbiorców na narrację. Tekst B jest ćwiczeniem, nie odnalezionym stanowiskiem przeciwników GPA."}, "BK2": {"name": "Bezpieczny Kredyt 2%", "short": "BK2%", "teams": "6 i 7", "scope": "Epizod BK2%: zapowiedź 16 grudnia 2022 r., przyjęcie tekstu przez Sejm po III czytaniu 14 kwietnia 2023 r., uruchomienie w lipcu 2023 r.; następców analizujemy osobno.", "focus": "Dostęp do kredytu i dostęp do mieszkania", "a": "W debacie o dopłatach do pierwszego kredytu gospodarstwa bez własnego mieszkania nie mogą udźwignąć rat. Państwo może im pomóc, dopłacając do kredytu. Skoro wysokie raty zamykają drogę do zakupu, ich obniżenie ma umożliwić nabycie mieszkania. Dlatego należy uruchomić dopłaty dla uprawnionych gospodarstw. Włączmy do debaty organizacje rodzin i pracowników, bo stabilne zamieszkanie dotyczy całego społeczeństwa.", "b": "W debacie o dopłatach najemcy bez zdolności kredytowej obawiają się, że mieszkania pozostaną dla nich niedostępne. Państwo może im pomóc, zwiększając dostępność mieszkań na wynajem. ebata o dostępie do Czystego Powietrza", "victim": "właściciele domów o małych dochodach zagubieni w dokumentach", "hero": "operator udzielający indywidualnej pomocy", "plot": "skomplikowane procedury → rezygnacja; pomoc → łatwiejszy dostęp", "moral": "rozwijać pomoc operatorów", "bVictim": "właściciele domów narażeni na błędne doradztwo", "cause": "skomplikowane procedury", "expansion": "włączmy ośrodki pomocy społecznej i organizacje seniorów", "warning": "Pilotaż operatorów poprzedzał późniejsze apele. Następstwo wydarzeń i podobieństwo propozycji nie wystarczają do przypisania NGO spowodowania powstania operatorów."}};
const SOURCE_DATA={"wersja": "2026-10-26", "zasada": "Wszystkie fragmenty to parafrazy z istniejących pakietów, nie cytaty. Analiza NPF i propozycje sporów stanowią nową interpretację dydaktyczną, nie ustalenia pierwotnych źródeł. Kody A1–A3 i P1–P4 odnoszą się do wcześniejszych pakietów.", "zakres_czasowy": "Utrzymano historyczne epizody ACF/PET. Nie aktualizowano prawa do stanu bieżącego ani nie przypisano aktorom późniejszej wiedzy.", "programy": [{"id": "SCT", "nazwa": "Strefa Czystego Transportu w Warszawie", "zespoly": [1, 2], "zakres": "Przygotowanie i przyjęcie uchwały ustanawiającej SCT 7 grudnia 2023 r.; kontekst 2021–2024. Start 1 lipca 2024 r. i zaplanowane zaostrzenia są etapami wdrażania, a nie datą analizowanej decyzji.", "wynik_R": "Przyjęcie przez Radę m.st. Warszawy uchwały XCI/2974/2023 ustanawiającej SCT 7.12.2023.", "potencjalny_spor_narracyjny": "Ochrona zdrowia osób narażonych i szybka, ambitna strefa versus ciężar dostosowania i tempo zmian. Pierwsza strona jest udokumentowana; druga może służyć jako jawnie fikcyjny kontrscenariusz, dopóki nie zostanie pozyskana wypowiedź aktora.", "status_sporu": "Niepełny kontrast empiryczny; pakiet dokumentuje popierające NGO oraz treść uchwały i wyjątki.", "zrodla": [{"id": "SCT_O1", "tytul": "Strefa czystego transportu", "autor": "Warszawa 19115", "data": null, "url": "https://warszawa19115.pl/en/-/strefa-czystego-transportu-sct", "lokalizacja": "Części o podstawach prawnych, konsultacjach i etapach SCT; odczytane jako PET P1–P2, P4", "oficjalne": true, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}, {"id": "SCT_O2", "tytul": "Uchwała XCI/2974/2023 Rady m.st. Warszawy", "autor": "Rada m.st. Warszawy", "data": "2023-12-07", "url": "https://zdm.waw.pl/wp-content/uploads/2024/05/akt-uchwala-SCT-DZ.-Woj-.-Maz.-z-dnia-15-grudnia-2023-r.-poz.-14557.pdf", "lokalizacja": "§ 1–4 i załącznik 2, ust. 8–9", "oficjalne": true, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}, {"id": "SCT_A1", "tytul": "Czy Warszawa wykorzysta szansę…", "autor": "Clean Cities Campaign", "data": "2023-06-05", "url": "https://poland.cleancitiescampaign.org/wplywsct/", "lokalizacja": "Wprowadzenie oraz wypowiedzi Niny Józefiny Bąk i Urszuli Stefanowicz", "oficjalne": false, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}], "parafrazy": [{"id": "SCT_N1", "typ": "parafraza dydaktyczna", "tekst": "Nina Józefina Bąk wiąże potrzebę SCT z ochroną osób najbardziej narażonych na zanieczyszczenia: dzieci, seniorów i osób z chorobami układu oddechowego. Chce szybkiej decyzji miasta, ambitnych granic i wymagań emisyjnych, które przyniosą odczuwalną poprawę powietrza. Zarazem wskazuje potrzebę wcześniejszego informowania kierowców, aby mogli przygotować się do zmiany.", "zrodlo_id": "SCT_A1", "lokalizacja_lokalna": "SCT A1", "ograniczenie": "Dokumentuje stanowisko aktorki i oczekiwane korzyści, nie ich osiągnięcie ani wpływ na radnych."}, {"id": "SCT_N2", "typ": "parafraza dydaktyczna", "tekst": "Urszula Stefanowicz uznaje każde ograniczenie zanieczyszczenia za wartościowe. Argumentuje jednak, że skoro miasto podejmuje wysiłek ustanowienia SCT, powinno wybrać ambitniejsze zasady, aby zwiększyć korzyści dla mieszkańców.", "zrodlo_id": "SCT_A1", "lokalizacja_lokalna": "SCT A2", "ograniczenie": "Oczekiwany skutek regulacji w stanowisku aktorki; nie niezależna ocena skuteczności."}, {"id": "SCT_N3", "typ": "parafraza dydaktyczna", "tekst": "Uchwałę przyjęto 7 grudnia 2023 r.; SCT rozpoczęła działanie 1 lipca 2024 r. Reguły przewidziały stopniowe zaostrzanie wymagań oraz wyjątki, m.in. dla określonych mieszkańców i seniorów.", "zrodlo_id": "SCT_O2", "lokalizacja_lokalna": "P4", "ograniczenie": "Treść decyzji i terminy nie wyjaśniają same w sobie przyczyny wyboru reguł."}], "wskazowka_NPF": "Szukaj beneficjentów/ofiar problemu, zagrożenia zdrowotnego, związku problem–interwencja i morału. Nie dopisuj złoczyńcy, jeżeli tekst go nie konstruuje; emisja lub pojazd jako przyczyna problemu nie staje się automatycznie postacią."}, {"id": "BO", "nazwa": "Budżet obywatelski Warszawy", "zespoly": [3, 10], "zakres": "Zmiana zasad 17 października 2024 r.: wprowadzenie poziomu lokalnego oraz reguł podziału środków w edycji prowadzonej w 2025 r., z realizacją projektów w 2026 r.; tło porównawcze z 2019 r.", "wynik_R": "Wprowadzenie poziomu lokalnego BO uchwałą XI/379/2024 z 17.10.2024.", "potencjalny_spor_narracyjny": "Sprawiedliwość jako podobna możliwość sfinansowania podstawowej inwestycji w małym i dużym osiedlu versus sprawiedliwość jako podział proporcjonalny do liczby mieszkańców i skali potrzeb.", "status_sporu": "Udokumentowany kontrast argumentów stowarzyszenia i urzędu. Należy sprawdzić, czy konkretny wybrany fragment spełnia kryteria narracji, a nie tylko stanowiska.", "zrodla": [{"id": "BO_O1", "tytul": "Raport z konsultacji zmian w budżecie obywatelskim", "autor": "Urząd m.st. Warszawy", "data": "2024-10-16", "url": "https://konsultacje.um.warszawa.pl/processes/bo/participatory_process_reports", "lokalizacja": "Załącznik 3: s. 5, uwaga 29; załącznik 5: s. 1 i 9", "oficjalne": true, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}, {"id": "BO_O2", "tytul": "Uchwała XI/379/2024 Rady m.st. Warszawy", "autor": "Rada m.st. Warszawy", "data": "2024-10-17", "url": "https://edziennik.mazowieckie.pl/WDU_W/2024/10017/akt.pdf", "lokalizacja": "§ 1 pkt 2 i 4", "oficjalne": true, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}, {"id": "BO_A1", "tytul": "Zmiany w uchwale o budżecie obywatelskim – nasze uwagi", "autor": "Razem dla Bielan", "data": "2024-09-11", "url": "https://razemdlabielan.waw.pl/zmiany-w-uchwale-o-budzecie-obywatelskim-nasze-uwagi/", "lokalizacja": "Wstęp i podział środków", "oficjalne": false, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}], "parafrazy": [{"id": "BO_N1", "typ": "parafraza dydaktyczna", "tekst": "Stowarzyszenie poparło potrzebę zmian BO, lecz zakwestionowało podział środków lokalnych jako niesprawiedliwy dla mniej ludnych osiedli. Wskazało, że podobny plac zabaw kosztuje tyle samo na Radiowie i Wawrzyszewie mimo różnych dostępnych pul. Postulowało podział umożliwiający podobny zakres projektów w różnych częściach dzielnicy. Udostępniło gotowe uwagi i zachęciło mieszkańców do ich zgłaszania.", "zrodlo_id": "BO_A1", "lokalizacja_lokalna": "BO A1", "ograniczenie": "Zawiera ocenę reguły i żądanie aktora. Nie dowodzi rzeczywistych skutków podziału ani wpływu stowarzyszenia na uchwałę."}, {"id": "BO_N2", "typ": "parafraza dydaktyczna", "tekst": "W odpowiedzi na konsultacje zespół BO uzasadnił poziom lokalny zwiększeniem szans sąsiedzkich projektów. Podział środków według liczby mieszkańców uznał za sprawiedliwy. Wyrównywanie pul na korzyść słabiej zaludnionych obszarów mogłoby jego zdaniem nierówno zaspokajać potrzeby.", "zrodlo_id": "BO_O1", "lokalizacja_lokalna": "BO A2", "ograniczenie": "Uzasadnienie urzędu, nie niezależna ocena efektów."}, {"id": "BO_N3", "typ": "parafraza dydaktyczna", "tekst": "Raport opublikowano 16 października 2024 r. W załączniku 3, uwaga 29, są argument o kosztach placu zabaw i propozycja sześciu obszarów Bielan. Treść odpowiada postulatom A1, lecz tabela nie podaje autora. Załącznik 5 zawiera stanowisko urzędu oraz informację o korektach granic w pięciu dzielnicach, w tym na Bielanach.", "zrodlo_id": "BO_O1", "lokalizacja_lokalna": "BO A3", "ograniczenie": "Nie przypisuj anonimowej uwagi stowarzyszeniu na podstawie podobieństwa. Korekta granic, przyjęcie postulatu o podziale i utworzenie poziomu lokalnego to różne wyniki."}], "wskazowka_NPF": "Porównaj konstrukcję grup dotkniętych niesprawiedliwością i proponowane rozwiązanie, przy stałym wyniku do wyjaśnienia. Sam spór wartości nie wystarcza do zakodowania pełnej narracji."}, {"id": "GPA", "nazwa": "Grodziskie Przewozy Autobusowe", "zespoly": [4, 5], "zakres": "Proces integracji transportu 2019–2023; centralny epizod: zgoda Rady Powiatu Grodziskiego na utworzenie związku i przyjęcie statutu 28 stycznia 2021 r. Początek przewozów GPA 1 stycznia 2022 r. to wdrażanie.", "wynik_R": "Uchwały Rady Powiatu Grodziskiego 240/XXVIII/21 i 241/XXVIII/21 z 28.01.2021: utworzenie GPA i statut.", "potencjalny_spor_narracyjny": "Integracja jako ratunek dla mieszkańców dotkniętych nieskoordynowanym transportem versus potencjalna opowieść o utracie lokalnego wpływu i nierównym podziale kosztów. Drugi człon jest wyłącznie kandydatem do fikcyjnego scenariusza, nie ustaleniem o historycznym sporze.", "status_sporu": "Pakiety nie dostarczają przeciwnej narracji. Można badać uzasadnienie integracji i konkurencyjne wyjaśnienie instytucjonalne bez wymyślania koalicji przeciwników.", "zrodla": [{"id": "GPA_O1", "tytul": "Materiały na sesję Rady Powiatu Grodziskiego 28.01.2021", "autor": "Powiat Grodziski; uzasadnienia Kamila Oltona", "data": "2021-01-28", "url": "https://bip.powiat-grodziski.pl/pliki/Biuro_rady_2018_2023/materialy_na_sesje_28.01.2021.pdf", "lokalizacja": "s. 13–14 i 24 PDF", "oficjalne": true, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}, {"id": "GPA_O2", "tytul": "Uchwała 240/XXVIII/21 o utworzeniu związku", "autor": "Rada Powiatu Grodziskiego", "data": "2021-01-28", "url": "https://bip.powiat-grodziski.pl/pliki/Biuro_rady_2018_2023/uchwala_240_2021.pdf", "lokalizacja": "s. 1", "oficjalne": true, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}, {"id": "GPA_O3", "tytul": "Statut GPA, uchwała 241/XXVIII/21", "autor": "Rada Powiatu Grodziskiego", "data": "2021-01-28", "url": "https://bip.powiat-grodziski.pl/pliki/Biuro_rady_2018_2023/uchwala_241_2021.pdf", "lokalizacja": "s. 2 PDF, wstęp statutu oraz § 2, 6", "oficjalne": true, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}, {"id": "GPA_O4", "tytul": "Informator Związku GPA, nr 1", "autor": "Związek GPA", "data": "2023-03", "url": "https://www.zabiawola.pl/plik,4502,gpa-informator-nr-1.pdf", "lokalizacja": "s. 2–6; retrospektywna relacja uczestników i organizatora", "oficjalne": true, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}], "parafrazy": [{"id": "GPA_N1", "typ": "parafraza dydaktyczna", "tekst": "Kamil Olton wskazuje, że dotychczasowe przewozy powiatowe nie mogą wykraczać poza powiat i muszą obejmować co najmniej dwie gminy. Wspólny związek ma umożliwić połączenia lepiej odpowiadające potrzebom mieszkańców, wspólne taryfy oraz skoordynowane rozkłady. Autor przedstawia integrację organizacji transportu jako sposób ulepszenia i poszerzenia oferty.", "zrodlo_id": "GPA_O1", "lokalizacja_lokalna": "GPA A1", "ograniczenie": "Stanowisko autora uzasadnienia. Udział gminy w związku nie dowodzi przyjęcia każdej części tej diagnozy."}, {"id": "GPA_N2", "typ": "parafraza dydaktyczna", "tekst": "Uzasadnienie statutu podaje, że sześć gmin, w tym Błonie, oraz powiat wyraziły wolę utworzenia GPA i wspólnie ustalały statut. Na podstawie pełnomocnictw tych gmin starosta wystąpił 12 listopada 2020 r. do wojewody o uzgodnienie projektu. Wojewoda odpowiedział pozytywnie pismem z 11 grudnia, doręczonym 15 grudnia.", "zrodlo_id": "GPA_O1", "lokalizacja_lokalna": "GPA A2", "ograniczenie": "Relacja autora dokumentu powiatowego; nie zawiera oryginału pełnomocnictwa ani własnego uzasadnienia Błonia."}, {"id": "GPA_N3", "typ": "parafraza dydaktyczna", "tekst": "Według informatora GPA poszczególne gminy korzystały z różnych systemów i przewoźników, bez wspólnej strategii, taryf i skoordynowanych rozkładów. Na spotkaniu w Ojrzanowie w listopadzie 2019 r. samorządowcy omawiali integrację, rozszerzenie oferty i ograniczenie wykluczenia komunikacyjnego.", "zrodlo_id": "GPA_O4", "lokalizacja_lokalna": "P1", "ograniczenie": "Informator z marca 2023 r. jest późniejszą relacją organizatora, nie współczesnym zapisem spotkania ani niezależną oceną."}], "wskazowka_NPF": "Możliwe postacie to mieszkańcy jako beneficjenci/ofiary problemu i współpracujące samorządy jako sprawcy poprawy, ale przypisanie każdej roli wymaga fragmentu tekstu. Bariery kompetencyjne nie są automatycznie złoczyńcą. Hipotezę wpływu opowieści porównaj z wyjaśnieniem przez zakres kompetencji."}, {"id": "BK2", "nazwa": "Bezpieczny kredyt 2% i następcy", "zespoly": [6, 7], "zakres": "Dla wspólnego zadania: zapowiedź Pierwszego Mieszkania 16 grudnia 2022 r. i uchwalenie ustawy obejmującej BK2% 14 kwietnia 2023 r.; uruchomienie 1 lipca 2023 r. jest oddzielnym etapem. Następcy pozostają szerszą ramą projektu studentów, nie są automatycznie częścią tego epizodu.", "wynik_R": "Uchwalenie przez Sejm 14.04.2023 ustawy zawierającej BK2% i Konto Mieszkaniowe.", "potencjalny_spor_narracyjny": "Państwo pomagające osobom zablokowanym w drodze do pierwszego mieszkania versus potencjalna krytyka nierównego dostępu do pomocy i kosztów dla innych uczestników rynku. Krytyczny człon wymaga źródła lub jawnego oznaczenia fikcji dydaktycznej.", "status_sporu": "Dostępny pakiet dokumentuje uzasadnienie rządu i poparcie klubu, nie dostarcza krytycznej narracji o skutkach cenowych.", "zrodla": [{"id": "BK2_O1", "tytul": "Program Pierwsze Mieszkanie – pomocna dłoń państwa", "autor": "Ministerstwo Rozwoju i Technologii; wypowiedzi Waldemara Budy", "data": "2022-12-16", "url": "https://www.gov.pl/web/rozwoj-technologia/program-pierwsze-mieszkanie--pomocna-dlon-panstwa", "lokalizacja": "Wypowiedzi ministra uzasadniające program", "oficjalne": true, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}, {"id": "BK2_O2", "tytul": "Tekst ustawy uchwalonej 14.04.2023, druk 3096", "autor": "Sejm RP", "data": "2023-04-14", "url": "https://api.sejm.gov.pl/sejm/term9/processes/3096/attachment/3096_u3.pdf", "lokalizacja": "s. 43, dodawany art. 9b ust. 1", "oficjalne": true, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}, {"id": "BK2_O3", "tytul": "Stenogram debaty sejmowej 13.04.2023", "autor": "Sejm RP; wypowiedź Jerzego Polaczka", "data": "2023-04-13", "url": "https://api.sejm.gov.pl/sejm/term9/proceedings/74/2023-04-13/transcripts/pdf", "lokalizacja": "s. 218–219 stenogramu, s. 76–77 PDF", "oficjalne": true, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}, {"id": "BK2_O4", "tytul": "Zapis wspólnego posiedzenia komisji FPB 400 i INF 269", "autor": "Sejm RP", "data": "2023-04-14", "url": "https://api.sejm.gov.pl/sejm/term9/committees/INF/sittings/269/pdf", "lokalizacja": "s. 8–9", "oficjalne": true, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}], "parafrazy": [{"id": "BK2_N1", "typ": "parafraza dydaktyczna", "tekst": "16 grudnia 2022 r. minister uzasadniał potrzebę pomocy wysokimi cenami mieszkań, stopami procentowymi i wymaganiami banków. Według niego zakup pierwszego mieszkania był trudny nawet dla osób nieźle zarabiających. Państwo miało pomagać przez dopłaty do rat oraz wsparcie oszczędzania.", "zrodlo_id": "BK2_O1", "lokalizacja_lokalna": "BK A1", "ograniczenie": "Uzasadnienie propozycji, nie pomiar skutków. Nie dopisuj do niego wiedzy o późniejszych cenach ani późniejszych programach."}, {"id": "BK2_N2", "typ": "parafraza dydaktyczna", "tekst": "13 kwietnia 2023 r. Polaczek w imieniu klubu PiS umieścił BK2% w szerszej polityce zwiększania państwowego wsparcia mieszkalnictwa. Zapowiedział trzy poprawki. Jedna miała umożliwić udział w programie osobom, które nabyły nieruchomość jako niepełnoletnie i zbyły ją przed pełnoletnością, nie mając pełnego wpływu na te decyzje. Zadeklarował poparcie przyjęcia i wdrażania ustawy.", "zrodlo_id": "BK2_O3", "lokalizacja_lokalna": "BK A2", "ograniczenie": "Wystąpienie w imieniu klubu; nie jest osobnym stanowiskiem każdego posła. Przekaz o osobach bez wpływu na wcześniejsze nabycie może posłużyć do analizy konstruowania zasługiwania."}, {"id": "BK2_N3", "typ": "parafraza dydaktyczna", "tekst": "Buda przedstawił pozytywne stanowisko rządu wobec rozszerzenia dla osób nabywających nieruchomość przed pełnoletnością. Komisje przyjęły łącznie poprawki 16 i 21: 66 za, 0 przeciw, 3 wstrzymujące się. To nie wynik głosowania nad całą ustawą.", "zrodlo_id": "BK2_O4", "lokalizacja_lokalna": "BK A3", "ograniczenie": "Sekwencja zgłoszenia, poparcia i głosowania nie ujawnia wcześniejszego uzgodnienia ani wpływu narracji na wybór głosujących."}], "wskazowka_NPF": "Szczególnie użyteczny jest kontrast między ogólnym uzasadnieniem pomocy i opowieścią o osobach niepełnoletnich bez kontroli nad dawną własnością. Nie utożsamiaj kredytobiorców z całą grupą potrzebujących mieszkania; to konstruowany zakres adresatów."}, {"id": "CP", "nazwa": "Czyste Powietrze", "zespoly": [8, 9, 11], "zakres": "System operatorów: pilotaż w 2023 r., zapowiedź rozszerzenia 17 października 2024 r., apel organizacji 12 grudnia 2024 r., zasady ogłoszone 20 marca i nabór od 31 marca 2025 r.", "wynik_R": "Obecność systemu operatorów w zasadach przedstawionych 20.03.2025, z obowiązkową pomocą przy najwyższej dotacji i prefinansowaniu.", "potencjalny_spor_narracyjny": "Ochrona najuboższych, zdrowia i ciągłości wsparcia versus naprawa programu i ochrona beneficjentów przed nadużyciami. Stanowiska mogą podzielać cel ochrony, różniąc się oceną przerwy i sposobu interwencji; nie zakładaj dwóch wrogich obozów.", "status_sporu": "Udokumentowane argumenty NGO o przerwie i pomocy oraz instytucjonalna chronologia reformy. Pełny kontrast narracyjny wymaga analizy tekstu instytucji, a nie dopisania intencji.", "zrodla": [{"id": "CP_O1", "tytul": "Sprawdzaj firmy podające się za operatorów programu Czyste Powietrze", "autor": "Komunikat WFOŚiGW opublikowany przez Powiat Łosicki", "data": "2024-10-17", "url": "https://samorzad.gov.pl/web/powiat-losicki/sprawdzaj-firmy-podajace-sie-za-operatorow-programu-czyste-powietrze", "lokalizacja": "Sekcja Niebawem operatorzy w całej Polsce", "oficjalne": true, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}, {"id": "CP_O2", "tytul": "Nowe Czyste Powietrze z jasnymi zasadami i stabilnym finansowaniem", "autor": "NFOŚiGW", "data": "2025-03-20", "url": "https://www.gov.pl/web/nfosigw/jasne-zasady-i-stabilne-zrodlo-finansowania--nowa-odslona-programu-czyste-powietrze-juz-wkrotce", "lokalizacja": "Sekcja o operatorach", "oficjalne": true, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}, {"id": "CP_A1", "tytul": "Organizacje społeczne za szybszym odblokowaniem programu Czyste Powietrze…", "autor": "Polski Alarm Smogowy; wypowiedź Andrzeja Guły", "data": "2024-12-12", "url": "https://polskialarmsmogowy.pl/2024/12/organizacje-spoleczne-za-szybszym-odblokowaniem-programu-czyste-powietrze-zmiany-mozna-wprowadzic-w-mniej-niz-miesiac/", "lokalizacja": "Wypowiedź Andrzeja Guły", "oficjalne": false, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}, {"id": "CP_A2", "tytul": "Apel organizacji społecznych do premiera", "autor": "30 organizacji, w tym Polski Alarm Smogowy i Fundacja Instrat", "data": "2024-12-12", "url": "https://polskialarmsmogowy.pl/wp-content/uploads/2024/12/Apel-NGO-do-Premiera-Donalda-Tuska-ws.-PCzP.pdf", "lokalizacja": "s. 2 postulaty pomocy, s. 3 sygnatariusze; data publikacji według komunikatu PAS", "oficjalne": false, "weryfikacja": "URL i metadane odczytane z lokalnego pakietu; bez ponownego sprawdzenia strony w tej sesji"}], "parafrazy": [{"id": "CP_N1", "typ": "parafraza dydaktyczna", "tekst": "W komunikacie z 12 grudnia 2024 r. Andrzej Guła uzasadnia znaczenie Czystego Powietrza poprawą jakości powietrza i zdrowia oraz zmniejszaniem rachunków za ogrzewanie. Uważa ograniczenie nadużyć za potrzebne, ale kwestionuje zamykanie naboru na tak długi czas. Według niego zmiany można wprowadzić szybciej.", "zrodlo_id": "CP_A1", "lokalizacja_lokalna": "CP A1", "ograniczenie": "Stanowisko aktora; nie dowodzi rzeczywistego czasu potrzebnego do naprawy programu ani wpływu na decyzję."}, {"id": "CP_N2", "typ": "parafraza dydaktyczna", "tekst": "Apel do premiera uznaje ochronę najuboższych za szczególnie ważną. Postuluje ogólnokrajową pomoc w przeprowadzaniu inwestycji, z udziałem pomocy społecznej, oraz większe wsparcie ocieplania domów i ciągłość finansowania. Wśród sygnatariuszy dokument wymienia Fundację Instrat i Polski Alarm Smogowy.", "zrodlo_id": "CP_A2", "lokalizacja_lokalna": "CP A2", "ograniczenie": "Wspólnie podpisane stanowisko. Nie jest osobną analizą każdej organizacji ani dowodem długotrwałej koordynacji."}, {"id": "CP_N3", "typ": "parafraza dydaktyczna", "tekst": "Komunikat WFOŚiGW, opublikowany przez powiat łosicki, wskazywał pilotaże w Małopolsce i województwie świętokrzyskim oraz plan uruchomienia w 2025 r. ogólnopolskiego systemu operatorów na podstawie tych doświadczeń. Ostrzegał jednocześnie przed firmami bezpodstawnie podającymi się za operatorów. Plan rozszerzenia był więc publicznie komunikowany przed grudniowym apelem organizacji.", "zrodlo_id": "CP_O1", "lokalizacja_lokalna": "P2", "ograniczenie": "Podważa twierdzenie, że grudniowy apel zapoczątkował system, lecz nie wyklucza późniejszego wpływu na szczegóły lub tempo."}, {"id": "CP_N4", "typ": "parafraza dydaktyczna", "tekst": "20 marca NFOŚiGW ogłosił zasady naboru rozpoczynającego się 31 marca 2025 r. Pomoc operatora stała się obowiązkowa przy najwyższym dofinansowaniu i prefinansowaniu. Funkcje operatorów powierzono gminom i WFOŚiGW.", "zrodlo_id": "CP_O2", "lokalizacja_lokalna": "P4", "ograniczenie": "Opis ogłoszonych reguł, nie dowód ich skuteczności ani powszechnego obowiązku dla wszystkich beneficjentów."}], "wskazowka_NPF": "Oddziel problem ubóstwa i niesprawnej pomocy od przypisywania winy. Sprawdź, czy podmioty uznawane za bohaterów, ofiary i odpowiedzialnych za problem zmieniają się między fragmentami; wspólna grupa beneficjentów nie wyklucza sporu o rozwiązanie."}]};
const SOLO={"version": "1.0", "title": "Start indywidualny: Biblioteka po pracy", "duration": "8–10 minut", "context": "Przed C5 • samodzielne przygotowanie • 5 krótkich zadań", "status": "Cały przypadek jest fikcyjny. Nie opisuje rzeczywistej biblioteki, organizacji ani badania.", "aim": "Przećwicz czytanie opowieści z dowodem tekstowym. Na C5 będziesz analizować z zespołem inny tekst, dotyczący Waszego programu.", "intro": "W NPF kodujemy to, jak tekst przedstawia postacie i działanie publiczne. Ofiara doświadcza szkody lub zagrożenia, bohater oferuje pomoc, a narrator opowiada. Narracja nie musi zawierać wszystkich ról. Najpierw wybierz odpowiedź, potem przeczytaj wyjaśnienie.", "storyTitle": "Fikcyjny program miejski „Biblioteka po pracy”", "story": "Stowarzyszenie Czytelników przedstawiło w komunikacie własną propozycję miejskiego programu: „Mieszkańcy pracujący do 17.00 zastają bibliotekę zamkniętą i rezygnują z wypożyczeń. Zespół biblioteki może im pomóc, otwierając placówkę do 20.00 dwa razy w tygodniu. Późniejsze godziny mają pozwolić odwiedzić bibliotekę po pracy. Miasto powinno sfinansować taki pilotaż przez sześć tygodni, a potem sprawdzić, kto korzysta z wydłużonych godzin”.", "questions": [{"id": "solo01", "topic": "Rola z dowodem", "prompt": "Który fragment najlepiej uzasadnia kod „ofiara” dla pracujących mieszkańców?", "options": ["„Zastają bibliotekę zamkniętą i rezygnują z wypożyczeń”.", "„Późniejsze godziny mają pozwolić odwiedzić bibliotekę po pracy”.", "„Potem sprawdzić, kto korzysta z wydłużonych godzin”."], "correct": 0, "feedback": "Zamknięta biblioteka i rezygnacja z wypożyczeń przedstawiają trudność oraz jej następstwo. To podstawa kodu ofiary. Możliwość wizyty po pracy opisuje oczekiwaną poprawę, a sprawdzenie korzystania — ocenę pilotażu. Samo bycie przyszłym użytkownikiem usługi nie nadaje jeszcze roli ofiary."}, {"id": "solo02", "topic": "Narrator a bohater", "prompt": "Kto opowiada, a kto w tej opowieści oferuje bezpośrednią pomoc mieszkańcom?", "options": ["Opowiada zespół biblioteki; pomoc oferuje Stowarzyszenie Czytelników.", "Opowiada Stowarzyszenie Czytelników; pomoc oferuje zespół biblioteki.", "Opowiada Stowarzyszenie Czytelników; pomoc oferują pracujący mieszkańcy."], "correct": 1, "feedback": "Własną propozycję przedstawia Stowarzyszenie Czytelników: jest narratorem. W tekście zespół biblioteki ma pomóc przez zmianę godzin: otrzymuje rolę bohatera. Publikowanie postulatu samo w sobie nie wystarcza, aby utożsamić narratora z bohaterem opowieści."}, {"id": "solo03", "topic": "Zmiana fragmentu", "prompt": "Usuwamy ostatnie zdanie, zaczynające się od „Miasto powinno…”. Jak zmienia się analiza pozostałego tekstu?", "options": ["Znika odniesienie do działania publicznego, pozostaje opowieść o prywatnym czasie mieszkańców.", "Znika postać oferująca rozwiązanie, pozostaje opis kłopotów pracujących mieszkańców.", "Znika wyraźny postulat finansowania, pozostają postacie i zmiana działania publicznej biblioteki."], "correct": 2, "feedback": "Usunięto wyraźny postulat finansowania pilotażu. Pozostały jednak mieszkańcy, zespół biblioteki i publiczna usługa, więc tekst nadal spełnia minimum narracji NPF. Nie trzeba uznać, że zniknął cały morał: propozycja późniejszych godzin pozostaje w innych zdaniach."}, {"id": "solo04", "topic": "Zmiana perspektywy", "context": "Pojawia się druga fikcyjna wypowiedź: „Pracownicy biblioteki już mają nadgodziny. Dodatkowe wieczory bez nowych etatów pogorszą ich sytuację. Miasto może ich ochronić, finansując dodatkową obsadę”.", "prompt": "Jak zmienia się przedstawienie zespołu biblioteki w tej drugiej wypowiedzi?", "options": ["Z oferujących pomoc stają się osobami narażonymi na szkodę; rolę określa dany tekst.", "Z oferujących pomoc stają się sprawcami szkody; rolę określa sprzeciw wobec zmiany.", "Z oferujących pomoc stają się narratorami programu; rolę określa miejsce zatrudnienia."], "correct": 0, "feedback": "W pierwszym tekście zespół ma ułatwić mieszkańcom korzystanie z usługi. W drugim pracownicy są przedstawieni jako narażeni na przeciążenie. Ten sam aktor może otrzymać różne role w różnych narracjach. Rola w tekście nie jest stałą oceną danej grupy."}, {"id": "solo05", "topic": "Dowód a wniosek", "context": "Po publikacji propozycji rada miasta przyjęła pilotaż. W protokole zapisano: „Argument o dostępie osób pracujących przemawia za próbą wydłużenia godzin”.", "prompt": "Który wniosek najlepiej odpowiada temu dodatkowemu materiałowi?", "options": ["Przyjęcie pilotażu potwierdza, że opowieść zmieniła przekonania większości radnych; protokół opisuje powód tej zmiany.", "Uzasadnienie decyzji zawiera argument z opowieści; jego znaczenie wobec innych przyczyn wymaga dalszego zbadania.", "Uzasadnienie decyzji powtarza część opowieści; do analizy jej możliwego wpływu protokół nie wnosi nowej informacji."], "correct": 1, "feedback": "Protokół jest śladem pojawienia się argumentu w uzasadnieniu decyzji. To więcej niż sama publikacja opowieści, ale jeszcze nie dowód zmiany przekonań większości ani wyłącznej przyczyny decyzji. Warto sprawdzić wcześniejsze plany, inne argumenty i przebieg rozpatrywania projektu."}], "finalReflection": {"label": "Zabierz na C5 jedno zdanie", "prompt": "Które rozróżnienie było dla Ciebie najtrudniejsze? Zapisz własny przykład albo pytanie.", "required": false}, "completion": "Start ukończony. Na C5 wybierzecie z zespołem własny program i podejmiecie wspólne decyzje z dowodem tekstowym. Wynik tego treningu nie jest oceną ani dowodem samodzielnego opanowania NPF.", "implementationNotes": ["Pokazuj jedno zadanie naraz; wspólną opowieść pozostaw dostępną na każdym ekranie, a drugi tekst wyłącznie przy solo04.", "Losuj kolejność odpowiedzi bez zmiany stabilnego identyfikatora opcji; klucz w JSON jest indeksem zero-based.", "Wyjaśnienie pojawia się dopiero po zatwierdzeniu. Przy poprawie używaj etykiety „Trafne po sprawdzeniu”, nie „Opanowane”.", "Krótki start nie powinien blokować wejścia do pracy zespołowej. Student może wrócić do niego, zachowując osobny zapis solo.", "Na ekranie końca podaj jedną przydatną regułę: „Kod → fragment → granica wniosku”. Unikaj dodatkowego rankingu i zbierania nazwisk."]};
const INSTRUCTIONS="<div class=\"howto\">\n<p class=\"lead\">Laboratorium narracji to quiz analityczny z objaśnieniami oraz kartą pracy ze źródłem. Uczysz się przypisywać fragmentom tekstu pojęcia NPF, uzasadniać interpretację i określać granice wniosku.<\/p>\n<p>W quizie czytasz krótki tekst, wybierasz jedną z trzech odpowiedzi i otrzymujesz wyjaśnienie. Kolejne zadania mają ustaloną kolejność. Dalszą częścią zajęć jest wspólne omówienie i otwarta analiza materiału o Waszym programie.<\/p>\n<div class=\"guide-route\" aria-label=\"Przebieg pracy na C5\"><span><b>1. Rozpoznaj<\/b><br>Quiz i objaśnienia<\/span><span><b>2. Uzasadnij<\/b><br>Fragment i reguła<\/span><span><b>3. Zastosuj<\/b><br>Własne źródło<\/span><\/div>\n<details data-guide=\"solo\"><summary>Przed C5: jak przejść trening samodzielny?<\/summary>\n<ol><li>Zarezerwuj 8–10 minut. Na starcie wybierz „Rozpocznij trening” w części „Samodzielnie”.<\/li><li>Przeczytaj przykład z objaśnieniem, a potem opowieść o bibliotece. To fikcja dydaktyczna.<\/li><li>Rozwiąż pięć zadań. Po każdej próbie przeczytaj informację zwrotną. Możesz używać podpowiedzi i poprawiać odpowiedzi.<\/li><li>W podsumowaniu zapisz jedno pytanie lub trudność do omówienia na C5. Na zajęciach otrzymasz inny zestaw, dotyczący programu Twojego zespołu.<\/li><\/ol>\n<p>Nie musisz ukończyć treningu solo, żeby wejść do części zespołowej.<\/p><\/details>\n<details data-guide=\"team\"><summary>Na C5: jak pracować w zespole?<\/summary>\n<p>Po wykładzie pracujcie w parze lub trójce. Wybierzcie swój program i używajcie jednego wspólnego urządzenia do zapisu odpowiedzi. Quiz ma 13 pytań w pięciu rundach i zajmuje około 30 minut. Opowieści A/B są fikcyjne, choć odnoszą się do badanego przez Was programu.<\/p>\n<ol><li><b>Każdy wybiera sam:<\/b> przez około 20 sekund ustal własny typ w myślach lub na kartce. Aplikacja nie zbiera osobnych głosów.<\/li><li><b>Uzgadniacie odpowiedź:<\/b> porównajcie wybory i wskażcie fragment tekstu. Analityk proponuje kod, sceptyk sprawdza podstawę, dokumentalista zapisuje wniosek. W parze jedna osoba łączy role.<\/li><li><b>Sprawdzacie i korygujecie:<\/b> zatwierdźcie wspólny wybór, przeczytajcie objaśnienie i w razie potrzeby poprawcie interpretację. Po rundzie zamieńcie się rolami. Sami pilnujecie czasu i podziału zadań.<\/li><\/ol>\n<p><b>Przygotujcie dwa uzasadnienia:<\/b> jedno, przy którym byliście zgodni, i jedno sporne lub budzące największą niepewność. Możecie je wpisać pod odpowiednimi pytaniami w sekcji „Zapiszcie uzasadnienie”. Rama wypowiedzi: „Wybieramy… ponieważ w tekście…; z tego fragmentu nie wynika…”. Prowadzący oceni rozumowanie podczas omówienia.<\/p>\n<\/details>\n<details data-guide=\"rounds\"><summary>Co robimy w pięciu rundach?<\/summary>\n<ol><li><b>Rozpoznaj narrację — 2 pytania.<\/b> Oceń, czy fragment spełnia warunki narracji w NPF.<\/li><li><b>Odczytaj strukturę — 5 pytań.<\/b> Ustal tło, role postaci, fabułę i proponowane rozwiązanie.<\/li><li><b>Porównaj opowieści — 2 pytania.<\/b> Porównaj A/B: eksponowane problemy i próby zmiany uczestnictwa w sporze.<\/li><li><b>Sprawdź interpretację — 2 pytania.<\/b> Oceń przypisanie roli oraz twierdzenie o wpływie narracji.<\/li><li><b>Zaplanuj badanie — 2 pytania.<\/b> Dobierz sposób badania i dane do pytania o narrację.<\/li><\/ol>\n<p>W każdej rundzie opierajcie odpowiedź na podanym tekście. Własna ocena polityczna programu nie zastępuje odczytania opowieści.<\/p><\/details>\n<details data-guide=\"transfer\"><summary>Co robimy po quizie i co ma powstać?<\/summary>\n<p>Po quizie omówcie dwa uzasadnienia. Następnie z podsumowania wybierzcie „Przejdź do pracy ze źródłem”. Ta część mieści się w dalszym planie C5, poza 30 minutami quizu.<\/p>\n<ol><li>Wybierzcie autentyczny fragment 80–150 słów o swoim programie. Zapiszcie autora, datę i lokalizację. Przy pracy offline można użyć dostarczonej parafrazy, zachowując jej oznaczenie.<\/li><li>Każda osoba samodzielnie przypisuje kody z dowodami tekstowymi na osobnej kartce lub w osobnym dokumencie. Zachowajcie te wersje do porównania.<\/li><li>Porównajcie kody i zapiszcie wspólny wynik w karcie HTML: uzasadnione kody, rozbieżność lub niepewność, regułę interpretacji, hipotezę o wpływie i granicę wniosku.<\/li><li>Na koniec każdy pisze osobny bilet wyjścia: jeden kod z dowodem, jedną korektę lub uzasadnione utrzymanie kodu oraz jeden brakujący ślad wpływu. Wspólne pole HTML służy zebraniu najważniejszych wniosków.<\/li><\/ol>\n<p><b>Rezultat:<\/b> dwa uzasadnienia quizowe, wspólna karta analizy źródła i indywidualne bilety wyjścia. Karta w aplikacji jest jedna dla programu; nie zastępuje osobnych prac uczestników. Jakość analiz otwartych ocenia człowiek.<\/p><\/details>\n<details data-guide=\"controls\"><summary>Jak używać przycisków, pomocy i zapisu?<\/summary>\n<ul><li>Wybierz jedną odpowiedź i kliknij „Sprawdź odpowiedź”. Samo zaznaczenie nie nalicza próby. Po błędzie możesz poprawić wybór albo przejść dalej. Zmieniony wybór trzeba ponownie sprawdzić. Trafna odpowiedź pozostaje zablokowana przed przypadkową zmianą.<\/li><li>„Podpowiedź” i „Pojęcia” są dozwolone. Użycie pomocy aplikacji przed pierwszą próbą zostaje odnotowane i nie odbiera punktów. „Jak grać” wyjaśnia obsługę i nie jest podpowiedzią do pytania.<\/li><li>„Wstecz” pozwala wrócić do poprzedniego zadania. „Podsumowanie” jest dostępne także przed ukończeniem quizu. Stamtąd można wrócić do zadań lub przejść do źródła.<\/li><li>„Pobierz zapis” / JSON tworzy kopię do wznowienia lub przeniesienia pracy. „Wczytaj zapis JSON” jest na ekranie startowym. Import zastępuje bieżące sesje po potwierdzeniu.<\/li><li>TXT i wydruk/PDF służą do czytania lub przekazania pracy prowadzącemu ustalonym kanałem. Pobranie pliku nie oznacza jego wysłania.<\/li><\/ul>\n<p>Gra działa offline, a zapis pozostaje w tej przeglądarce. Nie ma współdzielonej sesji internetowej ani automatycznego oddawania pracy. Przed zamknięciem pobierz JSON, szczególnie jeśli pojawi się komunikat o braku zapisu lokalnego.<\/p><\/details>\n<details data-guide=\"score\"><summary>Co oznacza wynik i kiedy kończymy?<\/summary>\n<p>Podsumowanie rozdziela trafne pierwsze odpowiedzi, aktualną trafność po poprawkach i użycie pomocy. Nie sumuje wyników solo i zespołu. Poprawka po przeczytaniu objaśnienia dokumentuje przebieg uczenia, a nie samodzielne opanowanie pojęcia.<\/p>\n<p>Quiz kończy się po sprawdzeniu pięciu albo trzynastu zadań; wynik nie musi być maksymalny. Pełne ćwiczenie na C5 obejmuje jeszcze omówienie, pracę ze źródłem i bilet wyjścia. Aplikacja nie przyznaje punktów za jakość uzasadnień ani nie potwierdza ukończenia całej analizy. Prowadzący może zakończyć etap quizowy o czasie i przejść do dalszej części zajęć.<\/p><\/details>\n<\/div>\n";

function teamQuestions(id) {
  const items = PROGRAM_ITEMS[id];
  if (!items) throw new Error('Nieznany program: ' + id);
  const stages = [0, 0, 1, 1, 1, 1, 1, 2, 2, 3, 3, 4, 4];
  return items.map(([prompt, opts, correct, feedback], i) => ({
    id: 'q' + String(i + 1).padStart(2, '0'),
    stage: stages[i], prompt, opts: [...opts], correct, feedback
  }));
}

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){let j;const n=i+1,limit=Math.floor(4294967296/n)*n;let r;do{r=crypto.getRandomValues(new Uint32Array(1))[0];}while(r>=limit);j=r%n;[b[i],b[j]]=[b[j],b[i]];}return b;}

function validateDB(x){
 if(!plain(x)||!plain(x.sessions)||!(x.selected===null||KEYS.includes(x.selected)))throw Error('Nieprawidłowa struktura zapisu.');
 const out={selected:x.selected,sessions:{},migrated:!!x.migrated};
 for(const key of Object.keys(x.sessions)){
  if(!KEYS.includes(key))throw Error('Nieznany tryb lub program.');
  const s=x.sessions[key];if(!plain(s))throw Error('Nieprawidłowa sesja.');
  const qs=bank(key),t=blank(key);
  if(!Number.isInteger(s.cursor)||s.cursor<0||s.cursor>=qs.length)throw Error('Nieprawidłowy numer zadania.');t.cursor=s.cursor;
  for(const name of ['answers','notes','helped','evidence','order'])if(!plain(s[name]))throw Error('Nieprawidłowe pole '+name+'.');
  for(const [k,v]of Object.entries(s.notes))if(own(FIELD_LABELS,k)&&typeof v==='string')t.notes[k]=v.slice(0,16000);
  for(const q of qs){
   const idx=n=>Number.isInteger(n)&&n>=0&&n<q.opts.length;
   if(own(s.answers,q.id)){
    const a=s.answers[q.id];if(!plain(a)||!Number.isInteger(a.attempts)||a.attempts<0||a.attempts>999)throw Error('Nieprawidłowy zapis odpowiedzi.');
    if(a.selected!==null&&!idx(a.selected))throw Error('Nieprawidłowy wybór.');
    if(a.attempts===0&&(a.checked!==null||a.firstSelected!==null))throw Error('Niespójny wynik bez próby.');
    if(a.attempts>0&&(!idx(a.selected)||!idx(a.checked)||!idx(a.firstSelected)))throw Error('Brak odpowiedzi przy zapisanej próbie.');
    if(a.attempts===1&&a.checked!==a.firstSelected)throw Error('Niespójny wynik pierwszej próby.');
    t.answers[q.id]={selected:a.selected,checked:a.checked,firstSelected:a.firstSelected,attempts:a.attempts,firstHelp:!!a.firstHelp};
   }
   if(typeof s.helped[q.id]==='boolean')t.helped[q.id]=s.helped[q.id];
   if(typeof s.evidence[q.id]==='string')t.evidence[q.id]=s.evidence[q.id].slice(0,2000);
   const ord=s.order[q.id];if(!Array.isArray(ord)||ord.length!==q.opts.length||new Set(ord).size!==q.opts.length||!ord.every(idx))throw Error('Nieprawidłowa kolejność opcji.');t.order[q.id]=ord.slice();
  }
  if(typeof s.created==='string')t.created=s.created.slice(0,80);out.sessions[key]=t;
 }
 if(out.selected&&!own(out.sessions,out.selected))out.selected=null;
 return out;
}

}

 $('#welcome').innerHTML=`<div class="eyebrow">Narrative Policy Framework • przygotowanie i C5</div><h1>Dwa kroki do analizy narracji</h1><p class="lead">Najpierw krótki trening samodzielny. Na C5 — wspólne decyzje o Waszym programie, poparte fragmentem tekstu.</p>${loadNotice?`<p class="notice">${esc(loadNotice)}</p>`:''}<section class="game-description" aria-labelledby="gameDescription"><div><h2 id="gameDescription">Na czym polega gra?</h2><p>To quiz analityczny: czytasz opowieść, wybierasz odpowiedź i poznajesz objaśnienie. Na C5 uzasadniacie decyzje w zespole, a potem stosujecie NPF do autentycznego źródła. Celem jest interpretacja poparta tekstem.</p></div><button id="welcomeGuide">Opis i instrukcja →</button></section><div class="mode-grid"><article class="panel"><div class="eyebrow">Przed C5 • 8–10 minut</div><h2>Samodzielnie</h2><p>Poznaj sposób analizy na fikcyjnym przykładzie biblioteki. Pięć zadań i jedno pytanie do zabrania na zajęcia.</p><button class="primary" id="soloStart">${db.sessions.solo?'Wznów trening':'Rozpocznij trening'}</button></article><article class="panel"><div class="eyebrow">Na C5 • około 30 minut</div><h2>W zespole</h2><p>Wybierzcie własny program. Najpierw każdy ustala odpowiedź, potem zespół uzgadnia wybór i jego podstawę.</p><button class="primary" id="chooseProgram">Wybierz program</button></article></div><details id="programChoices"><summary>Programy do pracy zespołowej</summary><p class="small">Pracujcie w parze lub trójce na jednym wspólnym urządzeniu. Każdy ustala własny wybór, a w aplikacji zaznaczacie odpowiedź uzgodnioną przez zespół.</p><div class="grid">${PROGRAMS.map(id=>{const p=CONTENT[id];return`<article class="program"><span class="num">ZESPOŁY ${esc(p.teams)}</span><h3>${esc(p.name)}</h3><p>${esc(p.focus)}</p><button data-start="${id}">${db.sessions['team:'+id]?'Wznów':'Rozpocznij'} →</button></article>`}).join('')}</div></details><div class="orientation"><div><h3>Najpierw wybór, potem wyjaśnienie</h3><p>Na ekranie jest jedno zadanie. Po sprawdzeniu można poprawić odpowiedź. Punkty służą informacji zwrotnej, a nie ocenie z kursu.</p></div><div><h3>Osobne zapisy</h3><p>Trening indywidualny i każdy program mają własny wynik. Na C5 nie musicie odtwarzać rozwiązanego wcześniej zestawu.</p></div></div><div class="actions"><button id="loadFile">Wczytaj zapis JSON</button>${legacyRaw?'<button id="oldFile">Pobierz zachowany zapis v1</button>':''}</div><p class="small muted">Gra działa offline. Notatki pozostają w przeglądarce; kopię możesz pobrać jako JSON. Na zajęcia przygotuj też własne źródło o programie. Teksty treningowe są fikcyjne.</p>`;
 $('#welcomeGuide').onclick=openInstructions;$('#soloStart').onclick=()=>start('solo');$('#chooseProgram').onclick=()=>{$('#programChoices').open=true;$('#programChoices').scrollIntoView({behavior:'smooth',block:'start'});};document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start('team:'+b.dataset.start));$('#loadFile').onclick=()=>$('#importFile').click();if($('#oldFile'))$('#oldFile').onclick=()=>download('NPF_zachowany_zapis_v1.json',JSON.stringify({application:'NPF-LAB-1',data:JSON.parse(legacyRaw)},null,2),'application/json');show('welcome');
}
function start(key){const fresh=!db.sessions[key];db.selected=key;if(fresh)db.sessions[key]=blank(key);save();if(key==='solo'&&fresh)renderIntro();else renderPlay();}
function renderIntro(){
 $('#intro').innerHTML=`<div class="eyebrow">Przed C5 • przykład z objaśnieniem</div><h1>Najpierw kod i jego podstawa</h1><p class="lead">W NPF opisujemy role nadane w tekście. Oddzielamy je od tego, co wydarzyło się w rzeczywistości.</p><article class="panel"><span class="source-tag">Fikcja dydaktyczna</span><p class="story">„Osoby czekające na autobus mokną podczas deszczu. Zarząd transportu może je ochronić, stawiając wiatę”.</p><div class="worked"><p><b>Ofiara:</b> osoby czekające. Podstawa: „mokną podczas deszczu”.</p><p><b>Bohater:</b> zarząd transportu. Podstawa: „może je ochronić”.</p><p><b>Granica:</b> tekst proponuje pomoc. Nie dowodzi, że wiata powstała.</p></div></article><p>Teraz samodzielnie przeanalizuj inną opowieść. Jeśli potrzebujesz definicji, użyj „Podpowiedź”. Nie musisz ukończyć treningu, aby wejść do gry zespołowej.</p><div class="actions"><button class="primary" id="introNext">Przejdź do 5 zadań →</button><button id="introBack">Wróć na start</button></div>`;$('#introNext').onclick=()=>renderPlay();$('#introBack').onclick=renderWelcome;show('intro');
}
function simpleNote(key,label,help=''){return`<label class="field" for="field-${key}">${esc(label)}${help?`<small>${esc(help)}</small>`:''}<textarea id="field-${key}" data-note="${key}" rows="3" maxlength="16000">${esc(session().notes[key]||'')}</textarea></label>`;}
function shortField(key,label){return`<label class="field" for="field-${key}">${esc(label)}<input type="text" id="field-${key}" data-note="${key}" maxlength="300" value="${esc(session().notes[key]||'')}"></label>`;}
function wireNotes(){document.querySelectorAll('[data-note]').forEach(el=>el.oninput=()=>{session().notes[el.dataset.note]=el.value;save();});}
function storyCard(name,body){return`<article class="reading"><span class="card-label">${esc(name)}</span><p>${esc(body)}</p></article>`;}
function stories(q){
 if(!team())return`<details class="texts" open><summary>Opowieść o bibliotece <span class="source-tag">Fikcja</span></summary>${storyCard('Tekst wyjściowy',SOLO.story)}${q.context?storyCard('Nowa informacja do tego zadania',q.context):''}</details>`;
 const p=profile(),showB=q.stage===2;
 let body=storyCard('Opowieść A',p.a)+(showB?storyCard('Opowieść B',p.b):'');
 return`<details class="texts" ${q.stage<3?'open':''}><summary>${showB?'Opowieści A i B':'Opowieść A'} <span class="source-tag">Fikcja</span></summary><div class="${showB?'story-columns':''}">${body}</div></details>`;
}
function hint(q){
 if(q.hint)return q.hint;
 if(!team())return ['Kod wymaga fragmentu pokazującego rolę, a nie samego wymienienia grupy.','Narrator tworzy lub przekazuje opowieść. Bohater ma w niej rozwiązać problem.','Sprawdź, które elementy nadal są w tekście. Minimum NPF to postać i odniesienie do polityki publicznej.','Jedna osoba lub instytucja może mieć różne role w różnych opowieściach.','Oddziel treść uzasadnienia decyzji od pełnego wyjaśnienia jej przyczyn.'][session().cursor];
 return ['Minimum NPF: postać i odniesienie do polityki publicznej. Nie wymaga kompletu wszystkich elementów.','Wybierz fragment uzasadniający kod. Tło osadza problem, postacie odgrywają role, fabuła wiąże zdarzenia, morał postuluje działanie.','Zestaw, kogo zaprasza się do debaty, kto ponosi szkodę i jakie rozwiązanie jest postulowane.','Porównaj interpretację z tekstem. Wskazanie przyczyny szkody nie musi oznaczać skonstruowania antagonisty.','Dobierz dane do pytania: struktura wypowiedzi, reakcja jednostek i działania w procesie wymagają odmiennych obserwacji.'][q.stage];
}
function markHelp(){if(view==='play'&&db.selected){session().helped[current().id]=true;save();}}
function questionHTML(q){const a=record(q.id),locked=a.checked===q.correct&&a.attempts>0,ord=session().order[q.id];return`<fieldset class="question" id="question"><legend>${esc(q.prompt)}</legend><div class="answers">${ord.map(i=>`<label class="option"><input type="radio" name="answer" value="${i}" ${a.selected===i?'checked':''} ${locked?'disabled':''}><span>${esc(q.opts[i])}</span></label>`).join('')}</div><button class="primary" id="checkAnswer" ${locked?'disabled':''}>${locked?'Sprawdzono':a.attempts?'Sprawdź poprawkę':'Sprawdź odpowiedź'}</button><p id="draftNotice" class="small muted">${a.attempts&&a.selected!==a.checked?'Zmieniono wybór. Sprawdź go, aby zaktualizować wynik.':''}</p>${a.attempts?`<div class="feedback ${locked?'':'wrong'}" role="status" tabindex="-1"><strong>${locked?'Trafna odpowiedź.':'Sprawdź podstawę odpowiedzi.'}</strong><p>${esc(q.feedback)}</p>${locked?'':'<p>Możesz poprawić wybór albo przejść dalej i wrócić do niego później.</p>'}</div>`:''}</fieldset>`;}
function renderPlay(scroll=true){
 const s=session(),q=current(),qs=bank(db.selected),t=stats(),isTeam=team();
 const stageNav=isTeam?STAGES.map((name,i)=>{const group=qs.filter(x=>x.stage===i),done=group.every(x=>s.answers[x.id]?.attempts>0),enabled=qs.filter(x=>x.stage<i).every(x=>s.answers[x.id]?.attempts>0);return`<button class="stage-dot ${q.stage===i?'active':''}" data-round="${i}" ${enabled?'':'disabled'} ${q.stage===i?'aria-current="step"':''}>${i+1}<span class="sr-only">. ${esc(name)}${done?' — zadania podjęte':''}</span></button>`}).join(''):'';
 $('#play').innerHTML=`<div class="workspace"><aside class="sidebar"><div class="eyebrow">${isTeam?'C5 • w zespole':'Przed C5 • samodzielnie'}</div><p class="program-name">${esc(isTeam?profile().short:'Biblioteka po pracy')}</p><div class="meter" role="progressbar" aria-label="Sprawdzone zadania" aria-valuenow="${t.attempted}" aria-valuemin="0" aria-valuemax="${t.total}"><span style="width:${t.attempted/t.total*100}%"></span></div><p class="small tally">Sprawdzone: ${t.attempted}/${t.total}</p><div class="stage-nav">${stageNav}</div><div class="sidebar-actions"><button id="saveJSON">Pobierz zapis</button><button id="showReport">Podsumowanie</button></div><p class="small muted ${storageOK?'':'save-error'}" id="saveState">${storageOK?'Zapis lokalny aktywny.':'Brak zapisu — pobierz JSON.'}</p></aside><div class="task-area"><div class="eyebrow">Zadanie ${s.cursor+1}/${qs.length}${isTeam?' • Runda '+(q.stage+1)+'/5':''}</div><h1 class="task-title">${esc(isTeam?STAGES[q.stage]:q.topic)}</h1>${isTeam?`<p class="round-task">${esc(STAGE_ACTIONS[q.stage])}</p><p class="team-rule">20 sekund: każdy wybiera sam. Potem uzgodnijcie odpowiedź i wskażcie fragment, który ją wspiera.</p>`:''}${stories(q)}${q.context&&isTeam?`<div class="task-context"><span class="source-tag">Dodatkowy fragment fikcyjny</span><p>${esc(q.context)}</p></div>`:''}${questionHTML(q)}<details id="hint"><summary>Podpowiedź</summary><p>${esc(hint(q))}</p><p class="small muted">Użycie pomocy przed pierwszym sprawdzeniem zostanie odnotowane. Nie odbiera punktów.</p></details>${isTeam?`<details><summary>Zapiszcie uzasadnienie (opcjonalnie)</summary><label class="field" for="evidence">Fragment → kod → granica wniosku<textarea id="evidence" rows="2" maxlength="2000">${esc(s.evidence[q.id]||'')}</textarea></label><p class="small muted">Prowadzący może poprosić o wyjaśnienie wybranych dwóch odpowiedzi. Gra nie ocenia jakości wpisanego uzasadnienia.</p></details>`:''}<div class="stage-footer"><button id="previous" ${s.cursor===0?'disabled':''}>← Wstecz</button><button class="primary" id="next">${s.cursor===qs.length-1?'Podsumuj →':'Następne zadanie →'}</button></div>${isTeam?`<details><summary>Oznaczenie zespołu i zakres</summary>${shortField('team','Numer zespołu (bez nazwisk)')}${shortField('role','Role w tej rundzie')}<p class="small">${esc(profile().scope)}</p></details>`:'<button class="quiet" id="seeExample">Wróć do przykładu z objaśnieniem</button>'}</div></div>`;
 document.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{const a=record(q.id);a.selected=+el.value;save();$('#draftNotice').textContent=a.attempts&&a.selected!==a.checked?'Zmieniono wybór. Sprawdź go, aby zaktualizować wynik.':'';});
 $('#checkAnswer').onclick=check;$('#next').onclick=next;$('#previous').onclick=()=>{s.cursor--;save();renderPlay();};$('#saveJSON').onclick=exportJSON;$('#showReport').onclick=()=>renderResult();$('#hint').ontoggle=()=>{if($('#hint')?.open)markHelp();};if($('#evidence'))$('#evidence').oninput=()=>{s.evidence[q.id]=$('#evidence').value;save();};if($('#seeExample'))$('#seeExample').onclick=()=>{markHelp();renderIntro();};
 document.querySelectorAll('[data-round]').forEach(b=>b.onclick=()=>{s.cursor=qs.findIndex(x=>x.stage===+b.dataset.round);save();renderPlay();});wireNotes();show('play',scroll);
}
function check(){const q=current(),a=record(q.id);if(a.selected===null){toast('Wybierz jedną odpowiedź.');return;}if(a.attempts&&a.checked===q.correct)return;if(a.attempts===0){a.firstSelected=a.selected;a.firstHelp=!!session().helped[q.id];}a.checked=a.selected;a.attempts++;save();const y=scrollY;renderPlay(false);scrollTo(0,y);$('.feedback').focus({preventScroll:true});$('.feedback').scrollIntoView({behavior:'smooth',block:'nearest'});}
function next(){const a=record(current().id);if(!a.attempts){toast('Najpierw wybierz i sprawdź odpowiedź.');$('#checkAnswer').focus();return;}if(a.selected!==a.checked){toast('Sprawdź zmienioną odpowiedź albo wróć do ostatnio sprawdzonego wyboru.');return;}if(session().cursor===bank(db.selected).length-1)renderResult();else{const old=current().stage;session().cursor++;save();renderPlay();if(team()&&current().stage!==old)toast('Nowa runda — zamieńcie się rolami.');}}
function sourceLinks(p){return p.zrodla.map(z=>`<p class="small"><a href="${esc(z.url)}" target="_blank" rel="noopener noreferrer">${esc(z.tytul)}</a> — ${esc(z.autor)}${z.data?', '+esc(z.data):''}<br>${esc(z.lokalizacja)}</p>`).join('');}
function renderTransfer(){const p=sourceProfile(),n=session().notes;$('#transferScreen').innerHTML=`<div class="eyebrow">Po grze • C5 • praca ze źródłem</div><h1>Sprawdźcie kody w rzeczywistym materiale</h1><p class="lead">Ta karta jest oddzielnym zadaniem. Najpierw wybierzcie fragment, potem zakodujcie go niezależnie i porównajcie wyniki.</p><div class="actions"><button id="backToReport">← Podsumowanie gry</button><button id="saveTransfer">Pobierz zapis JSON</button></div><p class="notice">Opowieści A/B były fikcyjne. Do tej części wybierzcie autentyczny fragment 80–150 słów. Parafraza poniżej może pomóc w pracy offline; jej brzmienie nie zastępuje oryginału.</p><section class="panel"><h2>1. Fragment i metadane</h2><details><summary>Źródła i pomoc offline dla ${esc(profile().short)}</summary>${sourceLinks(p)}<h3>Parafrazy z wcześniejszych pakietów</h3>${p.parafrazy.slice(0,2).map((f,i)=>{const z=p.zrodla.find(z=>z.id===f.zrodlo_id);return`<article class="source-item"><b>${esc(z?.autor)} • ${esc(z?.data||'data do ustalenia')}</b><p>${esc(f.tekst)}</p><p class="small">${esc(f.ograniczenie)}</p><button data-paraphrase="${i}">Wstaw jako parafrazę</button></article>`}).join('')}</details><label class="field" for="field-kind">Status fragmentu<select data-note="kind" id="field-kind"><option value="">Wybierz status</option>${['Cytat z oryginalnego źródła','Parafraza dydaktyczna — oryginał do sprawdzenia','Własna parafraza sprawdzona z oryginałem'].map(k=>`<option ${n.kind===k?'selected':''}>${esc(k)}</option>`).join('')}</select></label>${simpleNote('fragment','Fragment','Wklej tekst z oryginału albo jawnie oznaczoną parafrazę.')}<div class="two-fields">${shortField('author','Autor źródła / narrator (odróżnij te role)')}${shortField('date','Data dokumentu')}</div>${simpleNote('locator','Źródło i lokalizator','Tytuł, plik lub URL, strona/akapit, data dostępu.')}${simpleNote('audience','Adresat i kontekst','Do kogo i w jakiej sytuacji skierowano wypowiedź?')}</section><section class="panel"><h2>2. Kodowanie i porównanie</h2><p>Każda osoba zapisuje swoje kody przed rozmową na osobnej kartce lub w osobnym dokumencie. W tej wspólnej karcie zapiszcie dopiero wynik porównania.</p>${simpleNote('codes','Kody z fragmentami','Tło, postacie, fabuła, morał, przekonanie/strategia. Dopuszczalne: brak lub niejednoznaczność.')}${simpleNote('disagreement','Rozbieżność i reguła','Co zakodowaliście odmiennie? Jaki fragment uzasadnia rozstrzygnięcie lub zachowanie różnicy?')}</section><section class="panel"><h2>3. Hipoteza i granice</h2>${simpleNote('hypothesis','Hipoteza','Cecha narracji → reakcja odbiorców/działanie → wynik R. Podaj dane i możliwy wynik podważający.')}${simpleNote('limit','Czego fragment nie dowodzi?','Wskaż brakujący ślad wpływu i alternatywne wyjaśnienie.')}${simpleNote('exit','Wnioski z indywidualnych biletów wyjścia','Każdy pisze osobno: kod z dowodem, korektę lub utrzymanie kodu i brakujący ślad wpływu. Tutaj zbierzcie najważniejsze wnioski, bez nazwisk.')}<p class="small muted">Otwarte odpowiedzi wymagają oceny człowieka. Wypełnione pola nie oznaczają poprawnej analizy.</p></section><div class="actions"><button class="primary" id="transferDone">Zobacz kartę do oddania →</button></div>`;wireNotes();$('#backToReport').onclick=()=>renderResult();$('#saveTransfer').onclick=exportJSON;$('#transferDone').onclick=()=>renderResult();document.querySelectorAll('[data-paraphrase]').forEach(b=>b.onclick=()=>{const f=p.parafrazy[+b.dataset.paraphrase],z=p.zrodla.find(z=>z.id===f.zrodlo_id);if(n.fragment&&!confirm('Zastąpić fragment i jego metadane wybraną parafrazą? Pozostałe notatki pozostaną.'))return;Object.assign(n,{kind:'Parafraza dydaktyczna — oryginał do sprawdzenia',fragment:f.tekst,author:(z?.autor||'')+' (autor źródła; narratora sprawdź w oryginale)',date:z?.data||'',locator:`${z?.tytul||''}\n${z?.url||''}\n${z?.lokalizacja||''}\nParafraza z pakietu: ${f.lokalizacja_lokalna}`});save();renderTransfer();$('#field-kind').scrollIntoView({block:'center'});});show('transferScreen');}
function renderResult(scroll=true,activate=true){
 if(!db.selected)return;

 $('#result').innerHTML=`<div class="eyebrow">${isTeam?'Gra zespołowa na C5':'Przygotowanie indywidualne przed C5'}</div><h1>${esc(title())}</h1><p class="lead">${t.attempted===t.total?(isTeam?'Quiz ukończony. Teraz zastosujcie NPF do autentycznego źródła.':SOLO.completion):'To zapis częściowej pracy. Możesz wrócić do pozostałych zadań.'}</p><div class="scorecards"><div class="scorecard"><strong>${t.first}<small>/${t.total}</small></strong><span>Trafne pierwsze odpowiedzi<br>Sprawdzono ${t.attempted}/${t.total} zadań.</span></div><div class="scorecard"><strong>${t.final}<small>/${t.total}</small></strong><span>Trafne obecnie<br>${t.corrected} po poprawieniu błędu.</span></div><div class="scorecard"><strong>${t.helpFirst}</strong><span>Zadań z pomocą przed pierwszą próbą<br>Pomoc nie odbiera punktów.</span></div></div><p class="small muted">Wynik po objaśnieniu nie jest dowodem samodzielnego opanowania materiału. Wynik pierwszych odpowiedzi także wymaga ostrożnej interpretacji. Nie ma rankingu ani oceny kursowej.</p><div class="actions"><button id="returnGame">Wróć do zadań</button>${isTeam?'<button class="primary" id="openTransfer">Przejdź do pracy ze źródłem →</button>':'<button class="primary" id="returnHome">Wybierz pracę na C5 →</button>'}<button id="downloadText">Pobierz kartę TXT</button><button id="downloadJSON">Pobierz zapis JSON</button><button id="printReport">Drukuj / PDF</button></div>${!isTeam?`<div class="panel no-print">${simpleNote('soloReflection','Zabierz na C5 jedno pytanie',SOLO.finalReflection.prompt)}</div>`:''}<section class="panel"><h2>${isTeam?'Dwa uzasadnienia do omówienia':'Co zabierasz na zajęcia'}</h2><p>${isTeam?'Wybierzcie jedną odpowiedź, przy której byliście zgodni, i jedną sporną lub budzącą największą niepewność. Pokażcie fragment, regułę kodowania i granicę wniosku. Sam wybór litery nie wystarcza.':'Na C5 pracujecie na innym przykładzie i we własnym zespole. Osobny wynik treningu pozostaje zapisany. Przydatny schemat: kod → fragment → granica wniosku.'}</p></section><details class="no-print"><summary>Wyniki poszczególnych zadań i powrót do poprawy</summary><div class="result-items">${qs.map((q,i)=>{const a=s.answers[q.id],ok=a?.attempts&&a.checked===q.correct;return`<button data-review="${i}">${i+1}. ${ok?'Trafne':a?.attempts?'Do poprawy':'Nie sprawdzono'}</button>`}).join('')}</div></details><section class="panel"><h2>Karta pracy</h2>${isTeam&&!Object.values(s.notes).some(Boolean)?'<p>Nie ma jeszcze zapisanych notatek. Uzupełnicie je w osobnej części „Praca ze źródłem”.</p>':''}${Object.entries(FIELD_LABELS).filter(([k])=>isTeam?k!=='soloReflection'&&s.notes[k]:k==='soloReflection').map(([k,l])=>`<div class="summary-row"><b>${esc(l)}</b><p data-summary="${k}" class="${s.notes[k]?'':'empty'}">${esc(s.notes[k]||'Nie uzupełniono')}</p></div>`).join('')}${isTeam?qs.filter(q=>s.evidence[q.id]).map(q=>`<div class="summary-row"><b>Uzasadnienie zadania ${q.id.slice(1)}</b><p>${esc(s.evidence[q.id])}</p></div>`).join(''):''}</section>${isTeam?'<section class="panel"><h2>Rubryka do oceny przez człowieka</h2><p>Źródło i status; kod i fragment; mechanizm i poziom; granica wniosku. Każde kryterium: 0 — brak lub błąd, 1 — częściowo, 2 — poprawnie i z uzasadnieniem. Wynik 0–8 służy informacji zwrotnej i nie jest sumowany z quizem.</p></section>':''}<details class="panel answer-trace"><summary>Ślad odpowiedzi</summary>${qs.map((q,i)=>{const a=s.answers[q.id];return`<div class="summary-row"><b>${i+1}. ${esc(q.prompt)}</b><p>Pierwszy wybór: ${esc(a?.attempts?q.opts[a.firstSelected]:'nie sprawdzono')}<br>Ostatnio sprawdzony: ${esc(a?.attempts?q.opts[a.checked]:'brak')}<br>Liczba prób: ${a?.attempts||0}; pomoc przed pierwszą próbą: ${a?.firstHelp?'tak':'nie'}.</p></div>`}).join('')}</details><div class="actions no-print"><button id="resetSession">Rozpocznij ten tryb od nowa</button><p class="small muted">Pozostałe programy i drugi tryb pozostaną zapisane.</p></div>`;

function exportText(){const t=stats(),s=session();let out=`NPF — ${title()}\nTryb: ${team()?'zespół na C5':'samodzielnie przed C5'}\nPierwsze trafne: ${t.first}/${t.total}; trafne obecnie: ${t.final}/${t.total}; sprawdzono: ${t.attempted}/${t.total}.\nPomoc przed pierwszą próbą: ${t.helpFirst} zadań.\nWynik po objaśnieniu nie dowodzi samodzielnego opanowania NPF.\n\n`;for(const[k,l]of Object.entries(FIELD_LABELS))if(team()?k!=='soloReflection':k==='soloReflection')out+=`${l}\n${s.notes[k]||'[nie uzupełniono]'}\n\n`;for(const[qid,txt]of Object.entries(s.evidence))out+=`Uzasadnienie ${qid}\n${txt}\n\n`;out+='ŚLAD ODPOWIEDZI\n';for(const q of bank(db.selected)){const a=s.answers[q.id];out+=`${q.id} ${q.prompt}\nPierwsza: ${a?.attempts?q.opts[a.firstSelected]:'brak'}\nOstatnia sprawdzona: ${a?.attempts?q.opts[a.checked]:'brak'}\nPrób: ${a?.attempts||0}. Pomoc przed pierwszą próbą: ${a?.firstHelp?'tak':'nie'}.\n\n`;}out+='Źródło teoretyczne: Jones, Smith-Walter, McBeth i Shanahan (2023), The Narrative Policy Framework, s.161–195. DOI:10.4324/9781003308201-7. Teksty treningowe są fikcyjne.\n';if(team())for(const z of sourceProfile().zrodla)out+=`${z.autor}, ${z.tytul}, ${z.url}\n`;download('NPF_karta_'+db.selected.replace(':','_')+'.txt','\uFEFF'+out,'text/plain;charset=utf-8');}

$('#teacherBtn').onclick=()=>dialog('Jak wykorzystać grę przed C5 i na C5',`<p><strong>Przed C5:</strong> 8–10 minut samodzielnego startu na fikcyjnej bibliotece, z krótkim przykładem i pięcioma pytaniami. Student przynosi jedno pytanie lub trudność. To przygotowanie, nie zaliczenie.</p><p><strong>Na C5:</strong> 0–5 przypomnienie i pytania; 5–35 gra zespołowa o własnym programie; 35–45 omówienie; 45–65 źródło i indywidualne kodowanie; 65–80 porównanie kodów; 80–87 hipoteza i K2; 87–90 bilet wyjścia.</p><p><strong>W zespole:</strong> każdy ustala wybór przed rozmową. Następnie uzgadniacie odpowiedź i jej podstawę tekstową. Po rundzie zamiana ról. Prowadzący prosi o dwa uzasadnienia, w tym jedno sporne. W parze łączy się rolę dokumentalisty z analitykiem lub sceptykiem.</p><p><strong>Wynik:</strong> osobno trafność pierwszych odpowiedzi i aktualna trafność po poprawkach. Gra odnotowuje użycie swoich podpowiedzi. Nie mierzy samodzielnego opanowania materiału ani perswazyjnej skuteczności narracji.</p><p><strong>Gdy zabraknie czasu:</strong> otwórzcie częściowe podsumowanie i wybierzcie zadania do wspólnego omówienia. Zachowajcie pracę ze źródłem. Nie trzeba przejść solo, aby wejść w tryb zespołowy.</p><p><strong>Bez internetu:</strong> użyj pobranego źródła albo jawnej parafrazy w karcie. W razie braku sprzętu prowadzący wyświetla pytania, a zespoły zapisują odpowiedzi. Pełny klucz nie jest wyświetlany przed próbą — wyjaśnienia pojawiają się po odpowiedzi.</p><p class="small">Czasy są założeniem projektowym. Pierwsze zajęcia powinny służyć także sprawdzeniu, które pytania wymagają doprecyzowania.</p>`);

", "H2": "Plan nadawcy i dobór adresatów nie są pomiarem reakcji odbiorców.", "H3": "Data publikacji i zamiar autora nie ustalają początku prac nad rozwiązaniem."}}, {"id": "E2", "title": "Ślad na posiedzeniu", "preview": "Fragment protokołu spotkania po publikacji A.", "kind": "protokół", "cost": 1, "simulation": true, "body": "Protokół fikcyjnego zespołu roboczego, D+8. Członkini zespołu mówi: „W publikacji A zwrócono uwagę na problem narażenia mieszkańców ulic o dużym ruchu. Uwzględnijmy tę perspektywę przy porównaniu wariantów”. Przewodniczący dopisuje do porządku następnego spotkania omówienie tego argumentu. Protokół odnotowuje także argumenty o kosztach i wykonalności.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Obecność argumentu w protokole nie opisuje strategii poszerzania kręgu uczestników zapisanej w A.", "H2": "Wypowiedź jednej członkini zespołu nie jest wynikiem eksperymentu z odbiorcami A.", "H3": "To ślad wykorzystania argumentu w procesie. Nie ustala początku prac ani tego, czy bez A prace by się rozpoczęły. Nie należy go traktować jako dowodu braku jakiegokolwiek wpływu."}}, {"id": "E3", "title": "Licznik zasięgu", "preview": "Raport wyświetleń, kliknięć i zapisów na spotkanie.", "kind": "raport komunikacji", "cost": 1, "simulation": true, "body": "Raport kanału publikacji, D+7. Komunikat wyświetlono 12 000 razy; odnotowano 300 kliknięć i 18 zapisów na spotkanie. Jedna osoba mogła zobaczyć komunikat wiele razy. Formularz zapisu zawierał imię i adres kontaktowy. Nie zawierał pytania o poparcie dla rozwiązania.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Zasięg i kliknięcia nie zastępują analizy zaproszenia do rozszerzenia debaty. Wysoki zasięg nie jest sam w sobie strategią zakresu konfliktu.", "H2": "Wyświetlenia, kliknięcia i zapisy nie mierzą zmiany poparcia ani porównania A z inną wersją tekstu.", "H3": "Zasięg publikacji nie ustala genezy prac nad ro e wyodrębniono efektu samego bohatera.", "H3": "Efekt komunikatu na deklarowane poparcie ochotników nie ustala przyczyn rozpoczęcia prac nad rozwiązaniem."}}, {"id": "E6", "title": "Oś czasu bieżącej sprawy", "preview": "Wykaz publikacji, spotkań i decyzji z bieżącego miesiąca.", "kind": "chronologia", "cost": 1, "simulation": true, "body": "Wykaz sprawy z bieżącego miesiąca. D0: publikacja A. D+8: omówienie jej argumentu na posiedzeniu. D+16: porównanie wariantów. D+24: przyjęcie rekomendacji dalszych prac nad strefą z harmonogramem i wsparciem dla osób potrzebujących dostosowania. Nagłówek wykazu: „Zdarzenia po rozpoczęciu bieżącego miesiąca”.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Kolejność zdarzeń nie jest dowodem konkretnej strategii narracyjnej w A.", "H2": "Chronologia procesu nie zawiera porównania reakcji uczestników badania.", "H3": "A poprzedza wymienione posiedzenia, lecz wykaz zaczyna się w D0. Następstwo czasowe nie ustala genezy prac; może istnieć wcześniejsza historia."}}], "twist": {"id": "T", "title": "Nowy ślad: wcześniejszy projekt", "kind": "archiwum", "simulation": true, "body": "Archiwum przekazuje dokument z D−21, czyli 21 dni przed publikacją A. Tytuł: „Roboczy plan prac nad strefą z harmonogramem i wsparciem dla osób potrzebujących dostosowania”. Metryka rejestru potwierdza tę datę. W dokumencie przydzielono zadania zespołowi i zapisano pierwsze warianty rozwiązania. To nadal ta sama fikcyjna sprawa; dokument nie jest źródłem o rzeczywistym programie.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "weaken"}, "explanations": {"H1": "Wcześniejszy projekt nie zmienia treści zaproszenia w A.", "H2": "Historia prac nie zmienia wyniku eksperymentu ani nie zastępuje jego danych.", "H3": "Prace trwały już przed A, co osłabia tezę, że to jej publikacja je zapoczątkowała. Wciąż możliwe jest, że A wpłynęła na dalszy przebieg, kształt lub przyjęcie rozwiązania; tego dokument nie rozstrzyga."}}, "verdicts": {"H1": {"default": "supported", "evidence": ["A", "E1"], "feedback": "Kodujemy zaproszenie do udziału, a nie faktyczny wzrost liczby uczestników. Wystarcza trafny fragment A; karta metadanych może go uzupełnić."}, "H2": {"default": "undetermined", "ifOpened": {"card": "E5", "verdict": "supported"}, "evidence": ["E5"], "evidenceWhenUndetermined": ["A", "B", "E1", "E2", "E3", "E4", "E6", "T"], "feedback": "Losowy przydział i wyższe poparcie w grupie A wspierają tezę o dodatnim efekcie całego tekstu w tej próbie i w tym pomiarze. To nie dowód trwałej zmiany ani efektu u wszystkich mieszkańców. Nie wyodrębniono efektu samego bohatera.", "feedbackWithoutCard": "Nie pozyskaliście wyniku eksperymentu. Z posiadanych akt nie można rozstrzygnąć tej tezy. Trafne nierozstrzygnięcie z wyjaśnieniem ograniczeń jest pełnowartościowym wynikiem śledztwa; nie zgadujcie zawartości nieotwartych kart."}, "H3": {"default": "undetermined", "afterTwist": "weakened", "evidence": ["T"], "evidenceWhenUndetermined": ["A", "B", "E1", "E2", "E3", "E4", "E5", "E6"], "feedback": "Prace trwały już przed A, co osłabia tezę, że to jej publikacja je zapoczątkowała. Wciąż możliwe jest, że A wpłynęła na dalszy przebieg, kształt lub przyjęcie rozwiązania; tego dokument nie rozstrzyga.", "feedbackBeforeTwist": "Pozyskane materiały nie określają jeszcze początku prac. Wzmianka w protokole i następujące po publikacji spotkania są śladami do dalszego sprawdzenia, ale nie dowodzą genezy."}}, "debrief": ["Pokażcie w A ofiarę (mieszkańcy ulic o dużym ruchu), bohatera (zespół miejski), fabułę (mniej emisyjnych przejazdów → mniejsze narażenie mieszkańców) i morał (przyjąć strefę z harmonogramem i wsparciem). Bohater oferuje rozwiązanie; nie musi mieć już potwierdzonej skuteczności.", "Porównajcie ofiarę w A z ofiarą w B (osoby zależne od starszych samochodów). Role są przypisaniem tekstu, nie stałą oceną grupy. Nie trzeba dopisywać antagonisty.", "Która decyzja o wyborze akt była najbardziej użyteczna dla konkretnej tezy? Czy inna ścieżka mogłaby prowadzić do równie uczciwego raportu?", "Co nowy dokument zmienił, a czego nie zmienił? Oddzielcie początek prac, późniejsze wykorzystanie argumentu i ostateczny wynik polityki.", "W rzeczywistym badaniu programu zastąpcie wszystkie fikcyjne karty autentycznymi źródłami. Przenieście regułę „teza — dowód — granica wniosku”, nie treść ustaleń symulacji."]}, "BO": {"title": "Detektyw narracji — BO Warszawa", "briefing": "Zespół ma sprawdzić trzy twierdzenia o publikacji A. Najpierw odtwórzcie narrację, potem zdecydujcie, które akta otworzyć. Sprawa dotyczy tematu „Dwa znaczenia sprawiedliwego podziału”, ale wszystkie akta śledztwa są wymyślone. Waszym celem jest raport, który mówi dokładnie tyle, na ile pozwalają zdobyte dowody.", "fictionalTimelineNotice": "D0 to umowny dzień publikacji A w symulacji. D−21 i D+8 nie są datami rzeczywistych wydarzeń programu.", "hypotheses": [{"id": "H1", "text": "Narracja A stosuje strategię rozszerzania zakresu konfliktu.", "scope": "Treść i strategia narracji; poziom mezo."}, {"id": "H2", "text": "W opisanym eksperymencie tekst A zwiększył deklarowane poparcie w porównaniu z informacją bez narracji.", "scope": "Efekt całej wersji tekstu w badanej próbie i w pomiarze tuż po lekturze; poziom mikro."}, {"id": "H3", "text": "Publikacja A zapoczątkowała prace nad proponowanym rozwiązaniem.", "scope": "Geneza prac w fikcyjnym procesie; nie to samo co dalszy wpływ na decyzję."}], "baseEvidence": {"A": {"title": "Narracja A", "body": "Podczas warszawskiej debaty o lokalnych pulach BO mieszkańcy małych osiedli nie mogą sfinansować potrzebnego placu zabaw. Zespół mieszkańców może poprawić reguły, proponując minimalną pulę dla każdego obszaru. Plac zabaw kosztuje podobnie także tam, gdzie mieszka mniej osób, więc mała pula blokuje podobne projekty. Dlatego należy wprowadzić minimalną pulę lokalną. Zaprośmy do debaty rady rodziców z całego miasta, bo dostęp do sąsiedzkich inwestycji dotyczy wszystkich.", "relations": {"H1": "support", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Fragment „zaprośmy do debaty rady rodziców z całego miasta” zaprasza nowe grupy do sporu. To podstawa kodu rozszerzania zakresu konfliktu, a nie dowód sukcesu zaproszenia.", "H2": "Treść komunikatu nie jest pomiarem jego efektu.", "H3": "Postulat rozwiązania nie ustala początku prac nad nim."}}, "B": {"title": "Narracja B", "body": "W warszawskiej debacie o lokalnych pulach BO mieszkańcy ludnych osiedli obawiają się zbyt małych środków na osobę. Zespół odpowiedzialny za BO może chronić równe traktowanie, wiążąc pule z liczbą mieszkańców. Więcej mieszkańców oznacza więcej potrzeb, dlatego należy utrzymać podział według liczby ludności. Ten spór o sposób obliczania pul powinna rozstrzygnąć komisja techniczna w dotychczasowym składzie.", "relations": {"H1": "neutral", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "B pokazuje inną narrację; teza H1 dotyczy strategii zapisanej w A.", "H2": "B nie jest informacją bez narracji z eksperymentu. Nie wolno podmieniać grupy porównawczej.", "H3": "Postulat z B nie ustala genezy prac nad rozwiązaniem z A."}}}, "cards": [{"id": "E1", "title": "Kto nadał komunikat?", "preview": "Karta redakcyjna: autor, odbiorcy i cel publikacji.", "kind": "metadane", "cost": 1, "simulation": true, "body": "Karta redakcyjna, dzień D0. Autor publikacji A: „Grupa A” — nazwa fikcyjnej koalicji używana w aktach. Plan dystrybucji: przekazać tekst przedstawicielom rad rodziców z całego miasta. Zapisany cel: „Chcemy włączyć do sporu środowiska spoza dotychczasowego grona uczestników”. W tekście pomoc oferuje zespół mieszkańców proponujący zmianę.", "relations": {"H1": "support", "H2": "neutral", "H3": "neutral"}, "explanations": {"H1": "Zaplanowano włączenie nowych uczestników. Karta, razem z zaproszeniem w A, wspiera kod strategii rozszerzania zakresu konfliktu. Nie dowodzi, że zaproszeni faktycznie dołączyli.", "H2": "Plan nadawcy i dobór adr
