splay:grid;grid-template-columns:1fr 1fr;gap:15px;padding:25px;background:var(--ink);border-radius:14px;color:white}.board-art span{padding:18px;border:1px solid #73918e;border-radius:6px;line-height:1.4}.board-art b{display:block;color:#b6dbcb;font-size:27px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px}.aside{position:sticky;top:20px;align-self:start}.progress{display:flex;gap:8px;margin:16px 0 24px}.progress span{flex:1;border-top:5px solid #d1d9d3;padding-top:7px;font-size:13px}.progress .active{border-color:var(--teal);font-weight:700}.progress .past{border-color:#8daaa0}blockquote{margin:18px 0;border-left:3px solid var(--teal);padding:15px 20px;background:#eff5f2;font-size:18px}fieldset{border:0;padding:0;margin:18px 0}legend{font-weight:700;font-size:21px;margin-bottom:15px}.option{display:flex;gap:12px;border:1px solid var(--line);border-radius:8px;padding:14px;margin:10px 0;cursor:pointer}.option:has(input:checked){background:#edf5f0;border-color:var(--teal)}input[type=radio]{min-width:18px;height:18px;margin-top:5px}.feedback{border-left:4px solid var(--teal);padding:15px 20px;background:#edf5f0}.feedback.retry{border-color:var(--amber);background:#fff7e9}textarea,input[type=search],select{width:100%;padding:12px;font:inherit;border:1px solid #91a6a5;border-radius:7px}textarea{min-height:140px;resize:vertical}label.field{display:block;font-weight:650;margin:14px 0 6px}details{border:1px solid var(--line);border-radius:8px;margin:12px 0;padding:12px 16px;background:white}summary{cursor:pointer;font-weight:650}.aside details p{font-size:15px}.metric{display:flex;gap:18px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:8px;background:white}.metric b{font-size:32px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:15px}.error{color:#8a321a;font-weight:650}.badge{font-size:13px;color:var(--teal)}.usertext{white-space:pre-wrap;overflow-wrap:anywhere}dialog{border:1px solid var(--line);border-radius:16px </style></head><body><a class="skip" href="#main">Przejdź do treści</a><header><div><small>TEORIA I PRAKTYKA POLITYKI PUBLICZNEJ</small><strong>Detektyw narracji / NPF</strong></div><nav aria-label="Pomoc"><button id="home">Programy</button><button id="guide">Jak grać</button><button id="glossary">Pojęcia</button><button id="sources">Źródła</button><button id="c5">Na C5</button></nav></header><main id="main" tabindex="-1"></main><section id="printReport"></section><footer>TPPP 2026/2027 • Wersja 4.1 • 29.10.2026 • Na podstawie Jones i in. (2023). Materiał opracowany z pomocą AI. Narracje są fikcyjne. Otwarte uzasadnienia ocenia prowadzący.</footer><dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="close">Zamknij</button></div><div id="dialogBody"></div></dialog><input type="file" id="importFile" accept=".json,application/json" hidden><script>const DATA={"SCT":{"name":"Strefa Czystego Transportu","short":"SCT Warszawa","teams":"1 i 2","scope":"Warszawa, proces ustanowienia SCT w latach 2021–2024; uchwała z 7 grudnia 2023 r.","focus":"Zdrowie mieszkańców i dostęp do miasta","a":"Podczas warszawskiej debaty o strefie na jednym stole leżą mapa ulic i uwagi do harmonogramu. Rodzice mieszkający przy ruchliwych trasach opisują codzienne odprowadzanie dzieci wzdłuż jezdni. Nie mogą przenieść domu ani szkoły, a sam wybór bocznej ulicy nie usuwa ich narażenia na spaliny. Część uczestników spotkania pyta również o koszty wymiany samochodu.\n\nMiejski zespół proponuje rozłożyć ograniczenia dla najbardziej emisyjnych pojazdów na etapy i połączyć je z pomocą w dostosowaniu. Mniejsza liczba takich przejazdów ma ograniczyć kontakt mieszkańców z zanieczyszczeniami. Harmonogram ma dać czas na przygotowanie, lecz sam nie zastąpi zmiany ruchu.\n\nW projekcie stanowiska strefa pozostaje potrzebnym krokiem, pod warunkiem połączenia reguł wjazdu z okresem przejściowym i wsparciem. Do rozmowy zaproszono szkoły i organizacje pacjentów: sprawa nie kończy się na posiadaczach aut.","b":"W drugiej wypowiedzi o warszawskiej strefie pojawia się pracownica dojeżdżająca na wczesną zmianę. Z jej miejscowości pierwszy autobus rusza po rozpoczęciu pracy. Starszy samochód jest dla niej sposobem utrzymania zatrudnienia, nie tylko wyborem wygodniejszej podróży. Autor nie kwestionuje problemu zanieczyszczenia powietrza.\n\nMiasto mogłoby odpowiedzieć na tę trudność, uzgadniając wcześniejsze kursy i połączenia przez granice gmin. Samo przesunięcie terminu ograniczeń odsuwa problem, jeśli dojazd pozostaje niewykonalny. Zbyt szybkie wejście reguł w życie może przenieść koszt zmiany na osoby o małym wyborze środków transportu.\n\nW tej opowieści rozkład alternatywnych dojazdów powinien poprzedzać kolejne etapy ograniczeń. Okres przejściowy nadal jest potrzebny, ale jego długość należy powiązać z dostępnością połączeń. Autor zaprasza do rozmowy także pracowników spoza Warszawy.","setting":"Podczas warszawskiej debaty o strefie","victim":"rodziny mieszkające przy ruchliwych trasach","hero":"miejski zespół","plot":"mniej emisyjnych przejazdów → mniejsze narażenie mieszkańców","moral":"przyjąć strefę z harmonogramem i wsparciem","bVictim":"osoby zależne od starszych samochodów","cause":"zanieczyszczone powietrze","expansion":"włączmy do debaty także szkoły i organizacje pacjentów","warning":"Nie przypisuj tekstów A/B rzeczywistym urzędnikom ani NGO. W autentycznej analizie oddziel datę wypowiedzi, uchwałę i rozpoczęcie funkcjonowania strefy.","roles":[["Rodziny mieszkające przy trasach, których codzienne otoczenie naraża je na spaliny.","Uczestnicy pytający o samochody, którym tekst przypisuje główny ciężar narażenia na spaliny.","Organizacje zaproszone do rozmowy, którym tekst przypisuje utratę możliwości dojazdu."],["Szkoły i organizacje pacjentów występują jako podmioty wdrażające zmianę reguł wjazdu.","Miejski zespół występuje jako podmiot łączący zmianę reguł wjazdu z pomocą.","Rodziny przy trasach występują jako podmiot wdrażający ograniczenia dla emisyjnych pojazdów."]],"plotOptions":["Ograniczenie emisyjnych przejazdów ma zmniejszyć narażenie; harmonogram ułatwia przygotowanie do zmiany.","Wydłużenie okresu przejściowego ma zmniejszyć narażenie; ograniczenia wjazdu utrwalają uzyskaną poprawę.","Przeniesienie codziennych tras rodzin ma zmniejszyć narażenie; zmiana reguł wjazdu je uzupełnia."],"moralOptions":["Przyjąć harmonogram dostosowania, odkładając ustalenie reguł wjazdu do oceny jego rezultatów.","Przyjąć etapowe reguły wjazdu, łącząc ich wdrożenie z pomocą w dostosowaniu.","Przyjąć ograniczenia wjazdu, pozostawiając przygotowanie do zmiany indywidualnym decyzjom użytkowników samochodów."],"compareOptions":["A wiąże ochronę zdrowia z ograniczeniami, B wiąże ich kolejność z alternatywnymi dojazdami.","A wiąże ochronę zdrowia z ograniczeniami, B zastępuje ograniczenia rozbudową alternatywnych dojazdów.","A uzależnia ograniczenia od alternatywnych dojazdów, B uznaje sam harmonogram za wystarczającą pomoc."],"limitOptions":["Tekst B przedstawia dostępność dojazdu jako warunek kolejności zmian w organizacji ruchu.","Tekst B dokumentuje zmianę harmonogramu pod wpływem osób dojeżdżających do pracy spoza miasta.","Tekst B potwierdza przyjęcie wspólnego stanowiska przez organizacje reprezentujące pracowników spoza miasta."],"evidence":["Nie mogą przenieść domu ani szkoły","Miejski zespół proponuje rozłożyć ograniczenia","Mniejsza liczba takich przejazdów ma ograniczyć kontakt mieszkańców z zanieczyszczeniami","pod warunkiem połączenia reguł wjazdu z okresem przejściowym i wsparciem","rozkład alternatywnych dojazdów powinien poprzedzać kolejne etapy ograniczeń","W tej opowieści rozkład alternatywnych dojazdów powinien poprzedzać kolejne etapy ograniczeń"],"reasons":[["Tekst przypisuje tej grupie trudność, której nie usuwa indywidualna zmiana drogi. To podstawa kodu ofiary.","Pytanie o koszty pojawia się w A, lecz nie tej grupie przypisano główny opis codziennego narażenia na spaliny.","Zaproszenie do debaty nie oznacza przypisania zaproszonym organizacjom szkody ani utraty dojazdu."],["Szkoły i organizacje są zapraszane do debaty; tekst nie powierza im wprowadzania reguł wjazdu.","Zespołowi przypisano działanie mające przynieść ulgę. To rola bohatera, nawet jeśli rezultat pozostaje obietnicą.","Rodziny opisano jako narażone na problem, a nie jako wdrażające regulację."],["Tekst łączy zmianę ruchu ze zmianą narażenia, a harmonogramowi przypisuje funkcję przygotowania.","Harmonogram organizuje dostosowanie, ale tekst wyraźnie odróżnia go od działania ograniczającego emisje.","Wybór innej drogi przedstawiono jako niewystarczający. Ta odpowiedź zamienia ograniczenie działania w proponowany mechanizm."],["A nie odkłada ustalenia reguł do zakończenia okresu dostosowawczego. Harmonogram i ograniczenia są częściami jednej propozycji.","To rekonstrukcja postulowanego rozwiązania, czyli morału tej narracji.","Ograniczenia są częścią A, lecz pozostawienie dostosowania samym użytkownikom pomija postulowane wsparcie."],["Obie narracje dopuszczają ograniczenia. B zmienia warunek ich wdrożenia i grupę, której trudność eksponuje.","B nie zastępuje strefy transportem publicznym; wiąże kolejność ograniczeń z dostępnością alternatyw.","To odwrócenie warunków. W B sam harmonogram nie wystarcza, jeśli dojazd pozostaje niewykonalny."],["Można odtworzyć warunek postulowany w opowieści B. Nie oznacza to, że został on przyjęty.","Wypowiedź zawiera postulat dotyczący harmonogramu, nie dokumentację przyczyny rzeczywistej decyzji.","Zaproszenie do rozmowy nie jest dowodem wspólnego stanowiska ani istnienia koalicji."]],"transfer":"W autentycznej wypowiedzi o SCT sprawdź, czy aktor łączy ograniczenia z ochroną zdrowia, dostępnością dojazdu lub inną wartością. Oddziel postulowany termin od terminu uchwały i wdrożenia.","research":"Pytanie do projektu: czy sposób przedstawiania osób dotkniętych zmianą różni się między etapem konsultacji a uzasadnieniem decyzji? Dobierz datowane wypowiedzi i dokumenty z obu etapów. Do tezy o wpływie potrzebujesz także śladów wykorzystania argumentu w procesie decyzji.","questions":[{"id":"roles1","term":"characters","title":"Trop 1 • obsada opowieści","prompt":"Której grupie narracja A przypisuje główną trudność, na którą ma odpowiedzieć proponowana zmiana?","options":["Rodziny mieszkające przy trasach, których codzienne otoczenie naraża je na spaliny.","Uczestnicy pytający o samochody, którym tekst przypisuje główny ciężar narażenia na spaliny.","Organizacje zaproszone do rozmowy, którym tekst przypisuje utratę możliwości dojazdu."],"correct":0,"evidence":"Nie mogą przenieść domu ani szkoły","explanations":["Tekst przypisuje tej grupie trudność, której nie usuwa indywidualna zmiana drogi. To podstawa kodu ofiary.","Pytanie o koszty pojawia się w A, lecz nie tej grupie przypisano główny opis codziennego narażenia na spaliny.","Zaproszenie do debaty nie oznacza przypisania zaproszonym organizacjom szkody ani utraty dojazdu."],"feedback":"Ofiara w NPF to postać przedstawiona jako dotknięta szkodą lub trudnością. Rozpoznajemy przypisanie w tekście, nie orzekamy, kto obiektywnie stracił najwięcej. Grupa wymieniona w opowieści nie staje się przez to automatycznie ofiarą.","hint":"Oddziel grupę dotkniętą problemem od pozostałych uczestników. Znajdź opis przypisanej jej trudności."},{"id":"roles2","term":"characters","title":"Trop 2 • przypisana rola","prompt":"Która interpretacja roli bohatera ma oparcie w narracji A?","options":["Szkoły i organizacje pacjentów występują jako podmioty wdrażające zmianę reguł wjazdu.","Miejski zespół występuje jako podmiot łączący zmianę reguł wjazdu z pomocą.","Rodziny przy trasach występują jako podmiot wdrażający ograniczenia dla emisyjnych pojazdów."],"correct":1,"evidence":"Miejski zespół proponuje rozłożyć ograniczenia","explanations":["Szkoły i organizacje są zapraszane do debaty; tekst nie powierza im wprowadzania reguł wjazdu.","Zespołowi przypisano działanie mające przynieść ulgę. To rola bohatera, nawet jeśli rezultat pozostaje obietnicą.","Rodziny opisano jako narażone na problem, a nie jako wdrażające regulację."],"feedback":"Bohaterowi przypisuje się przyniesienie ulgi lub rozwiązanie problemu. Może nim być osoba, grupa lub instytucja. Wystarczy rola przypisana w opowieści, także w trybie przyszłym. Nie należy utożsamiać bohatera z autorem wypowiedzi ani z każdym uczestnikiem konsultacji.","hint":"Sprawdź, komu opowieść powierza działanie przynoszące ulgę, a komu tylko udział w debacie lub wykonanie innego zadania."},{"id":"plot","term":"plot","title":"Trop 3 • logika opowieści","prompt":"Który opis najlepiej odtwarza powiązanie problemu, działań i następstw w narracji A?","options":["Ograniczenie emisyjnych przejazdów ma zmniejszyć narażenie; harmonogram ułatwia przygotowanie do zmiany.","Wydłużenie okresu przejściowego ma zmniejszyć narażenie; ograniczenia wjazdu utrwalają uzyskaną poprawę.","Przeniesienie codziennych tras rodzin ma zmniejszyć narażenie; zmiana reguł wjazdu je uzupełnia."],"correct":0,"evidence":"Mniejsza liczba takich przejazdów ma ograniczyć kontakt mieszkańców z zanieczyszczeniami","explanations":["Tekst łączy zmianę ruchu ze zmianą narażenia, a harmonogramowi przypisuje funkcję przygotowania.","Harmonogram organizuje dostosowanie, ale tekst wyraźnie odróżnia go od działania ograniczającego emisje.","Wybór innej drogi przedstawiono jako niewystarczający. Ta odpowiedź zamienia ograniczenie działania w proponowany mechanizm."],"feedback":"Fabuła łączy postacie z kontekstem, porządkuje zdarzenia, działania, konflikty i motywy. W tym zadaniu ćwiczymy przedstawiony związek problemu i działania. To jeden aspekt fabuły; rozpoznanie go nie dowodzi rzeczywistej zależności przyczynowej.","hint":"Sprawdź kierunek zależności. Czy propozycja odpowiada na opisany problem, czy na wątek wspomniany tylko pobocznie?"},{"id":"moral","term":"moral","title":"Trop 4 • kierunek zmiany","prompt":"Jakie rozwiązanie pełni funkcję morału narracji A?","options":["Przyjąć harmonogram dostosowania, odkładając ustalenie reguł wjazdu do oceny jego rezultatów.","Przyjąć etapowe reguły wjazdu, łącząc ich wdrożenie z pomocą w dostosowaniu.","Przyjąć ograniczenia wjazdu, pozostawiając przygotowanie do zmiany indywidualnym decyzjom użytkowników samochodów."],"correct":1,"evidence":"pod warunkiem połączenia reguł wjazdu z okresem przejściowym i wsparciem","explanations":["A nie odkłada ustalenia reguł do zakończenia okresu dostosowawczego. Harmonogram i ograniczenia są częściami jednej propozycji.","To rekonstrukcja postulowanego rozwiązania, czyli morału tej narracji.","Ograniczenia są częścią A, lecz pozostawienie dostosowania samym użytkownikom pomija postulowane wsparcie."],"feedback":"Morał narracji to zwykle rozwiązanie problemu, wezwanie do działania lub lekcja moralna. W tych tekstach pytamy o postulowany instrument. Przykład ilustrujący problem, przewidywany rezultat i postulowane działanie pełnią różne funkcje, choć mogą wystąpić w jednym zdaniu.","hint":"Odtwórz postulat całej wypowiedzi. Nie pomyl przykładu, warunku lub oczekiwanego skutku z proponowanym narzędziem."},{"id":"compare","term":"characters","title":"Nowy trop • druga opowieść","prompt":"Które porównanie trafnie oddaje różnicę między A i B, bez dopisywania im postulatów?","options":["A wiąże ochronę zdrowia z ograniczeniami, B wiąże ich kolejność z alternatywnymi dojazdami.","A wiąże ochronę zdrowia z ograniczeniami, B zastępuje ograniczenia rozbudową alternatywnych dojazdów.","A uzależnia ograniczenia od alternatywnych dojazdów, B uznaje sam harmonogram za wystarczającą pomoc."],"correct":0,"evidence":"rozkład alternatywnych dojazdów powinien poprzedzać kolejne etapy ograniczeń","explanations":["Obie narracje dopuszczają ograniczenia. B zmienia warunek ich wdrożenia i grupę, której trudność eksponuje.","B nie zastępuje strefy transportem publicznym; wiąże kolejność ograniczeń z dostępnością alternatyw.","To odwrócenie warunków. W B sam harmonogram nie wystarcza, jeśli dojazd pozostaje niewykonalny."],"feedback":"Porównanie narracji obejmuje zarówno wspólne elementy, jak i zmianę postaci, akcentów lub proponowanego działania. Dodanie warunku wdrożenia nie musi oznaczać odrzucenia programu. Nie przypisuj roli złoczyńcy każdemu oponentowi ani nie wnioskuj o koalicji z samego podobieństwa tekstów.","hint":"Zestaw problem i postulat A z problemem i postulatem B. Szukaj również elementów, które druga opowieść zachowuje."},{"id":"limits","term":"mechanisms","title":"Kontrola raportu • granice dowodów","prompt":"Który wniosek ma wystarczającą podstawę w samym tekście B?","options":["Tekst B przedstawia dostępność dojazdu jako warunek kolejności zmian w organizacji ruchu.","Tekst B dokumentuje zmianę harmonogramu pod wpływem osób dojeżdżających do pracy spoza miasta.","Tekst B potwierdza przyjęcie wspólnego stanowiska przez organizacje reprezentujące pracowników spoza miasta."],"correct":0,"evidence":"W tej opowieści rozkład alternatywnych dojazdów powinien poprzedzać kolejne etapy ograniczeń","explanations":["Można odtworzyć warunek postulowany w opowieści B. Nie oznacza to, że został on przyjęty.","Wypowiedź zawiera postulat dotyczący harmonogramu, nie dokumentację przyczyny rzeczywistej decyzji.","Zaproszenie do rozmowy nie jest dowodem wspólnego stanowiska ani istnienia koalicji."],"feedback":"Analiza tekstu pozwala odtworzyć treść narracji. Pytanie, czy przekonała odbiorców lub wpłynęła na decyzję, wymaga danych o odbiorcach albo procesie decyzyjnym. Pytanie o skutki programu wymaga jeszcze innego rodzaju danych. NPF umożliwia stawianie tych pytań, lecz kodowanie pojedynczej wypowiedzi nie daje wszystkich odpowiedzi.","hint":"Oddziel to, jak narrator coś przedstawia, od informacji o przyjęciu rozwiązania, jego efektach i wpływie na decyzję."}]},"BO":{"name":"Budżet obywatelski Warszawy","short":"BO Warszawa","teams":"3 i 10","scope":"Zmiana reguł 17 października 2024 r. dla edycji BO 2026; poziom lokalny i podział środków.","focus":"Dwa znaczenia sprawiedliwego podziału","a":"W warszawskiej debacie o lokalnych pulach budżetu obywatelskiego przedstawiono szkic niewielkiego placu zabaw. Mieszkańcy małego osiedla od kilku edycji odkładają ten pomysł: nawet skromny projekt przekracza dostępną pulę. W większym osiedlu podobny zakup mieści się w budżecie. Cena urządzeń nie maleje proporcjonalnie do liczby osób zameldowanych w okolicy.\n\nGrupa mieszkańców przynosi propozycję minimalnej kwoty dla każdego obszaru. Powyżej tego minimum część pieniędzy nadal mogłaby zależeć od liczby ludności. Pomysł ma otworzyć drogę do projektów, które odpadają przed głosowaniem, a nie zagwarantować zwycięstwo konkretnemu placowi zabaw.\n\nAutor stanowiska uznaje tę korektę podziału za warunek realnego wyboru lokalnych inwestycji. Urzędnicy sporządzają zestawienie kosztów, a rady rodziców zostają zaproszone do dyskusji. Spór dotyczy możliwości zgłaszania wykonalnych projektów, choć pada także pytanie o środki przypadające na mieszkańca.","b":"W odpowiedzi dotyczącej warszawskich pul BO opisano gęsto zamieszkany obszar, w którym wielu mieszkańców korzysta z tych samych niewielkich przestrzeni. Tam podobny projekt musi służyć większej liczbie osób. Przeznaczenie znacznej części środków na jednakowe minima może pozostawić temu obszarowi mniej pieniędzy na mieszkańca.\n\nZespół odpowiedzialny za zasady BO proponuje oprzeć podział na liczbie ludności. Koszt urządzenia placu zabaw nie jest pomijany, ale za właściwą jednostkę porównania uznaje się osobę, a nie obszar. W tej opowieści powiązanie puli z liczbą mieszkańców ma chronić równość dostępu do wspólnych środków.\n\nAutor dopuszcza sprawdzenie granic obszarów, lecz nie traktuje tego jako zgody na gwarantowaną minimalną kwotę. Wyliczenia miałaby porównać dotychczasowa komisja. Opis nie zawiera informacji o przyjęciu któregokolwiek wariantu.","setting":"W warszawskiej debacie o lokalnych pulach budżetu obywatelskiego","victim":"mieszkańcy małego osiedla","hero":"grupa mieszkańców proponująca minimalną kwotę","plot":"podobny koszt placu zabaw + mała pula → zablokowane projekty","moral":"wprowadzić minimalną pulę lokalną","bVictim":"mieszkańcy ludnych osiedli","cause":"mała pula przy podobnych kosztach projektu","expansion":"zaprośmy do debaty rady rodziców z całego miasta","warning":"W rzeczywistych konsultacjach podobna treść anonimowej uwagi nie dowodzi tożsamości jej autora. Korekta granic obszarów i wprowadzenie poziomu lokalnego to różne wyniki.","roles":[["Mieszkańcy małego osiedla, których projekty nie mieszczą się w dostępnej puli.","Mieszkańcy większego osiedla, których projekty nie zdobywają poparcia w lokalnym głosowaniu.","Członkowie rad rodziców, których projekty przegrywają przez wysokie koszty zakupu urządzeń."],["Urzędnicy sporządzający zestawienie występują jako autorzy proponowanego minimum dla każdego obszaru.","Grupa proponująca minimum występuje jako inicjator zmiany otwierającej drogę lokalnym projektom.","Rady rodziców zaproszone do dyskusji występują jako wykonawcy już wybranych inwestycji."]],"plotOptions":["Podobne koszty przy małej puli blokują projekty; minimum ma umożliwić ich zgłoszenie.","Niskie poparcie przy małej puli blokuje projekty; minimum ma zwiększyć liczbę głosów.","Nadmierna liczba lokalnych projektów rozdrabnia pulę; minimum ma ograniczyć konkurencję między nimi."],"moralOptions":["Podzielić środki według liczby mieszkańców, uzupełniając ten podział korektą granic obszarów.","Zapewnić obszarom minimalną kwotę, pozostawiając możliwość podziału reszty według liczby mieszkańców.","Zapewnić dofinansowanie wybranemu placowi zabaw, pozostawiając dotychczasowy sposób podziału lokalnych środków."],"compareOptions":["A uzasadnia minimum dla obszaru, B uzasadnia podział środków według liczby mieszkańców.","A uzasadnia minimum dla mieszkańca, B uzasadnia podział środków według kosztów projektów.","A uzasadnia minimum dla obszaru, B uznaje korektę granic za przyjęcie tego minimum."],"limitOptions":["W B liczba mieszkańców stanowi uzasadnienie proponowanego sposobu podziału środków między obszary.","W B liczba mieszkańców wyjaśnia przyjęty przez komisję sposób podziału środków między obszary.","W B liczba mieszkańców potwierdza rzeczywistą przewagę potrzeb większych obszarów nad potrzebami mniejszych."],"evidence":["nawet skromny projekt przekracza dostępną pulę","Grupa mieszkańców przynosi propozycję minimalnej kwoty dla każdego obszaru","Cena urządzeń nie maleje proporcjonalnie do liczby osób","Powyżej tego minimum część pieniędzy nadal mogłaby zależeć od liczby ludności","za właściwą jednostkę porównania uznaje się osobę, a nie obszar","powiązanie puli z liczbą mieszkańców ma chronić równość dostępu"],"reasons":[["Szkodą w tej opowieści jest brak realnej możliwości zgłoszenia inwestycji w granicach puli.","Tekst nie opisuje przegranej większego osiedla w głosowaniu. Podobny zakup mieści się tam w budżecie.","Rady rodziców są zaproszone do dyskusji; nie podano ich własnych przegranych projektów."],["Urzędnicy dostarczają zestawienie. Autorstwo rozwiązania przypisano grupie mieszkańców.","Grupa ma usunąć przeszkodę przez zmianę zasad, dlatego otrzymuje rolę bohatera. Te same osoby mogą w narracji pełnić więcej niż jedną rolę.","Zaproszenie do debaty nie oznacza wykonawstwa inwestycji. Nie opisano też rozstrzygnięcia głosowania."],["Minimum ma usunąć barierę wykonalności finansowej przed głosowaniem. To zależność budująca fabułę A.","Ta odpowiedź przenosi problem z etapu zgłaszania do głosowania. A nie obiecuje większego poparcia.","A nie wyjaśnia problemu nadmiarem projektów. Wskazuje relację kosztu pojedynczej inwestycji do puli."],["To rozwiązanie bliższe B. A wprowadza minimalną kwotę niezależną od przeliczenia na mieszkańca.","A postuluje minimum, ale dopuszcza kryterium ludności dla pozostałych środków. Nie trzeba dopisywać likwidacji tego kryterium.","Plac zabaw ilustruje barierę. Morałem jest zmiana reguł, nie przyznanie środków temu konkretnemu projektowi."],["Narracje odmiennie uzasadniają sprawiedliwy podział: przez zdolność obszaru do sfinansowania projektu lub przez liczbę mieszkańców.","Ta odpowiedź myli jednostkę minimum z A i kryterium podziału z B. Koszt projektu jest argumentem A.","B rozróżnia korektę granic i przyjęcie minimum. Podobny cel nie czyni tych instrumentów tym samym rozwiązaniem."],["Jest to twierdzenie o uzasadnieniu zawartym w narracji, które można sprawdzić na jej tekście.","B nie podaje decyzji komisji. Zamieniając propozycję w przyjęte rozwiązanie, wychodzimy poza materiał.","Narrator używa liczby ludności jako kryterium. Sam tekst nie mierzy rzeczywistej skali wszystkich potrzeb."]],"transfer":"W źródłach o BO odróżnij minimalną pulę, kryterium ludności oraz granice obszarów. Kodując morał, zapisz dokładny instrument, nie tylko ogólne hasło sprawiedliwości.","research":"Pytanie do projektu: jakie rozumienia sprawiedliwości wspierają różne propozycje podziału? Porównaj uwagi konsultacyjne i uzasadnienia zmian. Podobieństwo anonimowych uwag nie dowodzi wspólnego autora ani koalicji; przejęcie propozycji wymaga porównania z dokumentem decyzji.","questions":[{"id":"roles1","term":"characters","title":"Trop 1 • obsada opowieści","prompt":"Której grupie narracja A przypisuje główną trudność, na którą ma odpowiedzieć proponowana zmiana?","options":["Mieszkańcy małego osiedla, których projekty nie mieszczą się w dostępnej puli.","Mieszkańcy większego osiedla, których projekty nie zdobywają poparcia w lokalnym głosowaniu.","Członkowie rad rodziców, których projekty przegrywają przez wysokie koszty zakupu urządzeń."],"correct":0,"evidence":"nawet skromny projekt przekracza dostępną pulę","explanations":["Szkodą w tej opowieści jest brak realnej możliwości zgłoszenia inwestycji w granicach puli.","Tekst nie opisuje przegranej większego osiedla w głosowaniu. Podobny zakup mieści się tam w budżecie.","Rady rodziców są zaproszone do dyskusji; nie podano ich własnych przegranych projektów."],"feedback":"Ofiara w NPF to postać przedstawiona jako dotknięta szkodą lub trudnością. Rozpoznajemy przypisanie w tekście, nie orzekamy, kto obiektywnie stracił najwięcej. Grupa wymieniona w opowieści nie staje się przez to automatycznie ofiarą.","hint":"Oddziel grupę dotkniętą problemem od pozostałych uczestników. Znajdź opis przypisanej jej trudności."},{"id":"roles2","term":"characters","title":"Trop 2 • przypisana rola","prompt":"Która interpretacja roli bohatera ma oparcie w narracji A?","options":["Urzędnicy sporządzający zestawienie występują jako autorzy proponowanego minimum dla każdego obszaru.","Grupa proponująca minimum występuje jako inicjator zmiany otwierającej drogę lokalnym projektom.","Rady rodziców zaproszone do dyskusji występują jako wykonawcy już wybranych inwestycji."],"correct":1,"evidence":"Grupa mieszkańców przynosi propozycję minimalnej kwoty dla każdego obszaru","explanations":["Urzędnicy dostarczają zestawienie. Autorstwo rozwiązania przypisano grupie mieszkańców.","Grupa ma usunąć przeszkodę przez zmianę zasad, dlatego otrzymuje rolę bohatera. Te same osoby mogą w narracji pełnić więcej niż jedną rolę.","Zaproszenie do debaty nie oznacza wykonawstwa inwestycji. Nie opisano też rozstrzygnięcia głosowania."],"feedback":"Bohaterowi przypisuje się przyniesienie ulgi lub rozwiązanie problemu. Może nim być osoba, grupa lub instytucja. Wystarczy rola przypisana w opowieści, także w trybie przyszłym. Nie należy utożsamiać bohatera z autorem wypowiedzi ani z każdym uczestnikiem konsultacji.","hint":"Sprawdź, komu opowieść powierza działanie przynoszące ulgę, a komu tylko udział w debacie lub wykonanie innego zadania."},{"id":"plot","term":"plot","title":"Trop 3 • logika opowieści","prompt":"Który opis najlepiej odtwarza powiązanie problemu, działań i następstw w narracji A?","options":["Podobne koszty przy małej puli blokują projekty; minimum ma umożliwić ich zgłoszenie.","Niskie poparcie przy małej puli blokuje projekty; minimum ma zwiększyć liczbę głosów.","Nadmierna liczba lokalnych projektów rozdrabnia pulę; minimum ma ograniczyć konkurencję między nimi."],"correct":0,"evidence":"Cena urządzeń nie maleje proporcjonalnie do liczby osób","explanations":["Minimum ma usunąć barierę wykonalności finansowej przed głosowaniem. To zależność budująca fabułę A.","Ta odpowiedź przenosi problem z etapu zgłaszania do głosowania. A nie obiecuje większego poparcia.","A nie wyjaśnia problemu nadmiarem projektów. Wskazuje relację kosztu pojedynczej inwestycji do puli."],"feedback":"Fabuła łączy postacie z kontekstem, porządkuje zdarzenia, działania, konflikty i motywy. W tym zadaniu ćwiczymy przedstawiony związek problemu i działania. To jeden aspekt fabuły; rozpoznanie go nie dowodzi rzeczywistej zależności przyczynowej.","hint":"Sprawdź kierunek zależności. Czy propozycja odpowiada na opisany problem, czy na wątek wspomniany tylko pobocznie?"},{"id":"moral","term":"moral","title":"Trop 4 • kierunek zmiany","prompt":"Jakie rozwiązanie pełni funkcję morału narracji A?","options":["Podzielić środki według liczby mieszkańców, uzupełniając ten podział korektą granic obszarów.","Zapewnić obszarom minimalną kwotę, pozostawiając możliwość podziału reszty według liczby mieszkańców.","Zapewnić dofinansowanie wybranemu placowi zabaw, pozostawiając dotychczasowy sposób podziału lokalnych środków."],"correct":1,"evidence":"Powyżej tego minimum część pieniędzy nadal mogłaby zależeć od liczby ludności","explanations":["To rozwiązanie bliższe B. A wprowadza minimalną kwotę niezależną od przeliczenia na mieszkańca.","A postuluje minimum, ale dopuszcza kryterium ludności dla pozostałych środków. Nie trzeba dopisywać likwidacji tego kryterium.","Plac zabaw ilustruje barierę. Morałem jest zmiana reguł, nie przyznanie środków temu konkretnemu projektowi."],"feedback":"Morał narracji to zwykle rozwiązanie problemu, wezwanie do działania lub lekcja moralna. W tych tekstach pytamy o postulowany instrument. Przykład ilustrujący problem, przewidywany rezultat i postulowane działanie pełnią różne funkcje, choć mogą wystąpić w jednym zdaniu.","hint":"Odtwórz postulat całej wypowiedzi. Nie pomyl przykładu, warunku lub oczekiwanego skutku z proponowanym narzędziem."},{"id":"compare","term":"characters","title":"Nowy trop • druga opowieść","prompt":"Które porównanie trafnie oddaje różnicę między A i B, bez dopisywania im postulatów?","options":["A uzasadnia minimum dla obszaru, B uzasadnia podział środków według liczby mieszkańców.","A uzasadnia minimum dla mieszkańca, B uzasadnia podział środków według kosztów projektów.","A uzasadnia minimum dla obszaru, B uznaje korektę granic za przyjęcie tego minimum."],"correct":0,"evidence":"za właściwą jednostkę porównania uznaje się osobę, a nie obszar","explanations":["Narracje odmiennie uzasadniają sprawiedliwy podział: przez zdolność obszaru do sfinansowania projektu lub przez liczbę mieszkańców.","Ta odpowiedź myli jednostkę minimum z A i kryterium podziału z B. Koszt projektu jest argumentem A.","B rozróżnia korektę granic i przyjęcie minimum. Podobny cel nie czyni tych instrumentów tym samym rozwiązaniem."],"feedback":"Porównanie narracji obejmuje zarówno wspólne elementy, jak i zmianę postaci, akcentów lub proponowanego działania. Dodanie warunku wdrożenia nie musi oznaczać odrzucenia programu. Nie przypisuj roli złoczyńcy każdemu oponentowi ani nie wnioskuj o koalicji z samego podobieństwa tekstów.","hint":"Zestaw problem i postulat A z problemem i postulatem B. Szukaj również elementów, które druga opowieść zachowuje."},{"id":"limits","term":"mechanisms","title":"Kontrola raportu • granice dowodów","prompt":"Który wniosek ma wystarczającą podstawę w samym tekście B?","options":["W B liczba mieszkańców stanowi uzasadnienie proponowanego sposobu podziału środków między obszary.","W B liczba mieszkańców wyjaśnia przyjęty przez komisję sposób podziału środków między obszary.","W B liczba mieszkańców potwierdza rzeczywistą przewagę potrzeb większych obszarów nad potrzebami mniejszych."],"correct":0,"evidence":"powiązanie puli z liczbą mieszkańców ma chronić równość dostępu","explanations":["Jest to twierdzenie o uzasadnieniu zawartym w narracji, które można sprawdzić na jej tekście.","B nie podaje decyzji komisji. Zamieniając propozycję w przyjęte rozwiązanie, wychodzimy poza materiał.","Narrator używa liczby ludności jako kryterium. Sam tekst nie mierzy rzeczywistej skali wszystkich potrzeb."],"feedback":"Analiza tekstu pozwala odtworzyć treść narracji. Pytanie, czy przekonała odbiorców lub wpłynęła na decyzję, wymaga danych o odbiorcach albo procesie decyzyjnym. Pytanie o skutki programu wymaga jeszcze innego rodzaju danych. NPF umożliwia stawianie tych pytań, lecz kodowanie pojedynczej wypowiedzi nie daje wszystkich odpowiedzi.","hint":"Oddziel to, jak narrator coś przedstawia, od informacji o przyjęciu rozwiązania, jego efektach i wpływie na decyzję."}]},"GPA":{"name":"Grodziskie Przewozy Autobusowe","short":"GPA","teams":"4 i 5","scope":"Integracja transportu 2019–2023; uchwały z 28 stycznia 2021 r. jako wybrany epizod instytucjonalny.","focus":"Integracja dojazdów i lokalna odpowiedzialność","a":"Na spotkaniu dotyczącym autobusów między gminami pokazano dwie tabele rozkładów. Uczennica dojeżdżająca przez granicę gminy wysiada kilka minut po odjeździe kolejnego autobusu. Pracownik z sąsiedniej miejscowości opisuje podobne oczekiwanie. Każdy przewoźnik wykonuje własny rozkład, ale podróż pasażera nie kończy się na granicy administracyjnej.\n\nSamorządy rozważają powierzenie wspólnemu organizatorowi uzgadniania połączeń i zasad biletowych. To on miałby dopasować przesiadki oraz umożliwić planowanie całej podróży. Sam zakup nowych autobusów nie rozwiąże rozmijania się kursów, choć może poprawić komfort.\n\nAutor stanowiska opowiada się za wspólną organizacją przewozów, pozostawiając lokalnym urzędom zbieranie uwag pasażerów. Szkoły i pracodawcy zostają zaproszeni do rozmowy o godzinach dojazdów. Nie przedstawiono jeszcze rozkładu po zmianie; opowieść pokazuje, dlaczego koordynacja miałaby usunąć codzienną trudność.","b":"W innej wypowiedzi o integracji autobusów opisano małą gminę na obrzeżu obszaru. Jej mieszkańcy korzystają z połączenia, które w zestawieniu liczby pasażerów wygląda słabo, ale umożliwia dojazd do przychodni. Obawiają się, że wspólny organizator skupi się na najbardziej uczęszczanych trasach. Nie twierdzą przy tym, że obecne przesiadki są dobrze ułożone.\n\nLokalne samorządy mogłyby uzgodnić udział w decyzjach oraz minimalny zakres obsługi. Gdyby te ustalenia poprzedzały przekazanie zadań, potrzeby peryferyjnych miejscowości miałyby wyraźne miejsce we wspólnym systemie. Sama możliwość wysyłania uwag nie daje takiej gwarancji.\n\nAutor proponuje więc integrację z regułami reprezentacji i obsługi. Opracowanie szczegółów powierzyłby dotychczasowemu zespołowi międzygminnemu. To postulat dotyczący warunków współpracy, a nie relacja z odebrania komukolwiek połączenia.","setting":"Na spotkaniu dotyczącym autobusów między gminami","victim":"pasażerowie podróżujący przez granice gmin","hero":"wspólny organizator","plot":"nieuzgodnione połączenia → dłuższa podróż","moral":"zintegrować organizację przewozów","bVictim":"mieszkańcy najmniejszych gmin","cause":"niedopasowane przesiadki","expansion":"zaprośmy szkoły i pracodawców całego obszaru","warning":"Statut i uchwała opisują rozwiązanie instytucjonalne; same nie pokazują reakcji odbiorców na narrację. Tekst B jest ćwiczeniem, nie odnalezionym stanowiskiem przeciwników GPA.","roles":[["Pasażerowie przekraczający granice gmin, którzy tracą czas wskutek niedopasowania kolejnych kursów.","Przewoźnicy wykonujący własne rozkłady, którzy tracą zlecenia wskutek zmiany granic administracyjnych.","Lokalne urzędy zbierające uwagi, które tracą możliwość planowania godzin szkolnych dojazdów."],["Lokalne urzędy pełnią rolę bohatera, ponieważ przejmują uzgadnianie przesiadek i biletów.","Wspólny organizator pełni rolę bohatera, ponieważ ma uzgodnić przesiadki i bilety.","Zaproszeni pracodawcy pełnią rolę bohatera, ponieważ przejmują organizację kursów między gminami."]],"plotOptions":["Odrębne rozkłady utrudniają przesiadki; wspólna koordynacja ma usprawnić całą podróż pasażera.","Niski komfort utrudnia przesiadki; zakup nowych autobusów ma usprawnić całą podróż pasażera.","Brak uwag pasażerów utrudnia przesiadki; dodatkowe konsultacje mają zastąpić wspólną koordynację."],"moralOptions":["Utrzymać odrębne rozkłady, przekazując wspólnemu zespołowi zakup nowego taboru dla gmin.","Powierzyć wspólnemu organizatorowi koordynację, zachowując lokalne zbieranie uwag od korzystających z przewozów.","Powierzyć szkołom ustalanie rozkładów, pozostawiając organizację przewozów poszczególnym urzędom na dotychczasowych zasadach."],"compareOptions":["A uzasadnia koordynację podróży, B uzależnia integrację od gwarancji reprezentacji i obsługi.","A uzasadnia koordynację podróży, B uznaje zbieranie uwag za wystarczającą gwarancję obsługi.","A uzasadnia reprezentację małych gmin, B proponuje poprawę przesiadek bez wspólnej organizacji."],"limitOptions":["W B słabiej zaludnione miejscowości przedstawiono jako narażone na pominięcie przy integracji.","W B słabiej zaludnione miejscowości opisano jako pozbawione połączeń w wyniku integracji.","W B słabiej zaludnione miejscowości wykazały skuteczność przyjętych gwarancji obsługi przy integracji."],"evidence":["wysiada kilka minut po odjeździe kolejnego autobusu","To on miałby dopasować przesiadki","Sam zakup nowych autobusów nie rozwiąże rozmijania się kursów","opowiada się za wspólną organizacją przewozów","integrację z regułami reprezentacji i obsługi","Obawiają się, że wspólny organizator skupi się na najbardziej uczęszczanych trasach"],"reasons":[["Opowieść przypisuje pasażerom utratę czasu. To szkoda istotna dla kodu ofiary w A.","Tekst nie opisuje utraty zleceń ani zmiany granic. Odrębność rozkładów jest elementem wyjaśnienia trudności pasażerów.","Urzędom pozostawiono zbieranie uwag; nie opisano ich jako poszkodowanych utratą takiej możliwości."],["Lokalne urzędy mają zbierać uwagi, a nie pełnić opisaną funkcję koordynatora.","Narracja powierza organizatorowi działanie mające usunąć trudność, więc nadaje mu rolę bohatera.","Pracodawców zaprasza się do rozmowy. Nie powierzono im prowadzenia przewozów."],["Fabuła łączy organizacyjną przyczynę trudności z proponowaną zmianą koordynacji.","Komfort to wątek poboczny. Narracja odróżnia zakup autobusów od rozwiązania problemu przesiadek.","Konsultacje uzupełniają wspólną organizację, nie zastępują jej w przedstawionym rozwiązaniu."],["Nowy tabor nie jest tu postulowaną odpowiedzią na rozmijanie się kursów.","To morał A: konkretny kierunek zmiany instytucjonalnej wraz z zachowaniem lokalnego kanału uwag.","Szkoły mają uczestniczyć w rozmowie o potrzebach, a nie przejąć kompetencję do ustalania rozkładów."],["A eksponuje podróż przez granice, B warunki zabezpieczenia mniejszych gmin. B dopuszcza integrację.","B rozróżnia możliwość zgłaszania uwag i gwarancję udziału oraz obsługi.","Ta odpowiedź zamienia akcenty narracji i dopisuje B rezygnację ze wspólnej organizacji."],["Można zakodować przewidywane zagrożenie i sposób przedstawienia jego adresatów.","Obawa przed pominięciem nie jest informacją o rzeczywistej likwidacji kursów.","Postulat gwarancji nie świadczy o ich przyjęciu ani o potwierdzonej skuteczności."]],"transfer":"W źródle o GPA odróżnij wspólnego organizatora, przewoźnika i samorząd. Sprawdź, komu narrator przypisuje zdolność rozwiązania problemu i czy warunki integracji różnią się od sprzeciwu wobec integracji.","research":"Pytanie do projektu: czy integrację uzasadniano częściej sprawnością podróży czy ochroną lokalnej reprezentacji? Porównaj datowane stanowiska gmin i uzasadnienia dokumentów. Statut pokazuje rozwiązanie instytucjonalne, ale sam nie dowodzi perswazji narracji.","questions":[{"id":"roles1","term":"characters","title":"Trop 1 • obsada opowieści","prompt":"Której grupie narracja A przypisuje główną trudność, na którą ma odpowiedzieć proponowana zmiana?","options":["Pasażerowie przekraczający granice gmin, którzy tracą czas wskutek niedopasowania kolejnych kursów.","Przewoźnicy wykonujący własne rozkłady, którzy tracą zlecenia wskutek zmiany granic administracyjnych.","Lokalne urzędy zbierające uwagi, które tracą możliwość planowania godzin szkolnych dojazdów."],"correct":0,"evidence":"wysiada kilka minut po odjeździe kolejnego autobusu","explanations":["Opowieść przypisuje pasażerom utratę czasu. To szkoda istotna dla kodu ofiary w A.","Tekst nie opisuje utraty zleceń ani zmiany granic. Odrębność rozkładów jest elementem wyjaśnienia trudności pasażerów.","Urzędom pozostawiono zbieranie uwag; nie opisano ich jako poszkodowanych utratą takiej możliwości."],"feedback":"Ofiara w NPF to postać przedstawiona jako dotknięta szkodą lub trudnością. Rozpoznajemy przypisanie w tekście, nie orzekamy, kto obiektywnie stracił najwięcej. Grupa wymieniona w opowieści nie staje się przez to automatycznie ofiarą.","hint":"Oddziel grupę dotkniętą problemem od pozostałych uczestników. Znajdź opis przypisanej jej trudności."},{"id":"roles2","term":"characters","title":"Trop 2 • przypisana rola","prompt":"Która interpretacja roli bohatera ma oparcie w narracji A?","options":["Lokalne urzędy pełnią rolę bohatera, ponieważ przejmują uzgadnianie przesiadek i biletów.","Wspólny organizator pełni rolę bohatera, ponieważ ma uzgodnić przesiadki i bilety.","Zaproszeni pracodawcy pełnią rolę bohatera, ponieważ przejmują organizację kursów między gminami."],"correct":1,"evidence":"To on miałby dopasować przesiadki","explanations":["Lokalne urzędy mają zbierać uwagi, a nie pełnić opisaną funkcję koordynatora.","Narracja powierza organizatorowi działanie mające usunąć trudność, więc nadaje mu rolę bohatera.","Pracodawców zaprasza się do rozmowy. Nie powierzono im prowadzenia przewozów."],"feedback":"Bohaterowi przypisuje się przyniesienie ulgi lub rozwiązanie problemu. Może nim być osoba, grupa lub instytucja. Wystarczy rola przypisana w opowieści, także w trybie przyszłym. Nie należy utożsamiać bohatera z autorem wypowiedzi ani z każdym uczestnikiem konsultacji.","hint":"Sprawdź, komu opowieść powierza działanie przynoszące ulgę, a komu tylko udział w debacie lub wykonanie innego zadania."},{"id":"plot","term":"plot","title":"Trop 3 • logika opowieści","prompt":"Który opis najlepiej odtwarza powiązanie problemu, działań i następstw w narracji A?","options":["Odrębne rozkłady utrudniają przesiadki; wspólna koordynacja ma usprawnić całą podróż pasażera.","Niski komfort utrudnia przesiadki; zakup nowych autobusów ma usprawnić całą podróż pasażera.","Brak uwag pasażerów utrudnia przesiadki; dodatkowe konsultacje mają zastąpić wspólną koordynację."],"correct":0,"evidence":"Sam zakup nowych autobusów nie rozwiąże rozmijania się kursów","explanations":["Fabuła łączy organizacyjną przyczynę trudności z proponowaną zmianą koordynacji.","Komfort to wątek poboczny. Narracja odróżnia zakup autobusów od rozwiązania problemu przesiadek.","Konsultacje uzupełniają wspólną organizację, nie zastępują jej w przedstawionym rozwiązaniu."],"feedback":"Fabuła łączy postacie z kontekstem, porządkuje zdarzenia, działania, konflikty i motywy. W tym zadaniu ćwiczymy przedstawiony związek problemu i działania. To jeden aspekt fabuły; rozpoznanie go nie dowodzi rzeczywistej zależności przyczynowej.","hint":"Sprawdź kierunek zależności. Czy propozycja odpowiada na opisany problem, czy na wątek wspomniany tylko pobocznie?"},{"id":"moral","term":"moral","title":"Trop 4 • kierunek zmiany","prompt":"Jakie rozwiązanie pełni funkcję morału narracji A?","options":["Utrzymać odrębne rozkłady, przekazując wspólnemu zespołowi zakup nowego taboru dla gmin.","Powierzyć wspólnemu organizatorowi koordynację, zachowując lokalne zbieranie uwag od korzystających z przewozów.","Powierzyć szkołom ustalanie rozkładów, pozostawiając organizację przewozów poszczególnym urzędom na dotychczasowych zasadach."],"correct":1,"evidence":"opowiada się za wspólną organizacją przewozów","explanations":["Nowy tabor nie jest tu postulowaną odpowiedzią na rozmijanie się kursów.","To morał A: konkretny kierunek zmiany instytucjonalnej wraz z zachowaniem lokalnego kanału uwag.","Szkoły mają uczestniczyć w rozmowie o potrzebach, a nie przejąć kompetencję do ustalania rozkładów."],"feedback":"Morał narracji to zwykle rozwiązanie problemu, wezwanie do działania lub lekcja moralna. W tych tekstach pytamy o postulowany instrument. Przykład ilustrujący problem, przewidywany rezultat i postulowane działanie pełnią różne funkcje, choć mogą wystąpić w jednym zdaniu.","hint":"Odtwórz postulat całej wypowiedzi. Nie pomyl przykładu, warunku lub oczekiwanego skutku z proponowanym narzędziem."},{"id":"compare","term":"characters","title":"Nowy trop • druga opowieść","prompt":"Które porównanie trafnie oddaje różnicę między A i B, bez dopisywania im postulatów?","options":["A uzasadnia koordynację podróży, B uzależnia integrację od gwarancji reprezentacji i obsługi.","A uzasadnia koordynację podróży, B uznaje zbieranie uwag za wystarczającą gwarancję obsługi.","A uzasadnia reprezentację małych gmin, B proponuje poprawę przesiadek bez wspólnej organizacji."],"correct":0,"evidence":"integrację z regułami reprezentacji i obsługi","explanations":["A eksponuje podróż przez granice, B warunki zabezpieczenia mniejszych gmin. B dopuszcza integrację.","B rozróżnia możliwość zgłaszania uwag i gwarancję udziału oraz obsługi.","Ta odpowiedź zamienia akcenty narracji i dopisuje B rezygnację ze wspólnej organizacji."],"feedback":"Porównanie narracji obejmuje zarówno wspólne elementy, jak i zmianę postaci, akcentów lub proponowanego działania. Dodanie warunku wdrożenia nie musi oznaczać odrzucenia programu. Nie przypisuj roli złoczyńcy każdemu oponentowi ani nie wnioskuj o koalicji z samego podobieństwa tekstów.","hint":"Zestaw problem i postulat A z problemem i postulatem B. Szukaj również elementów, które druga opowieść zachowuje."},{"id":"limits","term":"mechanisms","title":"Kontrola raportu • granice dowodów","prompt":"Który wniosek ma wystarczającą podstawę w samym tekście B?","options":["W B słabiej zaludnione miejscowości przedstawiono jako narażone na pominięcie przy integracji.","W B słabiej zaludnione miejscowości opisano jako pozbawione połączeń w wyniku integracji.","W B słabiej zaludnione miejscowości wykazały skuteczność przyjętych gwarancji obsługi przy integracji."],"correct":0,"evidence":"Obawiają się, że wspólny organizator skupi się na najbardziej uczęszczanych trasach","explanations":["Można zakodować przewidywane zagrożenie i sposób przedstawienia jego adresatów.","Obawa przed pominięciem nie jest informacją o rzeczywistej likwidacji kursów.","Postulat gwarancji nie świadczy o ich przyjęciu ani o potwierdzonej skuteczności."],"feedback":"Analiza tekstu pozwala odtworzyć treść narracji. Pytanie, czy przekonała odbiorców lub wpłynęła na decyzję, wymaga danych o odbiorcach albo procesie decyzyjnym. Pytanie o skutki programu wymaga jeszcze innego rodzaju danych. NPF umożliwia stawianie tych pytań, lecz kodowanie pojedynczej wypowiedzi nie daje wszystkich odpowiedzi.","hint":"Oddziel to, jak narrator coś przedstawia, od informacji o przyjęciu rozwiązania, jego efektach i wpływie na decyzję."}]},"BK2":{"name":"Bezpieczny Kredyt 2%","short":"BK2%","teams":"6 i 7","scope":"Epizod BK2%: zapowiedź 16 grudnia 2022 r., przyjęcie tekstu przez Sejm po III czytaniu 14 kwietnia 2023 r., uruchomienie w lipcu 2023 r.; następców analizujemy osobno.","focus":"Dostęp do kredytu i dostęp do mieszkania","a":"W debacie o dopłatach do pierwszego kredytu opisano parę, która regularnie płaci czynsz, lecz przy obecnych ratach nie może kupić własnego lokalu. Ma stałe dochody i oszczędności na część wydatków, ale kalkulacja miesięcznej raty zamyka rozmowę z bankiem. Obok tej historii pojawia się uwaga o małej liczbie mieszkań; nie wskazano jednak nowego budynku, który miałby szybko powstać.\n\nPaństwo mogłoby pokrywać część kosztu kredytu dla uprawnionych gospodarstw. Bank obsługiwałby umowę, a dopłata zmniejszałaby bieżące obciążenie. W tak opowiedzianej historii niższa rata otwiera drogę do zakupu tym, którzy są blisko możliwości sfinansowania mieszkania.\n\nAutor proponuje uruchomienie dopłat przy określonych warunkach dostępu. Nie obiecuje, że każdy najemca uzyska kredyt. Do dyskusji zaprasza organizacje rodzin i pracowników, traktując stabilne zamieszkanie jako sprawę szerszą niż pojedyncza transakcja.","b":"Druga opowieść o dopłatach zaczyna się od najemczyni, która ma zbyt nieregularne dochody, by uzyskać kredyt nawet przy niższej racie. W jej otoczeniu ofert wynajmu jest mało. Autor przyznaje, że dopłata może pomóc części kupujących, ale pyta, co dzieje się z osobami poza tą grupą.\n\nJeśli zwiększy się liczba chętnych do zakupu, a lokali szybko nie przybędzie, sprzedający mogą podnosić ceny. To przewidywanie w opowieści, nie wynik przedstawionego badania. Państwo mogłoby równolegle zwiększać dostępność mieszkań na wynajem, aby pomoc docierała także do osób bez zdolności kredytowej.\n\nW proponowanym stanowisku rozwój oferty najmu ma uzupełnić politykę mieszkaniową. Autor domaga się udziału organizacji najemców w debacie. Nie podaje, czy ktokolwiek przyjął tę propozycję ani jak zmieniły się ceny po wdrożeniu programu.","setting":"W debacie o dopłatach do pierwszego kredytu","victim":"gospodarstwo, któremu wysokość raty utrudnia zakup","hero":"państwo pokrywające część kosztu kredytu","plot":"wysokie raty → brak dostępu do zakupu; niższe raty → dostęp","moral":"uruchomić dopłaty dla uprawnionych gospodarstw","bVictim":"najemcy bez zdolności kredytowej","cause":"wysokie raty","expansion":"włączmy organizacje rodzin i pracowników","warning":"Opowieść o możliwym wzroście cen jest hipotezą w tekście treningowym. Gra nie zawiera oszacowania wpływu BK2% na ceny ani przypisanej realnemu krytykowi wypowiedzi.","roles":[["Gospodarstwo ze stałymi dochodami, któremu poziom raty zamyka możliwość zakupu mieszkania.","Bank obsługujący umowę kredytu, któremu brak nowych budynków uniemożliwia pokrycie kosztów.","Organizacje rodzin i pracowników, którym warunki programu uniemożliwiają udział w debacie."],["Bank otrzymuje rolę bohatera, bo finansuje dopłatę zmniejszającą bieżące obciążenie gospodarstwa.","Państwo otrzymuje rolę bohatera, bo finansuje pomoc zmniejszającą bieżące obciążenie gospodarstwa.","Organizacje otrzymują rolę bohatera, bo gwarantują dochody potrzebne do zawarcia umowy kredytu."]],"plotOptions":["Dopłata zmniejsza bieżące obciążenie kredytem; to ma ułatwić zakup części uprawnionych gospodarstw.","Dopłata zwiększa liczbę nowo budowanych mieszkań; to ma obniżyć koszt zakupu przez gospodarstwa.","Dopłata stabilizuje nieregularne dochody gospodarstw; to ma zapewnić zdolność kredytową części najemców."],"moralOptions":["Rozwinąć ofertę mieszkań na wynajem, kierując wsparcie do gospodarstw bez zdolności kredytowej.","Uruchomić dopłaty do kosztu kredytu, określając warunki dostępu dla zainteresowanych gospodarstw domowych.","Zagwarantować najemcom stałe dochody, kierując pomoc do osób ubiegających się o kredyt."],"compareOptions":["A eksponuje barierę raty, B eksponuje wykluczenie z kredytu i ograniczoną ofertę mieszkań.","A eksponuje barierę raty, B proponuje jej obniżenie jako pomoc dla nieregularnie zarabiających.","A proponuje nowe budownictwo, B traktuje dopłatę jako rozwiązanie dla osób wynajmujących mieszkania."],"limitOptions":["B zawiera przewidywanie wzrostu cen przy zwiększonym popycie i ograniczonej podaży lokali.","B dokumentuje wzrost cen spowodowany dopłatami przy ograniczonej podaży lokali na rynku.","B pokazuje zmianę decyzji państwa wywołaną argumentem o ograniczonej podaży lokali na rynku."],"evidence":["kalkulacja miesięcznej raty zamyka rozmowę z bankiem","Państwo mogłoby pokrywać część kosztu kredytu","niższa rata otwiera drogę do zakupu tym, którzy są blisko możliwości sfinansowania mieszkania","uruchomienie dopłat przy określonych warunkach dostępu","zbyt nieregularne dochody, by uzyskać kredyt nawet przy niższej racie","sprzedający mogą podnosić ceny"],"reasons":[["A opisuje tę trudność jako problem, na który ma odpowiedzieć proponowane narzędzie.","Nie opisano szkody ponoszonej przez bank ani jego niemożności pokrycia kosztów.","Organizacje są zapraszane do debaty. Warunki kredytu nie są warunkami ich udziału w rozmowie."],["Obsługa umowy jest odróżniona od finansowania pomocy. Nie należy utożsamiać wykonawcy procedury z przypisaną w tekście rolą wybawcy.","Narracja przypisuje państwu zdolność przyniesienia ulgi. To rola bohatera, a nie potwierdzenie skuteczności instrumentu.","Zaproszone organizacje nie gwarantują dochodów ani kredytów."],["To przedstawiony w A mechanizm poprawy sytuacji części gospodarstw.","A wspomina małą liczbę mieszkań, ale nie przypisuje dopłatom mechanizmu budowy nowych lokali.","Dopłata zmienia koszt kredytu, nie regularność dochodów. Ta odpowiedź miesza różne bariery dostępu."],["To kierunek bliższy opowieści B, nie postulat dopłat sformułowany w A.","Morał A dotyczy instrumentu kredytowego dla określonej grupy; nie obiecuje powszechnego dostępu.","W A nie proponuje się gwarancji zatrudnienia ani dochodów."],["A opowiada o grupie blisko możliwości zakupu. B przesuwa uwagę na osoby poza kredytem i możliwe konsekwencje popytu.","B podkreśla, że niższa rata nie rozwiązuje problemu nieregularnych dochodów tej najemczyni.","W A wzmianka o podaży nie staje się postulatem budownictwa, a B nie uznaje dopłaty za wystarczającą dla wykluczonych."],["Takie przewidywanie jest treścią narracji, którą można zrekonstruować bez uznawania jej za oszacowany efekt.","W B nie przedstawiono pomiaru cen ani identyfikacji przyczynowej efektu programu.","B zawiera postulat, lecz nie ślady jego wpływu na decyzję państwa."]],"transfer":"W analizie BK2% oddziel gospodarstwa uprawnione do kredytu od najemców bez zdolności kredytowej. Przewidywany wzrost cen koduj jako twierdzenie narratora, dopóki nie zestawisz go z niezależnym badaniem.","research":"Pytanie do projektu: kogo poszczególne wypowiedzi przedstawiają jako adresata pomocy i kto pozostaje poza opowieścią? Dobierz teksty z tego samego epizodu BK2%. Do badania efektu cenowego potrzebne są dane i projekt identyfikacji wpływu, a do badania perswazji dane o odbiorcach lub procesie decyzji.","questions":[{"id":"roles1","term":"characters","title":"Trop 1 • obsada opowieści","prompt":"Której grupie narracja A przypisuje główną trudność, na którą ma odpowiedzieć proponowana zmiana?","options":["Gospodarstwo ze stałymi dochodami, któremu poziom raty zamyka możliwość zakupu mieszkania.","Bank obsługujący umowę kredytu, któremu brak nowych budynków uniemożliwia pokrycie kosztów.","Organizacje rodzin i pracowników, którym warunki programu uniemożliwiają udział w debacie."],"correct":0,"evidence":"kalkulacja miesięcznej raty zamyka rozmowę z bankiem","explanations":["A opisuje tę trudność jako problem, na który ma odpowiedzieć proponowane narzędzie.","Nie opisano szkody ponoszonej przez bank ani jego niemożności pokrycia kosztów.","Organizacje są zapraszane do debaty. Warunki kredytu nie są warunkami ich udziału w rozmowie."],"feedback":"Ofiara w NPF to postać przedstawiona jako dotknięta szkodą lub trudnością. Rozpoznajemy przypisanie w tekście, nie orzekamy, kto obiektywnie stracił najwięcej. Grupa wymieniona w opowieści nie staje się przez to automatycznie ofiarą.","hint":"Oddziel grupę dotkniętą problemem od pozostałych uczestników. Znajdź opis przypisanej jej trudności."},{"id":"roles2","term":"characters","title":"Trop 2 • przypisana rola","prompt":"Która interpretacja roli bohatera ma oparcie w narracji A?","options":["Bank otrzymuje rolę bohatera, bo finansuje dopłatę zmniejszającą bieżące obciążenie gospodarstwa.","Państwo otrzymuje rolę bohatera, bo finansuje pomoc zmniejszającą bieżące obciążenie gospodarstwa.","Organizacje otrzymują rolę bohatera, bo gwarantują dochody potrzebne do zawarcia umowy kredytu."],"correct":1,"evidence":"Państwo mogłoby pokrywać część kosztu kredytu","explanations":["Obsługa umowy jest odróżniona od finansowania pomocy. Nie należy utożsamiać wykonawcy procedury z przypisaną w tekście rolą wybawcy.","Narracja przypisuje państwu zdolność przyniesienia ulgi. To rola bohatera, a nie potwierdzenie skuteczności instrumentu.","Zaproszone organizacje nie gwarantują dochodów ani kredytów."],"feedback":"Bohaterowi przypisuje się przyniesienie ulgi lub rozwiązanie problemu. Może nim być osoba, grupa lub instytucja. Wystarczy rola przypisana w opowieści, także w trybie przyszłym. Nie należy utożsamiać bohatera z autorem wypowiedzi ani z każdym uczestnikiem konsultacji.","hint":"Sprawdź, komu opowieść powierza działanie przynoszące ulgę, a komu tylko udział w debacie lub wykonanie innego zadania."},{"id":"plot","term":"plot","title":"Trop 3 • logika opowieści","prompt":"Który opis najlepiej odtwarza powiązanie problemu, działań i następstw w narracji A?","options":["Dopłata zmniejsza bieżące obciążenie kredytem; to ma ułatwić zakup części uprawnionych gospodarstw.","Dopłata zwiększa liczbę nowo budowanych mieszkań; to ma obniżyć koszt zakupu przez gospodarstwa.","Dopłata stabilizuje nieregularne dochody gospodarstw; to ma zapewnić zdolność kredytową części najemców."],"correct":0,"evidence":"niższa rata otwiera drogę do zakupu tym, którzy są blisko możliwości sfinansowania mieszkania","explanations":["To przedstawiony w A mechanizm poprawy sytuacji części gospodarstw.","A wspomina małą liczbę mieszkań, ale nie przypisuje dopłatom mechanizmu budowy nowych lokali.","Dopłata zmienia koszt kredytu, nie regularność dochodów. Ta odpowiedź miesza różne bariery dostępu."],"feedback":"Fabuła łączy postacie z kontekstem, porządkuje zdarzenia, działania, konflikty i motywy. W tym zadaniu ćwiczymy przedstawiony związek problemu i działania. To jeden aspekt fabuły; rozpoznanie go nie dowodzi rzeczywistej zależności przyczynowej.","hint":"Sprawdź kierunek zależności. Czy propozycja odpowiada na opisany problem, czy na wątek wspomniany tylko pobocznie?"},{"id":"moral","term":"moral","title":"Trop 4 • kierunek zmiany","prompt":"Jakie rozwiązanie pełni funkcję morału narracji A?","options":["Rozwinąć ofertę mieszkań na wynajem, kierując wsparcie do gospodarstw bez zdolności kredytowej.","Uruchomić dopłaty do kosztu kredytu, określając warunki dostępu dla zainteresowanych gospodarstw domowych.","Zagwarantować najemcom stałe dochody, kierując pomoc do osób ubiegających się o kredyt."],"correct":1,"evidence":"uruchomienie dopłat przy określonych warunkach dostępu","explanations":["To kierunek bliższy opowieści B, nie postulat dopłat sformułowany w A.","Morał A dotyczy instrumentu kredytowego dla określonej grupy; nie obiecuje powszechnego dostępu.","W A nie proponuje się gwarancji zatrudnienia ani dochodów."],"feedback":"Morał narracji to zwykle rozwiązanie problemu, wezwanie do działania lub lekcja moralna. W tych tekstach pytamy o postulowany instrument. Przykład ilustrujący problem, przewidywany rezultat i postulowane działanie pełnią różne funkcje, choć mogą wystąpić w jednym zdaniu.","hint":"Odtwórz postulat całej wypowiedzi. Nie pomyl przykładu, warunku lub oczekiwanego skutku z proponowanym narzędziem."},{"id":"compare","term":"characters","title":"Nowy trop • druga opowieść","prompt":"Które porównanie trafnie oddaje różnicę między A i B, bez dopisywania im postulatów?","options":["A eksponuje barierę raty, B eksponuje wykluczenie z kredytu i ograniczoną ofertę mieszkań.","A eksponuje barierę raty, B proponuje jej obniżenie jako pomoc dla nieregularnie zarabiających.","A proponuje nowe budownictwo, B traktuje dopłatę jako rozwiązanie dla osób wynajmujących mieszkania."],"correct":0,"evidence":"zbyt nieregularne dochody, by uzyskać kredyt nawet przy niższej racie","explanations":["A opowiada o grupie blisko możliwości zakupu. B przesuwa uwagę na osoby poza kredytem i możliwe konsekwencje popytu.","B podkreśla, że niższa rata nie rozwiązuje problemu nieregularnych dochodów tej najemczyni.","W A wzmianka o podaży nie staje się postulatem budownictwa, a B nie uznaje dopłaty za wystarczającą dla wykluczonych."],"feedback":"Porównanie narracji obejmuje zarówno wspólne elementy, jak i zmianę postaci, akcentów lub proponowanego działania. Dodanie warunku wdrożenia nie musi oznaczać odrzucenia programu. Nie przypisuj roli złoczyńcy każdemu oponentowi ani nie wnioskuj o koalicji z samego podobieństwa tekstów.","hint":"Zestaw problem i postulat A z problemem i postulatem B. Szukaj również elementów, które druga opowieść zachowuje."},{"id":"limits","term":"mechanisms","title":"Kontrola raportu • granice dowodów","prompt":"Który wniosek ma wystarczającą podstawę w samym tekście B?","options":["B zawiera przewidywanie wzrostu cen przy zwiększonym popycie i ograniczonej podaży lokali.","B dokumentuje wzrost cen spowodowany dopłatami przy ograniczonej podaży lokali na rynku.","B pokazuje zmianę decyzji państwa wywołaną argumentem o ograniczonej podaży lokali na rynku."],"correct":0,"evidence":"sprzedający mogą podnosić ceny","explanations":["Takie przewidywanie jest treścią narracji, którą można zrekonstruować bez uznawania jej za oszacowany efekt.","W B nie przedstawiono pomiaru cen ani identyfikacji przyczynowej efektu programu.","B zawiera postulat, lecz nie ślady jego wpływu na decyzję państwa."],"feedback":"Analiza tekstu pozwala odtworzyć treść narracji. Pytanie, czy przekonała odbiorców lub wpłynęła na decyzję, wymaga danych o odbiorcach albo procesie decyzyjnym. Pytanie o skutki programu wymaga jeszcze innego rodzaju danych. NPF umożliwia stawianie tych pytań, lecz kodowanie pojedynczej wypowiedzi nie daje wszystkich odpowiedzi.","hint":"Oddziel to, jak narrator coś przedstawia, od informacji o przyjęciu rozwiązania, jego efektach i wpływie na decyzję."}]},"CP":{"name":"Czyste Powietrze","short":"Czyste Powietrze","teams":"8, 9 i 11","scope":"Wątek operatorów i pomocy w dostępie do programu 2023–2025; odróżnij pilotaż od późniejszego apelu i rozszerzania rozwiązania.","focus":"Pomoc w dostępie do wsparcia i odpowiedzialność","a":"W rozmowie o dostępie do Czystego Powietrza właścicielka domu pokazuje teczkę niewypełnionych dokumentów. Niewielki dochód utrudnia samodzielne sfinansowanie remontu, ale dostępna dotacja także pozostaje poza jej zasięgiem: nie potrafi ułożyć kolejnych czynności i porównać ofert. Sąsiedzi przekazują jej adresy stron, po czym każdy wraca do swoich spraw.\n\nOperator mógłby towarzyszyć jej od przygotowania wniosku do rozliczenia prac. W tej opowieści ciągła pomoc zmniejsza ryzyko rezygnacji między etapami; sama dodatkowa ulotka nie przeprowadza przez procedurę. Wykonawca remontu miałby odpowiadać za prace, a nie zastępować osobę pomagającą w formalnościach.\n\nAutor proponuje rozwinąć dostęp do indywidualnego wsparcia operatorów. Zaprasza ośrodki pomocy społecznej i organizacje seniorów do rozmowy o docieraniu do osób dotąd nieobecnych w programie. Nie podano, ile wniosków zaakceptowano dzięki takiej pomocy.","b":"W drugiej wypowiedzi o operatorach opisano właściciela domu, który otrzymał dwie różne porady dotyczące rozliczenia. Chce skorzystać z pomocy, ale nie wie, kto odpowie za błędne wskazanie. Autor nie proponuje pozostawienia go samego z dokumentami. Problemem staje się możliwość zaufania pomocy, która ma być rozwijana.\n\nInstytucje publiczne mogłyby ustalić standardy doradztwa, kontrolę jakości i czytelną drogę zgłaszania błędów. Gdy zakres odpowiedzialności pozostaje niejasny, liczba punktów wsparcia nie mówi jeszcze, czy wnioskodawca jest chroniony. W tej opowieści standardy mają ograniczać ryzyko związane z błędną poradą.\n\nRozwój sieci operatorów powinien więc iść razem z regułami odpowiedzialności. Szczegóły miałby opracować dotychczasowy zespół wykonawczy. Wypowiedź nie zawiera wyników kontroli ani informacji, że opisane ryzyko wystąpiło we wszystkich punktach pomocy.","setting":"W rozmowie o dostępie do Czystego Powietrza","victim":"właścicielka domu mająca trudność z przejściem procedury","hero":"operator towarzyszący wnioskodawczyni","plot":"skomplikowane procedury → rezygnacja; pomoc → łatwiejszy dostęp","moral":"rozwijać pomoc operatorów","bVictim":"właściciele domów narażeni na błędne doradztwo","cause":"skomplikowane procedury","expansion":"włączmy ośrodki pomocy społecznej i organizacje seniorów","warning":"Pilotaż operatorów poprzedzał późniejsze apele. Następstwo wydarzeń i podobieństwo propozycji nie wystarczają do przypisania NGO spowodowania powstania operatorów.","roles":[["Właścicielka domu, dla której trudności proceduralne utrzymują dotację poza realnym zasięgiem.","Sąsiedzi właścicielki, dla których przekazywanie adresów stron uniemożliwia uzyskanie własnej dotacji.","Wykonawcy remontów, dla których dokumenty programu uniemożliwiają rozliczenie już wykonanych prac."],["Wykonawca remontu pełni rolę bohatera, ponieważ przejmuje prowadzenie wniosku i jego rozliczenia.","Operator wspierający właścicielkę pełni rolę bohatera, ponieważ ma towarzyszyć przechodzeniu kolejnych formalności.","Sąsiedzi właścicielki pełnią rolę bohatera, ponieważ przejmują odpowiedzialność za poprawność składanych dokumentów."]],"plotOptions":["Trudności między etapami sprzyjają rezygnacji; ciągła pomoc ma ułatwić skorzystanie z dotacji.","Brak adresów stron sprzyja rezygnacji; dodatkowe ulotki mają zastąpić pomoc przy procedurze.","Niskie dochody ograniczają remonty; większa dotacja ma zastąpić indywidualną pomoc przy procedurze."],"moralOptions":["Rozwinąć dystrybucję instrukcji, powierzając właścicielom samodzielne przejście między kolejnymi etapami procedury.","Rozwinąć indywidualne wsparcie operatorów, towarzyszących właścicielom domów podczas kolejnych etapów procedury.","Rozwinąć obowiązki wykonawców, powierzając im prowadzenie dokumentacji od wniosku do rozliczenia."],"compareOptions":["A podkreśla ciągłość pomocy w procedurze, B wiąże jej rozwój z odpowiedzialnością.","A podkreśla ciągłość pomocy w procedurze, B wiąże jej jakość z liczbą punktów.","A powierza operatorom kontrolę jakości prac, B przenosi doradztwo do firm remontowych."],"limitOptions":["W B standardy doradztwa przedstawiono jako sposób ograniczania ryzyka błędnej porady dla wnioskodawców.","W B standardy doradztwa potwierdzono jako przyczynę mniejszej liczby błędnych rozliczeń u wnioskodawców.","W B standardy doradztwa przyjęto pod wpływem wspólnego wystąpienia organizacji reprezentujących wnioskodawców."],"evidence":["nie potrafi ułożyć kolejnych czynności i porównać ofert","Operator mógłby towarzyszyć jej od przygotowania wniosku do rozliczenia prac","ciągła pomoc zmniejsza ryzyko rezygnacji między etapami","rozwinąć dostęp do indywidualnego wsparcia operatorów","Rozwój sieci operatorów powinien więc iść razem z regułami odpowiedzialności","standardy mają ograniczać ryzyko związane z błędną poradą"],"reasons":[["Narracja opisuje szkodę związaną z barierą dostępu do pomocy, mimo formalnego istnienia dotacji.","Sąsiedzi przekazują informacje, ale nie opisano ich własnej trudności z dotacją.","Tekst rozróżnia wykonawcę i pomoc proceduralną; nie mówi o nierozliczonych pracach wykonawców."],["A oddziela wykonanie remontu od prowadzenia przez formalności. Nie przypisuje wykonawcy tej drugiej roli.","Operatorowi przypisano pomoc prowadzącą do rozwiązania problemu. To podstawa roli bohatera.","Sąsiedzi podają adresy, lecz nie przejmują odpowiedzialności za dokumenty."],["Relacja między trudnością procedury, rezygnacją i ciągłą pomocą porządkuje fabułę A.","Właścicielka już otrzymuje adresy stron. A przedstawia samą informację jako niewystarczającą.","Niski dochód jest częścią tła, lecz A eksponuje przeszkodę proceduralną. Tekst nie proponuje zastąpienia pomocy większą kwotą dotacji."],["To odtworzenie sytuacji, którą A uznaje za niewystarczającą, a nie postulowane rozwiązanie.","Morałem jest rozwój konkretnego sposobu pomocy, a nie samo zwiększenie ilości informacji.","A rozdziela funkcje wykonawcy i operatora. Ta odpowiedź łączy je wbrew tekstowi."],["B nie odrzuca pomocy. Dodaje warunek jakości i odpowiedzialności do jej rozwoju.","B wyraźnie rozróżnia liczbę punktów i ochronę wnioskodawcy przed błędną poradą.","A nie opisuje operatora jako kontrolera jakości remontu, a B nie przenosi doradztwa do wykonawców."],["To rekonstrukcja postulowanego związku działania i rezultatu, nie ocena jego skuteczności.","B nie zawiera wyników kontroli ani pomiaru zmiany liczby błędów.","Nie podano przyjęcia standardów ani związku decyzji z wystąpieniem organizacji."]],"transfer":"W źródłach o Czystym Powietrzu rozróżnij dostęp do wsparcia, jakość porady i odpowiedzialność. Oddziel operatora od wykonawcy remontu. Wzmianka o ryzyku nie dowodzi powszechnego występowania szkody.","research":"Pytanie do projektu: czy narracje o operatorach skupiają się na wykluczeniu proceduralnym czy na jakości wsparcia? Porównaj apel, opis pilotażu i dokument wdrożeniowy z ich datami. Późniejszy apel nie może sam wyjaśniać wcześniejszego uruchomienia rozwiązania.","questions":[{"id":"roles1","term":"characters","title":"Trop 1 • obsada opowieści","prompt":"Której grupie narracja A przypisuje główną trudność, na którą ma odpowiedzieć proponowana zmiana?","options":["Właścicielka domu, dla której trudności proceduralne utrzymują dotację poza realnym zasięgiem.","Sąsiedzi właścicielki, dla których przekazywanie adresów stron uniemożliwia uzyskanie własnej dotacji.","Wykonawcy remontów, dla których dokumenty programu uniemożliwiają rozliczenie już wykonanych prac."],"correct":0,"evidence":"nie potrafi ułożyć kolejnych czynności i porównać ofert","explanations":["Narracja opisuje szkodę związaną z barierą dostępu do pomocy, mimo formalnego istnienia dotacji.","Sąsiedzi przekazują informacje, ale nie opisano ich własnej trudności z dotacją.","Tekst rozróżnia wykonawcę i pomoc proceduralną; nie mówi o nierozliczonych pracach wykonawców."],"feedback":"Ofiara w NPF to postać przedstawiona jako dotknięta szkodą lub trudnością. Rozpoznajemy przypisanie w tekście, nie orzekamy, kto obiektywnie stracił najwięcej. Grupa wymieniona w opowieści nie staje się przez to automatycznie ofiarą.","hint":"Oddziel grupę dotkniętą problemem od pozostałych uczestników. Znajdź opis przypisanej jej trudności."},{"id":"roles2","term":"characters","title":"Trop 2 • przypisana rola","prompt":"Która interpretacja roli bohatera ma oparcie w narracji A?","options":["Wykonawca remontu pełni rolę bohatera, ponieważ przejmuje prowadzenie wniosku i jego rozliczenia.","Operator wspierający właścicielkę pełni rolę bohatera, ponieważ ma towarzyszyć przechodzeniu kolejnych formalności.","Sąsiedzi właścicielki pełnią rolę bohatera, ponieważ przejmują odpowiedzialność za poprawność składanych dokumentów."],"correct":1,"evidence":"Operator mógłby towarzyszyć jej od przygotowania wniosku do rozliczenia prac","explanations":["A oddziela wykonanie remontu od prowadzenia przez formalności. Nie przypisuje wykonawcy tej drugiej roli.","Operatorowi przypisano pomoc prowadzącą do rozwiązania problemu. To podstawa roli bohatera.","Sąsiedzi podają adresy, lecz nie przejmują odpowiedzialności za dokumenty."],"feedback":"Bohaterowi przypisuje się przyniesienie ulgi lub rozwiązanie problemu. Może nim być osoba, grupa lub instytucja. Wystarczy rola przypisana w opowieści, także w trybie przyszłym. Nie należy utożsamiać bohatera z autorem wypowiedzi ani z każdym uczestnikiem konsultacji.","hint":"Sprawdź, komu opowieść powierza działanie przynoszące ulgę, a komu tylko udział w debacie lub wykonanie innego zadania."},{"id":"plot","term":"plot","title":"Trop 3 • logika opowieści","prompt":"Który opis najlepiej odtwarza powiązanie problemu, działań i następstw w narracji A?","options":["Trudności między etapami sprzyjają rezygnacji; ciągła pomoc ma ułatwić skorzystanie z dotacji.","Brak adresów stron sprzyja rezygnacji; dodatkowe ulotki mają zastąpić pomoc przy procedurze.","Niskie dochody ograniczają remonty; większa dotacja ma zastąpić indywidualną pomoc przy procedurze."],"correct":0,"evidence":"ciągła pomoc zmniejsza ryzyko rezygnacji między etapami","explanations":["Relacja między trudnością procedury, rezygnacją i ciągłą pomocą porządkuje fabułę A.","Właścicielka już otrzymuje adresy stron. A przedstawia samą informację jako niewystarczającą.","Niski dochód jest częścią tła, lecz A eksponuje przeszkodę proceduralną. Tekst nie proponuje zastąpienia pomocy większą kwotą dotacji."],"feedback":"Fabuła łączy postacie z kontekstem, porządkuje zdarzenia, działania, konflikty i motywy. W tym zadaniu ćwiczymy przedstawiony związek problemu i działania. To jeden aspekt fabuły; rozpoznanie go nie dowodzi rzeczywistej zależności przyczynowej.","hint":"Sprawdź kierunek zależności. Czy propozycja odpowiada na opisany problem, czy na wątek wspomniany tylko pobocznie?"},{"id":"moral","term":"moral","title":"Trop 4 • kierunek zmiany","prompt":"Jakie rozwiązanie pełni funkcję morału narracji A?","options":["Rozwinąć dystrybucję instrukcji, powierzając właścicielom samodzielne przejście między kolejnymi etapami procedury.","Rozwinąć indywidualne wsparcie operatorów, towarzyszących właścicielom domów podczas kolejnych etapów procedury.","Rozwinąć obowiązki wykonawców, powierzając im prowadzenie dokumentacji od wniosku do rozliczenia."],"correct":1,"evidence":"rozwinąć dostęp do indywidualnego wsparcia operatorów","explanations":["To odtworzenie sytuacji, którą A uznaje za niewystarczającą, a nie postulowane rozwiązanie.","Morałem jest rozwój konkretnego sposobu pomocy, a nie samo zwiększenie ilości informacji.","A rozdziela funkcje wykonawcy i operatora. Ta odpowiedź łączy je wbrew tekstowi."],"feedback":"Morał narracji to zwykle rozwiązanie problemu, wezwanie do działania lub lekcja moralna. W tych tekstach pytamy o postulowany instrument. Przykład ilustrujący problem, przewidywany rezultat i postulowane działanie pełnią różne funkcje, choć mogą wystąpić w jednym zdaniu.","hint":"Odtwórz postulat całej wypowiedzi. Nie pomyl przykładu, warunku lub oczekiwanego skutku z proponowanym narzędziem."},{"id":"compare","term":"characters","title":"Nowy trop • druga opowieść","prompt":"Które porównanie trafnie oddaje różnicę między A i B, bez dopisywania im postulatów?","options":["A podkreśla ciągłość pomocy w procedurze, B wiąże jej rozwój z odpowiedzialnością.","A podkreśla ciągłość pomocy w procedurze, B wiąże jej jakość z liczbą punktów.","A powierza operatorom kontrolę jakości prac, B przenosi doradztwo do firm remontowych."],"correct":0,"evidence":"Rozwój sieci operatorów powinien więc iść razem z regułami odpowiedzialności","explanations":["B nie odrzuca pomocy. Dodaje warunek jakości i odpowiedzialności do jej rozwoju.","B wyraźnie rozróżnia liczbę punktów i ochronę wnioskodawcy przed błędną poradą.","A nie opisuje operatora jako kontrolera jakości remontu, a B nie przenosi doradztwa do wykonawców."],"feedback":"Porównanie narracji obejmuje zarówno wspólne elementy, jak i zmianę postaci, akcentów lub proponowanego działania. Dodanie warunku wdrożenia nie musi oznaczać odrzucenia programu. Nie przypisuj roli złoczyńcy każdemu oponentowi ani nie wnioskuj o koalicji z samego podobieństwa tekstów.","hint":"Zestaw problem i postulat A z problemem i postulatem B. Szukaj również elementów, które druga opowieść zachowuje."},{"id":"limits","term":"mechanisms","title":"Kontrola raportu • granice dowodów","prompt":"Który wniosek ma wystarczającą podstawę w samym tekście B?","options":["W B standardy doradztwa przedstawiono jako sposób ograniczania ryzyka błędnej porady dla wnioskodawców.","W B standardy doradztwa potwierdzono jako przyczynę mniejszej liczby błędnych rozliczeń u wnioskodawców.","W B standardy doradztwa przyjęto pod wpływem wspólnego wystąpienia organizacji reprezentujących wnioskodawców."],"correct":0,"evidence":"standardy mają ograniczać ryzyko związane z błędną poradą","explanations":["To rekonstrukcja postulowanego związku działania i rezultatu, nie ocena jego skuteczności.","B nie zawiera wyników kontroli ani pomiaru zmiany liczby błędów.","Nie podano przyjęcia standardów ani związku decyzji z wystąpieniem organizacji."],"feedback":"Analiza tekstu pozwala odtworzyć treść narracji. Pytanie, czy przekonała odbiorców lub wpłynęła na decyzję, wymaga danych o odbiorcach albo procesie decyzyjnym. Pytanie o skutki programu wymaga jeszcze innego rodzaju danych. NPF umożliwia stawianie tych pytań, lecz kodowanie pojedynczej wypowiedzi nie daje wszystkich odpowiedzi.","hint":"Oddziel to, jak narrator coś przedstawia, od informacji o przyjęciu rozwiązania, jego efektach i wpływie na decyzję."}]}},GLOSSARY=[{"id":"narrative","title":"Narracja i jej minimum","english":"Policy narrative; narrativity","group":"Struktura opowieści","definition":"Operacyjne minimum narracji w NPF to co najmniej jedna postać oraz odniesienie do polityki publicznej. Narracja nie musi zawierać wszystkich czterech elementów formy ani wszystkich ról postaci. Narracyjność określa stopień obecności i kompletności elementów formy oraz treści ponad to minimum.","caution":"Narracyjność nie jest oceną jakości literackiej, prawdziwości ani skuteczności opowieści. Rozpoznanie narracji nie potwierdza jej twierdzeń.","pages":"167","kind":"NPF"},{"id":"form","title":"Forma opowieści","english":"Narrative form","group":"Struktura opowieści","definition":"Forma to budowa opowieści: postacie, tło, fabuła i morał. Są to kategorie, które pozwalają porównywać narracje dotyczące różnych problemów. Forma i treść są odróżnialne, ale powiązane: konkretny sposób przedstawienia postaci może zarazem wyrażać przekonanie lub strategię.","caution":"Nie traktuj listy czterech elementów jako warunku, który każda narracja musi spełnić w całości. Niektóre elementy mogą być domyślne; ich rozpoznanie trzeba uzasadnić tekstem.","pages":"163–165; minimum: 167","kind":"NPF"},{"id":"characters","title":"Postacie i trzy podstawowe role","english":"Characters: victim, hero, villain","group":"Struktura opowieści","definition":"Postacie są uczestnikami przedstawionymi w opowieści w określonych rolach. Ofiara doświadcza szkody lub jest nią zagrożona. Bohater oferuje pomoc w ograniczeniu szkody albo rozwiązaniu problemu. Antagonista jest przedstawiony jako sprawca szkody lub źródło problemu.","caution":"Kod opisuje przedstawienie w tekście: bohater nie musi mieć potwierdzonej skuteczności, a przeciwnik polityczny nie jest automatycznie antagonistą. Sama nazwa przyczyny problemu nie musi oznaczać postaci.","pages":"163–164; minimum jednej postaci: 167","kind":"NPF"},{"id":"setting","title":"Tło i kontekst","english":"Setting","group":"Struktura opowieści","definition":"Tło to okoliczności, w których opowieść umieszcza problem i postacie. Obejmuje miejsce i czas, ale również reguły prawne, zasoby, istotne zdarzenia oraz kontekst społeczny i ideowy. Chodzi o okoliczności przedstawiane jako ważne dla danej sprawy.","caution":"Tło nie ogranicza się do miejscowości i daty. Nie dopisuj wszystkich znanych Ci uwarunkowań programu, jeżeli analizowany fragment ich nie przedstawia.","pages":"163–164","kind":"NPF"},{"id":"plot","title":"Fabuła","english":"Plot","group":"Struktura opowieści","definition":"Fabuła łączy postacie z działaniami, zdarzeniami i kontekstem. Porządkuje to, co się dzieje, oraz przedstawia relacje, konflikty i motywy. Może zawierać wyjaśnienie przyczynowe, ale nie sprowadza się do pojedynczego związku przyczyny i skutku.","caution":"Odtworzenie fabuły mówi, jak opowieść przedstawia zdarzenia. Nie potwierdza, że właśnie tak przebiegał rzeczywisty proces ani że następstwo zdarzeń dowodzi przyczynowości.","pages":"163, 165","kind":"NPF"},{"id":"moral","title":"Morał — wniosek opowieści","english":"Moral","group":"Struktura opowieści","definition":"Morał to wniosek wynikający z opowieści: proponowa
