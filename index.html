ne rozwiązanie publiczne, wezwanie do działania albo lekcja płynąca z opowieści. Może być wyrażony wprost albo wynikać z przedstawienia problemu i rozwiązania. Nie musi być osobnym zdaniem zaczynającym się od słowa „należy”.","caution":"Nie utożsamiaj morału wyłącznie z moralizowaniem ani wyłącznie z formalnym projektem programu. Nie przypisuj tekstowi własnego postulatu, którego nie da się z niego uzasadnić.","pages":"165; struktura jawna lub domyślna: 163","kind":"NPF"},{"id":"narrator","title":"Narrator i odbiorca","english":"Narrator and audience","group":"Struktura opowieści","definition":"Narrator przedstawia opowieść, a odbiorca ją przyjmuje i interpretuje. To, kto opowiada, komu i jak te strony postrzegają siebie nawzajem, może mieć znaczenie dla oddziaływania narracji. Narrator i bohater mogą być tym samym podmiotem, lecz są różnymi rolami: pierwszy opowiada, drugi w opowieści oferuje rozwiązanie.","caution":"Przy cytacie sprawdź, kto wypowiada analizowaną narrację; wydawca strony lub autor całego dokumentu nie musi być narratorem cytowanego fragmentu. Sama publikacja postulatu nie nadaje narratorowi roli bohatera.","pages":"167–168; bohater: 164","kind":"NPF"},{"id":"content","title":"Treść: przekonania i strategie","english":"Narrative content","group":"Treść i strategie","definition":"Treść mówi, jakie znaczenie opowieść nadaje problemowi, postaciom i rozwiązaniom. Systemy przekonań pomagają uchwycić sposoby rozumienia i oceniania tych elementów. Strategie narracyjne dotyczą tego, jak i po co narrator organizuje oraz akcentuje elementy opowieści. W systematycznym badaniu rozpoznawanie przekonań wymaga jasno określonej podstawy teoretycznej i reguł kodowania.","caution":"Nie przypisuj autorowi całej ideologii na podstawie jednego zdania. Rozpoznanie sposobu przedstawienia nie jest jeszcze dowodem jego skuteczności ani pełnej wiedzy o intencjach autora.","pages":"165–166; powiązanie formy i treści: 164","kind":"NPF"},{"id":"scope","title":"Rozszerzanie i ograniczanie konfliktu","english":"Scope of conflict","group":"Treść i strategie","definition":"Jest to strategiczne przedstawianie sprawy w sposób, który ma rozszerzyć lub ograniczyć zaangażowanie w nią. Narrator może zapraszać nowe grupy, ale również przedstawiać sprawę jako dotyczącą wielu ludzi albo wąskiego grona. W badaniach analizowano między innymi rozpraszanie kosztów na liczne grupy i skupianie korzyści u nielicznych albo odwrotny sposób przedstawienia ich rozkładu. Dosłowne wezwanie nowych uczestników jest więc jednym ze sposobów, a nie całą definicją tej strategii.","caution":"Rozpoznanie strategii nie dowodzi zmiany kręgu uczestników. Wyniki dotyczące wygrywania i przegrywania są mieszane; rozdział omawia też alternatywną hipotezę o obronie status quo i dążeniu do zmiany. Nie używaj tych hipotez jako automatycznego klucza kodowania.","pages":"166, 174–175","kind":"NPF"},{"id":"causal","title":"Strategie przyczynowe w narracji","english":"Narrative causal strategies","group":"Treść i strategie","definition":"To sposób przedstawienia, dlaczego powstał problem oraz komu przypisuje się odpowiedzialność lub winę. Dotyczy przyczynowego wyjaśnienia wewnątrz opowieści, budowanego przez układ jej elementów. Rozdział wymienia za Stone cztery typy wyjaśnień: intencjonalne, niezamierzone, przypadkowe i mechaniczne, bez ich szczegółowego zdefiniowania w tym miejscu.","caution":"Nie myl przyczyny opisywanej przez narratora z mechanizmem wpływu samej narracji na odbiorców lub politykę. W rozdziale zmieniono dawną nazwę „causal mechanisms” właśnie po to, by ograniczyć to nieporozumienie.","pages":"166; przypis 6: 184","kind":"NPF"},{"id":"das","title":"Akcentowanie winy, pomocy i krzywdy","english":"Devil–angel–solidarity shifts","group":"Treść i strategie","definition":"Devil shift polega na akcentowaniu winy przeciwników przedstawianych jako antagoniści. Angel shift akcentuje bohaterów i ich zdolność rozwiązania problemu. Solidarity shift akcentuje ofiary i wyrządzoną im krzywdę. W badaniu ocenia się względne natężenie przedstawień postaci, często za pomocą ich proporcji.","caution":"Samo pojawienie się bohatera, ofiary lub antagonisty nie wystarcza do wykazania strategii. Słowo „shift” nie musi oznaczać zmiany w czasie, a wyniki badań nie uzasadniają prostego przypisania tych strategii do zwycięzców i przegranych.","pages":"166–167; ograniczenia hipotez: 176–177","kind":"NPF"},{"id":"mechanisms","title":"Jak narracja może oddziaływać","english":"Narrative mechanisms of policy change","group":"Wpływ i badanie","definition":"W modelu przedstawionym w rozdziale forma i treść narracji mogą wzbudzać afekt, czyli reakcję emocjonalną i oceniającą. Autorzy proponują dwa dalsze tory: perswazja lub manipulacja prowadząca do uczenia oraz uwaga prowadząca do mobilizacji. Tor uwagi może pobudzać działanie bez zmiany przekonań odbiorcy. Są to proponowane mechanizmy oddziaływania na wszystkich trzech poziomach analizy.","caution":"To model do sprawdzania, a nie gwarancja skuteczności każdej opowieści. Zasięg publikacji nie dowodzi zmiany przekonań, a reakcja odbiorców sama nie dowodzi spowodowania decyzji publicznej.","pages":"168–169; afekt: także 170","kind":"NPF","detailTitle":"Perswazja a manipulacja — doprecyzowanie","detail":"W rozróżnieniu proponowanym przez autorów odbiorcy przyjmują opowieść i działają zgodnie z nią, ponieważ jest to w ich interesie (perswazja) albo sądzą, że tak jest (manipulacja). Autorzy zaznaczają, że odróżnienie tych sytuacji jest trudne i wymaga trafnych, rzetelnych reguł badania. Sama obecność emocji ani niezgoda z poglądem narratora nie dowodzi manipulacji. Podstawa: s. 169 i przypis 8 na s. 184."},{"id":"learning","title":"Uczenie się a przyjęcie nowej narracji","english":"Policy learning; narrative policy learning","group":"Wpływ i badanie","definition":"W tradycyjnym ujęciu uczenie się w polityce wiąże się z trwałą zmianą preferencji lub zachowań pod wpływem nowej informacji. Uczenie narracyjne polega na przyjęciu nowej konfiguracji elementów opowieści, nawet gdy inne informacje, w tym dowody naukowe, pozostają te same. Rozdział traktuje trwałą zmianę dominujących narracji jako możliwą drogę do zmiany polityki.","caution":"Chwilowa deklaracja poparcia nie wystarcza do wykazania trwałego uczenia. Omawiana hipoteza łącząca utrwaloną rekonfigurację narracji ze zmianą polityki jest w tym rozdziale oznaczona jako jeszcze nieprzetestowana.","pages":"169, 177–178","kind":"NPF"},{"id":"levels","title":"Poziomy: mikro, mezo i makro","english":"Levels of analysis","group":"Wpływ i badanie","definition":"Mikro: jak poszczególne osoby tworzą i odbierają narracje. Mezo: jak aktorzy zorganizowani w grupy i koalicje strategicznie używają narracji w podsystemie polityki. Makro: jak narracje osadzone w kulturach i instytucjach kształtują politykę publiczną.","caution":"Poziom wynika z pytania badawczego, nie ze szczebla administracji, wielkości próby ani formatu dokumentu. Program krajowy można badać na poziomie mikro, a lokalny na poziomie makro.","pages":"169; mikro: 173; mezo: 174; makro: 179–180; przypis 9: 185","kind":"NPF","detailTitle":"Poziom, jednostka analizy i obserwacji","detail":"Poziom analizy wskazuje teoretyczną skalę działania narracji. W rozróżnieniu tego rozdziału jednostka analizy to podmiot, z którego narracje pochodzą (osoba, grupa lub instytucja), a jednostka obserwacji to wyodrębniony materiał, w którym koduje się dane narracyjne (np. zdanie, akapit, dokument lub film). Szczebel administracji to jeszcze inne rozróżnienie. Podstawa: przypis 9 na s. 185."},{"id":"evidence","title":"Interpretacja i dowód tekstowy","english":"","group":"Narzędzia w grze","definition":"Autorska pomoc metodyczna, nie osobne pojęcie NPF. Interpretację uzasadniamy fragmentem i regułą kodowania: kto doświadcza problemu, komu przypisano pomoc, jakie działania powiązano i co proponuje narrator. Fragment jest dowodem tego, co przedstawia opowieść; nie musi być dowodem, że tak działa rzeczywisty program.","caution":"Samo wystąpienie słowa w tekście nie przesądza o kodzie. Uwzględnij kontekst, warunki i to, czy wypowiedź opisuje fakt, obawę czy postulat.","pages":"","kind":"metoda gry"},{"id":"uncertainty","title":"Nierozstrzygnięcie i granice wniosku","english":"","group":"Narzędzia w grze","definition":"Autorska pomoc metodyczna, nie osobne pojęcie NPF. Gdy materiał nie daje podstawy do wniosku, wskaż, czego nie wiadomo i jakich danych brakuje. Nieobecność elementu narracji jest dopuszczalnym wynikiem kodowania. Nie dopisuj postaci ani skutku, aby uzyskać pełny schemat.","caution":"Brak dowodu wpływu narracji nie jest dowodem braku wpływu. Można rzetelnie zrekonstruować jej treść, nie rozstrzygając jej skuteczności.","pages":"","kind":"metoda gry"}],EXAMPLES={"SCT":{"narrative":"Przykład fikcyjny: W wypowiedzi o strefie czystego transportu wskazano, że szkody doświadczają dzieci uczące się przy ruchliwej ulicy. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.","form":"Przykład fikcyjny: Opowieść o strefie czystego transportu: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Ograniczenie ruchu ma zmniejszyć narażenie dzieci na spaliny” łączy działanie ze zmianą sytuacji (fabuła). „Wprowadźmy ograniczenia ruchu z pomocą dla osób potrzebujących dostosowania” wskazuje postulowane działanie (morał). Te cztery kody opisują budowę wypowiedzi.","characters":"Przykład fikcyjny: Ofiara: dzieci uczące się przy ruchliwej ulicy — w opowieści to grupa narażona na szkodę. Bohater: zespół miejski — jeśli tekst właśnie tej postaci przypisuje możliwość pomocy. Antagonistę można rozpoznać w osobnej wypowiedzi: „Firma A celowo obchodzi ograniczenia i naraża dzieci na spaliny”. To odczytanie ról w wymyślonych tekstach, nie ocena rzeczywistych podmiotów.","setting":"Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o strefie czystego transportu”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.","plot":"Przykład fikcyjny: „Rodzice opisali problem spalin przy szkole. Zespół miejski przedstawił wariant ograniczeń ruchu, a część mieszkańców zażądała okresu dostosowania przed ich wprowadzeniem.” Fabuła łączy tu działania postaci w sekwencję: zgłoszenie trudności, propozycja pomocy i żądanie jej zmiany. Pokazuje również relację między uczestnikami sporu. Samo hasło „narażenie na spaliny” nazywa trudność, ale nie odtwarza tej fabuły.","moral":"Przykład fikcyjny: „Wprowadźmy ograniczenia ruchu z pomocą dla osób potrzebujących dostosowania” jest postulatem działania. Wypowiedź mogłaby też zakończyć się szerszą lekcją „Wspólne instytucje powinny pomagać osobom, które same nie mogą usunąć tej bariery”. Morał nie musi być gotowym projektem przepisu ani tym, z czym zgadza się czytelnik.","narrator":"Przykład fikcyjny: O strefie czystego transportu wypowiada się fikcyjna grupa rodziców — to narrator. W tej opowieści rolę proponowanego bohatera pełni postać określona jako „zespół miejski”. Adresatami mogą być radni albo mieszkańcy. Jeśli gazetowy artykuł cytuje tę wypowiedź, odróżnij narrację cytowanej grupy od komentarza dziennikarza.","content":"Przykład fikcyjny: W zdaniu „Ochrona zdrowia powinna mieć pierwszeństwo w organizacji ruchu” można rozpoznać wyrażone przekonanie normatywne. Użycie tego przekonania do przedstawienia sprawy jako ważnej dla wielu grup może służyć strategii narracyjnej. Nie przypisuj jednak autorowi całej ideologii na podstawie jednego zdania; potrzebujesz reguły kodowania i podstawy teoretycznej.","scope":"Przykład fikcyjny: W debacie o strefie czystego transportu ktoś mówi: „Skutki tego rozwiązania obciążają rodziny, pracowników i seniorów w całym regionie, a korzyści zbiera kilka podmiotów”. Taki układ kosztów i korzyści przedstawia problem jako dotyczący wielu grup i może służyć rozszerzaniu konfliktu także bez dosłownego zaproszenia do debaty. „To tylko techniczna sprawa wąskiego grona, pozostawmy ją dotychczasowym uczestnikom” wskazuje przeciwny kierunek. Nie wynika z tego, czy skład uczestników rzeczywiście się zmienił.","causal":"Przykład fikcyjny: Wypowiedź „Firma A celowo obchodzi ograniczenia i naraża dzieci na spaliny” przypisuje odpowiedzialność za szkodę celowemu działaniu postaci. To przykład przyczynowości konstruowanej wewnątrz narracji o strefie czystego transportu. Nie jest to dowód, że wypowiedź zmieniła opinię odbiorcy, ani ustalenie, że opisane zachowanie rzeczywiście miało miejsce.","das":"Przykład fikcyjny: W zbiorze tekstów o strefie czystego transportu porównujesz udział przedstawień bohaterów, antagonistów i ofiar. Dominujące eksponowanie zdolności pomocy postaci określonej jako „zespół miejski” może wskazywać angel shift; dominujące obwinianie przeciwników — devil shift, a akcentowanie krzywdy ofiar — solidarity shift. Najpierw ustal jednostkę i sposób porównania. Pojedyncza wzmianka o roli nie rozstrzyga, która strategia dominuje.","mechanisms":"Przykład fikcyjny: Po lekturze opowieści o strefie czystego transportu czytelniczka odczuwa sympatię do proponowanego bohatera i zaczyna popierać jego rozwiązanie — to możliwy ślad toru prowadzącego przez afekt do perswazji. Inny czytelnik już popierał rozwiązanie, lecz teraz uznaje sprawę za pilną i wysyła pytanie do urzędu — to możliwy ślad uwagi i mobilizacji. Samo następstwo nie potwierdza wpływu narracji. Do odróżnienia perswazji od manipulacji nie wystarczy też ocena, że proponowane rozwiązanie jest politycznie niesłuszne.","learning":"Przykład fikcyjny: W dyskusji o strefie czystego transportu nowe dane o zasięgu problemu prowadzą do trwałej zmiany preferencji: to przykład tradycyjnego uczenia. Przy tych samych danych uczestnicy mogą przyjąć nową opowieść, która w roli ofiary eksponuje inną grupę, określoną jako „osoby dojeżdżające na leczenie”. Jeśli ta zmiana zostaje przyjęta i utrzymuje się, ilustruje narracyjne uczenie. Jedna deklaracja tuż po lekturze nie potwierdza trwałości.","levels":"Przykład fikcyjny: Mikro: badasz reakcję osoby na opowieść o strefie czystego transportu. Mezo: badasz używanie narracji przez grupy w sporze. Makro: rozważasz szerszą opowieść „Obywatele zyskują samodzielność, gdy wspólne instytucje usuwają bariery przemieszczania; dlatego organizacja przestrzeni i usług powinna chronić ich możliwość swobodnego poruszania się.” i sprawdzasz, czy utrwala się przez lata w kulturze lub instytucjach oraz organizuje różne debaty polityczne. Sama wartość lub pojedynczy postulat nie wystarcza do rozpoznania takiej makronarracji.","evidence":"Przykład fikcyjny: Teza: wypowiedź o strefie czystego transportu zawiera jawny postulat działania. Fragment „Wprowadźmy ograniczenia ruchu z pomocą dla osób potrzebujących dostosowania” wspiera tę tezę. Metryka podająca jedynie datę publikacji nie rozstrzyga jej, ale nie odbiera znaczenia pierwszemu fragmentowi. Status tezy dotyczy całego zebranego materiału, a relacja — każdego fragmentu ocenianego z osobna.","uncertainty":"Przykład fikcyjny: W krótkim streszczeniu debaty o strefie czystego transportu zapisano, że omawiano problem określony jako „narażenie na spaliny”. Chcesz sprawdzić tezę, że narrator wprost obwinił konkretną instytucję, lecz nie masz pełnej wypowiedzi. Streszczenie tego nie rozstrzyga: trzeba odnaleźć oryginał. Brak informacji o obwinianiu w streszczeniu nie dowodzi, że nie było go w wypowiedzi."},"BO":{"narrative":"Przykład fikcyjny: W wypowiedzi o budżecie obywatelskim wskazano, że szkody doświadczają mieszkańcy osiedla pozbawieni miejsca spotkań w cieniu. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.","form":"Przykład fikcyjny: Opowieść o budżecie obywatelskim: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Ogród ma zapewnić cień i umożliwić sąsiadom wspólne spotkania” łączy działanie ze zmianą sytuacji (fabuła). „Przeznaczmy część budżetu na ogród dostępny dla wszystkich mieszkańców” wskazuje postulowane działanie (morał). Te cztery kody opisują budowę wypowiedzi.","characters":"Przykład fikcyjny: Ofiara: mieszkańcy osiedla pozbawieni miejsca spotkań w cieniu — w opowieści to grupa narażona na szkodę. Bohater: grupa projektodawców — jeśli tekst właśnie tej postaci przypisuje możliwość pomocy. Antagonistę można rozpoznać w osobnej wypowiedzi: „Zarządca A celowo blokuje mieszkańcom dostęp do wspólnego terenu”. To odczytanie ról w wymyślonych tekstach, nie ocena rzeczywistych podmiotów.","setting":"Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o budżecie obywatelskim”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.","plot":"Przykład fikcyjny: „Mieszkańcy zgłosili brak miejsca spotkań. Grupa projektodawców przygotowała pomysł ogrodu, a część sąsiadów zaproponowała zmianę projektu, żeby zachować miejsce do zabawy.” Fabuła łączy tu działania postaci w sekwencję: zgłoszenie trudności, propozycja pomocy i żądanie jej zmiany. Pokazuje również relację między uczestnikami sporu. Samo hasło „brak dostępnego miejsca spotkań” nazywa trudność, ale nie odtwarza tej fabuły.","moral":"Przykład fikcyjny: „Przeznaczmy część budżetu na ogród dostępny dla wszystkich mieszkańców” jest postulatem działania. Wypowiedź mogłaby też zakończyć się szerszą lekcją „Wspólne instytucje powinny pomagać osobom, które same nie mogą usunąć tej bariery”. Morał nie musi być gotowym projektem przepisu ani tym, z czym zgadza się czytelnik.","narrator":"Przykład fikcyjny: O budżecie obywatelskim wypowiada się fikcyjna inicjatywa sąsiedzka — to narrator. W tej opowieści rolę proponowanego bohatera pełni postać określona jako „grupa projektodawców”. Adresatami mogą być radni albo mieszkańcy. Jeśli gazetowy artykuł cytuje tę wypowiedź, odróżnij narrację cytowanej grupy od komentarza dziennikarza.","content":"Przykład fikcyjny: W zdaniu „Mieszkańcy powinni współdecydować o lokalnych wydatkach” można rozpoznać wyrażone przekonanie normatywne. Użycie tego przekonania do przedstawienia sprawy jako ważnej dla wielu grup może służyć strategii narracyjnej. Nie przypisuj jednak autorowi całej ideologii na podstawie jednego zdania; potrzebujesz reguły kodowania i podstawy teoretycznej.","scope":"Przykład fikcyjny: W debacie o budżecie obywatelskim ktoś mówi: „Skutki tego rozwiązania obciążają rodziny, pracowników i seniorów w całym regionie, a korzyści zbiera kilka podmiotów”. Taki układ kosztów i korzyści przedstawia problem jako dotyczący wielu grup i może służyć rozszerzaniu konfliktu także bez dosłownego zaproszenia do debaty. „To tylko techniczna sprawa wąskiego grona, pozostawmy ją dotychczasowym uczestnikom” wskazuje przeciwny kierunek. Nie wynika z tego, czy skład uczestników rzeczywiście się zmienił.","causal":"Przykład fikcyjny: Wypowiedź „Zarządca A celowo blokuje mieszkańcom dostęp do wspólnego terenu” przypisuje odpowiedzialność za szkodę celowemu działaniu postaci. To przykład przyczynowości konstruowanej wewnątrz narracji o budżecie obywatelskim. Nie jest to dowód, że wypowiedź zmieniła opinię odbiorcy, ani ustalenie, że opisane zachowanie rzeczywiście miało miejsce.","das":"Przykład fikcyjny: W zbiorze tekstów o budżecie obywatelskim porównujesz udział przedstawień bohaterów, antagonistów i ofiar. Dominujące eksponowanie zdolności pomocy postaci określonej jako „grupa projektodawców” może wskazywać angel shift; dominujące obwinianie przeciwników — devil shift, a akcentowanie krzywdy ofiar — solidarity shift. Najpierw ustal jednostkę i sposób porównania. Pojedyncza wzmianka o roli nie rozstrzyga, która strategia dominuje.","mechanisms":"Przykład fikcyjny: Po lekturze opowieści o budżecie obywatelskim czytelniczka odczuwa sympatię do proponowanego bohatera i zaczyna popierać jego rozwiązanie — to możliwy ślad toru prowadzącego przez afekt do perswazji. Inny czytelnik już popierał rozwiązanie, lecz teraz uznaje sprawę za pilną i wysyła pytanie do urzędu — to możliwy ślad uwagi i mobilizacji. Samo następstwo nie potwierdza wpływu narracji. Do odróżnienia perswazji od manipulacji nie wystarczy też ocena, że proponowane rozwiązanie jest politycznie niesłuszne.","learning":"Przykład fikcyjny: W dyskusji o budżecie obywatelskim nowe dane o zasięgu problemu prowadzą do trwałej zmiany preferencji: to przykład tradycyjnego uczenia. Przy tych samych danych uczestnicy mogą przyjąć nową opowieść, która w roli ofiary eksponuje inną grupę, określoną jako „osoby z trudnościami w poruszaniu się”. Jeśli ta zmiana zostaje przyjęta i utrzymuje się, ilustruje narracyjne uczenie. Jedna deklaracja tuż po lekturze nie potwierdza trwałości.","levels":"Przykład fikcyjny: Mikro: badasz reakcję osoby na opowieść o budżecie obywatelskim. Mezo: badasz używanie narracji przez grupy w sporze. Makro: rozważasz szerszą opowieść „Mieszkańcy pozostawieni poza decyzjami tracą wpływ na wspólne zasoby; instytucje oddające im część władzy odbudowują wspólnotę, dlatego obywatele powinni współdecydować o sprawach publicznych.” i sprawdzasz, czy utrwala się przez lata w kulturze lub instytucjach oraz organizuje różne debaty polityczne. Sama wartość lub pojedynczy postulat nie wystarcza do rozpoznania takiej makronarracji.","evidence":"Przykład fikcyjny: Teza: wypowiedź o budżecie obywatelskim zawiera jawny postulat działania. Fragment „Przeznaczmy część budżetu na ogród dostępny dla wszystkich mieszkańców” wspiera tę tezę. Metryka podająca jedynie datę publikacji nie rozstrzyga jej, ale nie odbiera znaczenia pierwszemu fragmentowi. Status tezy dotyczy całego zebranego materiału, a relacja — każdego fragmentu ocenianego z osobna.","uncertainty":"Przykład fikcyjny: W krótkim streszczeniu debaty o budżecie obywatelskim zapisano, że omawiano problem określony jako „brak dostępnego miejsca spotkań”. Chcesz sprawdzić tezę, że narrator wprost obwinił konkretną instytucję, lecz nie masz pełnej wypowiedzi. Streszczenie tego nie rozstrzyga: trzeba odnaleźć oryginał. Brak informacji o obwinianiu w streszczeniu nie dowodzi, że nie było go w wypowiedzi."},"GPA":{"narrative":"Przykład fikcyjny: W wypowiedzi o lokalnych przewozach autobusowych wskazano, że szkody doświadczają osoby bez samochodu kończące pracę późnym wieczorem. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.","form":"Przykład fikcyjny: Opowieść o lokalnych przewozach autobusowych: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Dodatkowy kurs ma umożliwić powrót z późnej zmiany i ułatwić podjęcie pracy” łączy działanie ze zmianą sytuacji (fabuła). „Uruchommy wieczorny kurs skoordynowany z godzinami końca zmian” wskazuje postulowane działanie (morał). Te cztery kody opisują budowę wypowiedzi.","characters":"Przykład fikcyjny: Ofiara: osoby bez samochodu kończące pracę późnym wieczorem — w opowieści to grupa narażona na szkodę. Bohater: organizator transportu — jeśli tekst właśnie tej postaci przypisuje możliwość pomocy. Antagonistę można rozpoznać w osobnej wypowiedzi: „Operator A świadomie nie wykonuje zaplanowanych kursów i zostawia pasażerów bez dojazdu”. To odczytanie ról w wymyślonych tekstach, nie ocena rzeczywistych podmiotów.","setting":"Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o lokalnych przewozach autobusowych”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.","plot":"Przykład fikcyjny: „Pracownicy opisali trudności z powrotem z późnej zmiany. Organizator zaproponował kurs wieczorny; pasażerowie poprosili o przesunięcie odjazdu, aby zdążyć po zakończeniu pracy.” Fabuła łączy tu działania postaci w sekwencję: zgłoszenie trudności, propozycja pomocy i żądanie jej zmiany. Pokazuje również relację między uczestnikami sporu. Samo hasło „brak możliwości powrotu do domu autobusem” nazywa trudność, ale nie odtwarza tej fabuły.","moral":"Przykład fikcyjny: „Uruchommy wieczorny kurs skoordynowany z godzinami końca zmian” jest postulatem działania. Wypowiedź mogłaby też zakończyć się szerszą lekcją „Wspólne instytucje powinny pomagać osobom, które same nie mogą usunąć tej bariery”. Morał nie musi być gotowym projektem przepisu ani tym, z czym zgadza się czytelnik.","narrator":"Przykład fikcyjny: O lokalnych przewozach autobusowych wypowiada się fikcyjna grupa pracowników zmianowych — to narrator. W tej opowieści rolę proponowanego bohatera pełni postać określona jako „organizator transportu”. Adresatami mogą być radni albo mieszkańcy. Jeśli gazetowy artykuł cytuje tę wypowiedź, odróżnij narrację cytowanej grupy od komentarza dziennikarza.","content":"Przykład fikcyjny: W zdaniu „Dostęp do transportu powinien ograniczać nierówności szans” można rozpoznać wyrażone przekonanie normatywne. Użycie tego przekonania do przedstawienia sprawy jako ważnej dla wielu grup może służyć strategii narracyjnej. Nie przypisuj jednak autorowi całej ideologii na podstawie jednego zdania; potrzebujesz reguły kodowania i podstawy teoretycznej.","scope":"Przykład fikcyjny: W debacie o lokalnych przewozach autobusowych ktoś mówi: „Skutki tego rozwiązania obciążają rodziny, pracowników i seniorów w całym regionie, a korzyści zbiera kilka podmiotów”. Taki układ kosztów i korzyści przedstawia problem jako dotyczący wielu grup i może służyć rozszerzaniu konfliktu także bez dosłownego zaproszenia do debaty. „To tylko techniczna sprawa wąskiego grona, pozostawmy ją dotychczasowym uczestnikom” wskazuje przeciwny kierunek. Nie wynika z tego, czy skład uczestników rzeczywiście się zmienił.","causal":"Przykład fikcyjny: Wypowiedź „Operator A świadomie nie wykonuje zaplanowanych kursów i zostawia pasażerów bez dojazdu” przypisuje odpowiedzialność za szkodę celowemu działaniu postaci. To przykład przyczynowości konstruowanej wewnątrz narracji o lokalnych przewozach autobusowych. Nie jest to dowód, że wypowiedź zmieniła opinię odbiorcy, ani ustalenie, że opisane zachowanie rzeczywiście miało miejsce.","das":"Przykład fikcyjny: W zbiorze tekstów o lokalnych przewozach autobusowych porównujesz udział przedstawień bohaterów, antagonistów i ofiar. Dominujące eksponowanie zdolności pomocy postaci określonej jako „organizator transportu” może wskazywać angel shift; dominujące obwinianie przeciwników — devil shift, a akcentowanie krzywdy ofiar — solidarity shift. Najpierw ustal jednostkę i sposób porównania. Pojedyncza wzmianka o roli nie rozstrzyga, która strategia dominuje.","mechanisms":"Przykład fikcyjny: Po lekturze opowieści o lokalnych przewozach autobusowych czytelniczka odczuwa sympatię do proponowanego bohatera i zaczyna popierać jego rozwiązanie — to możliwy ślad toru prowadzącego przez afekt do perswazji. Inny czytelnik już popierał rozwiązanie, lecz teraz uznaje sprawę za pilną i wysyła pytanie do urzędu — to możliwy ślad uwagi i mobilizacji. Samo następstwo nie potwierdza wpływu narracji. Do odróżnienia perswazji od manipulacji nie wystarczy też ocena, że proponowane rozwiązanie jest politycznie niesłuszne.","learning":"Przykład fikcyjny: W dyskusji o lokalnych przewozach autobusowych nowe dane o zasięgu problemu prowadzą do trwałej zmiany preferencji: to przykład tradycyjnego uczenia. Przy tych samych danych uczestnicy mogą przyjąć nową opowieść, która w roli ofiary eksponuje inną grupę, ok iązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.","form":"Przykład fikcyjny: Opowieść o programie wsparcia zakupu mieszkania: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Wsparcie ma zmniejszyć koszt finansowania i umożliwić zakup mieszkania” łączy działanie ze zmianą sytuacji (fabuła). „Zaprojektujmy wsparcie dla gospodarstw napotykających barierę finansowania” wskazuje postulowane działanie (morał). Te cztery kody opisują budowę wypowiedzi.","characters":"Przykład fikcyjny: Ofiara: gospodarstwa domowe napotykające barierę zakupu pierwszego mieszkania — w opowieści to grupa narażona na szkodę. Bohater: projektanci programu wsparcia — jeśli tekst właśnie tej postaci przypisuje możliwość pomocy. Antagonistę można rozpoznać w osobnej wypowiedzi: „Pośrednik A świadomie wprowadza klientów w błąd i pogarsza ich sytuację finansową”. To odczytanie ról w wymyślonych tekstach, nie ocena rzeczywistych podmiotów.","setting":"Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o programie wsparcia zakupu mieszkania”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.","plot":"Przykład fikcyjny: „Gospodarstwa opisały barierę zakupu pierwszego mieszkania. Projektanci przedstawili propozycję wsparcia; część uczestników debaty zażądała zmiany kryteriów dostępu przed jej przyjęciem.” Fabuła łączy tu działania postaci w sekwencję: zgłoszenie trudności, propozycja pomocy i żądanie jej zmiany. Pokazuje również relację między uczestnikami sporu. Samo hasło „niemożność sfinansowania pierwszego mieszkania” nazywa trudność, ale nie odtwarza tej fabuły.","moral":"Przykład fikcyjny: „Zaprojektujmy wsparcie dla gospodarstw napotykających barierę finansowania” jest postulatem działania. Wypowiedź mogłaby też zakończyć się szerszą lekcją „Wspólne instytucje powinny pomagać osobom, które same nie mogą usunąć tej bariery”. Morał nie musi być gotowym projektem przepisu ani tym, z czym zgadza się czytelnik.","narrator":"Przykład fikcyjny: O programie wsparcia zakupu mieszkania wypowiada się fikcyjne stowarzyszenie gospodarstw domowych — to narrator. W tej opowieści rolę proponowanego bohatera pełni postać określona jako „projektanci programu wsparcia”. Adresatami mogą być radni albo mieszkańcy. Jeśli gazetowy artykuł cytuje tę wypowiedź, odróżnij narrację cytowanej grupy od komentarza dziennikarza.","content":"Przykład fikcyjny: W zdaniu „Państwo powinno wspierać dostęp do pierwszego mieszkania” można rozpoznać wyrażone przekonanie normatywne. Użycie tego przekonania do przedstawienia sprawy jako ważnej dla wielu grup może służyć strategii narracyjnej. Nie przypisuj jednak autorowi całej ideologii na podstawie jednego zdania; potrzebujesz reguły kodowania i podstawy teoretycznej.","scope":"Przykład fikcyjny: W debacie o programie wsparcia zakupu mieszkania ktoś mówi: „Skutki tego rozwiązania obciążają rodziny, pracowników i seniorów w całym regionie, a korzyści zbiera kilka podmiotów”. Taki układ kosztów i korzyści przedstawia problem jako dotyczący wielu grup i może służyć rozszerzaniu konfliktu także bez dosłownego zaproszenia do debaty. „To tylko techniczna sprawa wąskiego grona, pozostawmy ją dotychczasowym uczestnikom” wskazuje przeciwny kierunek. Nie wynika z tego, czy skład uczestników rzeczywiście się zmienił.","causal":"Przykład fikcyjny: Wypowiedź „Pośrednik A świadomie wprowadza klientów w błąd i pogarsza ich sytuację finansową” przypisuje odpowiedzialność za szkodę celowemu działaniu postaci. To przykład przyczynowości konstruowanej wewnątrz narracji o programie wsparcia zakupu mieszkania. Nie jest to dowód, że wypowiedź zmieniła opinię odbiorcy, ani ustalenie, że opisane zachowanie rzeczywiście miało miejsce.","das":"Przykład fikcyjny: W zbiorze tekstów o programie wsparcia zakupu mieszkania porównujesz udział przedstawień bohaterów, antagonistów i ofiar. Dominujące eksponowanie zdolności pomocy postaci określonej jako „projektanci programu wsparcia” może wskazywać angel shift; dominujące obwinianie przeciwników — devil shift, a akcentowanie krzywdy ofiar — solidarity shift. Najpierw ustal jednostkę i sposób porównania. Pojedyncza wzmianka o roli nie rozstrzyga, która strategia dominuje.","mechanisms":"Przykład fikcyjny: Po lekturze opowieści o programie wsparcia zakupu mieszkania czytelniczka odczuwa sympatię do proponowanego bohatera i zaczyna popierać jego rozwiązanie — to możliwy ślad toru prowadzącego przez afekt do perswazji. Inny czytelnik już popierał rozwiązanie, lecz teraz uznaje sprawę za pilną i wysyła pytanie do urzędu — to możliwy ślad uwagi i mobilizacji. Samo następstwo nie potwierdza wpływu narracji. Do odróżnienia perswazji od manipulacji nie wystarczy też ocena, że proponowane rozwiązanie jest politycznie niesłuszne.","learning":"Przykład fikcyjny: W dyskusji o programie wsparcia zakupu mieszkania nowe dane o zasięgu problemu prowadzą do trwałej zmiany preferencji: to przykład tradycyjnego uczenia. Przy tych samych danych uczestnicy mogą przyjąć nową opowieść, która w roli ofiary eksponuje inną grupę, określoną jako „gospodarstwa pozostające na rynku najmu”. Jeśli ta zmiana zostaje przyjęta i utrzymuje się, ilustruje narracyjne uczenie. Jedna deklaracja tuż po lekturze nie potwierdza trwałości.","levels":"Przykład fikcyjny: Mikro: badasz reakcję osoby na opowieść o programie wsparcia zakupu mieszkania. Mezo: badasz używanie narracji przez grupy w sporze. Makro: rozważasz szerszą opowieść „Rodziny pozbawione trwałego miejsca życia pozostają zależne od silniejszych; instytucje wspierające własność pomagają im uzyskać samodzielność, dlatego własne mieszkanie powinno być podstawą społecznego bezpieczeństwa.” i sprawdzasz, czy utrwala się przez lata w kulturze lub instytucjach oraz organizuje różne debaty polityczne. Sama wartość lub pojedynczy postulat nie wystarcza do rozpoznania takiej makronarracji.","evidence":"Przykład fikcyjny: Teza: wypowiedź o programie wsparcia zakupu mieszkania zawiera jawny postulat działania. Fragment „Zaprojektujmy wsparcie dla gospodarstw napotykających barierę finansowania” wspiera tę tezę. Metryka podająca jedynie datę publikacji nie rozstrzyga jej, ale nie odbiera znaczenia pierwszemu fragmentowi. Status tezy dotyczy całego zebranego materiału, a relacja — każdego fragmentu ocenianego z osobna.","uncertainty":"Przykład fikcyjny: W krótkim streszczeniu debaty o programie wsparcia zakupu mieszkania zapisano, że omawiano problem określony jako „niemożność sfinansowania pierwszego mieszkania”. Chcesz sprawdzić tezę, że narrator wprost obwinił konkretną instytucję, lecz nie masz pełnej wypowiedzi. Streszczenie tego nie rozstrzyga: trzeba odnaleźć oryginał. Brak informacji o obwinianiu w streszczeniu nie dowodzi, że nie było go w wypowiedzi."},"CP":{"narrative":"Przykład fikcyjny: W wypowiedzi o programie poprawy efektywności energetycznej domów wskazano, że szkody doświadczają gospodarstwa ponoszące wysokie koszty ogrzewania niedocieplonych domów. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.","form":"Przykład fikcyjny: Opowieść o programie poprawy efektywności energetycznej domów: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Doradztwo ma ułatwić modernizację domu, a ta zmniejszyć zapotrzebowanie na energię” łączy działanie ze zmianą sytuacji (fabuła). „Zapewnijmy mieszkańcom dostęp do doradztwa i wsparcia modernizacji” wskazuje postulowane działanie (morał). Te cztery kody opisują budowę wypowiedzi.","characters":"Przykład fikcyjny: Ofiara: gospodarstwa ponoszące wysokie koszty ogrzewania niedocieplonych domów — w opowieści to grupa narażona na szkodę. Bohater: zespół doradców gminnych — jeśli tekst właśnie tej postaci przypisuje możliwość pomocy. Antagonistę można rozpoznać w osobnej wypowiedzi: „Wykonawca A świadomie pobiera zaliczki bez wykonania prac i pogarsza sytuację gospodarstw”. To odczytanie ról w wymyślonych tekstach, nie ocena rzeczywistych podmiotów.","setting":"Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o programie poprawy efektywności energetycznej domów”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.","plot":"Przykład fikcyjny: „Mieszkańcy opisali trudności z ogrzaniem domów. Zespół doradców zaproponował pomoc w modernizacji; właściciele poprosili o zmianę kolejności prac, aby nie pozostawać bez ogrzewania zimą.” Fabuła łączy tu działania postaci w sekwencję: zgłoszenie trudności, propozycja pomocy i żądanie jej zmiany. Pokazuje również relację między uczestnikami sporu. Samo hasło „wysokie koszty utrzymania odpowiedniej temperatury w domu” nazywa trudność, ale nie odtwarza tej fabuły.","moral":"Przykład fikcyjny: „Zapewnijmy mieszkańcom dostęp do doradztwa i wsparcia modernizacji” jest postulatem działania. Wypowiedź mogłaby też zakończyć się szerszą lekcją „Wspólne instytucje powinny pomagać osobom, które same nie mogą usunąć tej bariery”. Morał nie musi być gotowym projektem przepisu ani tym, z czym zgadza się czytelnik.","narrator":"Przykład fikcyjny: O programie poprawy efektywności energetycznej domów wypowiada się fikcyjna grupa mieszkańców gminy — to narrator. W tej opowieści rolę proponowanego bohatera pełni postać określona jako „zespół doradców gminnych”. Adresatami mogą być radni albo mieszkańcy. Jeśli gazetowy artykuł cytuje tę wypowiedź, odróżnij narrację cytowanej grupy od komentarza dziennikarza.","content":"Przykład fikcyjny: W zdaniu „Transformacja energetyczna powinna uwzględniać gospodarstwa o mniejszych zasobach” można rozpoznać wyrażone przekonanie normatywne. Użycie tego przekonania do przedstawienia sprawy jako ważnej dla wielu grup może służyć strategii narracyjnej. Nie przypisuj jednak autorowi całej ideologii na podstawie jednego zdania; potrzebujesz reguły kodowania i podstawy teoretycznej.","scope":"Przykład fikcyjny: W debacie o programie poprawy efektywności energetycznej domów ktoś mówi: „Skutki tego rozwiązania obciążają rodziny, pracowników i seniorów w całym regionie, a korzyści zbiera kilka podmiotów”. Taki układ kosztów i korzyści przedstawia problem jako dotyczący wielu grup i może służyć rozszerzaniu konfliktu także bez dosłownego zaproszenia do debaty. „To tylko techniczna sprawa wąskiego grona, pozostawmy ją dotychczasowym uczestnikom” wskazuje przeciwny kierunek. Nie wynika z tego, czy skład uczestników rzeczywiście się zmienił.","causal":"Przykład fikcyjny: Wypowiedź „Wykonawca A świadomie pobiera zaliczki bez wykonania prac i pogarsza sytuację gospodarstw” przypisuje odpowiedzialność za szkodę celowemu działaniu postaci. To przykład przyczynowości konstruowanej wewnątrz narracji o programie poprawy efektywności energetycznej domów. Nie jest to dowód, że wypowiedź zmieniła opinię odbiorcy, ani ustalenie, że opisane zachowanie rzeczywiście miało miejsce.","das":"Przykład fikcyjny: W zbiorze tekstów o programie poprawy efektywności energetycznej domów porównujesz udział przedstawień bohaterów, antagonistów i ofiar. Dominujące eksponowanie zdolności pomocy postaci określonej jako „zespół doradców gminnych” może wskazywać angel shift; dominujące obwinianie przeciwników — devil shift, a akcentowanie krzywdy ofiar — solidarity shift. Najpierw ustal jednostkę i sposób porównania. Pojedyncza wzmianka o roli nie rozstrzyga, która strategia dominuje.","mechanisms":"Przykład fikcyjny: Po lekturze opowieści o programie poprawy efektywności energetycznej domów czytelniczka odczuwa sympatię do proponowanego bohatera i zaczyna popierać jego rozwiązanie — to możliwy ślad toru prowadzącego przez afekt do perswazji. Inny czytelnik już popierał rozwiązanie, lecz teraz uznaje sprawę za pilną i wysyła pytanie do urzędu — to możliwy ślad uwagi i mobilizacji. Samo następstwo nie potwierdza wpływu narracji. Do odróżnienia perswazji od manipulacji nie wystarczy też ocena, że proponowane rozwiązanie jest politycznie niesłuszne.","learning":"Przykład fikcyjny: W dyskusji o programie poprawy efektywności energetycznej domów nowe dane o zasięgu problemu prowadzą do trwałej zmiany preferencji: to przykład tradycyjnego uczenia. Przy tych samych danych uczestnicy mogą przyjąć nową opowieść, która w roli ofiary eksponuje inną grupę, określoną jako „najemcy niedocieplonych domów”. Jeśli ta zmiana zostaje przyjęta i utrzymuje się, ilustruje narracyjne uczenie. Jedna deklaracja tuż po lekturze nie potwierdza trwałości.","levels":"Przykład fikcyjny: Mikro: badasz reakcję osoby na opowieść o programie poprawy efektywności energetycznej domów. Mezo: badasz używanie narracji przez grupy w sporze. Makro: rozważasz szerszą opowieść „Wspólnota traci spójność, gdy koszty zmian ponoszą głównie słabsi; instytucje rozkładające ciężary sprawiedliwie odbudowują współpracę, dlatego polityka publiczna powinna chronić ludzi o mniejszych zasobach.” i sprawdzasz, czy utrwala się przez lata w kulturze lub instytucjach oraz organizuje różne debaty polityczne. Sama wartość lub pojedynczy postulat nie wystarcza do rozpoznania takiej makronarracji.","evidence":"Przykład fikcyjny: Teza: wypowiedź o programie poprawy efektywności energetycznej domów zawiera jawny postulat działania. Fragment „Zapewnijmy mieszkańcom dostęp do doradztwa i wsparcia modernizacji” wspiera tę tezę. Metryka podająca jedynie datę publikacji nie rozstrzyga jej, ale nie odbiera znaczenia pierwszemu fragmentowi. Status tezy dotyczy całego zebranego materiału, a relacja — każdego fragmentu ocenianego z osobna.","uncertainty":"Przykład fikcyjny: W krótkim streszczeniu debaty o programie poprawy efektywności energetycznej domów zapisano, że omawiano problem określony jako „wysokie koszty utrzymania odpowiedniej temperatury w domu”. Chcesz sprawdzić tezę, że narrator wprost obwinił konkretną instytucję, lecz nie masz pełnej wypowiedzi. Streszczenie tego nie rozstrzyga: trzeba odnaleźć oryginał. Brak informacji o obwinianiu w streszczeniu nie dowodzi, że nie było go w wypowiedzi."},"SOLO":{"narrative":"Przykład fikcyjny: W wypowiedzi o programie wydłużenia godzin pracy biblioteki wskazano, że szkody doświadczają osoby pracujące do późna, które nie mogą korzystać z biblioteki. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.","form":"Przykład fikcyjny: Opowieść o programie wydłużenia godzin pracy biblioteki: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Wieczorne otwarcie ma umożliwić osobom pracującym wypożyczanie książek” łączy działanie ze zmianą sytuacji (fabuła). „Otwórzmy bibliotekę w dodatkowy wieczór” wskazuje postulowane działanie (morał). Te cztery kody opisują budowę wypowiedzi.","characters":"Przykład fikcyjny: Ofiara: osoby pracujące do późna, które nie mogą korzystać z biblioteki — w opowieści to grupa narażona na szkodę. Bohater: zespół biblioteki — jeśli tekst właśnie tej postaci przypisuje możliwość pomocy. Antagonistę można rozpoznać w osobnej wypowiedzi: „Zarządca A celowo blokuje dostęp do wejścia i uniemożliwia czytelnikom korzystanie z biblioteki”. To odczytanie ról w wymyślonych tekstach, nie ocena rzeczywistych podmiotów.","setting":"Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o programie wydłużenia godzin pracy biblioteki”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.","plot":"Przykład fikcyjny: „Czytelnicy poprosili o dostęp do książek po pracy. Zespół biblioteki zaproponował dodatkowy wieczór; pracownicy zażądali ustalenia obsady, zanim zostaną zmienione godziny otwarcia.” Fabuła łączy tu działania postaci w sekwencję: zgłoszenie trudności, propozycja pomocy i żądanie jej zmiany. Pokazuje również relację między uczestnikami sporu. Samo hasło „utrudniony dostęp do książek po pracy” nazywa trudność, ale nie odtwarza tej fabuły.","moral":"Przykład fikcyjny: „Otwórzmy bibliotekę w dodatkowy wieczór” jest postulatem działania. Wypowiedź mogłaby też zakończyć się szerszą lekcją „Wspólne instytucje powinny pomagać osobom, które same nie mogą usunąć tej bariery”. Morał nie musi być gotowym projektem przepisu ani tym, z czym zgadza się czytelnik.","narrator":"Przykład fikcyjny: O programie wydłużenia godzin pracy biblioteki wypowiada się fikcyjny klub czytelników — to narrator. W tej opowieści rolę proponowanego bohatera pełni postać określona jako „zespół biblioteki”. Adresatami mogą być radni albo mieszkańcy. Jeśli gazetowy artykuł cytuje tę wypowiedź, odróżnij narrację cytowanej grupy od komentarza dziennikarza.","content":"Przykład fikcyjny: W zdaniu „Usługi kultury powinny być dostępne także osobom pracującym wieczorami” można rozpoznać wyrażone przekonanie normatywne. Użycie tego przekonania do przedstawienia sprawy jako ważnej dla wielu grup może służyć strategii narracyjnej. Nie przypisuj jednak autorowi całej ideologii na podstawie jednego zdania; potrzebujesz reguły kodowania i podstawy teoretycznej.","scope":"Przykład fikcyjny: W debacie o programie wydłużenia godzin pracy biblioteki ktoś mówi: „Skutki tego rozwiązania obciążają rodziny, pracowników i seniorów w całym regionie, a korzyści zbiera kilka podmiotów”. Taki układ kosztów i korzyści przedstawia problem jako dotyczący wielu grup i może służyć rozszerzaniu konfliktu także bez dosłownego zaproszenia do debaty. „To tylko techniczna sprawa wąskiego grona, pozostawmy ją dotychczasowym uczestnikom” wskazuje przeciwny kierunek. Nie wynika z tego, czy skład uczestników rzeczywiście się zmienił.","causal":"Przykład fikcyjny: Wypowiedź „Zarządca A celowo blokuje dostęp do wejścia i uniemożliwia czytelnikom korzystanie z biblioteki” przypisuje odpowiedzialność za szkodę celowemu działaniu postaci. To przykład przyczynowości konstruowanej wewnątrz narracji o programie wydłużenia godzin pracy biblioteki. Nie jest to dowód, że wypowiedź zmieniła opinię odbiorcy, ani ustalenie, że opisane zachowanie rzeczywiście miało miejsce.","das":"Przykład fikcyjny: W zbiorze tekstów o programie wydłużenia godzin pracy biblioteki porównujesz udział przedstawień bohaterów, antagonistów i ofiar. Dominujące eksponowanie zdolności pomocy postaci określonej jako „zespół biblioteki” może wskazywać angel shift; dominujące obwinianie przeciwników — devil shift, a akcentowanie krzywdy ofiar — solidarity shift. Najpierw ustal jednostkę i sposób porównania. Pojedyncza wzmianka o roli nie rozstrzyga, która strategia dominuje.","mechanisms":"Przykład fikcyjny: Po lekturze opowieści o programie wydłużenia godzin pracy biblioteki czytelniczka odczuwa sympatię do proponowanego bohatera i zaczyna popierać jego rozwiązanie — to możliwy ślad toru prowadzącego przez afekt do perswazji. Inny czytelnik już popierał rozwiązanie, lecz teraz uznaje sprawę za pilną i wysyła pytanie do urzędu — to możliwy ślad uwagi i mobilizacji. Samo następstwo nie potwierdza wpływu narracji. Do odróżnienia perswazji od manipulacji nie wystarczy też ocena, że proponowane rozwiązanie jest politycznie niesłuszne.","learning":"Przykład fikcyjny: W dyskusji o programie wydłużenia godzin pracy biblioteki nowe dane o zasięgu problemu prowadzą do trwałej zmiany preferencji: to przykład tradycyjnego uczenia. Przy tych samych danych uczestnicy mogą przyjąć nową opowieść, która w roli ofiary eksponuje inną grupę, określoną jako „opiekunowie małych dzieci”. Jeśli ta zmiana zostaje przyjęta i utrzymuje się, ilustruje narracyjne uczenie. Jedna deklaracja tuż po lekturze nie potwierdza trwałości.","levels":"Przykład fikcyjny: Mikro: badasz reakcję osoby na opowieść o programie wydłużenia godzin pracy biblioteki. Mezo: badasz używanie narracji przez grupy w sporze. Makro: rozważasz szerszą opowieść „Ludzie wykluczeni z obiegu wiedzy tracą wpływ na wspólne sprawy; instytucje otwierające dostęp do wiedzy wzmacniają ich samodzielność, dlatego usługi kultury i edukacji powinny być powszechnie dostępne.” i sprawdzasz, czy utrwala się przez lata w kulturze lub instytucjach oraz organizuje różne debaty polityczne. Sama wartość lub pojedynczy postulat nie wystarcza do rozpoznania takiej makronarracji.","evidence":"Przykład fikcyjny: Teza: wypowiedź o programie wydłużenia godzin pracy biblioteki zawiera jawny postulat działania. Fragment „Otwórzmy bibliotekę w dodatkowy wieczór” wspiera tę tezę. Metryka podająca jedynie datę publikacji nie rozstrzyga jej, ale nie odbiera znaczenia pierwszemu fragmentowi. Status tezy dotyczy całego zebranego materiału, a relacja — każdego fragmentu ocenianego z osobna.","uncertainty":"Przykład fikcyjny: W krótkim streszczeniu debaty o programie wydłużenia godzin pracy biblioteki zapisano, że omawiano problem określony jako „utrudniony dostęp do książek po pracy”. Chcesz sprawdzić tezę, że narrator wprost obwinił konkretną instytucję, lecz nie masz pełnej wypowiedzi. Streszczenie tego nie rozstrzyga: trzeba odnaleźć oryginał. Brak informacji o obwinianiu w streszczeniu nie dowodzi, że nie było go w wypowiedzi."}};

 ['Jakie pytanie, takie dane','Dla treści narracji potrzebujesz tekstów. Dla jej odbioru: danych o odbiorcach, np. zaprojektowanego badania eksperymentalnego lub wywiadów odpowiednich do pytania. Dla wpływu na decyzję: śladów przebiegu procesu i sprawdzenia konkurencyjnych wyjaśnień. Dla skutków instrumentu: danych o rezultatach i odpowiedniego porównania. Nie zastępuj jednego rodzaju dowodu drugim.'],
 ['Dalsze narzędzia NPF','Ćwiczenie skupia się na wybranych elementach formy. NPF bada też przekonania, strategie i różne poziomy analizy. Zaproszenie nowych grup do sporu może wskazywać rozszerzanie zakresu konfliktu; nie dowodzi, że grupy faktycznie dołączyły. Przypisanie winy wewnątrz narracji jest czymś innym niż mechanizm oddziaływania narracji na odbiorcę.']
];}
function questionLearning(q){const a=cur().answers[q.id];return `<article class="report-card"><h3>${esc(q.title)}</h3><p class="small">${esc(q.prompt)}</p><p class="small"><b>Pierwszy wybór: ${a.first===q.correct?'zgodny z kluczem':'do korekty'}; ostatni: ${a.last===q.correct?'zgodny z kluczem':'do korekty'}.</b> Sprawdzone wybory: ${a.attempts}. Pomoc przed pierwszym: ${a.firstHelp?'tak':'nie'}.</p><blockquote>Podstawa interpretacji: „${esc(q.evidence)}”.</blockquote><p>${esc(q.feedback)}</p><div class="alternatives"><h4>Dlaczego te odpowiedzi?</h4>${q.options.map((o,i)=>`<p><b>${esc(o)}</b> <span class="result-tag">${[i===a.first?'[Twój pierwszy wybór]':'',i===a.last?'[Twój ostatni wybór]':'',i===q.correct?'[Wsparta tekstem]':''].filter(Boolean).join(' ')}</span><br>${esc(q.explanations[i])}</p>`).join('')}</div></article>`;}
function feedbackReportHTML(){const p=program(),s=cur(),t=score();return `<div class="learning-report"><section class="report-intro"><p class="eyebrow">Detektyw narracji • indywidualny raport uczenia się • v4.1</p><h1>${esc(p.short)}: od narracji do analizy</h1><p>Fikcyjny materiał ćwiczeniowy. Raport zawiera Twoje odpowiedzi i automatyczne objaśnienia zadań. Nie jest oceną jakości otwartych uzasadnień.</p><div class="metrics"><div class="metric"><b>${t.first}/6</b><span>Pierwsze odpowiedzi</span></div><div class="metric"><b>${t.final}/6</b><span>Ostatnie sprawdzone odpowiedzi</span></div></div><p>Pomoc przed pierwszą próbą: ${t.help}/6. Korekta po wyjaśnieniu jest częścią nauki. Różnica wyników nie jest samodzielnym dowodem trwałego opanowania NPF.</p><h2>Twój następny krok</h2><ul>${recommendations().map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h2>Twoja pierwsza interpretacja A</h2><p class="usertext">${esc(s.initial)}</p><h2>Twoja interpretacja po B</h2><p class="usertext">${esc(s.final)}</p><p class="notice">Te dwa teksty zapisano bez automatycznej oceny merytorycznej. Sprawdź: czy jest konkretny fragment, trafne pojęcie i granica wniosku? Tę jakość omawiacie na C5.</p></section><section class="report-sources"><h2>Materiał, na którym pracowałeś/pracowałaś</h2><h3>Narracja A • fikcyjna</h3>${p.a.split('\n\n').map(x=>`<p>${esc(x)}</p>`).join('')}<h3>Narracja B • fikcyjna</h3>${p.b.split('\n\n').map(x=>`<p>${esc(x)}</p>`).join('')}<p><b>Tło (setting):</b> „${esc(p.setting)}” wskazuje sytuację wypowiedzi. Tło może obejmować także reguły, zasoby i instytucje. Nie sprowadza się do samej nazwy miejsca.</p></section><section class="report-answers"><h2>Twoje wybory i wyjaśnienia</h2>${p.questions.map(questionLearning).join('')}</section><section class="report-transfer"><h2>Zastosuj NPF do swojego programu</h2><p class="notice">${esc(p.transfer)}</p><p>${esc(p.research)}</p>${learningParts().map(([h,t])=>`<article class="report-card"><h3>${esc(h)}</h3><p>${esc(t)}</p></article>`).join('')}<section class="report-card final-checklist"><h3>Mała karta na C5</h3><ol><li>Zapisz autentyczne źródło: autor, data, tytuł, lokalizator i fragment.</li><li>Przypisz postacie, fabułę i morał tylko tam, gdzie tekst daje podstawę. Przy każdym kodzie zapisz fragment.</li><li>Wskaż jedno inne odczytanie lub brakujący element. Uzasadnij, dlaczego wybierasz swoją interpretację.</li><li>Napisz, czego ten tekst nie dowodzi i jakie dodatkowe dane pomogłyby zbadać wpływ narracji.</li></ol><p>Na C5 porównacie interpretacje i przejdziecie do autentycznego źródła. Nie odgrywacie ponownie całej gry. Raport PDF/TXT służy nauce i rozmowie; kod NPF2 służy oddaniu indywidualnej gry przez formularz UW.</p><h3>Podstawa teoretyczna</h3><p>Jones, M.D., Smith-Walter, A., McBeth, M.K., Shanahan, E.A. (2023), The Narrative Policy Framework, w: C.M. Weible (red.), Theories of the Policy Process, wyd. 5, s. 161–195. Forma: s. 164–165; strategie: s. 166–167; minimum narracji: s. 167; jednostka analizy i obserwacji: przypis 9, s. 185. Objaśnienia są parafrazami i autorskim zastosowaniem dydaktycznym. Narracje A/B nie są cytatami z badań ani źródłami do projektu.</p></section></section></div>`;}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fresh(id){return{created:new Date().toISOString(),cursor:0,leads:[],order:Object.fromEntries(DATA[id].questions.map(q=>[q.id,shuffle([0,1,2])])),answers:{},help:{},initial:'',final:'',initialLocked:false,done:false};}
function validateDraft(data){
 const object=x=>x&&typeof x==='object'&&!Array.isArray(x),fail=()=>{throw Error('Nieprawidłowy lub niekompletny zapis wersji 4.1.');};
 if(!object(data)||!object(data.sessions)||!(data.selected===null||DATA[data.selected]))fail();const clean={selected:data.selected,sessions:{}};
 for(const[id,s]of Object.entries(data.sessions)){if(!DATA[id]||!object(s)||!Number.isInteger(s.cursor)||s.cursor<0||s.cursor>8||typeof s.done!=='boolean'||typeof s.created!=='string'||!Number.isFinite(Date.parse(s.created))||!Array.isArray(s.leads)||s.leads.length>3||new Set(s.leads).size!==s.leads.length||s.leads.some(x=>!['postacie','fabuła','rozwiązanie'].includes(x))||!object(s.answers)||!object(s.order)||!object(s.help))fail();
  for(const k of ['initial','final'])if(typeof s[k]!=='string'||s[k].length>4000)fail();
  for(const q of DATA[id].questions){const valid=n=>Number.isInteger(n)&&n>=0&&n<=2,ord=s.order[q.id];if(!Array.isArray(ord)||ord.length!==3||new Set(ord).size!==3||!ord.every(valid))fail();const a=s.answers[q.id];if(a){if(!object(a)||!Number.isInteger(a.attempts)||a.attempts<0||a.attempts>999||!(a.selected===null||valid(a.selected))||typeof a.firstHelp!=='boolean')fail();if(a.attempts>0&&(!valid(a.first)||!valid(a.last)||(a.attempts===1&&a.first!==a.last)))fail();if(a.attempts===0&&(a.first!==null||a.last!==null))fail();}}
  const required=s.cursor<=4?s.cursor-1:s.cursor<=6?4:s.cursor===7?5:6;
  if(s.cursor>0&&!s.leads.length)fail();for(let i=0;i<required;i++)if(!s.answers[DATA[id].questions[i].id]?.attempts)fail();if(typeof s.initialLocked!=='boolean'||(s.cursor>=6&&(!s.initialLocked||s.initial.trim().length<30)))fail();
  if(s.done)Receipt.validate(payloadFor(id,s));clean.sessions[id]=JSON.parse(JSON.stringify(s));
 }if(clean.selected&&!clean.sessions[clean.selected])fail();return clean;
}

mpts){a.first=a.selected;a.firstHelp=!!s.help[q.id];}a.last=a.selected;a.attempts++;save();$('#error').textContent='';$('#feedback').innerHTML=feedback(q,a);$('#next').disabled=false;$('#feedback').focus({preventScroll:true});$('#feedback').scrollIntoView({block:'nearest'});};$('#hint').onclick=()=>{helpUsed();modal('Wskazówka',`<p>${esc(q.hint)}</p><p class="small">Pomoc jest dozwolona. Nie zmienia punktacji.</p>`);};$('#term').onclick=()=>openGlossary(q.term);$('#next').onclick=()=>{if(a.attempts&&a.selected===a.last){s.cursor++;save();render();}};$('#back').onclick=()=>{s.cursor--;save();render();};return;}
 if(s.cursor===5){frame(`<h1>Raport roboczy: tylko narracja A</h1>${s.initialLocked?'<p class="notice">Ten zapis został utrwalony przed odkryciem B. Dalsze uwagi dopisz w raporcie końcowym.</p>':''}<p>Zapisz 2–3 zdania: <b>kto doświadcza problemu, kto ma pomóc i dlaczego proponowane działanie ma coś zmienić?</b> Wskaż krótki fragment jako dowód.</p><p>Po zapisaniu odkryjesz narrację B. Ten raport pozostanie do porównania — możesz później zmienić interpretację w raporcie końcowym.</p><label class="field" for="initial">Twoja interpretacja A</label><textarea id="initial" maxlength="4000" ${s.initialLocked?'readonly':''} placeholder="W narracji A… Wskazuje na to fragment…">${esc(s.initial)}</textarea><p id="error" role="alert" class="error"></p><div class="actions"><button id="back">← Wróć do tropów</button><button id="unlock" class="primary">${s.initialLocked?'Wróć do narracji B →':'Zapisz i odkryj narrację B →'}</button></div>`);$('#initial').readOnly=!!s.initialLocked;$('#initial').oninput=e=>{s.initial=e.target.value;save();};$('#unlock').onclick=()=>{if(s.initial.trim().length<30){$('#error').textContent='Zapisz interpretację z fragmentem (co najmniej 30 znaków). To kontrola wypełnienia, nie ocena jakości.';$('#initial').focus();return;}s.initialLocked=true;s.cursor=6;save();render();};$('#back').onclick=()=>{s.cursor=4;save();render();};return;}
 frame(`<h1>Co zmieniła druga opowieść?</h1><details><summary>Twój pierwszy raport o A</summary><p class="usertext">${esc(s.initial)}</p></details><p>Napisz 2–4 zdania: <b>co zmieniasz lub podtrzymujesz po lekturze B?</b> Porównaj postać, fabułę lub rozwiązanie. Wskaż fragment i jedną rzecz, której same narracje nie pozwalają ustalić.</p><label class="field" for="final">Twój raport końcowy</label><textarea id="final" maxlength="4000" placeholder="Po lekturze B… Dowodem jest… Z samych tekstów nie wynika…">${esc(s.final)}</textarea><p id="error" class="error" role="alert"></p><div class="actions"><button id="back">← Wróć do porównania</button><button id="finish" class="primary">Zamknij sprawę i przygotuj kod →</button></div><p class="small">Nie musisz zmienić zdania. Uzasadnione podtrzymanie interpretacji jest równie wartościowe. Otwarte odpowiedzi ocenia prowadzący.</p>`);$('#final').oninput=e=>{s.final=e.target.value;save();};$('#back').onclick=()=>{s.cursor=7;save();render();};$('#finish').onclick=()=>{if(s.final.trim().length<30){$('#error').textContent='Uzupełnij raport końcowy (co najmniej 30 znaków). Wskaż fragment i granicę wniosku.';$('#final').focus();return;}s.done=true;try{Receipt.validate(payloadFor(db4.selected,s));}catch(e){s.done=false;$('#error').textContent=e.message;return;}save();report();};
}
function feedback(q,a){return `<div class="feedback ${a.last===q.correct?'':'retry'}"><b>${a.last===q.correct?'Interpretacja zgodna z tekstem':'Ta interpretacja wymaga korekty'}</b><p>${esc(q.explanations[a.last])}</p><p><b>Podstawa w tekście:</b> „${esc(q.evidence)}”.</p><details><summary>Pojęcie i pozostałe interpretacje</summary><p>${esc(q.feedback)}</p>${q.options.map((o,i)=>`<p><b>${esc(o)}</b><br>${esc(q.explanations[i])}</p>`).join('')}</details><p class="small">Możesz poprawić odpowiedź albo przejść dalej. Pierwszy wybór pozostaje zapisany. Pełne objaśnienia znajdziesz w raporcie końcowym.</p></div>`;}
function score(s=cur(),p=program()){return{first:p.questions.filter(q=>s.answers[q.id]?.first===q.correct).length,final:p.questions.filter(q=>s.answers[q.id]?.last===q.correct).length,total:6,help:p.questions.filter(q=>s.answers[q.id]?.firstHelp).length};}
function payloadFor(id,s){return{schema:2,game:'4.1',key:'NPF-PROGRAM-41',mode:'individual',program:id,id:'individual-'+id+'-'+s.created,created:s.created,state:JSON.parse(JSON.stringify(s)),score:score(s,DATA[id])};}
function report(){const s=cur(),t=score();frame(`<div class="eyebrow">Sprawa zakończona • raport indywidualny</div><h1>Masz interpretację do obrony</h1><p class="lead">Teraz oddaj kod i zabierz raport na C5. Będzie punktem wyjścia do porównania interpretacji w Twoim zespole.</p><div class="metrics"><div class="metric"><b>${t.first}/6</b><span>Pierwsze odpowiedzi</span></div><div class="metric"><b>${t.final}/6</b><span>Odpowiedzi po sprawdzeniu</span></div></div><p class="small">Pomoc przed pierwszą próbą: ${t.help}/6. Punkty dotyczą interpretacji zamkniętych. Nie oceniają uzasadnień ani samodzielnego opanowania NPF.</p><div class="actions"><button class="primary" id="makeCode">Przygotuj kod do formularza UW</button><button id="print">Zapisz raport PDF / drukuj</button><button id="textReport">Pobierz raport TXT</button></div><p class="small">PDF: w oknie drukowania wybierz „Zapisz jako PDF”. Raport zawiera narracje, Twoje wybory, objaśnienia wszystkich odpowiedzi i wskazówki do projektu. Anulowanie druku nie zmienia pracy.</p><details><summary>Co warto powtórzyć?</summary><ul>${recommendations().map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details><article class="panel"><h2>Twoja interpretacja A</h2><p class="usertext">${esc(s.initial)}</p><h2>Co zmieniła narracja B?</h2><p class="usertext">${esc(s.final)}</p><button id="editFinal">Dopracuj raport końcowy</button></article><details><summary>Sprawdź swoje wybory i wróć do zadania</summary>${program().questions.map((q,i)=>{const a=s.answers[q.id];return`<p><b>${esc(q.title)}</b><br>Pierwszy wybór: ${esc(q.options[a.first])}<br>Końcowy: ${esc(q.options[a.last])}<br>Prób: ${a.attempts} <button data-review="${i}" class="plain">Wróć do zadania</button></p>`;}).join('')}</details><details><summary>Pełny raport z objaśnieniami i zastosowaniem NPF</summary>${feedbackReportHTML()}</details><div class="notice"><b>Na C5:</b> porównacie interpretacje, uzasadnicie różnice i zbadacie autentyczny fragment o programie. Nie gracie ponownie całej sprawy.</div><div class="actions"><button id="reset">Nowa rozgrywka w tym programie</button></div>`);$('#makeCode').onclick=codeDialog;$('#textReport').onclick=()=>dl('NPF_raport_'+db4.selected+'.txt',reportText());$('#editFinal').onclick=()=>{s.done=false;s.cursor=8;save();render();};document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const i=+b.dataset.review;s.done=false;s.cursor=i<4?i+1:i+2;save();render();});$('#print').onclick=printReport;$('#reset').onclick=()=>{if(confirm('Rozpocząć od nowa tylko ten program? Najpierw pobierz JSON lub raport, jeśli chcesz zachować bieżącą rozgrywkę.')){db4.sessions[db4.selected]=fresh(db4.selected);save();render();}};}
async function codeDialog(){try{const p=payloadFor(db4.selected,cur()),code=await Receipt.encode(p);modal('Oddaj indywidualną rozgrywkę',`<p><b>${esc(program().short)}</b> • pierwszy wynik ${p.score.first}/6, końcowy ${p.score.final}/6.</p><ol><li>Skopiuj cały kod.</li><li>Otwórz formularz i zaloguj się na konto UW.</li><li>Wklej kod, podaj numer zespołu i jedno pytanie lub trudność na C5. Prześlij formularz do poniedziałku, godz. 15:00.</li></ol><label class="field" for="code">Kod ukończenia (${code.length} znaków)</label><textarea id="code" class="code" readonly spellcheck="false"></textarea><div class="actions"><button id="copy" class="primary">Kopiuj kod</button><button id="codeTXT">Pobierz kod TXT</button><a class="button" href="${FORM}" target="_blank" rel="noopener noreferrer">Formularz UW ↗</a></div><p id="copyStatus" role="status">Samo wygenerowanie kodu nie wysyła pracy.</p><details><summary>Co zawiera kod?</summary><p>Twój program, wybory, próby, pomoc i oba otwarte raporty. Nie wpisuj danych osobowych do raportów. Kod nie zawiera automatycznie e-maila; zbierze go formularz. Kodowanie nie jest szyfrowaniem ani dowodem samodzielności.</p></details>`);$('#code').value=code;$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);$('#copyStatus').textContent='Skopiowano. Wklej kod do formularza i prześlij odpowiedź.';}catch{$('#code').focus();$('#code').select();$('#copyStatus').textContent='Kod zaznaczony. Skopiuj ręcznie: Ctrl+C / ⌘C albo menu telefonu.';}};$('#codeTXT').onclick=()=>dl('NPF_kod_'+db4.selected+'.txt',code);}catch(e){modal('Nie można przygotować kodu',`<p>${esc(e.message)}</p><p>Pobierz JSON i zachowaj swoją pracę.</p>`);}}
function openGlossary(target=''){helpUsed();const context=db4.selected||'SCT';modal('Pojęcia NPF',`<p>Wybierz tylko potrzebne pojęcie. Definicję możesz rozwinąć o przykład ze swojego programu.</p><div class="gloss-controls"><label>Znajdź pojęcie<input id="gSearch" type="search" placeholder="Np. postacie, fabuła, morał"></label><label>Program przykładu<select id="gContext">${Object.entries(DATA).map(([id,p])=>`<option value="${id}" ${id===context?'selected':''}>${esc(p.short)}</option>`).join('')}</select></label></div><p id="gCount" role="status"></p><div id="gEntries"></div>`);const entries=()=>{$('#gEntries').innerHTML=GLOSSARY.map(t=>`<details class="gterm" data-term="${t.id}" ${t.id===target?'open':''}><summary>${esc(t.title)}<small>${esc(t.english)}</small></summary><p>${esc(t.definition)}</p><p class="notice">${esc(t.caution)}</p>${t.detail?`<details><summary>Więcej o pojęciu</summary><p>${esc(t.detail)}</p></details>`:''}<details class="gexample"><summary>Przykład w programie</summary><p>${esc(EXAMPLES[$('#gContext').value][t.id])}</p><p class="small">Przykład fikcyjny, nie opis danych o programie.</p></details><p class="small">${t.kind==='NPF'?`Jones i in. (2023), s. ${esc(t.pages)}; parafraza.`:'Autorska pomoc metodyczna, nie definicja NPF.'}</p></details>`).join('');filter();};const norm=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');const filter=()=>{const term=norm($('#gSearch').value);let n=0;document.querySelectorAll('.gterm').forEach(el=>{const t=GLOSSARY.find(x=>x.id===el.dataset.term);el.hidden=!norm(t.title+' '+t.english+' '+t.definition+' '+t.caution).includes(term);if(!el.hidden)n++;});$('#gCount').textContent=n?`Widoczne pojęcia: ${n}.`:'Brak wyników. Spróbuj krótszej nazwy.';};$('#gSearch').oninput=filter;$('#gContext').onchange=()=>{const open=[...document.querySelectorAll('.gterm[open]')].map(e=>e.dataset.term);entries();for(const id of open)$(`[data-term="${id}"]`).open=true;};entries();if(target)$(`[data-term="${target}"]`).scrollIntoView({block:'nearest'});}
$('#home').onclick=home;$('#glossary').onclick=()=>openGlossary();$('#guide').onclick=()=>modal('Jak prowadzić śledztwo',`<p>Wybierz własny program. Pracujesz indywidualnie, bez limitu czasu i bez rywalizacji.</p><ol><li>Przeczytaj narrację A i wybierz trop czytania.</li><li>Zbadaj postacie, fabułę i rozwiązanie w czterech zadaniach. Możesz poprawiać odpowiedzi po wyjaśnieniu.</li><li>Zapisz pierwszą interpretację, aby odkryć narrację B.</li><li>Porównaj opowieści i wskaż granice wniosku.</li><li>Uzasadnij zmianę lub podtrzymanie interpretacji. Oddaj swój kod w formularzu UW.</li></ol><p>Pomoc jest dozwolona. Wynik pierwszych prób pozostaje zapisany. Krótkie raporty ocenia prowadzący; minimalna długość nie oznacza poprawności.</p><p>Całość: orientacyjnie 20–25 minut. Pobierz JSON, jeśli chcesz przenieść pracę do innej przeglądarki. Kody starszej gry odczytuje dekoder prowadzącego, ale stare zapisy postępu nie są nowymi rozgrywkami.</p>`);
$('#sources').onclick=()=>modal('Źródło teorii i status materiału',`<p>Jones, M.D., Smith-Walter, A., McBeth, M.K., Shanahan, E.A. (2023), „The Narrative Policy Framework”, w: C.M. Weible (red.), <i>Theories of the Policy Process</i>, wyd. 5, s. 161–195. <a href="https://doi.org/10.4324/9781003308201-7" target="_blank" rel="noopener noreferrer">Rozdział źródłowy</a>.</p><p>Postacie i tło: s. 164; fabuła i morał: s. 165; minimum narracji: s. 167. Fabuła nie jest ograniczona do schematu przyczynowego — tu ćwiczymy jeden jej aspekt.</p><p>Wszystkie narracje i przykłady są fikcyjnym materiałem dydaktycznym opracowanym z pomocą AI. Nie przypisujemy ich rzeczywistym aktorom. Nazwy programów służą dopasowaniu ćwiczenia do projektów.</p>${db4.selected?`<p class="notice">${esc(program().warning)}</p>`:''}<p>Przejście od tekstu do twierdzenia o wpływie wymaga innych danych. Otwarte uzasadnienia wymagają oceny człowieka.</p>`);
$('#c5').onclick=()=>modal('C5: kontynuacja Twojej analizy',`<p><b>Przed C5:</b> ukończ indywidualną grę we własnym programie. Oddaj kod do poniedziałku, godz. 15:00, i zachowaj raport.</p><p><b>Na C5 — 90 minut:</b></p><ol><li>0–15: wspólne omówienie dwóch trudności widocznych w odpowiedziach.</li><li>15–35: w zespołach porównajcie interpretacje A/B. Wskażcie jedną różnicę i uzasadnijcie ją fragmentem.</li><li>35–75: zastosujcie postacie, fabułę i morał do autentycznego fragmentu o swoim programie; najpierw każdy koduje sam, potem porównujecie.</li><li>75–90: przedstawcie kod z dowodem oraz granicę wniosku. Zachowajcie wspólną kartę do projektu.</li></ol><p>Nie gracie od nowa całego śledztwa. Wykład jest osobnym spotkaniem. Kod gry nie zawiera późniejszej analizy autentycznego źródła.</p>`);
$('#importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>2000000)throw Error('Plik przekracza 2 MB.');const raw=JSON.parse(await f.text());if(raw.application!=='NPF-PROGRAM-41')throw Error('To nie jest zapis postępu wersji 4.1. Zachowaj starszy plik; nie zamieniamy dawnych wyników w nowe rozgrywki.');const candidate=validateDraft(raw.data);if(Object.keys(db4.sessions).length&&!confirm('Zastąpić lokalny postęp wersji 4.1? Pobierz wcześniej JSON, jeśli chcesz go zachować.'))return;db4=candidate;save();home();}catch(e){modal('Nie wczytano zapisu',`<p>${esc(e.message)}</p><p>Dotychczasowy postęp pozostaje bez zmian.</p>`);}finally{e.target.value='';}};
window.onbeforeprint=()=>{$('#printReport').innerHTML=cur()?.done?feedbackReportHTML():'<p>Rozgrywka nie jest ukończona. Zachowaj JSON, aby kontynuować.</p>';};
home();
</script></body></html>
