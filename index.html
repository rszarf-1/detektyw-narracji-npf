ikcyjny: W krótkim streszczeniu debaty o programie poprawy efektywności energetycznej domów zapisano, że omawiano problem określony jako „wysokie koszty utrzymania odpowiedniej temperatury w domu”. Chcesz sprawdzić tezę, że narrator wprost obwinił konkretną instytucję, lecz nie masz pełnej wypowiedzi. Streszczenie tego nie rozstrzyga: trzeba odnaleźć oryginał. Brak informacji o obwinianiu w streszczeniu nie dowodzi, że nie było go w wypowiedzi."},"SOLO":{"narrative":"Przykład fikcyjny: W wypowiedzi o programie wydłużenia godzin pracy biblioteki wskazano, że szkody doświadczają osoby pracujące do późna, które nie mogą korzystać z biblioteki. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.","form":"Przykład fikcyjny: Opowieść o programie wydłużenia godzin pracy biblioteki: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Wieczorne otwarcie ma umożliwić osobom pracującym wypożyczanie książek” łączy działanie ze zmianą sytuacji (fabuła). „Otwórzmy bibliotekę w dodatkowy wieczór” wskazuje postulowane działanie (morał). Te cztery kody opisują budowę wypowiedzi.","characters":"Przykład fikcyjny: Ofiara: osoby pracujące do późna, które nie mogą korzystać z biblioteki — w opowieści to grupa narażona na szkodę. Bohater: zespół biblioteki — jeśli tekst właśnie tej postaci przypisuje możliwość pomocy. Antagonistę można rozpoznać w osobnej wypowiedzi: „Zarządca A celowo blokuje dostęp do wejścia i uniemożliwia czytelnikom korzystanie z biblioteki”. To odczytanie ról w wymyślonych tekstach, nie ocena rzeczywistych podmiotów.","setting":"Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o programie wydłużenia godzin pracy biblioteki”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.","plot":"Przykład fikcyjny: „Czytelnicy poprosili o dostęp do książek po pracy. Zespół biblioteki zaproponował dodatkowy wieczór; pracownicy zażądali ustalenia obsady, zanim zostaną zmienione godziny otwarcia.” Fabuła łączy tu działania postaci w sekwencję: zgłoszenie trudności, propozycja pomocy i żądanie jej zmiany. Pokazuje również relację między uczestnikami sporu. Samo hasło „utrudniony dostęp do książek po pracy” nazywa trudność, ale nie odtwarza tej fabuły.","moral":"Przykład fikcyjny: „Otwórzmy bibliotekę w dodatkowy wieczór” jest postulatem działania. Wypowiedź mogłaby też zakończyć się szerszą lekcją „Wspólne instytucje powinny pomagać osobom, które same nie mogą usunąć tej bariery”. Morał nie musi być gotowym projektem przepisu ani tym, z czym zgadza się czytelnik.","narrator":"Przykład fikcyjny: O programie wydłużenia godzin pracy biblioteki wypowiada się fikcyjny klub czytelników — to narrator. W tej opowieści rolę proponowanego bohatera pełni postać określona jako „zespół biblioteki”. Adresatami mogą być radni albo mieszkańcy. Jeśli gazetowy artykuł cytuje tę wypowiedź, odróżnij narrację cytowanej grupy od komentarza dziennikarza.","content":"Przykład fikcyjny: W zdaniu „Usługi kultury powinny być dostępne także osobom pracującym wieczorami” można rozpoznać wyrażone przekonanie normatywne. Użycie tego przekonania do przedstawienia sprawy jako ważnej dla wielu grup może służyć strategii narracyjnej. Nie przypisuj jednak autorowi całej ideologii na podstawie jednego zdania; potrzebujesz reguły kodowania i podstawy teoretycznej.","scope":"Przykład fikcyjny: W debacie o programie wydłużenia godzin pracy biblioteki ktoś mówi: „Skutki tego rozwiązania obciążają rodziny, pracowników i seniorów w całym regionie, a korzyści zbiera kilka podmiotów”. Taki układ kosztów i korzyści przedstawia problem jako dotyczący wielu grup i może służyć rozszerzaniu konfliktu także bez dosłownego zaproszenia do debaty. „To tylko techniczna sprawa wąskiego grona, pozostawmy ją dotychczasowym uczestnikom” wskazuje przeciwny kierunek. Nie wynika z tego, czy skład uczestników rzeczywiście się zmienił.","causal":"Przykład fikcyjny: Wypowiedź „Zarządca A celowo blokuje dostęp do wejścia i uniemożliwia czytelnikom korzystanie z biblioteki” przypisuje odpowiedzialność za szkodę celowemu działaniu postaci. To przykład przyczynowości konstruowanej wewnątrz narracji o programie wydłużenia godzin pracy biblioteki. Nie jest to dowód, że wypowiedź zmieniła opinię odbiorcy, ani ustalenie, że opisane zachowanie rzeczywiście miało miejsce.","das":"Przykład fikcyjny: W zbiorze tekstów o programie wydłużenia godzin pracy biblioteki porównujesz udział przedstawień bohaterów, antagonistów i ofiar. Dominujące eksponowanie zdolności pomocy postaci określonej jako „zespół biblioteki” może wskazywać angel shift; dominujące obwinianie przeciwników — devil shift, a akcentowanie krzywdy ofiar — solidarity shift. Najpierw ustal jednostkę i sposób porównania. Pojedyncza wzmianka o roli nie rozstrzyga, która strategia dominuje.","mechanisms":"Przykład fikcyjny: Po lekturze opowieści o programie wydłużenia godzin pracy biblioteki czytelniczka odczuwa sympatię do proponowanego bohatera i zaczyna popierać jego rozwiązanie — to możliwy ślad toru prowadzącego przez afekt do perswazji. Inny czytelnik już popierał rozwiązanie, lecz teraz uznaje sprawę za pilną i wysyła pytanie do urzędu — to możliwy ślad uwagi i mobilizacji. Samo następstwo nie potwierdza wpływu narracji. Do odróżnienia perswazji od manipulacji nie wystarczy też ocena, że proponowane rozwiązanie jest politycznie niesłuszne.","learning":"Przykład fikcyjny: W dyskusji o programie wydłużenia godzin pracy biblioteki nowe dane o zasięgu problemu prowadzą do trwałej zmiany preferencji: to przykład tradycyjnego uczenia. Przy tych samych danych uczestnicy mogą przyjąć nową opowieść, która w roli ofiary eksponuje inną grupę, określoną jako „opiekunowie małych dzieci”. Jeśli ta zmiana zostaje przyjęta i utrzymuje się, ilustruje narracyjne uczenie. Jedna deklaracja tuż po lekturze nie potwierdza trwałości.","levels":"Przykład fikcyjny: Mikro: badasz reakcję osoby na opowieść o programie wydłużenia godzin pracy biblioteki. Mezo: badasz używanie narracji przez grupy w sporze. Makro: rozważasz szerszą opowieść „Ludzie wykluczeni z obiegu wiedzy tracą wpływ na wspólne sprawy; instytucje otwierające dostęp do wiedzy wzmacniają ich samodzielność, dlatego usługi kultury i edukacji powinny być powszechnie dostępne.” i sprawdzasz, czy utrwala się przez lata w kulturze lub instytucjach oraz organizuje różne debaty polityczne. Sama wartość lub pojedynczy postulat nie wystarcza do rozpoznania takiej makronarracji.","evidence":"Przykład fikcyjny: Teza: wypowiedź o programie wydłużenia godzin pracy biblioteki zawiera jawny postulat działania. Fragment „Otwórzmy bibliotekę w dodatkowy wieczór” wspiera tę tezę. Metryka podająca jedynie datę publikacji nie rozstrzyga jej, ale nie odbiera znaczenia pierwszemu fragmentowi. Status tezy dotyczy całego zebranego materiału, a relacja — każdego fragmentu ocenianego z osobna.","uncertainty":"Przykład fikcyjny: W krótkim streszczeniu debaty o programie wydłużenia godzin pracy biblioteki zapisano, że omawiano problem określony jako „utrudniony dostęp do książek po pracy”. Chcesz sprawdzić tezę, że narrator wprost obwinił konkretną instytucję, lecz nie masz pełnej wypowiedzi. Streszczenie tego nie rozstrzyga: trzeba odnaleźć oryginał. Brak informacji o obwinianiu w streszczeniu nie dowodzi, że nie było go w wypowiedzi."}};

function frame(body){const s=cur(),stage=s.cursor<=4?0:s.cursor===5?1:s.cursor<=7?2:3;draw(`<div class="eyebrow">Akta ${esc(db4.selected)} • ${esc(program().short)}</div><div class="progress" aria-label="Etapy śledztwa">${['Rozpoznaj A','Zapisz interpretację','Otwórz B','Oddaj raport'].map((x,i)=>`<span class="${i===stage?'active':i<stage?'past':''}" ${i===stage?'aria-current="step"':''}>${i+1}. ${x}</span>`).join('')}</div><div class="layout"><section>${body}</section><aside class="aside"><h2>Teczka podręczna</h2><details><summary>Czytaj narrację A</summary>${story('A')}</details>${s.cursor>=6?`<details><summary>Czytaj narrację B</summary>${story('B')}</details>`:''}<div class="actions"><button id="saveProgress">Pobierz JSON</button></div><p class="small" id="saveStatus">${storageOK?'Postęp zapisuje się w tej przeglądarce.':'Brak zapisu lokalnego — pobierz JSON.'}</p><p class="small">Możesz korzystać z pojęć i podpowiedzi. Nie tracisz za to punktów. Zapisujemy pomoc przed pierwszą próbą.</p></aside></div>`);$('#saveProgress').onclick=exportSave;}
function render(){if(cur().done)return report();const s=cur(),p=program();
 if(s.cursor===0){frame(`<h1>Otwórz pierwszą teczkę</h1><p>Twoja misja: wyjaśnić, jak zbudowano opowieść o programie <b>${esc(p.short)}</b>, i sprawdzić, co zmienia druga narracja.</p><div class="notice">Teksty są fikcyjne. Analizujesz sposób opowiadania, nie oceniasz skuteczności programu.</div><article class="panel"><h2>Narracja A</h2>${story('A')}</article><details><summary>Przykład kodowania: tło opowieści</summary><p>„${esc(p.setting)}” wskazuje kontekst tej wypowiedzi. To element <b>tła</b>. Sam opis tła nie mówi jeszcze, kto ma rozwiązać problem.</p></details><h2>Od jakiego tropu zaczniesz?</h2><p>Wybierz co najmniej jeden trop i zobacz wskazówkę. To wybór sposobu czytania, bez punktów.</p><div class="actions">${['postacie','fabuła','rozwiązanie'].map(x=>`<button class="leadchoice" data-lead="${x}" aria-pressed="${s.leads.includes(x)}">${x}</button>`).join('')}</div><p id="leadHint" role="status"></p><div class="actions"><button id="begin" class="primary" ${s.leads.length?'':'disabled'}>Rozpocznij badanie A →</button></div>`);const tips={postacie:'Kto doświadcza trudności, a kto ma przynieść pomoc? Nie dopisuj złoczyńcy, jeśli tekst go nie wskazuje.',fabuła:'Jak opowieść łączy problem, działania i następstwa? Zwróć uwagę na kierunek zależności.',rozwiązanie:'Jakie działanie narrator przedstawia jako potrzebne? Oddziel postulat od obietnicy rezultatu.'};document.querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>{const x=b.dataset.lead;if(!s.leads.includes(x))s.leads.push(x);b.setAttribute('aria-pressed','true');$('#leadHint').textContent=tips[x];$('#begin').disabled=false;save();});$('#begin').onclick=()=>{s.cursor=1;save();render();};return;}
 const q=qNow();if(q){const a=s.answers[q.id]||(s.answers[q.id]={selected:null,first:null,last:null,attempts:0,firstHelp:false});frame(`<div class="eyebrow">${s.cursor<=4?'Narracja A • trop '+s.cursor+' z 4':'Porównanie A i B • '+(s.cursor-5)+' z 2'}</div><h1>${esc(q.title)}</h1>${s.cursor===6?`<article class="panel"><h2>Nowa perspektywa: narracja B</h2>${story('B')}</article>`:''}${q.excerpt?`<blockquote>${esc(q.excerpt)}</blockquote>`:''}<fieldset><legend>${esc(q.prompt)}</legend>${s.order[q.id].map(i=>`<label class="option"><input type="radio" name="answer" value="${i}" ${a.selected===i?'checked':''}><span>${esc(q.options[i])}</span></label>`).join('')}</fieldset><p id="error" class="error" role="alert"></p><div class="actions"><button id="check" class="primary">Sprawdź interpretację</button><button id="hint">Wskazówka</button><button id="term">Wyjaśnij pojęcie</button></div><div id="feedback" role="status">${a.attempts?feedback(q,a):''}</div><div class="actions"><button id="back">← Wstecz</button><button id="next" ${a.attempts&&a.selected===a.last?'':'disabled'}>Dalej →</button></div>`);document.querySelectorAll('[name=answer]').forEach(e=>e.onchange=()=>{a.selected=+e.value;$('#next').disabled=!(a.attempts&&a.selected===a.last);save();});$('#check').onclick=()=>{if(a.selected===null){$('#error').textContent='Wybierz jedną interpretację przed sprawdzeniem.';document.querySelector('[name=answer]').focus();return;}if(a.attempts>=999){$('#error').textContent='Osiągnięto limit prób.';return;}if(!a.attempts){a.first=a.selected;a.firstHelp=!!s.help[q.id];}a.last=a.selected;a.attempts++;save();$('#error').textContent='';$('#feedback').innerHTML=feedback(q,a);$('#next').disabled=false;};$('#hint').onclick=()=>{helpUsed();modal('Wskazówka',`<p>${esc(q.hint)}</p><p class="small">Pomoc jest dozwolona. Nie zmienia punktacji.</p>`);};$('#term').onclick=()=>openGlossary(q.term);$('#next').onclick=()=>{if(a.attempts&&a.selected===a.last){s.cursor++;save();render();}};$('#back').onclick=()=>{s.cursor--;save();render();};return;}
 if(s.cursor===5){frame(`<h1>Raport roboczy: tylko narracja A</h1><p>Zapisz 2–3 zdania: <b>kto doświadcza problemu, kto ma pomóc i dlaczego proponowane działanie ma coś zmienić?</b> Wskaż krótki fragment jako dowód.</p><p>Po zapisaniu odkryjesz narrację B. Ten raport pozostanie do porównania — możesz później zmienić interpretację w raporcie końcowym.</p><label class="field" for="initial">Twoja interpretacja A</label><textarea id="initial" maxlength="4000" ${s.initialLocked?'readonly':''} placeholder="W narracji A… Wskazuje na to fragment…">${esc(s.initial)}</textarea><p id="error" role="alert" class="error"></p><div class="actions"><button id="back">← Wróć do tropów</button><button id="unlock" class="primary">Zapisz i odkryj narrację B →</button></div>`);$('#initial').readOnly=!!s.initialLocked;$('#initial').oninput=e=>{s.initial=e.target.value;save();};$('#unlock').onclick=()=>{if(s.initial.trim().length<30){$('#error').textContent='Zapisz interpretację z fragmentem (co najmniej 30 znaków). To kontrola wypełnienia, nie ocena jakości.';$('#initial').focus();return;}s.initialLocked=true;s.cursor=6;save();render();};$('#back').onclick=()=>{s.cursor=4;save();render();};return;}
 frame(`<h1>Co zmieniła druga opowieść?</h1><details><summary>Twój pierwszy raport o A</summary><p class="usertext">${esc(s.initial)}</p></details><p>Napisz 2–4 zdania: <b>co zmieniasz lub podtrzymujesz po lekturze B?</b> Porównaj postać, fabułę lub rozwiązanie. Wskaż fragment i jedną rzecz, której same narracje nie pozwalają ustalić.</p><label class="field" for="final">Twój raport końcowy</label><textarea id="final" maxlength="4000" placeholder="Po lekturze B… Dowodem jest… Z samych tekstów nie wynika…">${esc(s.final)}</textarea><p id="error" class="error" role="alert"></p><div class="actions"><button id="back">← Wróć do porównania</button><button id="finish" class="primary">Zamknij sprawę i przygotuj kod →</button></div><p class="small">Nie musisz zmienić zdania. Uzasadnione podtrzymanie interpretacji jest równie wartościowe. Otwarte odpowiedzi ocenia prowadzący.</p>`);$('#final').oninput=e=>{s.final=e.target.value;save();};$('#back').onclick=()=>{s.cursor=7;save();render();};$('#finish').onclick=()=>{if(s.final.trim().length<30){$('#error').textContent='Uzupełnij raport końcowy (co najmniej 30 znaków). Wskaż fragment i granicę wniosku.';$('#final').focus();return;}s.done=true;try{Receipt.validate(payloadFor(db4.selected,s));}catch(e){s.done=false;$('#error').textContent=e.message;return;}save();report();};

function feedback(q,a){return `<div class="feedback ${a.last===q.correct?'':'retry'}"><b>${a.last===q.correct?'Interpretacja zgodna z fragmentem':'Sprawdź podstawę interpretacji'}</b><p>${esc(q.feedback)}</p><p class="small">Możesz poprawić odpowiedź albo przejść dalej. Pierwszy wybór pozostaje zapisany.</p></div>`;}
function score(s=cur(),p=program()){return{first:p.questions.filter(q=>s.answers[q.id]?.first===q.correct).length,final:p.questions.filter(q=>s.answers[q.id]?.last===q.correct).length,total:6,help:p.questions.filter(q=>s.answers[q.id]?.firstHelp).length};}

function report(){const s=cur(),t=score();frame(`<div class="eyebrow">Sprawa zakończona • raport indywidualny</div><h1>Masz interpretację do obrony</h1><p class="lead">Teraz oddaj kod i zabierz raport na C5. Będzie punktem wyjścia do porównania interpretacji w Twoim zespole.</p><div class="metrics"><div class="metric"><b>${t.first}/6</b><span>Pierwsze odpowiedzi</span></div><div class="metric"><b>${t.final}/6</b><span>Odpowiedzi po sprawdzeniu</span></div></div><p class="small">Pomoc przed pierwszą próbą: ${t.help}/6. Punkty dotyczą interpretacji zamkniętych. Nie oceniają uzasadnień ani samodzielnego opanowania NPF.</p><div class="actions"><button class="primary" id="makeCode">Przygotuj kod do formularza UW</button><button id="textReport">Pobierz raport TXT</button></div><article class="panel"><h2>Twoja interpretacja A</h2><p class="usertext">${esc(s.initial)}</p><h2>Co zmieniła narracja B?</h2><p class="usertext">${esc(s.final)}</p><button id="editFinal">Dopracuj raport końcowy</button></article><details><summary>Sprawdź swoje wybory i wróć do zadania</summary>${program().questions.map((q,i)=>{const a=s.answers[q.id];return`<p><b>${esc(q.title)}</b><br>Pierwszy wybór: ${esc(q.options[a.first])}<br>Końcowy: ${esc(q.options[a.last])}<br>Prób: ${a.attempts} <button data-review="${i}" class="plain">Wróć do zadania</button></p>`;}).join('')}</details><div class="notice"><b>Na C5:</b> porównacie interpretacje, uzasadnicie różnice i zbadacie autentyczny fragment o programie. Nie gracie ponownie całej sprawy.</div><div class="actions"><button id="print">Drukuj / PDF</button><button id="reset">Nowa rozgrywka w tym programie</button></div>`);$('#makeCode').onclick=codeDialog;$('#textReport').onclick=()=>dl('NPF_raport_'+db4.selected+'.txt',reportText());$('#editFinal').onclick=()=>{s.done=false;s.cursor=8;save();render();};document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const i=+b.dataset.review;s.done=false;s.cursor=i<4?i+1:i+2;save();render();});$('#print').onclick=()=>window.print();$('#reset').onclick=()=>{if(confirm('Rozpocząć od nowa tylko ten program? Najpierw pobierz JSON lub raport, jeśli chcesz zachować bieżącą rozgrywkę.')){db4.sessions[db4.selected]=fresh(db4.selected);save();render();}};}
async function codeDialog(){try{const p=payloadFor(db4.selected,cur()),code=await Receipt.encode(p);modal('Oddaj indywidualną rozgrywkę',`<p><b>${esc(program().short)}</b> • pierwszy wynik ${p.score.first}/6, końcowy ${p.score.final}/6.</p><ol><li>Skopiuj cały kod.</li><li>Otwórz formularz i zaloguj się na konto UW.</li><li>Wklej kod, podaj numer zespołu i własną refleksję. Prześlij formularz do poniedziałku, godz. 15:00.</li></ol><label class="field" for="code">Kod ukończenia (${code.length} znaków)</label><textarea id="code" class="code" readonly spellcheck="false"></textarea><div class="actions"><button id="copy" class="primary">Kopiuj kod</button><button id="codeTXT">Pobierz kod TXT</button><a class="button" href="${FORM}" target="_blank" rel="noopener noreferrer">Formularz UW ↗</a></div><p id="copyStatus" role="status">Samo wygenerowanie kodu nie wysyła pracy.</p><details><summary>Co zawiera kod?</summary><p>Twój program, wybory, próby, pomoc i oba otwarte raporty. Nie wpisuj danych osobowych do raportów. Kod nie zawiera automatycznie e-maila; zbierze go formularz. Kodowanie nie jest szyfrowaniem ani dowodem samodzielności.</p></details>`);$('#code').value=code;$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);$('#copyStatus').textContent='Skopiowano. Wklej kod do formularza i prześlij odpowiedź.';}catch{$('#code').focus();$('#code').select();$('#copyStatus').textContent='Kod zaznaczony. Skopiuj ręcznie: Ctrl+C / ⌘C albo menu telefonu.';}};$('#codeTXT').onclick=()=>dl('NPF_kod_'+db4.selected+'.txt',code);}catch(e){modal('Nie można przygotować kodu',`<p>${esc(e.message)}</p><p>Pobierz JSON i zachowaj swoją pracę.</p>`);}}
function openGlossary(target=''){helpUsed();const context=db4.selected||'SCT';modal('Pojęcia NPF',`<p>Wybierz tylko potrzebne pojęcie. Definicję możesz rozwinąć o przykład ze swojego programu.</p><div class="gloss-controls"><label>Znajdź pojęcie<input id="gSearch" type="search" placeholder="Np. postacie, fabuła, morał"></label><label>Program przykładu<select id="gContext">${Object.entries(DATA).map(([id,p])=>`<option value="${id}" ${id===context?'selected':''}>${esc(p.short)}</option>`).join('')}</select></label></div><p id="gCount" role="status"></p><div id="gEntries"></div>`);const entries=()=>{$('#gEntries').innerHTML=GLOSSARY.map(t=>`<details class="gterm" data-term="${t.id}" ${t.id===target?'open':''}><summary>${esc(t.title)}<small>${esc(t.english)}</small></summary><p>${esc(t.definition)}</p><p class="notice">${esc(t.caution)}</p>${t.detail?`<details><summary>Więcej o pojęciu</summary><p>${esc(t.detail)}</p></details>`:''}<details class="gexample"><summary>Przykład w programie</summary><p>${esc(EXAMPLES[$('#gContext').value][t.id])}</p><p class="small">Przykład fikcyjny, nie opis danych o programie.</p></details><p class="small">${t.kind==='NPF'?`Jones i in. (2023), s. ${esc(t.pages)}; parafraza.`:'Autorska pomoc metodyczna, nie definicja NPF.'}</p></details>`).join('');filter();};const norm=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');const filter=()=>{const term=norm($('#gSearch').value);let n=0;document.querySelectorAll('.gterm').forEach(el=>{const t=GLOSSARY.find(x=>x.id===el.dataset.term);el.hidden=!norm(t.title+' '+t.english+' '+t.definition+' '+t.caution).includes(term);if(!el.hidden)n++;});$('#gCount').textContent=n?`Widoczne pojęcia: ${n}.`:'Brak wyników. Spróbuj krótszej nazwy.';};$('#gSearch').oninput=filter;$('#gContext').onchange=()=>{const open=[...document.querySelectorAll('.gterm[open]')].map(e=>e.dataset.term);entries();for(const id of open)$(`[data-term="${id}"]`).open=true;};entries();if(target)$(`[data-term="${target}"]`).scrollIntoView({block:'nearest'});}
$('#home').onclick=home;$('#glossary').onclick=()=>openGlossary();$('#guide').onclick=()=>modal('Jak prowadzić śledztwo',`<p>Wybierz własny program. Pracujesz indywidualnie, bez limitu czasu i bez rywalizacji.</p><ol><li>Przeczytaj narrację A i wybierz trop czytania.</li><li>Zbadaj postacie, fabułę i rozwiązanie w czterech zadaniach. Możesz poprawiać odpowiedzi po wyjaśnieniu.</li><li>Zapisz pierwszą interpretację, aby odkryć narrację B.</li><li>Porównaj opowieści i wskaż granice wniosku.</li><li>Uzasadnij zmianę lub podtrzymanie interpretacji. Oddaj swój kod w formularzu UW.</li></ol><p>Pomoc jest dozwolona. Wynik pierwszych prób pozostaje zapisany. Krótkie raporty ocenia prowadzący; minimalna długość nie oznacza poprawności.</p><p>Całość: orientacyjnie 15–20 minut. Pobierz JSON, jeśli chcesz przenieść pracę do innej przeglądarki. Kody starszej gry odczytuje dekoder prowadzącego, ale stare zapisy postępu nie są nowymi rozgrywkami.</p>`);
$('#sources').onclick=()=>modal('Źródło teorii i status materiału',`<p>Jones, M.D., Smith-Walter, A., McBeth, M.K., Shanahan, E.A. (2023), „The Narrative Policy Framework”, w: C.M. Weible (red.), <i>Theories of the Policy Process</i>, wyd. 5, s. 161–195. <a href="https://doi.org/10.4324/9781003308201-7" target="_blank" rel="noopener noreferrer">Rozdział źródłowy</a>.</p><p>Postacie i tło: s. 164; fabuła i morał: s. 165; minimum narracji: s. 167. Fabuła nie jest ograniczona do schematu przyczynowego — tu ćwiczymy jeden jej aspekt.</p><p>Wszystkie narracje i przykłady są fikcyjnym materiałem dydaktycznym opracowanym z pomocą AI. Nie przypisujemy ich rzeczywistym aktorom. Nazwy programów służą dopasowaniu ćwiczenia do projektów.</p>${db4.selected?`<p class="notice">${esc(program().warning)}</p>`:''}<p>Przejście od tekstu do twierdzenia o wpływie wymaga innych danych. Otwarte uzasadnienia wymagają oceny człowieka.</p>`);
$('#c5').onclick=()=>modal('C5: kontynuacja Twojej analizy',`<p><b>Przed C5:</b> ukończ indywidualną grę we własnym programie. Oddaj kod do poniedziałku, godz. 15:00, i zachowaj raport.</p><p><b>Na C5 — 90 minut:</b></p><ol><li>0–15: wspólne omówienie dwóch trudności widocznych w odpowiedziach.</li><li>15–35: w zespołach porównajcie interpretacje A/B. Wskażcie jedną różnicę i uzasadnijcie ją fragmentem.</li><li>35–75: zastosujcie postacie, fabułę i morał do autentycznego fragmentu o swoim programie; najpierw każdy koduje sam, potem porównujecie.</li><li>75–90: przedstawcie kod z dowodem oraz granicę wniosku. Zachowajcie wspólną kartę do projektu.</li></ol><p>Nie gracie od nowa całego śledztwa. Wykład jest osobnym spotkaniem. Kod gry nie zawiera późniejszej analizy autentycznego źródła.</p>`);
$('#importFile').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>2000000)throw Error('Plik przekracza 2 MB.');const raw=JSON.parse(await f.text());if(raw.application!=='NPF-PROGRAM-4')throw Error('To nie jest zapis postępu wersji 4. Zachowaj starszy plik; nie zamieniamy dawnych wyników w nowe rozgrywki.');const candidate=validateDraft(raw.data);if(Object.keys(db4.sessions).length&&!confirm('Zastąpić lokalny postęp wersji 4? Pobierz wcześniej JSON, jeśli chcesz go zachować.'))return;db4=candidate;save();home();}catch(e){modal('Nie wczytano zapisu',`<p>${esc(e.message)}</p><p>Dotychczasowy postęp pozostaje bez zmian.</p>`);}finally{e.target.value='';}};
window.onbeforeprint=()=>{$('#printReport').innerHTML=cur()?.done?`<h1>Detektyw narracji • ${esc(program().short)}</h1><pre class="usertext">${esc(reportText())}</pre>`:'<p>Rozgrywka nie jest ukończona. Zachowaj JSON, aby kontynuować.</p>';};
home();
</script></body></html>
