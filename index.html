splay:grid;grid-template-columns:1fr 1fr;gap:15px;padding:25px;background:var(--ink);border-radius:14px;color:white}.board-art span{padding:18px;border:1px solid #73918e;border-radius:6px;line-height:1.4}.board-art b{display:block;color:#b6dbcb;font-size:27px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px}.aside{position:sticky;top:20px;align-self:start}.progress{display:flex;gap:8px;margin:16px 0 24px}.progress span{flex:1;border-top:5px solid #d1d9d3;padding-top:7px;font-size:13px}.progress .active{border-color:var(--teal);font-weight:700}.progress .past{border-color:#8daaa0}blockquote{margin:18px 0;border-left:3px solid var(--teal);padding:15px 20px;background:#eff5f2;font-size:18px}fieldset{border:0;padding:0;margin:18px 0}legend{font-weight:700;font-size:21px;margin-bottom:15px}.option{display:flex;gap:12px;border:1px solid var(--line);border-radius:8px;padding:14px;margin:10px 0;cursor:pointer}.option:has(input:checked){background:#edf5f0;border-color:var(--teal)}input[type=radio]{min-width:18px;height:18px;margin-top:5px}.feedback{border-left:4px solid var(--teal);padding:15px 20px;background:#edf5f0}.feedback.retry{border-color:var(--amber);background:#fff7e9}textarea,input[type=search],select{width:100%;padding:12px;font:inherit;border:1px solid #91a6a5;border-radius:7px}textarea{min-height:140px;resize:vertical}label.field{display:block;font-weight:650;margin:14px 0 6px}details{border:1px solid var(--line);border-radius:8px;margin:12px 0;padding:12px 16px;background:white}summary{cursor:pointer;font-weight:650}.aside details p{font-size:15px}.metric{display:flex;gap:18px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:8px;background:white}.metric b{font-size:32px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:15px}.error{color:#8a321a;font-weight:650}.badge{font-size:13px;color:var(--teal)}.usertext{white-space:pre-wrap;overflow-wrap:anywhere}dialog{border:1px solid var(--line);border-radius:16px;max-width:760px;width:calc(100% - 30px);max-height:88vh;padding:26px;color:var(--ink)}dialog::backdrop{background:#14343eaa}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:15px;position:sticky;top:-26px;background:white;padding:10px 0;z-index:2}.dialog-head h2{margin:0}.gloss-controls{display:grid;grid-template-columns:1fr 1fr;gap:16px}.gterm small{display:block;font-weight:400}.gexample{background:#f3f7f4}footer{max-width:1160px;margin:auto;padding:20px 24px;border-top:1px solid var(--line);font-size:12px;color:#587079}#printReport{display:none}[hidden]{display:none!important}.code{font:13px/1.5 monospace;min-height:100px;word-break:break-all}.plain{border:0;background:none;text-decoration:underline;padding:4px}.leadchoice[aria-pressed=true]{background:var(--teal);color:white}

</style></head><body><a class="skip" href="#main">Przejdź do treści</a><header><div><small>TEORIA I PRAKTYKA POLITYKI PUBLICZNEJ</small><strong>Detektyw narracji / NPF</strong></div><nav aria-label="Pomoc"><button id="home">Programy</button><button id="guide">Jak grać</button><button id="glossary">Pojęcia</button><button id="sources">Źródła</button><button id="c5">Na C5</button></nav></header><main id="main" tabindex="-1"></main><section id="printReport"></section><footer>TPPP 2026/2027 • Wersja 4.0 • 29.10.2026 • Na podstawie Jones i in. (2023). Materiał opracowany z pomocą AI. Narracje są fikcyjne. Otwarte uzasadnienia ocenia prowadzący.</footer><dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="close">Zamknij</button></div><div id="dialogBody"></div></dialog><input type="file" id="importFile" accept=".json,application/json" hidden><script>const DATA={"SCT":{"name":"Strefa Czystego Transportu","short":"SCT Warszawa","teams":"1 i 2","scope":"Warszawa, proces ustanowienia SCT w latach 2021–2024; uchwała z 7 grudnia 2023 r.","focus":"Zdrowie mieszkańców i dostęp do miasta","a":"W Warszawie podczas debaty nad strefą mieszkańcy ulic o dużym ruchu cierpią z powodu zanieczyszczonego powietrza. Zespół miejski może ich ochronić, ograniczając ruch najbardziej emisyjnych pojazdów. Mniej takich przejazdów ma prowadzić do mniejszego narażenia mieszkańców. Dlatego należy przyjąć strefę z harmonogramem i wsparciem dla osób potrzebujących dostosowania. To sprawa zdrowia wszystkich mieszkańców, więc włączmy do debaty także szkoły i organizacje pacjentów.","b":"W debacie o warszawskiej strefie osoby zależne od starszych samochodów obawiają się utraty możliwości dojazdu. Miasto może im pomóc przez okresy dostosowawcze i lepszy transport zbiorowy. Skoro szybkie ograniczenia mogą utrudnić dojazd do pracy, należy najpierw zapewnić realne alternatywy. Otwórzmy debatę także dla pracowników dojeżdżających spoza miasta.","setting":"W Warszawie podczas debaty nad strefą","victim":"mieszkańcy ulic o dużym ruchu","hero":"zespół miejski","plot":"mniej emisyjnych przejazdów → mniejsze narażenie mieszkańców","moral":"przyjąć strefę z harmonogramem i wsparciem","bVictim":"osoby zależne od starszych samochodów","cause":"zanieczyszczone powietrze","expansion":"włączmy do debaty także szkoły i organizacje pacjentów","warning":"Nie przypisuj tekstów A/B rzeczywistym urzędnikom ani NGO. W autentycznej analizie oddziel datę wypowiedzi, uchwałę i rozpoczęcie funkcjonowania strefy.","sentences":["W Warszawie podczas debaty nad strefą mieszkańcy ulic o dużym ruchu cierpią z powodu zanieczyszczonego powietrza.","Zespół miejski może ich ochronić, ograniczając ruch najbardziej emisyjnych pojazdów.","Mniej takich przejazdów ma prowadzić do mniejszego narażenia mieszkańców.","Dlatego należy przyjąć strefę z harmonogramem i wsparciem dla osób potrzebujących dostosowania.","To sprawa zdrowia wszystkich mieszkańców, więc włączmy do debaty także szkoły i organizacje pacjentów."],"questions":[{"id":"roles1","term":"characters","title":"Trop 1 • kto doświadcza problemu?","excerpt":"W Warszawie podczas debaty nad strefą mieszkańcy ulic o dużym ruchu cierpią z powodu zanieczyszczonego powietrza.","prompt":"Jaką rolę otrzymuje tu opisana grupa mieszkańców lub gospodarstw?","options":["Ofiara problemu","Bohater opowieści","Narrator wypowiedzi"],"correct":0,"feedback":"W tekście grupa „mieszkańcy ulic o dużym ruchu” doświadcza szkody lub trudności. To podstawa kodu ofiary. Nie przypisujemy roli na podstawie własnej oceny programu.","hint":"Szukaj tego, kto doświadcza szkody. Narrator jest tym, kto opowiada — nie musi być postacią tego fragmentu."},{"id":"roles2","term":"characters","title":"Trop 2 • kto oferuje pomoc?","excerpt":"Zespół miejski może ich ochronić, ograniczając ruch najbardziej emisyjnych pojazdów.","prompt":"Jaką rolę przypisuje ten fragment podmiotowi, którego działanie opisuje?","options":["Ofiara problemu","Bohater opowieści","Sprawca szkody"],"correct":1,"feedback":"„zespół miejski” ma przynieść ulgę lub rozwiązać problem, więc otrzymuje rolę bohatera. To rola przypisana w opowieści, nie ustalenie rzeczywistej skuteczności.","hint":"Kodujemy sposób przedstawienia postaci. Obietnica pomocy może wystarczyć do roli bohatera; nie trzeba dowodzić sukcesu programu."},{"id":"plot","term":"plot","title":"Trop 3 • jak działa opowieść?","excerpt":"Mniej takich przejazdów ma prowadzić do mniejszego narażenia mieszkańców.","prompt":"Który opis najlepiej oddaje powiązanie zdarzeń lub działań w tym fragmencie?","options":["Ograniczenie emisyjnych przejazdów ma zmniejszyć narażenie mieszkańców na zanieczyszczenia.","Poprawa zdrowia mieszkańców ma dopiero umożliwić ograniczenie emisyjnych przejazdów.","Uzgodnienie harmonogramu ma usunąć potrzebę ograniczania liczby emisyjnych przejazdów."],"correct":0,"feedback":"Opowieść wiąże: mniej emisyjnych przejazdów → mniejsze narażenie mieszkańców. Ten związek jest elementem fabuły. Fabuła obejmuje relacje, działania i przebieg zdarzeń — nie jest wyłącznie listą tematów ani dowodem rzeczywistej przyczynowości.","hint":"Ułóż w myślach ciąg: problem → działanie lub następstwo. Sprawdź kierunek zależności i nie dodawaj mechanizmu, którego tekst nie podaje."},{"id":"moral","term":"moral","title":"Trop 4 • do czego przekonuje narrator?","excerpt":"Dlatego należy przyjąć strefę z harmonogramem i wsparciem dla osób potrzebujących dostosowania.","prompt":"Jaką funkcję pełni wskazane zdanie w strukturze narracji?","options":["Opis okoliczności sporu","Proponowane rozwiązanie problemu","Opis następstw problemu"],"correct":1,"feedback":"Postulat „przyjąć strefę z harmonogramem i wsparciem” pełni funkcję morału: wskazuje, jakie działanie należy podjąć. Morał nie musi być oceną dobra i zła. Narracja NPF nie musi zawierać wszystkich elementów formy.","hint":"Zwróć uwagę, czy fragment mówi, co należy zrobić, czy opisuje zastaną sytuację."},{"id":"compare","term":"characters","title":"Nowy trop • druga opowieść","prompt":"Które porównanie najlepiej oddaje różnicę między narracjami A i B?","options":["A akcentuje narażenie na zanieczyszczenia, B trudności osób zależnych od samochodu.","A akcentuje utrudnienia dojazdu do pracy, B narażenie mieszkańców na zanieczyszczenia.","A proponuje same ograniczenia ruchu, B dodaje wsparcie dla osób potrzebujących dostosowania."],"correct":0,"feedback":"A akcentuje narażenie na zanieczyszczenia, B trudności osób zależnych od samochodu. Porównujemy to, co eksponują teksty; nie orzekamy, która propozycja jest politycznie słuszna. Sam sprzeciw wobec rozwiązania nie nadaje postaci roli złoczyńcy.","hint":"Porównaj, kto doświadcza trudności i jakie rozwiązanie jest proponowane. Inna opowieść nie musi oznaczać całkowitego odrzucenia programu."},{"id":"limits","term":"mechanisms","title":"Kontrola raportu • granice dowodów","prompt":"Co możesz uzasadnić na podstawie samych narracji A i B?","options":["Możemy odtworzyć sposób przedstawienia problemu; wpływ tych opowieści na decyzję wymaga innych danych.","Możemy ustalić wpływ opowieści na decyzję; sposób przedstawienia problemu wymaga badania opinii odbiorców.","Możemy rozstrzygnąć skuteczność obu rozwiązań; podział ról postaci wymaga danych o rzeczywistych rezultatach."],"correct":0,"feedback":"Teksty pozwalają kodować przedstawienie problemu, postacie, fabułę i morał. Nie wystarczają do wykazania perswazji, skuteczności programu ani wpływu na decyzję. Na C5 sprawdzicie autentyczne źródło i nazwiecie brakujące dane.","hint":"Odróżnij treść opowieści od reakcji odbiorców i przebiegu decyzji. To różne przedmioty badania."}]},"BO":{"name":"Budżet obywatelski Warszawy","short":"BO Warszawa","teams":"3 i 10","scope":"Zmiana reguł 17 października 2024 r. dla edycji BO 2026; poziom lokalny i podział środków.","focus":"Dwa znaczenia sprawiedliwego podziału","a":"Podczas warszawskiej debaty o lokalnych pulach BO mieszkańcy małych osiedli nie mogą sfinansować potrzebnego placu zabaw. Zespół mieszkańców może poprawić reguły, proponując minimalną pulę dla każdego obszaru. Plac zabaw kosztuje podobnie także tam, gdzie mieszka mniej osób, więc mała pula blokuje podobne projekty. Dlatego należy wprowadzić minimalną pulę lokalną. Zaprośmy do debaty rady rodziców z całego miasta, bo dostęp do sąsiedzkich inwestycji dotyczy wszystkich.","b":"W warszawskiej debacie o lokalnych pulach BO mieszkańcy ludnych osiedli obawiają się zbyt małych środków na osobę. Zespół odpowiedzialny za BO może chronić równe traktowanie, wiążąc pule z liczbą mieszkańców. Więcej mieszkańców oznacza więcej potrzeb, dlatego należy utrzymać podział według liczby ludności. Ten spór o sposób obliczania pul powinna rozstrzygnąć komisja techniczna w dotychczasowym składzie.","setting":"warszawska debata o lokalnych pulach BO","victim":"mieszkańcy małych osiedli","hero":"zespół mieszkańców proponujący zmianę","plot":"podobny koszt placu zabaw + mała pula → zablokowane projekty","moral":"wprowadzić minimalną pulę lokalną","bVictim":"mieszkańcy ludnych osiedli","cause":"mała pula przy podobnych kosztach projektu","expansion":"zaprośmy do debaty rady rodziców z całego miasta","warning":"W rzeczywistych konsultacjach podobna treść anonimowej uwagi nie dowodzi tożsamości jej autora. Korekta granic obszarów i wprowadzenie poziomu lokalnego to różne wyniki.","sentences":["Podczas warszawskiej debaty o lokalnych pulach BO mieszkańcy małych osiedli nie mogą sfinansować potrzebnego placu zabaw.","Zespół mieszkańców może poprawić reguły, proponując minimalną pulę dla każdego obszaru.","Plac zabaw kosztuje podobnie także tam, gdzie mieszka mniej osób, więc mała pula blokuje podobne projekty.","Dlatego należy wprowadzić minimalną pulę lokalną.","Zaprośmy do debaty rady rodziców z całego miasta, bo dostęp do sąsiedzkich inwestycji dotyczy wszystkich."],"questions":[{"id":"roles1","term":"characters","title":"Trop 1 • kto doświadcza problemu?","excerpt":"Podczas warszawskiej debaty o lokalnych pulach BO mieszkańcy małych osiedli nie mogą sfinansować potrzebnego placu zabaw.","prompt":"Jaką rolę otrzymuje tu opisana grupa mieszkańców lub gospodarstw?","options":["Ofiara problemu","Bohater opowieści","Narrator wypowiedzi"],"correct":0,"feedback":"W tekście grupa „mieszkańcy małych osiedli” doświadcza szkody lub trudności. To podstawa kodu ofiary. Nie przypisujemy roli na podstawie własnej oceny programu.","hint":"Szukaj tego, kto doświadcza szkody. Narrator jest tym, kto opowiada — nie musi być postacią tego fragmentu."},{"id":"roles2","term":"characters","title":"Trop 2 • kto oferuje pomoc?","excerpt":"Zespół mieszkańców może poprawić reguły, proponując minimalną pulę dla każdego obszaru.","prompt":"Jaką rolę przypisuje ten fragment podmiotowi, którego działanie opisuje?","options":["Ofiara problemu","Bohater opowieści","Sprawca szkody"],"correct":1,"feedback":"„zespół mieszkańców proponujący zmianę” ma przynieść ulgę lub rozwiązać problem, więc otrzymuje rolę bohatera. To rola przypisana w opowieści, nie ustalenie rzeczywistej skuteczności.","hint":"Kodujemy sposób przedstawienia postaci. Obietnica pomocy może wystarczyć do roli bohatera; nie trzeba dowodzić sukcesu programu."},{"id":"plot","term":"plot","title":"Trop 3 • jak działa opowieść?","excerpt":"Plac zabaw kosztuje podobnie także tam, gdzie mieszka mniej osób, więc mała pula blokuje podobne projekty.","prompt":"Który opis najlepiej oddaje powiązanie zdarzeń lub działań w tym fragmencie?","options":["Podobny koszt inwestycji sprawia, że mała pula blokuje potrzebne projekty.","Mniejsza liczba mieszkańców sprawia, że podobne inwestycje mają niższy koszt.","Większa liczba projektów sprawia, że koszt każdego placu zabaw spada."],"correct":0,"feedback":"Opowieść wiąże: podobny koszt placu zabaw + mała pula → zablokowane projekty. Ten związek jest elementem fabuły. Fabuła obejmuje relacje, działania i przebieg zdarzeń — nie jest wyłącznie listą tematów ani dowodem rzeczywistej przyczynowości.","hint":"Ułóż w myślach ciąg: problem → działanie lub następstwo. Sprawdź kierunek zależności i nie dodawaj mechanizmu, którego tekst nie podaje."},{"id":"moral","term":"moral","title":"Trop 4 • do czego przekonuje narrator?","excerpt":"Dlatego należy wprowadzić minimalną pulę lokalną.","prompt":"Jaką funkcję pełni wskazane zdanie w strukturze narracji?","options":["Opis okoliczności sporu","Proponowane rozwiązanie problemu","Opis następstw problemu"],"correct":1,"feedback":"Postulat „wprowadzić minimalną pulę lokalną” pełni funkcję morału: wskazuje, jakie działanie należy podjąć. Morał nie musi być oceną dobra i zła. Narracja NPF nie musi zawierać wszystkich elementów formy.","hint":"Zwróć uwagę, czy fragment mówi, co należy zrobić, czy opisuje zastaną sytuację."},{"id":"compare","term":"characters","title":"Nowy trop • druga opowieść","prompt":"Które porównanie najlepiej oddaje różnicę między narracjami A i B?","options":["A uzasadnia minimum środków na obszar, B podział zależny od liczby mieszkańców.","A uzasadnia podział według liczby mieszkańców, B minimum środków na każdy obszar.","A uzasadnia minimalną pulę na mieszkańca, B podział środków według kosztów inwestycji."],"correct":0,"feedback":"A uzasadnia minimum środków na obszar, B podział zależny od liczby mieszkańców. Porównujemy to, co eksponują teksty; nie orzekamy, która propozycja jest politycznie słuszna. Sam sprzeciw wobec rozwiązania nie nadaje postaci roli złoczyńcy.","hint":"Porównaj, kto doświadcza trudności i jakie rozwiązanie jest proponowane. Inna opowieść nie musi oznaczać całkowitego odrzucenia programu."},{"id":"limits","term":"mechanisms","title":"Kontrola raportu • granice dowodów","prompt":"Co możesz uzasadnić na podstawie samych narracji A i B?","options":["Możemy odtworzyć sposób przedstawienia problemu; wpływ tych opowieści na decyzję wymaga innych danych.","Możemy ustalić wpływ opowieści na decyzję; sposób przedstawienia problemu wymaga badania opinii odbiorców.","Możemy rozstrzygnąć skuteczność obu rozwiązań; podział ról postaci wymaga danych o rzeczywistych rezultatach."],"correct":0,"feedback":"Teksty pozwalają kodować przedstawienie problemu, postacie, fabułę i morał. Nie wystarczają do wykazania perswazji, skuteczności programu ani wpływu na decyzję. Na C5 sprawdzicie autentyczne źródło i nazwiecie brakujące dane.","hint":"Odróżnij treść opowieści od reakcji odbiorców i przebiegu decyzji. To różne przedmioty badania."}]},"GPA":{"name":"Grodziskie Przewozy Autobusowe","short":"GPA","teams":"4 i 5","scope":"Integracja transportu 2019–2023; uchwały z 28 stycznia 2021 r. jako wybrany epizod instytucjonalny.","focus":"Integracja dojazdów i lokalna odpowiedzialność","a":"W debacie o wspólnej organizacji autobusów mieszkańcy dojeżdżający przez granice gmin tracą czas na niedopasowanych przesiadkach. Wspólny organizator może ich wesprzeć, koordynując rozkłady i bilety. Gdy połączenia nie są uzgadniane, podróż trwa dłużej. Dlatego należy zintegrować organizację przewozów. Zaprośmy do rozmowy szkoły i pracodawców całego obszaru, bo od dojazdów zależy dostęp do nauki i pracy.","b":"W debacie o wspólnych autobusach mieszkańcy najmniejszych gmin obawiają się utraty wpływu na swoje połączenia. Lokalne samorządy mogą ich chronić, uzgadniając gwarancje obsługi i udziału w decyzjach. Bez tych gwarancji potrzeby peryferyjnych miejscowości mogą zostać pominięte. Dlatego przed integracją trzeba uzgodnić reguły reprezentacji. Szczegóły powinien ustalić istniejący zespół międzygminny.","setting":"debata o wspólnej organizacji autobusów między gminami","victim":"mieszkańcy dojeżdżający przez granice gmin","hero":"wspólny organizator","plot":"nieuzgodnione połączenia → dłuższa podróż","moral":"zintegrować organizację przewozów","bVictim":"mieszkańcy najmniejszych gmin","cause":"niedopasowane przesiadki","expansion":"zaprośmy szkoły i pracodawców całego obszaru","warning":"Statut i uchwała opisują rozwiązanie instytucjonalne; same nie pokazują reakcji odbiorców na narrację. Tekst B jest ćwiczeniem, nie odnalezionym stanowiskiem przeciwników GPA.","sentences":["W debacie o wspólnej organizacji autobusów mieszkańcy dojeżdżający przez granice gmin tracą czas na niedopasowanych przesiadkach.","Wspólny organizator może ich wesprzeć, koordynując rozkłady i bilety.","Gdy połączenia nie są uzgadniane, podróż trwa dłużej.","Dlatego należy zintegrować organizację przewozów.","Zaprośmy do rozmowy szkoły i pracodawców całego obszaru, bo od dojazdów zależy dostęp do nauki i pracy."],"questions":[{"id":"roles1","term":"characters","title":"Trop 1 • kto doświadcza problemu?","excerpt":"W debacie o wspólnej organizacji autobusów mieszkańcy dojeżdżający przez granice gmin tracą czas na niedopasowanych przesiadkach.","prompt":"Jaką rolę otrzymuje tu opisana grupa mieszkańców lub gospodarstw?","options":["Ofiara problemu","Bohater opowieści","Narrator wypowiedzi"],"correct":0,"feedback":"W tekście grupa „mieszkańcy dojeżdżający przez granice gmin” doświadcza szkody lub trudności. To podstawa kodu ofiary. Nie przypisujemy roli na podstawie własnej oceny programu.","hint":"Szukaj tego, kto doświadcza szkody. Narrator jest tym, kto opowiada — nie musi być postacią tego fragmentu."},{"id":"roles2","term":"characters","title":"Trop 2 • kto oferuje pomoc?","excerpt":"Wspólny organizator może ich wesprzeć, koordynując rozkłady i bilety.","prompt":"Jaką rolę przypisuje ten fragment podmiotowi, którego działanie opisuje?","options":["Ofiara problemu","Bohater opowieści","Sprawca szkody"],"correct":1,"feedback":"„wspólny organizator” ma przynieść ulgę lub rozwiązać problem, więc otrzymuje rolę bohatera. To rola przypisana w opowieści, nie ustalenie rzeczywistej skuteczności.","hint":"Kodujemy sposób przedstawienia postaci. Obietnica pomocy może wystarczyć do roli bohatera; nie trzeba dowodzić sukcesu programu."},{"id":"plot","term":"plot","title":"Trop 3 • jak działa opowieść?","excerpt":"Gdy połączenia nie są uzgadniane, podróż trwa dłużej.","prompt":"Który o  im pomóc, dopłacając do kredytu.","prompt":"Jaką rolę przypisuje ten fragment podmiotowi, którego działanie opisuje?","options":["Ofiara problemu","Bohater opowieści","Sprawca szkody"],"correct":1,"feedback":"„państwo oferujące dopłaty” ma przynieść ulgę lub rozwiązać problem, więc otrzymuje rolę bohatera. To rola przypisana w opowieści, nie ustalenie rzeczywistej skuteczności.","hint":"Kodujemy sposób przedstawienia postaci. Obietnica pomocy może wystarczyć do roli bohatera; nie trzeba dowodzić sukcesu programu."},{"id":"plot","term":"plot","title":"Trop 3 • jak działa opowieść?","excerpt":"Skoro wysokie raty zamykają drogę do zakupu, ich obniżenie ma umożliwić nabycie mieszkania.","prompt":"Który opis najlepiej oddaje powiązanie zdarzeń lub działań w tym fragmencie?","options":["Wysokie raty utrudniają zakup; dopłaty mają ułatwić gospodarstwom nabycie mieszkania.","Brak mieszkań podnosi raty; dopłaty mają bezpośrednio zwiększyć liczbę budowanych lokali.","Zakup mieszkań obniża raty; dopłaty mają dopiero później poszerzyć grupę najemców."],"correct":0,"feedback":"Opowieść wiąże: wysokie raty → brak dostępu do zakupu; niższe raty → dostęp. Ten związek jest elementem fabuły. Fabuła obejmuje relacje, działania i przebieg zdarzeń — nie jest wyłącznie listą tematów ani dowodem rzeczywistej przyczynowości.","hint":"Ułóż w myślach ciąg: problem → działanie lub następstwo. Sprawdź kierunek zależności i nie dodawaj mechanizmu, którego tekst nie podaje."},{"id":"moral","term":"moral","title":"Trop 4 • do czego przekonuje narrator?","excerpt":"Dlatego należy uruchomić dopłaty dla uprawnionych gospodarstw.","prompt":"Jaką funkcję pełni wskazane zdanie w strukturze narracji?","options":["Opis okoliczności sporu","Proponowane rozwiązanie problemu","Opis następstw problemu"],"correct":1,"feedback":"Postulat „uruchomić dopłaty dla uprawnionych gospodarstw” pełni funkcję morału: wskazuje, jakie działanie należy podjąć. Morał nie musi być oceną dobra i zła. Narracja NPF nie musi zawierać wszystkich elementów formy.","hint":"Zwróć uwagę, czy fragment mówi, co należy zrobić, czy opisuje zastaną sytuację."},{"id":"compare","term":"characters","title":"Nowy trop • druga opowieść","prompt":"Które porównanie najlepiej oddaje różnicę między narracjami A i B?","options":["A proponuje dopłaty do kredytu, B wskazuje bariery najemców i problem podaży.","A proponuje zwiększenie podaży najmu, B wskazuje dopłaty dla uprawnionych kredytobiorców.","A proponuje dopłaty kredytowe, B gwarancje kredytu dla osób bez zdolności kredytowej."],"correct":0,"feedback":"A proponuje dopłaty do kredytu, B wskazuje bariery najemców i problem podaży. Porównujemy to, co eksponują teksty; nie orzekamy, która propozycja jest politycznie słuszna. Sam sprzeciw wobec rozwiązania nie nadaje postaci roli złoczyńcy.","hint":"Porównaj, kto doświadcza trudności i jakie rozwiązanie jest proponowane. Inna opowieść nie musi oznaczać całkowitego odrzucenia programu."},{"id":"limits","term":"mechanisms","title":"Kontrola raportu • granice dowodów","prompt":"Co możesz uzasadnić na podstawie samych narracji A i B?","options":["Możemy odtworzyć sposób przedstawienia problemu; wpływ tych opowieści na decyzję wymaga innych danych.","Możemy ustalić wpływ opowieści na decyzję; sposób przedstawienia problemu wymaga badania opinii odbiorców.","Możemy rozstrzygnąć skuteczność obu rozwiązań; podział ról postaci wymaga danych o rzeczywistych rezultatach."],"correct":0,"feedback":"Teksty pozwalają kodować przedstawienie problemu, postacie, fabułę i morał. Nie wystarczają do wykazania perswazji, skuteczności programu ani wpływu na decyzję. Na C5 sprawdzicie autentyczne źródło i nazwiecie brakujące dane.","hint":"Odróżnij treść opowieści od reakcji odbiorców i przebiegu decyzji. To różne przedmioty badania."}]},"CP":{"name":"Czyste Powietrze","short":"Czyste Powietrze","teams":"8, 9 i 11","scope":"Wątek operatorów i pomocy w dostępie do programu 2023–2025; odróżnij pilotaż od późniejszego apelu i rozszerzania rozwiązania.","focus":"Pomoc w dostępie do wsparcia i odpowiedzialność","a":"W debacie o dostępie do Czystego Powietrza właściciele domów o małych dochodach gubią się w dokumentach i nie korzystają ze wsparcia. Operator może przeprowadzić ich przez wniosek i realizację prac. Skomplikowane procedury zniechęcają, więc indywidualna pomoc ma ułatwić skorzystanie z programu. Dlatego należy rozwijać pomoc operatorów. Włączmy ośrodki pomocy społecznej i organizacje seniorów, bo problem dotyczy także osób dotąd nieobecnych w debacie.","b":"W debacie o operatorach właściciele domów obawiają się niejasnej odpowiedzialności za doradztwo. Instytucje publiczne mogą ich chronić, określając standardy pomocy i kontrolę jakości. Jeśli podział odpowiedzialności jest niejasny, błędna porada może zaszkodzić wnioskodawcy. Dlatego należy powiązać rozwój operatorów z jasnymi standardami. Projekt szczegółowych zasad powinien przygotować dotychczasowy zespół wykonawczy.","setting":"debata o dostępie do Czystego Powietrza","victim":"właściciele domów o małych dochodach zagubieni w dokumentach","hero":"operator udzielający indywidualnej pomocy","plot":"skomplikowane procedury → rezygnacja; pomoc → łatwiejszy dostęp","moral":"rozwijać pomoc operatorów","bVictim":"właściciele domów narażeni na błędne doradztwo","cause":"skomplikowane procedury","expansion":"włączmy ośrodki pomocy społecznej i organizacje seniorów","warning":"Pilotaż operatorów poprzedzał późniejsze apele. Następstwo wydarzeń i podobieństwo propozycji nie wystarczają do przypisania NGO spowodowania powstania operatorów.","sentences":["W debacie o dostępie do Czystego Powietrza właściciele domów o małych dochodach gubią się w dokumentach i nie korzystają ze wsparcia.","Operator może przeprowadzić ich przez wniosek i realizację prac.","Skomplikowane procedury zniechęcają, więc indywidualna pomoc ma ułatwić skorzystanie z programu.","Dlatego należy rozwijać pomoc operatorów.","Włączmy ośrodki pomocy społecznej i organizacje seniorów, bo problem dotyczy także osób dotąd nieobecnych w debacie."],"questions":[{"id":"roles1","term":"characters","title":"Trop 1 • kto doświadcza problemu?","excerpt":"W debacie o dostępie do Czystego Powietrza właściciele domów o małych dochodach gubią się w dokumentach i nie korzystają ze wsparcia.","prompt":"Jaką rolę otrzymuje tu opisana grupa mieszkańców lub gospodarstw?","options":["Ofiara problemu","Bohater opowieści","Narrator wypowiedzi"],"correct":0,"feedback":"W tekście grupa „właściciele domów o małych dochodach zagubieni w dokumentach” doświadcza szkody lub trudności. To podstawa kodu ofiary. Nie przypisujemy roli na podstawie własnej oceny programu.","hint":"Szukaj tego, kto doświadcza szkody. Narrator jest tym, kto opowiada — nie musi być postacią tego fragmentu."},{"id":"roles2","term":"characters","title":"Trop 2 • kto oferuje pomoc?","excerpt":"Operator może przeprowadzić ich przez wniosek i realizację prac.","prompt":"Jaką rolę przypisuje ten fragment podmiotowi, którego działanie opisuje?","options":["Ofiara problemu","Bohater opowieści","Sprawca szkody"],"correct":1,"feedback":"„operator udzielający indywidualnej pomocy” ma przynieść ulgę lub rozwiązać problem, więc otrzymuje rolę bohatera. To rola przypisana w opowieści, nie ustalenie rzeczywistej skuteczności.","hint":"Kodujemy sposób przedstawienia postaci. Obietnica pomocy może wystarczyć do roli bohatera; nie trzeba dowodzić sukcesu programu."},{"id":"plot","term":"plot","title":"Trop 3 • jak działa opowieść?","excerpt":"Skomplikowane procedury zniechęcają, więc indywidualna pomoc ma ułatwić skorzystanie z programu.","prompt":"Który opis najlepiej oddaje powiązanie zdarzeń lub działań w tym fragmencie?","options":["Złożone procedury utrudniają dostęp; pomoc operatora ma ułatwić skorzystanie ze wsparcia.","Pomoc operatora komplikuje procedury; samodzielny wniosek ma ułatwić dostęp do wsparcia.","Mała liczba wniosków zwiększa dochody; wyższe dochody mają zastąpić pomoc operatora."],"correct":0,"feedback":"Opowieść wiąże: skomplikowane procedury → rezygnacja; pomoc → łatwiejszy dostęp. Ten związek jest elementem fabuły. Fabuła obejmuje relacje, działania i przebieg zdarzeń — nie jest wyłącznie listą tematów ani dowodem rzeczywistej przyczynowości.","hint":"Ułóż w myślach ciąg: problem → działanie lub następstwo. Sprawdź kierunek zależności i nie dodawaj mechanizmu, którego tekst nie podaje."},{"id":"moral","term":"moral","title":"Trop 4 • do czego przekonuje narrator?","excerpt":"Dlatego należy rozwijać pomoc operatorów.","prompt":"Jaką funkcję pełni wskazane zdanie w strukturze narracji?","options":["Opis okoliczności sporu","Proponowane rozwiązanie problemu","Opis następstw problemu"],"correct":1,"feedback":"Postulat „rozwijać pomoc operatorów” pełni funkcję morału: wskazuje, jakie działanie należy podjąć. Morał nie musi być oceną dobra i zła. Narracja NPF nie musi zawierać wszystkich elementów formy.","hint":"Zwróć uwagę, czy fragment mówi, co należy zrobić, czy opisuje zastaną sytuację."},{"id":"compare","term":"characters","title":"Nowy trop • druga opowieść","prompt":"Które porównanie najlepiej oddaje różnicę między narracjami A i B?","options":["A akcentuje dostęp przez pomoc operatorów, B standardy pomocy i odpowiedzialność.","A akcentuje kontrolę jakości doradztwa, B dostęp dzięki ograniczeniu liczby operatorów.","A proponuje uproszczenie wniosków, B zastąpienie operatorów wspólnym punktem informacji dla właścicieli."],"correct":0,"feedback":"A akcentuje dostęp przez pomoc operatorów, B standardy pomocy i odpowiedzialność. Porównujemy to, co eksponują teksty; nie orzekamy, która propozycja jest politycznie słuszna. Sam sprzeciw wobec rozwiązania nie nadaje postaci roli złoczyńcy.","hint":"Porównaj, kto doświadcza trudności i jakie rozwiązanie jest proponowane. Inna opowieść nie musi oznaczać całkowitego odrzucenia programu."},{"id":"limits","term":"mechanisms","title":"Kontrola raportu • granice dowodów","prompt":"Co możesz uzasadnić na podstawie samych narracji A i B?","options":["Możemy odtworzyć sposób przedstawienia problemu; wpływ tych opowieści na decyzję wymaga innych danych.","Możemy ustalić wpływ opowieści na decyzję; sposób przedstawienia problemu wymaga badania opinii odbiorców.","Możemy rozstrzygnąć skuteczność obu rozwiązań; podział ról postaci wymaga danych o rzeczywistych rezultatach."],"correct":0,"feedback":"Teksty pozwalają kodować przedstawienie problemu, postacie, fabułę i morał. Nie wystarczają do wykazania perswazji, skuteczności programu ani wpływu na decyzję. Na C5 sprawdzicie autentyczne źródło i nazwiecie brakujące dane.","hint":"Odróżnij treść opowieści od reakcji odbiorców i przebiegu decyzji. To różne przedmioty badania."}]}},GLOSSARY=[{"id":"narrative","title":"Narracja i jej minimum","english":"Policy narrative; narrativity","group":"Struktura opowieści","definition":"Operacyjne minimum narracji w NPF to co najmniej jedna postać oraz odniesienie do polityki publicznej. Narracja nie musi zawierać wszystkich czterech elementów formy ani wszystkich ról postaci. Narracyjność określa stopień obecności i kompletności elementów formy oraz treści ponad to minimum.","caution":"Narracyjność nie jest oceną jakości literackiej, prawdziwości ani skuteczności opowieści. Rozpoznanie narracji nie potwierdza jej twierdzeń.","pages":"167","kind":"NPF"},{"id":"form","title":"Forma opowieści","english":"Narrative form","group":"Struktura opowieści","definition":"Forma to budowa opowieści: postacie, tło, fabuła i morał. Są to kategorie, które pozwalają porównywać narracje dotyczące różnych problemów. Forma i treść są odróżnialne, ale powiązane: konkretny sposób przedstawienia postaci może zarazem wyrażać przekonanie lub strategię.","caution":"Nie traktuj listy czterech elementów jako warunku, który każda narracja musi spełnić w całości. Niektóre elementy mogą być domyślne; ich rozpoznanie trzeba uzasadnić tekstem.","pages":"163–165; minimum: 167","kind":"NPF"},{"id":"characters","title":"Postacie i trzy podstawowe role","english":"Characters: victim, hero, villain","group":"Struktura opowieści","definition":"Postacie są uczestnikami przedstawionymi w opowieści w określonych rolach. Ofiara doświadcza szkody lub jest nią zagrożona. Bohater oferuje pomoc w ograniczeniu szkody albo rozwiązaniu problemu. Antagonista jest przedstawiony jako sprawca szkody lub źródło problemu.","caution":"Kod opisuje przedstawienie w tekście: bohater nie musi mieć potwierdzonej skuteczności, a przeciwnik polityczny nie jest automatycznie antagonistą. Sama nazwa przyczyny problemu nie musi oznaczać postaci.","pages":"163–164; minimum jednej postaci: 167","kind":"NPF"},{"id":"setting","title":"Tło i kontekst","english":"Setting","group":"Struktura opowieści","definition":"Tło to okoliczności, w których opowieść umieszcza problem i postacie. Obejmuje miejsce i czas, ale również reguły prawne, zasoby, istotne zdarzenia oraz kontekst społeczny i ideowy. Chodzi o okoliczności przedstawiane jako ważne dla danej sprawy.","caution":"Tło nie ogranicza się do miejscowości i daty. Nie dopisuj wszystkich znanych Ci uwarunkowań programu, jeżeli analizowany fragment ich nie przedstawia.","pages":"163–164","kind":"NPF"},{"id":"plot","title":"Fabuła","english":"Plot","group":"Struktura opowieści","definition":"Fabuła łączy postacie z działaniami, zdarzeniami i kontekstem. Porządkuje to, co się dzieje, oraz przedstawia relacje, konflikty i motywy. Może zawierać wyjaśnienie przyczynowe, ale nie sprowadza się do pojedynczego związku przyczyny i skutku.","caution":"Odtworzenie fabuły mówi, jak opowieść przedstawia zdarzenia. Nie potwierdza, że właśnie tak przebiegał rzeczywisty proces ani że następstwo zdarzeń dowodzi przyczynowości.","pages":"163, 165","kind":"NPF"},{"id":"moral","title":"Morał — wniosek opowieści","english":"Moral","group":"Struktura opowieści","definition":"Morał to wniosek wynikający z opowieści: proponowane rozwiązanie publiczne, wezwanie do działania albo lekcja płynąca z opowieści. Może być wyrażony wprost albo wynikać z przedstawienia problemu i rozwiązania. Nie musi być osobnym zdaniem zaczynającym się od słowa „należy”.","caution":"Nie utożsamiaj morału wyłącznie z moralizowaniem ani wyłącznie z formalnym projektem programu. Nie przypisuj tekstowi własnego postulatu, którego nie da się z niego uzasadnić.","pages":"165; struktura jawna lub domyślna: 163","kind":"NPF"},{"id":"narrator","title":"Narrator i odbiorca","english":"Narrator and audience","group":"Struktura opowieści","definition":"Narrator przedstawia opowieść, a odbiorca ją przyjmuje i interpretuje. To, kto opowiada, komu i jak te strony postrzegają siebie nawzajem, może mieć znaczenie dla oddziaływania narracji. Narrator i bohater mogą być tym samym podmiotem, lecz są różnymi rolami: pierwszy opowiada, drugi w opowieści oferuje rozwiązanie.","caution":"Przy cytacie sprawdź, kto wypowiada analizowaną narrację; wydawca strony lub autor całego dokumentu nie musi być narratorem cytowanego fragmentu. Sama publikacja postulatu nie nadaje narratorowi roli bohatera.","pages":"167–168; bohater: 164","kind":"NPF"},{"id":"content","title":"Treść: przekonania i strategie","english":"Narrative content","group":"Treść i strategie","definition":"Treść mówi, jakie znaczenie opowieść nadaje problemowi, postaciom i rozwiązaniom. Systemy przekonań pomagają uchwycić sposoby rozumienia i oceniania tych elementów. Strategie narracyjne dotyczą tego, jak i po co narrator organizuje oraz akcentuje elementy opowieści. W systematycznym badaniu rozpoznawanie przekonań wymaga jasno określonej podstawy teoretycznej i reguł kodowania.","caution":"Nie przypisuj autorowi całej ideologii na podstawie jednego zdania. Rozpoznanie sposobu przedstawienia nie jest jeszcze dowodem jego skuteczności ani pełnej wiedzy o intencjach autora.","pages":"165–166; powiązanie formy i treści: 164","kind":"NPF"},{"id":"scope","title":"Rozszerzanie i ograniczanie konfliktu","english":"Scope of conflict","group":"Treść i strategie","definition":"Jest to strategiczne przedstawianie sprawy w sposób, który ma rozszerzyć lub ograniczyć zaangażowanie w nią. Narrator może zapraszać nowe grupy, ale również przedstawiać sprawę jako dotyczącą wielu ludzi albo wąskiego grona. W badaniach analizowano między innymi rozpraszanie kosztów na liczne grupy i skupianie korzyści u nielicznych albo odwrotny sposób przedstawienia ich rozkładu. Dosłowne wezwanie nowych uczestników jest więc jednym ze sposobów, a nie całą definicją tej strategii.","caution":"Rozpoznanie strategii nie dowodzi zmiany kręgu uczestników. Wyniki dotyczące wygrywania i przegrywania są mieszane; rozdział omawia też alternatywną hipotezę o obronie status quo i dążeniu do zmiany. Nie używaj tych hipotez jako automatycznego klucza kodowania.","pages":"166, 174–175","kind":"NPF"},{"id":"causal","title":"Strategie przyczynowe w narracji","english":"Narrative causal strategies","group":"Treść i strategie","definition":"To sposób przedstawienia, dlaczego powstał problem oraz komu przypisuje się odpowiedzialność lub winę. Dotyczy przyczynowego wyjaśnienia wewnątrz opowieści, budowanego przez układ jej elementów. Rozdział wymienia za Stone cztery typy wyjaśnień: intencjonalne, niezamierzone, przypadkowe i mechaniczne, bez ich szczegółowego zdefiniowania w tym miejscu.","caution":"Nie myl przyczyny opisywanej przez narratora z mechanizmem wpływu samej narracji na odbiorców lub politykę. W rozdziale zmieniono dawną nazwę „causal mechanisms” właśnie po to, by ograniczyć to nieporozumienie.","pages":"166; przypis 6: 184","kind":"NPF"},{"id":"das","title":"Akcentowanie winy, pomocy i krzywdy","english":"Devil–angel–solidarity shifts","group":"Treść i strategie","definition":"Devil shift polega na akcentowaniu winy przeciwników przedstawianych jako antagoniści. Angel shift akcentuje bohaterów i ich zdolność rozwiązania problemu. Solidarity shift akcentuje ofiary i wyrządzoną im krzywdę. W badaniu ocenia się względne natężenie przedstawień postaci, często za pomocą ich proporcji.","caution":"Samo pojawienie się bohatera, ofiary lub antagonisty nie wystarcza do wykazania strategii. Słowo „shift” nie musi oznaczać zmiany w czasie, a wyniki badań nie uzasadniają prostego przypisania tych strategii do zwycięzców i przegranych.","pages":"166–167; ograniczenia hipotez: 176–177","kind":"NPF"},{"id":"mechanisms","title":"Jak narracja może oddziaływać","english":"Narrative mechanisms of policy change","group":"Wpływ i badanie","definition":"W modelu przedstawionym w rozdziale forma i treść narracji mogą wzbudzać afekt, czyli reakcję emocjonalną i oceniającą. Autorzy proponują dwa dalsze tory: perswazja lub manipulacja prowadząca do uczenia oraz uwaga prowadząca do mobilizacji. Tor uwagi może pobudzać działanie bez zmiany przekonań odbiorcy. Są to proponowane mechanizmy oddziaływania na wszystkich trzech poziomach analizy.","caution":"To model do sprawdzania, a nie gwarancja skuteczności każdej opowieści. Zasięg publikacji nie dowodzi zmiany przekonań, a reakcja odbiorców sama nie dowodzi spowodowania decyzji publicznej.","pages":"168–169; afekt: także 170","kind":"NPF","detailTitle":"Perswazja a manipulacja — doprecyzowanie","detail":"W rozróżnieniu proponowanym przez autorów odbiorcy przyjmują opowieść i działają zgodnie z nią, ponieważ jest to w ich interesie (perswazja) albo sądzą, że tak jest (manipulacja). Autorzy zaznaczają, że odróżnienie tych sytuacji jest trudne i wymaga trafnych, rzetelnych reguł badania. Sama obecność emocji ani niezgoda z poglądem narratora nie dowodzi manipulacji. Podstawa: s. 169 i przypis 8 na s. 184."},{"id":"learning","title":"Uczenie się a przyjęcie nowej narracji","english":"Policy learning; narrative policy learning","group":"Wpływ i badanie","definition":"W tradycyjnym ujęciu uczenie się w polityce wiąże się z trwałą zmianą preferencji lub zachowań pod wpływem nowej informacji. Uczenie narracyjne polega na przyjęciu nowej konfiguracji elementów opowieści, nawet gdy inne informacje, w tym dowody naukowe, pozostają te same. Rozdział traktuje trwałą zmianę dominujących narracji jako możliwą drogę do zmiany polityki.","caution":"Chwilowa deklaracja poparcia nie wystarcza do wykazania trwałego uczenia. Omawiana hipoteza łącząca utrwaloną rekonfigurację narracji ze zmianą polityki jest w tym rozdziale oznaczona jako jeszcze nieprzetestowana.","pages":"169, 177–178","kind":"NPF"},{"id":"levels","title":"Poziomy: mikro, mezo i makro","english":"Levels of analysis","group":"Wpływ i badanie","definition":"Mikro: jak poszczególne osoby tworzą i odbierają narracje. Mezo: jak aktorzy zorganizowani w grupy i koalicje strategicznie używają narracji w podsystemie polityki. Makro: jak narracje osadzone w kulturach i instytucjach kształtują politykę publiczną.","caution":"Poziom wynika z pytania badawczego, nie ze szczebla administracji, wielkości próby ani formatu dokumentu. Program krajowy można badać na poziomie mikro, a lokalny na poziomie makro.","pages":"169; mikro: 173; mezo: 174; makro: 179–180; przypis 9: 185","kind":"NPF","detailTitle":"Poziom, jednostka analizy i obserwacji","detail":"Poziom analizy wskazuje teoretyczną skalę działania narracji. W rozróżnieniu tego rozdziału jednostka analizy to podmiot, z którego narracje pochodzą (osoba, grupa lub instytucja), a jednostka obserwacji to wyodrębniony materiał, w którym koduje się dane narracyjne (np. zdanie, akapit, dokument lub film). Szczebel administracji to jeszcze inne rozróżnienie. Podstawa: przypis 9 na s. 185."},{"id":"evidence","title":"Teza, dowód i ocena w grze","english":"","group":"Narzędzia w grze","definition":"To autorska pomoc metodyczna w grze, a nie osobne pojęcie NPF z rozdziału. Teza jest sprawdzanym twierdzeniem, a materiał dowodowy to pozyskany fragment lub karta, na których opierasz ocenę. Relacja karty do tezy mówi, czy ta konkretna informacja ją wspiera, osłabia czy nie rozstrzyga. Status tezy wyraża ocenę całego aktualnie pozyskanego materiału.","caution":"Karta nierozstrzygająca nie unieważnia automatycznie innej, która dostarcza trafnego wsparcia lub osłabienia. „Wsparta” nie znaczy „ostatecznie udowodniona”, a „osłabiona” nie zawsze znaczy „wykluczona”.","pages":"","kind":"metoda gry"},{"id":"uncertainty","title":"Nierozstrzygnięcie i granice wniosku","english":"","group":"Narzędzia w grze","definition":"To autorska pomoc metodyczna w grze, a nie osobne pojęcie NPF z rozdziału. Status „nierozstrzygnięta” oznacza, że pozyskany materiał nie daje wystarczającej podstawy do wsparcia ani osłabienia konkretnej tezy. Uzasadnienie powinno wskazać, czego nie mierzy dostępny materiał i jakiej informacji nadal brakuje.","caution":"Brak dowodu efektu nie jest dowodem braku efektu. Nie wybieraj nierozstrzygnięcia automatycznie, jeśli zdobyte akta zawierają już informację wyraźnie zmieniającą ocenę tezy.","pages":"","kind":"metoda gry"}],EXAMPLES={"SCT":{"narrative":"Przykład fikcyjny: W wypowiedzi o strefie czystego transportu wskazano, że szkody doświadczają dzieci uczące się przy ruchliwej ulicy. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.","form":"Przykład fikcyjny: Opowieść o strefie czystego transportu: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Ograniczenie ruchu ma zmniejszyć narażenie dzieci na spaliny” łączy działanie ze zmianą sytuacji (fabuła). „Wprowadźmy ograniczenia ruchu z pomocą dla osób potrzebujących dostosowania” wskazuje postulowane działanie (morał). Te cztery kody opisują budowę wypowiedzi.","characters":"Przykład fikcyjny: Ofiara: dzieci uczące się przy ruchliwej ulicy — w opowieści to grupa narażona na szkodę. Bohater: zespół miejski — jeśli tekst właśnie tej postaci przypisuje możliwość pomocy. Antagonistę można rozpoznać w osobnej wypowiedzi: „Firma A celowo obchodzi ograniczenia i naraża dzieci na spaliny”. To odczytanie ról w wymyślonych tekstach, nie ocena rzeczywistych podmiotów.","setting":"Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o strefie czystego transportu”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.","plot":"Przykład fikcyjny: „Rodzice opisali problem spalin przy szkole. Zespół miejski przedstawił wariant ograniczeń ruchu, a część mieszkańców zażądała okresu dostosowania przed ich wprowadzeniem.” Fabuła łączy tu działania postaci w sekwencję: zgłoszenie trudności, propozycja pomocy i żądanie jej zmiany. Pokazuje również relację między uczestnikami sporu. Samo hasło „narażenie na spaliny” nazywa trudność, ale nie odtwarza tej fabuły.","moral":"Przykład fikcyjny: „Wprowadźmy ograniczenia ruchu z pomocą dla osób potrzebujących dostosowania” jest postulatem działania. Wypowiedź mogłaby też zakończyć się szerszą lekcją „Wspólne instytucje powinny pomagać osobom, które same nie mogą usunąć tej bariery”. Morał nie musi być gotowym projektem przepisu ani tym, z czym zgadza się czytelnik.","narrator":"Przykład fikcyjny: O strefie czystego transportu wypowiada się fikcyjna grupa rodziców — to narrator. W tej opowieści rolę proponowanego bohatera pełni postać określona jako „zespół miejski”. Adresatami mogą być radni albo mieszkańcy. Jeśli gazetowy artykuł cytuje tę wypowiedź, odróżnij narrację cytowanej grupy od komentarza dziennikarza.","content":"Przykład fikcyjny: W zdaniu „Ochrona zdrowia powinna mieć pierwszeństwo w organizacji ruchu” można rozpoznać wyrażone przekonanie normatywne. Użycie tego przekonania do przedstawienia sprawy jako ważnej dla wielu grup może służyć strategii narracyjnej. Nie przypisuj jednak autorowi całej ideologii na podstawie jednego zdania; potrzebujesz reguły kodowania i podstawy teoretycznej.","scope":"Przykład fikcyjny: W debacie o strefie czystego transportu ktoś mówi: „Skutki tego rozwiązania obciążają rodziny, pracowników i seniorów w całym regionie, a korzyści zbiera kilka podmiotów”. Taki układ kosztów i korzyści przedstawia problem jako dotyczący wielu grup i może służyć rozszerzaniu konfliktu także bez dosłownego zaproszenia do debaty. „To tylko techniczna sprawa wąskiego grona, pozostawmy ją dotychczasowym uczestnikom” wskazuje przeciwny kierunek. Nie wynika z tego, czy skład uczestników rzeczywiście się zmienił.","causal":"Przykład fikcyjny: Wypowiedź „Firma A celowo obchodzi ograniczenia i naraża dzieci na spaliny” przypisuje odpowiedzialność za szkodę celowemu działaniu postaci. To przykład przyczynowości konstruowanej wewnątrz narracji o strefie czystego transportu. Nie jest to dowód, że wypowiedź zmieniła opinię odbiorcy, ani ustalenie, że opisane zachowanie rzeczywiście miało miejsce.","das":"Przykład fikcyjny: W zbiorze tekstów o strefie czystego transportu porównujesz udział przedstawień bohaterów, antagonistów i ofiar. Dominujące eksponowanie zdolności pomocy postaci określonej jako „zespół miejski” może wskazywać angel shift; dominujące obwinianie przeciwników — devil shift, a akcentowanie krzywdy ofiar — solidarity shift. Najpierw ustal jednostkę i sposób porównania. Pojedyncza wzmianka o roli nie rozstrzyga, która strategia dominuje.","mechanisms":"Przykład fikcyjny: Po lekturze opowieści o strefie czystego transportu czytelniczka odczuwa sympatię do proponowanego bohatera i zaczyna popierać jego rozwiązanie — to możliwy ślad toru prowadzącego przez afekt do perswazji. Inny czytelnik już popierał rozwiązanie, lecz teraz uznaje sprawę za pilną i wysyła pytanie do urzędu — to możliwy ślad uwagi i mobilizacji. Samo następstwo nie potwierdza wpływu narracji. Do odróżnienia perswazji od manipulacji nie wystarczy też ocena, że proponowane rozwiązanie jest politycznie niesłuszne.","learning":"Przykład fikcyjny: W dyskusji o strefie czystego transportu nowe dane o zasięgu problemu prowadzą do trwałej zmiany preferencji: to przykład tradycyjnego uczenia. Przy tych samych danych uczestnicy mogą przyjąć nową opowieść, która w roli ofiary eksponuje inną grupę, określoną jako „osoby dojeżdżające na leczenie”. Jeśli ta zmiana zostaje przyjęta i utrzymuje się, ilustruje narracyjne uczenie. Jedna deklaracja tuż po lekturze nie potwierdza trwałości.","levels":"Przykład fikcyjny: Mikro: badasz reakcję osoby na opowieść o strefie czystego transportu. Mezo: badasz używanie narracji przez grupy w sporze. Makro: rozważasz szerszą opowieść „Obywatele zyskują samodzielność, gdy wspólne instytucje usuwają bariery przemieszczania; dlatego organizacja przestrzeni i usług powinna chronić ich możliwość swobodnego poruszania się.” i sprawdzasz, czy utrwala się przez lata w kulturze lub instytucjach oraz organizuje różne debaty polityczne. Sama wartość lub pojedynczy postulat nie wystarcza do rozpoznania takiej makronarracji.","evidence":"Przykład fikcyjny: Teza: wypowiedź o strefie czystego transportu zawiera jawny postulat działania. Fragment „Wprowadźmy ograniczenia ruchu z pomocą dla osób potrzebujących dostosowania” wspiera tę tezę. Metryka podająca jedynie datę publikacji nie rozstrzyga jej, ale nie odbiera znaczenia pierwszemu fragmentowi. Status tezy dotyczy całego zebranego materiału, a relacja — każdego fragmentu ocenianego z osobna.","uncertainty":"Przykład fikcyjny: W krótkim streszczeniu debaty o strefie czystego transportu zapisano, że omawiano problem określony jako „narażenie na spaliny”. Chcesz sprawdzić tezę, że narrator wprost obwinił konkretną instytucję, lecz nie masz pełnej wypowiedzi. Streszczenie tego nie rozstrzyga: trzeba odnaleźć oryginał. Brak informacji o obwinianiu w streszczeniu nie dowodzi, że nie było go w wypowiedzi."},"BO":{"narrative":"Przykład fikcyjny: W wypowiedzi o budżecie obywatelskim wskazano, że szkody doświadczają mieszkańcy osiedla pozbawieni miejsca spotkań w cieniu. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.","form":"Przykład fikcyjny: Opowieść o budżecie obywatelskim: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Ogród ma zapewnić cień i umożliwić sąsiadom wspólne spotkania” łączy działanie ze zmianą sytuacji (fabuła). „Przeznaczmy część budżetu na ogród dostępny dla wszystkich mieszkańców” wskazuje postulowane działanie (morał). Te cztery kody opisują budowę wypowiedzi.","characters":"Przykład fikcyjny: Ofiara: mieszkańcy osiedla pozbawieni miejsca spotkań w cieniu — w opowieści to grupa narażona na szkodę. Bohater: grupa projektodawców — jeśli tekst właśnie tej postaci przypisuje możliwość pomocy. Antagonistę można rozpoznać w osobnej wypowiedzi: „Zarządca A celowo blokuje mieszkańcom dostęp do wspólnego terenu”. To odczytanie ról w wymyślonych tekstach, nie ocena rzeczywistych podmiotów.","setting":"Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o budżecie obywatelskim”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.","plot":"Przykład fikcyjny: „Mieszkańcy zgłosili brak miejsca spotkań. Grupa projektodawców przygotowała pomysł ogrodu, a część sąsiadów zaproponowała zmianę projektu, żeby zachować miejsce do zabawy.” Fabuła łączy tu działania postaci w sekwencję: zgłoszenie trudności, propozycja pomocy i żądanie jej zmiany. Pokazuje również relację między uczestnikami sporu. Samo hasło „brak dostępnego miejsca spotkań” nazywa trudność, ale nie odtwarza tej fabuły.","moral":"Przykład fikcyjny: „Przeznaczmy część budżetu na ogród dostępny dla wszystkich mieszkańców” jest postulatem działania. Wypowiedź mogłaby też zakończyć się szerszą lekcją „Wspólne instytucje powinny pomagać osobom, które same nie mogą usunąć tej bariery”. Morał nie musi być gotowym projektem przepisu ani tym, z czym zgadza się czytelnik.","narrator":"Przykład fikcyjny: O budżecie obywatelskim wypowiada się fikcyjna inicjatywa sąsiedzka — to narrator. W tej opowieści rolę proponowanego bohatera pełni postać określona jako „grupa projektodawców”. Adresatami mogą być radni albo mieszkańcy. Jeśli gazetowy artykuł cytuje tę wypowiedź, odróżnij narrację cytowanej grupy od komentarza dziennikarza.","content":"Przykład fikcyjny: W zdaniu „Mieszkańcy powinni współdecydować o lokalnych wydatkach” można rozpoznać wyrażone przekonanie normatywne. Użycie tego przekonania do przedstawienia sprawy jako ważnej dla wielu grup może służyć strategii narracyjnej. Nie przypisuj jednak autorowi całej ideologii na podstawie jednego zdania; potrzebujesz reguły kodowania i podstawy teoretycznej.","scope":"Przykład fikcyjny: W debacie o budżecie obywatelskim ktoś mówi: „Skutki tego rozwiązania obciążają rodziny, pracowników i seniorów w całym regionie, a korzyści zbiera kilka podmiotów”. Taki układ kosztów i korzyści przedstawia problem jako dotyczący wielu grup i może służyć rozszerzaniu konfliktu także bez dosłownego zaproszenia do debaty. „To tylko techniczna sprawa wąskiego grona, pozostawmy ją dotychczasowym uczestnikom” wskazuje przeciwny kierunek. Nie wynika z tego, czy skład uczestników rzeczywiście się zmienił.","causal":"Przykład fikcyjny: Wypowiedź „Zarządca A celowo blokuje mieszkańcom dostęp do wspólnego terenu” przypisuje odpowiedzialność za szkodę celowemu działaniu postaci. To przykład przyczynowości konstruowanej wewnątrz narracji o budżecie obywatelskim. Nie jest to dowód, że wypowiedź zmieniła opinię odbiorcy, ani ustalenie, że opisane zachowanie rzeczywiście miało miejsce.","das":"Przykład fikcyjny: W zbiorze tekstów o budżecie obywatelskim porównujesz udział przedstawień bohaterów, antagonistów i ofiar. Dominujące eksponowanie zdolności pomocy postaci określonej jako „grupa projektodawców” może wskazywać angel shift; dominujące obwinianie przeciwników — devil shift, a akcentowanie krzywdy ofiar — solidarity shift. Najpierw ustal jednostkę i sposób porównania. Pojedyncza wzmianka o roli nie rozstrzyga, która strategia dominuje.","mechanisms":"Przykład fikcyjny: Po lekturze opowieści o budżecie obywatelskim czytelniczka odczuwa sympatię do proponowanego bohatera i zaczyna popierać jego rozwiązanie — to możliwy ślad toru prowadzącego przez afekt do perswazji. Inny czytelnik już popierał rozwiązanie, lecz teraz uznaje sprawę za pilną i wysyła pytanie do urzędu — to możliwy ślad uwagi i mobilizacji. Samo następstwo nie potwierdza wpływu narracji. Do odróżnienia perswazji od manipulacji nie wystarczy też ocena, że proponowane rozwiązanie jest politycznie niesłuszne.","learning":"Przykład fikcyjny: W dyskusji o budżecie obywatelskim nowe dane o zasięgu problemu prowadzą do trwałej zmiany preferencji: to przykład tradycyjnego uczenia. Przy tych samych danych uczestnicy mogą przyjąć nową opowieść, która w roli ofiary eksponuje inną grupę, określoną jako „osoby z trudnościami w poruszaniu się”. Jeśli ta zmiana zostaje przyjęta i utrzymuje się, ilustruje narracyjne uczenie. Jedna deklaracja tuż po lekturze nie potwierdza trwałości.","levels":"Przykład fikcyjny: Mikro: badasz reakcję osoby na opowieść o budżecie obywatelskim. Mezo: badasz używanie narracji przez grupy w sporze. Makro: rozważasz szerszą opowieść „Mieszkańcy pozostawieni poza decyzjami tracą wpływ na wspólne zasoby; instytucje oddające im część władzy odbudowują wspólnotę, dlatego obywatele powinni współdecydować o sprawach publicznych.” i sprawdzasz, czy utrwala się przez lata w kulturze lub instytucjach oraz organizuje różne debaty polityczne. Sama wartość lub pojedynczy postulat nie wystarcza do rozpoznania takiej makronarracji.","evidence":"Przykład fikcyjny: Teza: wypowiedź o budżecie obywatelskim zawiera jawny postulat działania. Fragment „Przeznaczmy część budżetu na ogród dostępny dla wszystkich mieszkańców” wspiera tę tezę. Metryka podająca jedynie datę publikacji nie rozstrzyga jej, ale nie odbiera znaczenia pierwszemu fragmentowi. Status tezy dotyczy całego zebranego materiału, a relacja — każdego fragmentu ocenianego z osobna.","uncertainty":"Przykład fikcyjny: W krótkim streszczeniu debaty o budżecie obywatelskim zapisano, że omawiano problem określony jako „brak dostępnego miejsca spotkań”. Chcesz sprawdzić tezę, że narrator wprost obwinił konkretną instytucję, lecz nie masz pełnej wypowiedzi. Streszczenie tego nie rozstrzyga: trzeba odnaleźć oryginał. Brak informacji o obwinianiu w streszczeniu nie dowodzi, że nie było go w wypowiedzi."},"GPA":{"narrative":"Przykład fikcyjny: W wypowiedzi o lokalnych przewozach autobusowych wskazano, że szkody doświadczają osoby bez samochodu kończące pracę późnym wieczorem. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.","form":"Przykład fikcyjny: Opowieść o lokalnych przewozach autobusowych: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Dodatkowy kurs ma umożliwić powrót z późnej zmiany i ułatwić podjęcie pracy” łączy działanie ze zmianą sytuacji (fabuła). „Uruchommy wieczorny kurs skoordynowany z godzinami końca zmian” wskazuje postulowane działanie (morał). Te cztery kody opisują budowę wypowiedzi.","characters":"Przykład fikcyjny: Ofiara: osoby bez samochodu kończące pracę późnym wieczorem — w opowieści to grupa narażona na szkodę. Bohater: organizator transportu — jeśli tekst właśnie tej postaci przypisuje możliwość pomocy. Antagonistę można rozpoznać w osobnej wypowiedzi: „Operator A świadomie nie wykonuje zaplanowanych kursów i zostawia pasażerów bez dojazdu”. To odczytanie ról w wymyślonych tekstach, nie ocena rzeczywistych podmiotów.","setting":"Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o lokalnych przewozach autobusowych”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.","plot":"Przykład fikcyjny: „Pracownicy opisali trudności z powrotem z późnej zmiany. Organizator zaproponował kurs wieczorny; pasażerowie poprosili o przesunięcie odjazdu, aby zdążyć po zakończeniu pracy.” Fabuła łączy tu działania postaci w sekwencję: zgłoszenie trudności, propozycja pomocy i żądanie jej zmiany. Pokazuje również relację między uczestnikami sporu. Samo hasło „brak możliwości powrotu do domu autobusem” nazywa trudność, ale nie odtwarza tej fabuły.","moral":"Przykład fikcyjny: „Uruchommy wieczorny kurs skoordynowany z godzinami końca zmian” jest postulatem działania. Wypowiedź mogłaby też zakończyć się szerszą lekcją „Wspólne instytucje powinny pomagać osobom, które same nie mogą usunąć tej bariery”. Morał nie musi być gotowym projektem przepisu ani tym, z czym zgadza się czytelnik.","narrator":"Przykład fikcyjny: O lokalnych przewozach autobusowych wypowiada się fikcyjna grupa pracowników zmianowych — to narrator. W tej opowieści rolę proponowanego bohatera pełni postać określona jako „organizator transportu”. Adresatami mogą być radni albo mieszkańcy. Jeśli gazetowy artykuł cytuje tę wypowiedź, odróżnij narrację cytowanej grupy od komentarza dziennikarza.","content":"Przykład fikcyjny: W zdaniu „Dostęp do transportu powinien ograniczać nierówności szans” można rozpoznać wyrażone przekonanie normatywne. Użycie tego przekonania do przedstawienia sprawy jako ważnej dla wielu grup może służyć strategii narracyjnej. Nie przypisuj jednak autorowi całej ideologii na podstawie jednego zdania; potrzebujesz reguły kodowania i podstawy teoretycznej.","scope":"Przykład fikcyjny: W debacie o lokalnych przewozach autobusowych ktoś mówi: „Skutki tego rozwiązania obciążają rodziny, pracowników i seniorów w całym regionie, a korzyści zbiera kilka podmiotów”. Taki układ kosztów i korzyści przedstawia problem jako dotyczący wielu grup i może służyć rozszerzaniu konfliktu także bez dosłownego zaproszenia do debaty. „To tylko techniczna sprawa wąskiego grona, pozostawmy ją dotychczasowym uczestnikom” wskazuje przeciwny kierunek. Nie wynika z tego, czy skład uczestników rzeczywiście się zmienił.","causal":"Przykład fikcyjny: Wypowiedź „Operator A świadomie nie wykonuje zaplanowanych kursów i zostawia pasażerów bez dojazdu” przypisuje odpowiedzialność za szkodę celowemu działaniu postaci. To przykład przyczynowości konstruowanej wewnątrz narracji o lokalnych przewozach autobusowych. Nie jest to dowód, że wypowiedź zmieniła opinię odbiorcy, ani ustalenie, że opisane zachowanie rzeczywiście miało miejsce.","das":"Przykład fikcyjny: W zbiorze tekstów o lokalnych przewozach autobusowych porównujesz udział przedstawień bohaterów, antagonistów i ofiar. Dominujące eksponowanie zdolności pomocy postaci określonej jako „organizator transportu” może wskazywać angel shift; dominujące obwinianie przeciwników — devil shift, a akcentowanie krzywdy ofiar — solidarity shift. Najpierw ustal jednostkę i sposób porównania. Pojedyncza wzmianka o roli nie rozstrzyga, która strategia dominuje.","mechanisms":"Przykład fikcyjny: Po lekturze opowieści o lokalnych przewozach autobusowych czytelniczka odczuwa sympatię do proponowanego bohatera i zaczyna popierać jego rozwiązanie — to możliwy ślad toru prowadzącego przez afekt do perswazji. Inny czytelnik już popierał rozwiązanie, lecz teraz uznaje sprawę za pilną i wysyła pytanie do urzędu — to możliwy ślad uwagi i mobilizacji. Samo następstwo nie potwierdza wpływu narracji. Do odróżnienia perswazji od manipulacji nie wystarczy też ocena, że proponowane rozwiązanie jest politycznie niesłuszne.","learning":"Przykład fikcyjny: W dyskusji o lokalnych przewozach autobusowych nowe dane o zasięgu problemu prowadzą do trwałej zmiany preferencji: to przykład tradycyjnego uczenia. Przy tych samych danych uczestnicy mogą przyjąć nową opowieść, która w roli ofiary eksponuje inną grupę, określoną jako „osoby odwiedzające bliskich w szpitalu”. Jeśli ta zmiana zostaje przyjęta i utrzymuje się, ilustruje narracyjne uczenie. Jedna deklaracja tuż po lekturze nie potwierdza trwałości.","levels":"Przykład fikcyjny: Mikro: badasz reakcję osoby na opowieść o lokalnych przewozach autobusowych. Mezo: badasz używanie narracji przez grupy w sporze. Makro: rozważasz szerszą opowieść „Ludzie pozbawieni podstawowych usług tracą szansę uczestniczenia w życiu społecznym; instytucje zapewniające równy dostęp pomagają im odzyskać samodzielność, dlatego państwo powinno usuwać bariery dostępu.” i sprawdzasz, czy utrwala się przez lata w kulturze lub instytucjach oraz organizuje różne debaty polityczne. Sama wartość lub pojedynczy postulat nie wystarcza do rozpoznania takiej makronarracji.","evidence":"Przykład fikcyjny: Teza: wypowiedź o lokalnych przewozach autobusowych zawiera jawny postulat działania. Fragment „Uruchommy wieczorny kurs skoordynowany z godzinami końca zmian” wspiera tę tezę. Metryka podająca jedynie datę publikacji nie rozstrzyga jej, ale nie odbiera znaczenia pierwszemu fragmentowi. Status tezy dotyczy całego zebranego materiału, a relacja — każdego fragmentu ocenianego z osobna.","uncertainty":"Przykład fikcyjny: W krótkim streszczeniu debaty o lokalnych przewozach autobusowych zapisano, że omawiano problem określony jako „brak możliwości powrotu do domu autobusem”. Chcesz sprawdzić tezę, że narrator wprost obwinił konkretną instytucję, lecz nie masz pełnej wypowiedzi. Streszczenie tego nie rozstrzyga: trzeba odnaleźć oryginał. Brak informacji o obwinianiu w streszczeniu nie dowodzi, że nie było go w wypowiedzi."},"BK2":{"narrative":"Przykład fikcyjny: W wypowiedzi o programie wsparcia zakupu mieszkania wskazano, że szkody doświadczają gospodarstwa domowe napotykające barierę zakupu pierwszego mieszkania. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.","form":"Przykład fikcyjny: Opowieść o programie wsparcia zakupu mieszkania: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Wsparcie ma zmniejszyć koszt finansowania i umożliwić zakup mieszkania” łączy działanie ze zmianą sytuacji (fabuła). „Zaprojektujmy wsparcie dla gospodarstw napotykających barierę finansowania” wskazuje postulowane działanie (morał). Te cztery kody opisują budowę wypowiedzi.","characters":"Przykład fikcyjny: Ofiara: gospodarstwa domowe napotykające barierę zakupu pierwszego mieszkania — w opowieści to grupa narażona na szkodę. Bohater: projektanci programu wsparcia — jeśli tekst właśnie tej postaci przypisuje możliwość pomocy. Antagonistę można rozpoznać w osobnej wypowiedzi: „Pośrednik A świadomie wprowadza klientów w błąd i pogarsza ich sytuację finansową”. To odczytanie ról w wymyślonych tekstach, nie ocena rzeczywistych podmiotów.","setting":"Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o programie wsparcia zakupu mieszkania”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.","plot":"Przykład fikcyjny: „Gospodarstwa opisały barierę zakupu pierwszego mieszkania. Projektanci przedstawili propozycję wsparcia; część uczestników debaty zażądała zmiany kryteriów dostępu przed jej przyjęciem.” Fabuła łączy tu działania postaci w sekwencję: zgłoszenie trudności, propozycja pomocy i żądanie jej zmiany. Pokazuje również relację między uczestnikami sporu. Samo hasło „niemożność sfinansowania pierwszego mieszkania” nazywa trudność, ale nie odtwarza tej fabuły.","moral":"Przykład fikcyjny: „Zaprojektujmy wsparcie dla gospodarstw napotykających barierę finansowania” jest postulatem działania. Wypowiedź mogłaby też zakończyć się szerszą lekcją „Wspólne instytucje powinny pomagać osobom, które same nie mogą usunąć tej bariery”. Morał nie musi być gotowym projektem przepisu ani tym, z czym zgadza się czytelnik.","narrator":"Przykład fikcyjny: O programie wsparcia zakupu mieszkania wypowiada się fikcyjne stowarzyszenie gospodarstw domowych — to narrator. W tej opowieści rolę proponowanego bohatera pełni postać określona jako „projektanci programu wsparcia”. Adresatami mogą być radni albo mieszkańcy. Jeśli gazetowy artykuł cytuje tę wypowiedź, odróżnij narrację cytowanej grupy od komentarza dziennikarza.","content":"Przykład fikcyjny: W zdaniu „Państwo powinno wspierać dostęp do pierwszego mieszkania” można rozpoznać wyrażone przekonanie normatywne. Użycie tego przekonania do przedstawienia sprawy jako ważnej dla wielu grup może służyć strategii narracyjnej. Nie przypisuj jednak autorowi całej ideologii na podstawie jednego zdania; potrzebujesz reguły kodowania i podstawy teoretycznej.","scope":"Przykład fikcyjny: W debacie o programie wsparcia zakupu mieszkania ktoś mówi: „Skutki tego rozwiązania obciążają rodziny, pracowników i seniorów w całym regionie, a korzyści zbiera kilka podmiotów”. Taki układ kosztów i korzyści przedstawia problem jako dotyczący wielu grup i może służyć rozszerzaniu konfliktu także bez dosłownego zaproszenia do debaty. „To tylko techniczna sprawa wąskiego grona, pozostawmy ją dotychczasowym uczestnikom” wskazuje przeciwny kierunek. Nie wynika z tego, czy skład uczestników rzeczywiście się zmienił.","causal":"Przykład fikcyjny: Wypowiedź „Pośrednik A świadomie wprowadza klientów w błąd i pogarsza ich sytuację finansową” przypisuje odpowiedzialność za szkodę celowemu działaniu postaci. To przykład przyczynowości konstruowanej wewnątrz narracji o programie wsparcia zakupu mieszkania. Nie jest to dowód, że wypowiedź zmieniła opinię odbiorcy, ani ustalenie, że opisane zachowanie rzeczywiście miało miejsce.","das":"Przykład fikcyjny: W zbiorze tekstów o programie wsparcia zakupu mieszkania porównujesz udział przedstawień bohaterów, antagonistów i ofiar. Dominujące eksponowanie zdolności pomocy postaci określonej jako „projektanci programu wsparcia” może wskazywać angel shift; dominujące obwinianie przeciwników — devil shift, a akcentowanie krzywdy ofiar — solidarity shift. Najpierw ustal jednostkę i sposób porównania. Pojedyncza wzmianka o roli nie rozstrzyga, która strategia dominuje.","mechanisms":"Przykład fikcyjny: Po lekturze opowieści o programie wsparcia zakupu mieszkania czytelniczka odczuwa sympatię do proponowanego bohatera i zaczyna popierać jego rozwiązanie — to możliwy ślad toru prowadzącego przez afekt do perswazji. Inny czytelnik już popierał rozwiązanie, lecz teraz uznaje sprawę za pilną i wysyła pytanie do urzędu — to możliwy ślad uwagi i mobilizacji. Samo następstwo nie potwierdza wpływu narracji. Do odróżnienia perswazji od manipulacji nie wystarczy też ocena, że proponowane rozwiązanie jest politycznie niesłuszne.","learning":"Przykład fikcyjny: W dyskusji o programie wsparcia zakupu mieszkania nowe dane o zasięgu problemu prowadzą do trwałej zmiany preferencji: to przykład tradycyjnego uczenia. Przy tych samych danych uczestnicy mogą przyjąć nową opowieść, która w roli ofiary eksponuje inną grupę, określoną jako „gospodarstwa pozostające na rynku najmu”. Jeśli ta zmiana zostaje przyjęta i utrzymuje się, ilustruje narracyjne uczenie. Jedna deklaracja tuż po lekturze nie potwierdza trwałości.","levels":"Przykład fikcyjny: Mikro: badasz reakcję osoby na opowieść o programie wsparcia zakupu mieszkania. Mezo: badasz używanie narracji przez grupy w sporze. Makro: rozważasz szerszą opowieść „Rodziny pozbawione trwałego miejsca życia pozostają zależne od silniejszych; instytucje wspierające własność pomagają im uzyskać samodzielność, dlatego własne mieszkanie powinno być podstawą społecznego bezpieczeństwa.” i sprawdzasz, czy utrwala się przez lata w kulturze lub instytucjach oraz organizuje różne debaty polityczne. Sama wartość lub pojedynczy postulat nie wystarcza do rozpoznania takiej makronarracji.","evidence":"Przykład fikcyjny: Teza: wypowiedź o programie wsparcia zakupu mieszkania zawiera jawny postulat działania. Fragment „Zaprojektujmy wsparcie dla gospodarstw napotykających barierę finansowania” wspiera tę tezę. Metryka podająca jedynie datę publikacji nie rozstrzyga jej, ale nie odbiera znaczenia pierwszemu fragmentowi. Status tezy dotyczy całego zebranego materiału, a relacja — każdego fragmentu ocenianego z osobna.","uncertainty":"Przykład fikcyjny: W krótkim streszczeniu debaty o programie wsparcia zakupu mieszkania zapisano, że omawiano problem określony jako „niemożność sfinansowania pierwszego mieszkania”. Chcesz sprawdzić tezę, że narrator wprost obwinił konkretną instytucję, lecz nie masz pełnej wypowiedzi. Streszczenie tego nie rozstrzyga: trzeba odnaleźć oryginał. Brak informacji o obwinianiu w streszczeniu nie dowodzi, że nie było go w wypowiedzi."},"CP":{"narrative":"Przykład fikcyjny: W wypowiedzi o programie poprawy efektywności energetycznej domów wskazano, że szkody doświadczają gospodarstwa ponoszące wysokie koszty ogrzewania niedocieplonych domów. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.","form":"Przykład fikcyjny: Opowieść o programie poprawy efektywności energetycznej domów: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Doradztwo ma ułatwić modernizację domu, a ta zmniejszyć zapotrzebowanie na energię” łączy działanie ze zmianą sytuacji (fabuła). „Zapewnijmy mieszkańcom dostęp do doradztwa i wsparcia modernizacji” wskazuje postulowane działanie (morał). Te cztery kody opisują budowę wypowiedzi.","characters":"Przykład fikcyjny: Ofiara: gospodarstwa ponoszące wysokie koszty ogrzewania niedocieplonych domów — w opowieści to grupa narażona na szkodę. Bohater: zespół doradców gminnych — jeśli tekst właśnie tej postaci przypisuje możliwość pomocy. Antagonistę można rozpoznać w osobnej wypowiedzi: „Wykonawca A świadomie pobiera zaliczki bez wykonania prac i pogarsza sytuację gospodarstw”. To odczytanie ról w wymyślonych tekstach, nie ocena rzeczywistych podmiotów.","setting":"Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o programie poprawy efektywności energetycznej domów”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.","plot":"Przykład fikcyjny: „Mieszkańcy opisali trudności z ogrzaniem domów. Zespół doradców zaproponował pomoc w modernizacji; właściciele poprosili o zmianę kolejności prac, aby nie pozostawać bez ogrzewania zimą.” Fabuła łączy tu działania postaci w sekwencję: zgłoszenie trudności, propozycja pomocy i żądanie jej zmiany. Pokazuje również relację między uczestnikami sporu. Samo hasło „wysokie koszty utrzymania odpowiedniej temperatury w domu” nazywa trudność, ale nie odtwarza tej fabuły.","moral":"Przykład fikcyjny: „Zapewnijmy mieszkańcom dostęp do doradztwa i wsparcia modernizacji” jest postulatem działania. Wypowiedź mogłaby też zakończyć się szerszą lekcją „Wspólne instytucje powinny pomagać osobom, które same nie mogą usunąć tej bariery”. Morał nie musi być gotowym projektem przepisu ani tym, z czym zgadza się czytelnik.","narrator":"Przykład fikcyjny: O programie poprawy efektywności energetycznej domów wypowiada się fikcyjna grupa mieszkańców gminy — to narrator. W tej opowieści rolę proponowanego bohatera pełni postać określona jako „zespół doradców gminnych”. Adresatami mogą być radni albo mieszkańcy. Jeśli gazetowy artykuł cytuje tę wypowiedź, odróżnij narrację cytowanej grupy od komentarza dziennikarza.","content":"Przykład fikcyjny: W zdaniu „Transformacja en
