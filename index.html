const GLOSSARY=[{"id": "narrative", "title": "Narracja i jej minimum", "english": "Policy narrative; narrativity", "group": "Struktura opowieści", "definition": "Operacyjne minimum narracji w NPF to co najmniej jedna postać oraz odniesienie do polityki publicznej. Narracja nie musi zawierać wszystkich czterech elementów formy ani wszystkich ról postaci. Narracyjność określa stopień obecności i kompletności elementów formy oraz treści ponad to minimum.", "caution": "Narracyjność nie jest oceną jakości literackiej, prawdziwości ani skuteczności opowieści. Rozpoznanie narracji nie potwierdza jej twierdzeń.", "pages": "167", "kind": "NPF"}, {"id": "form", "title": "Forma opowieści", "english": "Narrative form", "group": "Struktura opowieści", "definition": "Forma to budowa opowieści: postacie, tło, fabuła i morał. Są to kategorie, które pozwalają porównywać narracje dotyczące różnych problemów. Forma i treść są odróżnialne, ale powiązane: konkretny sposób przedstawienia postaci może zarazem wyrażać przekonanie lub strategię.", "caution": "Nie traktuj listy czterech elementów jako warunku, który każda narracja musi spełnić w całości. Niektóre elementy mogą być domyślne; ich rozpoznanie trzeba uzasadnić tekstem.", "pages": "163–165; minimum: 167", "kind": "NPF"}, {"id": "characters", "title": "Postacie i trzy podstawowe role", "english": "Characters: victim, hero, villain", "group": "Struktura opowieści", "definition": "Postacie są uczestnikami przedstawionymi w opowieści w określonych rolach. Ofiara doświadcza szkody lub jest nią zagrożona. Bohater oferuje pomoc w ograniczeniu szkody albo rozwiązaniu problemu. Antagonista jest przedstawiony jako sprawca szkody lub źródło problemu.", "caution": "Kod opisuje przedstawienie w tekście: bohater nie musi mieć potwierdzonej skuteczności, a przeciwnik polityczny nie jest automatycznie antagonistą. Sama nazwa przyczyny problemu nie musi oznaczać postaci.", "pages": "163–164; minimum jednej postaci: 167", "kind": "NPF"}, {"id": "setting", "title": "Tło i kontekst", "english": "Setting", "group": "Struktura opowieści", "definition": "Tło to okoliczności, w których opowieść umieszcza problem i postacie. Obejmuje miejsce i czas, ale również reguły prawne, zasoby, istotne zdarzenia oraz kontekst społeczny i ideowy. Chodzi o okoliczności przedstawiane jako ważne dla danej sprawy.", "caution": "Tło nie ogranicza się do miejscowości i daty. Nie dopisuj wszystkich znanych Ci uwarunkowań programu, jeżeli analizowany fragment ich nie przedstawia.", "pages": "163–164", "kind": "NPF"}, {"id": "plot", "title": "Fabuła", "english": "Plot", "group": "Struktura opowieści", "definition": "Fabuła łączy postacie z działaniami, zdarzeniami i kontekstem. Porządkuje to, co się dzieje, oraz przedstawia relacje, konflikty i motywy. Może zawierać wyjaśnienie przyczynowe, ale nie sprowadza się do pojedynczego związku przyczyny i skutku.", "caution": "Odtworzenie fabuły mówi, jak opowieść przedstawia zdarzenia. Nie potwierdza, że właśnie tak przebiegał rzeczywisty proces ani że następstwo zdarzeń dowodzi przyczynowości.", "pages": "163, 165", "kind": "NPF"}, {"id": "moral", "title": "Morał — wniosek opowieści", "english": "Moral", "group": "Struktura opowieści", "definition": "Morał to wniosek wynikający z opowieści: proponowane rozwiązanie publiczne, wezwanie do działania albo lekcja płynąca z opowieści. Może być wyrażony wprost albo wynikać z przedstawienia problemu i rozwiązania. Nie musi być osobnym zdaniem zaczynającym się od słowa „należy”.", "caution": "Nie utożsamiaj morału wyłącznie z moralizowaniem ani wyłącznie z formalnym projektem programu. Nie przypisuj tekstowi własnego postulatu, którego nie da się z niego uzasadnić.", "pages": "165; struktura jawna lub domyślna: 163", "kind": "NPF"}, {"id": "narrator", "title": "Narrator i odbiorca", "english": "Narrator and audience", "group": "Struktura opowieści", "definition": "Narrator przedstawia opowieść, a odbiorca ją przyjmuje i interpretuje. To, kto opowiada, komu i jak te strony postrzegają siebie nawzajem, może mieć znaczenie dla oddziaływania narracji. Narrator i bohater mogą być tym samym podmiotem, lecz są różnymi rolami: pierwszy opowiada, drugi w opowieści oferuje rozwiązanie.", "caution": "Przy cytacie sprawdź, kto wypowiada analizowaną narrację; wydawca strony lub autor całego dokumentu nie musi być narratorem cytowanego fragmentu. Sama publikacja postulatu nie nadaje narratorowi roli bohatera.", "pages": "167–168; bohater: 164", "kind": "NPF"}, {"id": "content", "title": "Treść: przekonania i strategie", "english": "Narrative content", "group": "Treść i strategie", "definition": "Treść mówi, jakie znaczenie opowieść nadaje problemowi, postaciom i rozwiązaniom. Systemy przekonań pomagają uchwycić sposoby rozumienia i oceniania tych elementów. Strategie narracyjne dotyczą tego, jak i po co narrator organizuje oraz akcentuje elementy opowieści. W systematycznym badaniu rozpoznawanie przekonań wymaga jasno określonej podstawy teoretycznej i reguł kodowania.", "caution": "Nie przypisuj autorowi całej ideologii na podstawie jednego zdania. Rozpoznanie sposobu przedstawienia nie jest jeszcze dowodem jego skuteczności ani pełnej wiedzy o intencjach autora.", "pages": "165–166; powiązanie formy i treści: 164", "kind": "NPF"}, {"id": "scope", "title": "Rozszerzanie i ograniczanie konfliktu", "english": "Scope of conflict", "group": "Treść i strategie", "definition": "Jest to strategiczne przedstawianie sprawy w sposób, który ma rozszerzyć lub ograniczyć zaangażowanie w nią. Narrator może zapraszać nowe grupy, ale również przedstawiać sprawę jako dotyczącą wielu ludzi albo wąskiego grona. W badaniach analizowano między innymi rozpraszanie kosztów na liczne grupy i skupianie korzyści u nielicznych albo odwrotny sposób przedstawienia ich rozkładu. Dosłowne wezwanie nowych uczestników jest więc jednym ze sposobów, a nie całą definicją tej strategii.", "caution": "Rozpoznanie strategii nie dowodzi zmiany kręgu uczestników. Wyniki dotyczące wygrywania i przegrywania są mieszane; rozdział omawia też alternatywną hipotezę o obronie status quo i dążeniu do zmiany. Nie używaj tych hipotez jako automatycznego klucza kodowania.", "pages": "166, 174–175", "kind": "NPF"}, {"id": "causal", "title": "Strategie przyczynowe w narracji", "english": "Narrative causal strategies", "group": "Treść i strategie", "definition": "To sposób przedstawienia, dlaczego powstał problem oraz komu przypisuje się odpowiedzialność lub winę. Dotyczy przyczynowego wyjaśnienia wewnątrz opowieści, budowanego przez układ jej elementów. Rozdział wymienia za Stone cztery typy wyjaśnień: intencjonalne, niezamierzone, przypadkowe i mechaniczne, bez ich szczegółowego zdefiniowania w tym miejscu.", "caution": "Nie myl przyczyny opisywanej przez narratora z mechanizmem wpływu samej narracji na odbiorców lub politykę. W rozdziale zmieniono dawną nazwę „causal mechanisms” właśnie po to, by ograniczyć to nieporozumienie.", "pages": "166; przypis 6: 184", "kind": "NPF"}, {"id": "das", "title": "Akcentowanie winy, pomocy i krzywdy", "english": "Devil–angel–solidarity shifts", "group": "Treść i strategie", "definition": "Devil shift polega na akcentowaniu winy przeciwników przedstawianych jako antagoniści. Angel shift akcentuje bohaterów i ich zdolność rozwiązania problemu. Solidarity shift akcentuje ofiary i wyrządzoną im krzywdę. W badaniu ocenia się względne natężenie przedstawień postaci, często za pomocą ich proporcji.", "caution": "Samo pojawienie się bohatera, ofiary lub antagonisty nie wystarcza do wykazania strategii. Słowo „shift” nie musi oznaczać zmiany w czasie, a wyniki badań nie uzasadniają prostego przypisania tych strategii do zwycięzców i przegranych.", "pages": "166–167; ograniczenia hipotez: 176–177", "kind": "NPF"}, {"id": "mechanisms", "title": "Jak narracja może oddziaływać", "english": "Narrative mechanisms of policy change", "group": "Wpływ i badanie", "definition": "W modelu przedstawionym w rozdziale forma i treść narracji mogą wzbudzać afekt, czyli reakcję emocjonalną i oceniającą. Autorzy proponują dwa dalsze tory: perswazja lub manipulacja prowadząca do uczenia oraz uwaga prowadząca do mobilizacji. Tor uwagi może pobudzać działanie bez zmiany przekonań odbiorcy. Są to proponowane mechanizmy oddziaływania na wszystkich trzech poziomach analizy.", "caution": "To model do sprawdzania, a nie gwarancja skuteczności każdej opowieści. Zasięg publikacji nie dowodzi zmiany przekonań, a reakcja odbiorców sama nie dowodzi spowodowania decyzji publicznej.", "pages": "168–169; afekt: także 170", "kind": "NPF", "detailTitle": "Perswazja a manipulacja — doprecyzowanie", "detail": "W rozróżnieniu proponowanym przez autorów odbiorcy przyjmują opowieść i działają zgodnie z nią, ponieważ jest to w ich interesie (perswazja) albo sądzą, że tak jest (manipulacja). Autorzy zaznaczają, że odróżnienie tych sytuacji jest trudne i wymaga trafnych, rzetelnych reguł badania. Sama obecność emocji ani niezgoda z poglądem narratora nie dowodzi manipulacji. Podstawa: s. 169 i przypis 8 na s. 184."}, {"id": "learning", "title": "Uczenie się a przyjęcie nowej narracji", "english": "Policy learning; narrative policy learning", "group": "Wpływ i badanie", "definition": "W tradycyjnym ujęciu uczenie się w polityce wiąże się z trwałą zmianą preferencji lub zachowań pod wpływem nowej informacji. Uczenie narracyjne polega na przyjęciu nowej konfiguracji elementów opowieści, nawet gdy inne informacje, w tym dowody naukowe, pozostają te same. Rozdział traktuje trwałą zmianę dominujących narracji jako możliwą drogę do zmiany polityki.", "caution": "Chwilowa deklaracja poparcia nie wystarcza do wykazania trwałego uczenia. Omawiana hipoteza łącząca utrwaloną rekonfigurację narracji ze zmianą polityki jest w tym rozdziale oznaczona jako jeszcze nieprzetestowana.", "pages": "169, 177–178", "kind": "NPF"}, {"id": "levels", "title": "Poziomy: mikro, mezo i makro", "english": "Levels of analysis", "group": "Wpływ i badanie", "definition": "Mikro: jak poszczególne osoby tworzą i odbierają narracje. Mezo: jak aktorzy zorganizowani w grupy i koalicje strategicznie używają narracji w podsystemie polityki. Makro: jak narracje osadzone w kulturach i instytucjach kształtują politykę publiczną.", "caution": "Poziom wynika z pytania badawczego, nie ze szczebla administracji, wielkości próby ani formatu dokumentu. Program krajowy można badać na poziomie mikro, a lokalny na poziomie makro.", "pages": "169; mikro: 173; mezo: 174; makro: 179–180; przypis 9: 185", "kind": "NPF", "detailTitle": "Poziom, jednostka analizy i obserwacji", "detail": "Poziom analizy wskazuje teoretyczną skalę działania narracji. W rozróżnieniu tego rozdziału jednostka analizy to podmiot, z którego narracje pochodzą (osoba, grupa lub instytucja), a jednostka obserwacji to wyodrębniony materiał, w którym koduje się dane narracyjne (np. zdanie, akapit, dokument lub film). Szczebel administracji to jeszcze inne rozróżnienie. Podstawa: przypis 9 na s. 185."}, {"id": "evidence", "title": "Teza, dowód i ocena w grze", "english": "", "group": "Narzędzia w grze", "definition": "To autorska pomoc metodyczna w grze, a nie osobne pojęcie NPF z rozdziału. Teza jest sprawdzanym twierdzeniem, a materiał dowodowy to pozyskany fragment lub karta, na których opierasz ocenę. Relacja karty do tezy mówi, czy ta konkretna informacja ją wspiera, osłabia czy nie rozstrzyga. Status tezy wyraża ocenę całego aktualnie pozyskanego materiału.", "caution": "Karta nierozstrzygająca nie unieważnia automatycznie innej, która dostarcza trafnego wsparcia lub osłabienia. „Wsparta” nie znaczy „ostatecznie udowodniona”, a „osłabiona” nie zawsze znaczy „wykluczona”.", "pages": "", "kind": "metoda gry"}, {"id": "uncertainty", "title": "Nierozstrzygnięcie i granice wniosku", "english": "", "group": "Narzędzia w grze", "definition": "To autorska pomoc metodyczna w grze, a nie osobne pojęcie NPF z rozdziału. Status „nierozstrzygnięta” oznacza, że pozyskany materiał nie daje wystarczającej podstawy do wsparcia ani osłabienia konkretnej tezy. Uzasadnienie powinno wskazać, czego nie mierzy dostępny materiał i jakiej informacji nadal brakuje.", "caution": "Brak dowodu efektu nie jest dowodem braku efektu. Nie wybieraj nierozstrzygnięcia automatycznie, jeśli zdobyte akta zawierają już informację wyraźnie zmieniającą ocenę tezy.", "pages": "", "kind": "metoda gry"}], GEXAMPLES={"SCT": {"narrative": "Przykład fikcyjny: W wypowiedzi o strefie czystego transportu wskazano, że szkody doświadczają dzieci uczące się przy ruchliwej ulicy. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.", "form": "Przykład fikcyjny: Opowieść o strefie czystego transportu: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Ograniczenie ruchu ma zmniejszyć narażenie dzieci na spaliny” łączy działanie ze zmianą sytuacji (fabuła). „Wprowadźmy ograniczenia ruchu z pomocą dla osób potrzebujących dostosowania” wskazuje postulowane działanie (morał). Te cztery kody opisują budowę wypowiedzi.", "characters": "Przykład fikcyjny: Ofiara: dzieci uczące się przy ruchliwej ulicy — w opowieści to grupa narażona na szkodę. Bohater: zespół miejski — jeśli tekst właśnie tej postaci przypisuje możliwość pomocy. Antagonistę można rozpoznać w osobnej wypowiedzi: „Firma A celowo obchodzi ograniczenia i naraża dzieci na spaliny”. To odczytanie ról w wymyślonych tekstach, nie ocena rzeczywistych podmiotów.", "setting": "Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o strefie czystego transportu”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.", "plot": "Przykład fikcyjny: „Rodzice opisali problem spalin przy szkole. Zespół miejski przedstawił wariant ograniczeń ruchu, a część mieszkańców zażądała okresu dostosowania przed ich wprowadzeniem.” Fabuła łączy tu działania postaci w sekwencję: zgłoszenie trudności, propozycja pomocy i żądanie jej zmiany. Pokazuje również relację między uczestnikami sporu. Samo hasło „narażenie na spaliny” nazywa trudność, ale nie odtwarza tej fabuły.", "moral": "Przykład fikcyjny: „Wprowadźmy ograniczenia ruchu z pomocą dla osób potrzebujących dostosowania” jest postulatem działania. Wypowiedź mogłaby też zakończyć się szerszą lekcją „Wspólne instytucje powinny pomagać osobom, które same nie mogą usunąć tej bariery”. Morał nie musi być gotowym projektem przepisu ani tym, z czym zgadza się czytelnik.", "narrator": "Przykład fikcyjny: O strefie czystego transportu wypowiada się fikcyjna grupa rodziców — to narrator. W tej opowieści rolę proponowanego bohatera pełni postać określona jako „zespół miejski”. Adresatami mogą być radni albo mieszkańcy. Jeśli gazetowy artykuł cytuje tę wypowiedź, odróżnij narrację cytowanej grupy od komentarza dziennikarza.", "content": "Przykład fikcyjny: W zdaniu „Ochrona zdrowia powinna mieć pierwszeństwo w organizacji ruchu” można rozpoznać wyrażone przekonanie normatywne. Użycie tego przekonania do przedstawienia sprawy jako ważnej dla wielu grup może służyć strategii narracyjnej. Nie przypisuj jednak autorowi całej ideologii na podstawie jednego zdania; potrzebujesz reguły kodowania i podstawy teoretycznej.", "scope": "Przykład fikcyjny: W debacie o strefie czystego transportu ktoś mówi: „Skutki tego rozwiązania obciążają rodziny, pracowników i seniorów w całym regionie, a korzyści zbiera kilka podmiotów”. Taki układ kosztów i korzyści przedstawia problem jako dotyczący wielu grup i może służyć rozszerzaniu konfliktu także bez dosłownego zaproszenia do debaty. „To tylko techniczna sprawa wąskiego grona, pozostawmy ją dotychczasowym uczestnikom” wskazuje przeciwny kierunek. Nie wynika z tego, czy skład uczestników rzeczywiście się zmienił.", "causal": "Przykład fikcyjny: Wypowiedź „Firma A celowo obchodzi ograniczenia i naraża dzieci na spaliny” przypisuje odpowiedzialność za szkodę celowemu działaniu postaci. To przykład przyczynowości konstruowanej wewnątrz narracji o strefie czystego transportu. Nie jest to dowód, że wypowiedź zmieniła opinię odbiorcy, ani ustalenie, że opisane zachowanie rzeczywiście miało miejsce.", "das": "Przykład fikcyjny: W zbiorze tekstów o strefie czystego transportu porównujesz udział przedstawień bohaterów, antagonistów i ofiar. Dominujące eksponowanie zdolności pomocy postaci określonej jako „zespół miejski” może wskazywać angel shift; dominujące obwinianie przeciwników — devil shift, a akcentowanie krzywdy ofiar — solidarity shift. Najpierw ustal jednostkę i sposób porównania. Pojedyncza wzmianka o roli nie rozstrzyga, która strategia dominuje.", "mechanisms": "Przykład fikcyjny: Po lekturze opowieści o strefie czystego transportu czytelniczka odczuwa sympatię do proponowanego bohatera i zaczyna popierać jego rozwiązanie — to możliwy ślad toru prowadzącego przez afekt do perswazji. Inny czytelnik już popierał rozwiązanie, lecz teraz uznaje sprawę za pilną i wysyła pytanie do urzędu — to możliwy ślad uwagi i mobilizacji. Samo następstwo nie potwierdza wpływu narracji. Do odróżnienia perswazji od manipulacji nie wystarczy też ocena, że proponowane rozwiązanie jest politycznie niesłuszne.", "learning": "Przykład fikcyjny: W dyskusji o strefie czystego transportu nowe dane o zasięgu problemu prowadzą do trwałej zmiany preferencji: to przykład tradycyjnego uczenia. Przy tych samych danych uczestnicy mogą przyjąć nową opowieść, która w roli ofiary eksponuje inną grupę, określoną jako „osoby dojeżdżające na leczenie”. Jeśli ta zmiana zostaje przyjęta i utrzymuje się, ilustruje narracyjne uczenie. Jedna deklaracja tuż po lekturze nie potwierdza trwałości.", "levels": "Przykład fikcyjny: Mikro: badasz reakcję osoby na opowieść o strefie czystego transportu. Mezo: badasz używanie narracji przez grupy w sporze. Makro: rozważasz szerszą opowieść „Obywatele zyskują samodzielność, gdy wspólne instytucje usuwają bariery przemieszczania; dlatego organizacja przestrzeni i usług powinna chronić ich możliwość swobodnego poruszania się.” i sprawdzasz, czy utrwala się przez lata w kulturze lub instytucjach oraz organizuje różne debaty polityczne. Sama wartość lub pojedynczy postulat nie wystarcza do rozpoznania takiej makronarracji.", "evidence": "Przykład fikcyjny: Teza: wypowiedź o strefie czystego transportu zawiera jawny postulat działania. Fragment „Wprowadźmy ograniczenia ruchu z pomocą dla osób potrzebujących dostosowania” wspiera tę tezę. Metryka podająca jedynie datę publikacji nie rozstrzyga jej, ale nie odbiera znaczenia pierwszemu fragmentowi. Status tezy dotyczy całego zebranego materiału, a relacja — każdego fragmentu ocenianego z osobna.", "uncertainty": "Przykład fikcyjny: W krótkim streszczeniu debaty o strefie czystego transportu zapisano, że omawiano problem określony jako „narażenie na spaliny”. Chcesz sprawdzić tezę, że narrator wprost obwinił konkretną instytucję, lecz nie masz pełnej wypowiedzi. Streszczenie tego nie rozstrzyga: trzeba odnaleźć oryginał. Brak informacji o obwinianiu w streszczeniu nie dowodzi, że nie było go w wypowiedzi."}, "BO": {"narrative": "Przykład fikcyjny: W wypowiedzi o budżecie obywatelskim wskazano, że szkody doświadczają mieszkańcy osiedla pozbawieni miejsca spotkań w cieniu. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.", "form": "Przykład fikcyjny: Opowieść o budżecie obywatelskim: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Ogród ma zapewnić cień i umożliwić sąsiadom wspólne spotkania” łączy działanie ze zmianą sytuacji (fabuła). „Przeznaczmy część budżetu na  lokalnych przewozach autobusowych. Mezo: badasz używanie narracji przez grupy w sporze. Makro: rozważasz szerszą opowieść „Ludzie pozbawieni podstawowych usług tracą szansę uczestniczenia w życiu społecznym; instytucje zapewniające równy dostęp pomagają im odzyskać samodzielność, dlatego państwo powinno usuwać bariery dostępu.” i sprawdzasz, czy utrwala się przez lata w kulturze lub instytucjach oraz organizuje różne debaty polityczne. Sama wartość lub pojedynczy postulat nie wystarcza do rozpoznania takiej makronarracji.", "evidence": "Przykład fikcyjny: Teza: wypowiedź o lokalnych przewozach autobusowych zawiera jawny postulat działania. Fragment „Uruchommy wieczorny kurs skoordynowany z godzinami końca zmian” wspiera tę tezę. Metryka podająca jedynie datę publikacji nie rozstrzyga jej, ale nie odbiera znaczenia pierwszemu fragmentowi. Status tezy dotyczy całego zebranego materiału, a relacja — każdego fragmentu ocenianego z osobna.", "uncertainty": "Przykład fikcyjny: W krótkim streszczeniu debaty o lokalnych przewozach autobusowych zapisano, że omawiano problem określony jako „brak możliwości powrotu do domu autobusem”. Chcesz sprawdzić tezę, że narrator wprost obwinił konkretną instytucję, lecz nie masz pełnej wypowiedzi. Streszczenie tego nie rozstrzyga: trzeba odnaleźć oryginał. Brak informacji o obwinianiu w streszczeniu nie dowodzi, że nie było go w wypowiedzi."}, "BK2": {"narrative": "Przykład fikcyjny: W wypowiedzi o programie wsparcia zakupu mieszkania wskazano, że szkody doświadczają gospodarstwa domowe napotykające barierę zakupu pierwszego mieszkania. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.", "form": "Przykład fikcyjny: Opowieść o programie wsparcia zakupu mieszkania: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Wsparcie ma zmniejszyć koszt finans stach, nie ocena rzeczywistych podmiotów.", "setting": "Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o programie poprawy efektywności energetycznej domów”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.", "plot": "Przykład fikcyjny: „Mieszkańcy opisali trudności z ogrzaniem domów. Zespół doradców zaproponował pomoc w modernizacji; właściciele poprosili o zmianę kolejności prac, aby nie pozostawać bez ogrzewania zimą.” Fabuła łączy tu działania postaci w sekwencję: zgłoszenie trudności, propozycja pomocy i żądanie jej zmiany. Pokazuje również relację między uczestnikami sporu. Samo hasło „wysokie koszty utrzymania odpowiedniej temperatury w domu” nazywa trudność, ale nie odtwarza tej fabuły.", "moral": "Przykład fikcyjny: „Zapewnijmy mieszkańcom dostęp do doradztwa i wsparcia modernizacji” jest postulatem działania. Wypowiedź mogłaby też zakończyć się szerszą lekcją „Wspólne instytucje powinny pomagać osobom, które same nie mogą usunąć tej bariery”. Morał nie musi być gotowym projektem przepisu ani tym, z czym zgadza się czytelnik.", "narrator": "Przykład fikcyjny: O programie poprawy efektywności energetycznej domów wypowiada się fikcyjna grupa mieszkańców gminy — to narrator. W tej opowieści rolę proponowanego bohatera pełni postać określona jako „zespół doradców gminnych”. Adresatami mogą być radni albo mieszkańcy. Jeśli gazetowy artykuł cytuje tę wypowiedź, odróżnij narrację cytowanej grupy od komentarza dziennikarza.", "content": "Przykład fikcyjny: W zdaniu „Transformacja energetyczna powinna uwzględniać gospodarstwa o mniejszych zasobach” można rozpoznać wyrażone przekonanie normatywne. Użycie tego przekonania do przedstawienia sprawy jako ważnej dla wielu grup może służyć strategii narracyjnej. Nie przypisuj jednak autorowi całej ideologii na podstawie jednego zdania; potrzebu  Do odróżnienia perswazji od manipulacji nie wystarczy też ocena, że proponowane rozwiązanie jest politycznie niesłuszne.", "learning": "Przykład fikcyjny: W dyskusji o programie poprawy efektywności energetycznej domów nowe dane o zasięgu problemu prowadzą do trwałej zmiany preferencji: to przykład tradycyjnego uczenia. Przy tych samych danych uczestnicy mogą przyjąć nową opowieść, która w roli ofiary eksponuje inną grupę, określoną jako „najemcy niedocieplonych domów”. Jeśli ta zmiana zostaje przyjęta i utrzymuje się, ilustruje narracyjne uczenie. Jedna deklaracja tuż po lekturze nie potwierdza trwałości.", "levels": "Przykład fikcyjny: Mikro: badasz reakcję osoby na opowieść o programie poprawy efektywności energetycznej domów. Mezo: badasz używanie narracji przez grupy w sporze. Makro: rozważasz szerszą opowieść „Wspólnota traci spójność, gdy koszty zmian ponoszą głównie słabsi; instytucje rozkładające ciężary sprawiedliwie odbudowują współpracę, dlatego polityka publiczna powinna chronić ludzi o mniejszych zasobach.” i sprawdzasz, czy utrwala się przez lata w kulturze lub instytucjach oraz organizuje różne debaty polityczne. Sama wartość lub pojedynczy postulat nie wystarcza do rozpoznania takiej makronarracji.", "evidence": "Przykład fikcyjny: Teza: wypowiedź o programie poprawy efektywności energetycznej domów zawiera jawny postulat działania. Fragment „Zapewnijmy mieszkańcom dostęp do doradztwa i wsparcia modernizacji” wspiera tę tezę. Metryka podająca jedynie datę publikacji nie rozstrzyga jej, ale nie odbiera znaczenia pierwszemu fragmentowi. Status tezy dotyczy całego zebranego materiału, a relacja — każdego fragmentu ocenianego z osobna.", "uncertainty": "Przykład fikcyjny: W krótkim streszczeniu debaty o programie poprawy efektywności energetycznej domów zapisano, że omawiano problem określony jako „wysokie koszty utrzymania odpowiedniej temperatury w domu”. Chcesz sprawdzić tezę, że narrator wprost obwinił konkretną instytucję, lecz nie masz pełnej wypowiedzi. Streszczenie tego nie rozstrzyga: trzeba odnaleźć oryginał. Brak informacji o obwinianiu w streszczeniu nie dowodzi, że nie było go w wypowiedzi."}, "SOLO": {"narrative": "Przykład fikcyjny: W wypowiedzi o programie wydłużenia godzin pracy biblioteki wskazano, że szkody doświadczają osoby pracujące do późna, które nie mogą korzystać z biblioteki. Jest postać w roli ofiary i odniesienie do działania publicznego. To spełnia minimum NPF, nawet jeśli fragment nie opisuje jeszcze bohatera ani rozwiązania. Sama liczba wydanych środków nie wskazuje żadnej roli postaci.", "form": "Przykład fikcyjny: Opowieść o programie wydłużenia godzin pracy biblioteki: podczas konsultacji (tło) opisano poszkodowanych mieszkańców (postać). „Wieczorne otwarcie ma umożliwić osobom pracującym wypożyczanie książek” łączy działanie ze zmianą sytuacji (fabuła). „Otwórzmy bibliotekę w dodatkowy wieczór” wskazuje postulowane działanie (morał). Te cztery kody opisują budowę wypowiedzi.", "characters": "Przykład fikcyjny: Ofiara: osoby pracujące do późna, które nie mogą korzystać z biblioteki — w opowieści to grupa narażona na szkodę. Bohater: zespół biblioteki — jeśli tekst właśnie tej postaci przypisuje możliwość pomocy. Antagonistę można rozpoznać w osobnej wypowiedzi: „Zarządca A celowo blokuje dostęp do wejścia i uniemożliwia czytelnikom korzystanie z biblioteki”. To odczytanie ról w wymyślonych tekstach, nie ocena rzeczywistych podmiotów.", "setting": "Przykład fikcyjny: „Podczas jesiennych konsultacji w gminie, przy ograniczonym budżecie, dyskutujemy o programie wydłużenia godzin pracy biblioteki”. Czas konsultacji, gmina i ograniczenie zasobów tworzą tło. Tłem mogą być też opisane w źródle przepisy, normy albo zdarzenie skupiające uwagę; nie dopisuj ich z własnej wiedzy.", "plot": "Przykład fikcyjny: „Czytelnicy poprosili o dostęp do książek po pracy. Zespół biblioteki zaproponował dodatkowy wieczór; pracownicy zażądali ustalenia obsady, zanim zostaną zmienione godziny otwarcia.” F let gContext='SOLO',gQuery='',gClaim='H1',gCase=null;
const gReadOpen=new Set(),gClaimsOpen=new Set(['H1']);
const gNormalize=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ł/g,'l');
function gContextNow(){return db.selected?.startsWith('team:')?db.selected.slice(5):'SOLO';}
function gGlossaryBody(target=''){
 const groups=[...new Set(GLOSSARY.map(x=>x.group))];
 return `<p class="g-intro">Wybierz hasło, a potem rozwiń przykład. To pomoc do analizy; nie musisz czytać całego słownika przed grą.</p><div class="g-controls"><label for="gSearch">Znajdź pojęcie<input type="search" id="gSearch" placeholder="Np. bohater, fabuła, mikro…" value="${esc(gQuery)}" autocomplete="off"></label><label for="gContext">Kontekst przykładów<select id="gContext">${Object.entries(GCONTEXTS).map(([id,label])=>`<option value="${id}" ${gContext===id?'selected':''}>${esc(label)}</option>`).join('')}</select></label></div><p class="small g-fiction">Wszystkie przykłady są wymyślone do nauki. Nie opisują rzeczywistych zdarzeń ani akt zdobywanych w śledztwie.</p><p class="small" id="gCount" role="status"></p>${groups.map(group=>`<section class="g-group"><h3>${esc(group)}</h3>${GLOSSARY.filter(t=>t.group===group).map(t=>`<details class="g-entry" data-term="${t.id}" ${target===t.id?'open':''}><summary><span>${esc(t.title)}</span>${t.english?`<small>${esc(t.english)}</small>`:''}</summary><div class="g-definition"><p>${esc(t.definition)}</p><p class="g-caution"><b>Granica interpretacji:</b> ${esc(t.caution)}</p>${t.detail?`<details class="g-more"><summary>${esc(t.detailTitle)}</summary><p>${esc(t.detail)}</p></details>`:''} <details class="g-example"><summary>Przykład: ${esc(GCONTEXTS[gContext])}</summary><p>${esc(GEXAMPLES[gContext][t.id])}</p></details><p class="small muted">${t.kind==='NPF'?`Podstawa: Jones i in. (2023), s. ${esc(t.pages)}. Parafraza definicji rozdziału; przykład jest autorski.`:'Autorska pomoc metodyczna do tej gry. Statusy i reguły punktowania nie są definicjami NPF z rozdziału.'}</p></div></details>`).join('')}</section>`).join('')}<p id="gNoResults" class="notice" hidden>Nie znaleziono hasła. Spróbuj krótszej nazwy, np. „postać”, „wpływ” albo „dowód”.</p><p class="small muted">Numery oznaczają strony drukowane rozdziału. Możesz wrócić do zadania przez „Zamknij” lub Escape. Pomoc jest dozwolona.</p>`;
}
function gFilter(){const q=gNormalize(gQuery.trim());let count=0;document.querySelectorAll('.g-entry').forEach(el=>{const t=GLOSSARY.find(x=>x.id===el.dataset.term);el.hidden=!!q&&!gNormalize(t.title+' '+t.english+' '+t.group+' '+t.definition+' '+t.caution+' '+(t.detail||'')).includes(q);if(!el.hidden)count++;});document.querySelectorAll('.g-group').forEach(el=>el.hidden=![...el.querySelectorAll('.g-entry')].some(x=>!x.hidden));$('#gCount').textContent=`Widoczne hasła: ${count} z ${GLOSSARY.length}.`;$('#gNoResults').hidden=count!==0;}
function gWireGlossary(){
 $('#gSearch').oninput=e=>{gQuery=e.target.value;gFilter();};
 $('#gSearch').onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();$('#helpDialog').close();}};
 $('#gContext').onchange=e=>{gContext=e.target.value;const entries=[...document.querySelectorAll('.g-entry')],open=entries.filter(x=>x.open).map(x=>x.dataset.term),examples=entries.filter(x=>x.querySelector('.g-example').open).map(x=>x.dataset.term),more=entries.filter(x=>x.querySelector('.g-more')?.open).map(x=>x.dataset.term),y=$('#helpDialog').scrollTop;$('#dialogBody').innerHTML=gGlossaryBody();for(const id of open)$(`[data-term="${id}"]`).open=true;for(const id of examples)$(`[data-term="${id}"] .g-example`).open=true;for(const id of more)$(`[data-term="${id}"] .g-more`).open=true;gWireGlossary();gFilter();$('#gContext').focus({preventScroll:true});$('#helpDialog').scrollTop=y;};
}
function gOpen(target=''){markHelp();gContext=gContextNow();gQuery='';dialog('Pojęcia NPF',gGlossaryBody(target));gWireGlossary();gFilter();if(target){const el=$(`[data-term="${target}"]`);el.scrollIntoView({block:'nearest'});el.querySelector('summary').focus({preventScroll:true});}}
$('#glossaryBtn').onclick=()=>gOpen();
function gConceptButton(id,label){return `<button class="quiet g-concept" type="button" data-concept="${id}">${esc(label)}</button>`;}
function gComplete(a){return !!(a.verdict&&a.links.some(l=>l.card&&l.relation)&&a.links.every(l=>(!l.card&&!l.relation)||(l.card&&l.relation))&&a.note.trim().length>=12);}
function gProgress(){if(view!=='detective'||ds()?.screen!=='board')return;let n=0;for(const h of ['H1','H2','H3']){const good=gComplete(ds().board[h]);if(good)n++;const e=$(`[data-complete="${h}"]`);if(e)e.textContent=good?'Uzupełniono':'Do uzupełnienia';}const p=$('#gProgress');if(p){const text=`Uzupełniono ${n} z 3 tez. To stan formularza, nie ocena poprawności.`;if(p.textContent!==text)p.textContent=text;}}
function gOpenClaim(h,focus=false){gClaim=h;gClaimsOpen.add(h);const section=$(`[data-claim="${h}"]`);if(section){section.open=true;if(focus)section.querySelector('summary').focus();}}
function gEnhanceBoard(){
 const s=ds();
 const tools=$('.d-inline-tools');tools.insertAdjacentHTML('afterend',`<details class="g-worked"><summary>Jak odróżnić status tezy od znaczenia dokumentu?</summary><p><b>Status tezy</b> to wniosek z całej zdobytej teczki. <b>Relacja dokumentu</b> mówi, co jeden wskazany materiał wnosi do tej tezy. Dokument może nie rozstrzygać tezy, którą wspiera inny dokument.</p><p><b>Przykład spoza śledztwa:</b> teza mówi, że nowy rozkład biblioteki wydłużył otwarcie we wtorki. Stary i nowy rozkład wskazują tę samą godzinę — to osłabia tezę. Licznik wejść na stronę nie rozstrzyga godzin otwarcia. Nie musisz nadawać obu dokumentom tej samej relacji.</p><p>Wystarczą 1–2 zdania notatki: wskaż fragment, wyjaśnij jego znaczenie i zaznacz granicę wniosku.</p>${gConceptButton('evidence','Pojęcia: teza i dowód')}${gConceptButton('uncertainty','Kiedy „nierozstrzygnięta”?')}</details><p class="small" id="gProgress" role="status"></p><div class="notice" id="gError" role="alert" hidden></div>`);
 const sections=[...document.querySelectorAll('#detective .d-hypothesis')];
 sections.forEach((section,i)=>{

  section.replaceWith(details);details.append(section);
  details.addEventListener('toggle',()=>{if(!details.isConnected)return;if(details.open){gClaim=h;gClaimsOpen.add(h);}else gClaimsOpen.delete(h);});
  section.insertAdjacentHTML('afterbegin',gConceptButton(({H1:'scope',H2:'mechanisms',H3:'evidence'})[h],({H1:'Co to jest zakres konfliktu?',H2:'Jak badać wpływ narracji?',H3:'Teza a dowód — wyjaśnienie'})[h]));
  const verdict=section.querySelector('[data-verdict]').parentElement;verdict.firstChild.textContent='Wniosek z całej teczki';
  section.querySelectorAll('[data-link-rel]').forEach(el=>el.parentElement.firstChild.textContent='Znaczenie tego dokumentu');
  section.querySelectorAll('.d-evidence-link').forEach((row,j)=>{
   const btn=row.querySelector('[data-read]');if(!btn)return;const card=btn.dataset.read,c=dCard(card),key=`${dDB.selected}:${h}:${j}:${card}`;
   const read=document.createElement('details');read.className='g-inline-evidence';read.dataset.readKey=key;read.open=gReadOpen.has(key);read.innerHTML=`<summary>Treść ${card} przy tej tezie</summary><span class="source-tag">Fikcyjny dokument z teczki</span><p>${esc(c.body)}</p>`;read.addEventListener('toggle',()=>{if(!read.isConnected)return;if(read.open)gReadOpen.add(key);else gReadOpen.delete(key);});btn.remove();row.append(read);
  });
  if(i<2){const btn=document.createElement('button');btn.type='button';btn.className='quiet';btn.textContent='Przejdź do H'+(i+2)+' →';btn.onclick=()=>gOpenClaim('H'+(i+2),true);section.append(btn);}
 });
 const revision=$('#dRevision');if(revision)revision.insertAdjacentHTML('afterend','<p class="small">Wystarczą 1–2 zdania: co zmieniacie lub utrzymujecie oraz który fragment to uzasadnia.</p>');

const gOriginalDRender=dRender;

 else{const claims=[...document.querySelectorAll('#detective .g-claim')];if(claims.length){gClaimsOpen.clear();claims.forEach(el=>{if(el.open)gClaimsOpen.add(el.dataset.claim);});}document.querySelectorAll('#detective .g-inline-evidence').forEach(el=>{if(el.open)gReadOpen.add(el.dataset.readKey);else gReadOpen.delete(el.dataset.readKey);});}

 if(ds().screen==='files')$('.d-title').insertAdjacentHTML('afterend',`<details class="g-worked"><summary>Jak wybrać przydatny trop?</summary><p>Najpierw wskażcie tezę, którą chcecie sprawdzić. Następnie wybierzcie dokument, który może dostarczyć potrzebnej informacji. D0 oznacza dzień publikacji A; D+8 jest osiem dni później, D−21 — 21 dni wcześniej.</p><p>W eksperymencie grupa porównawcza pozwala ocenić, czy reakcja różni się po innej wersji komunikatu. Samo odnotowanie reakcji po lekturze nie wyodrębnia wpływu tekstu.</p>${gConceptButton('evidence','Teza i dowód')}${gConceptButton('mechanisms','Dwie drogi wpływu narracji')}</details>`);

};
const gOriginalSubmit=dSubmit;
dSubmit=function(){
 const s=ds();let issue=null;
 for(const h of ['H1','H2','H3']){const a=s.board[h];
  if(!a.verdict){issue={h,selector:`[data-verdict="${h}"]`,message:`${h}: wybierz wniosek z całej teczki.`};break;}
  if(!a.links.some(l=>l.card&&l.relation)){const i=Math.max(0,a.links.findIndex(l=>l.card||l.relation)),field=a.links[i].card?'rel':'card';issue={h,selector:`[data-link-${field}="${h}"][data-index="${i}"]`,message:`${h}: wskaż dokument i określ jego znaczenie dla tej tezy.`};break;}
  const incomplete=a.links.findIndex(l=>!!l.card!==!!l.relation);
  if(incomplete>=0){const field=a.links[incomplete].card?'rel':'card';issue={h,selector:`[data-link-${field}="${h}"][data-index="${incomplete}"]`,message:`${h}: dokończ powiązanie dokumentu ${incomplete+1} albo usuń nieużywane pole.`};break;}
  if(a.note.trim().length<12){issue={h,selector:`[data-claim-note="${h}"]`,message:`${h}: dopisz krótkie uzasadnienie (co najmniej 12 znaków). Wskaż fragment i granicę wniosku.`};break;}
 }
 if(!issue&&s.twist&&s.revision.trim().length<12)issue={selector:'#dRevision',message:'Dopisz, co zmieniacie lub utrzymujecie po nowym dokumencie i dlaczego (co najmniej 12 znaków).'};
 if(issue){const error=$('#gError');if(error){error.hidden=false;error.textContent=issue.message;}if(issue.h)gOpenClaim(issue.h);const field=$(issue.selector);if(field){if(error)field.parentElement.insertAdjacentElement('beforebegin',error);field.setAttribute('aria-invalid','true');field.setAttribute('aria-describedby','gError');field.focus();field.scrollIntoView({block:'center'});field.addEventListener('input',()=>{field.removeAttribute('aria-invalid');field.removeAttribute('aria-describedby');if(error)error.hidden=true;},{once:true});}return false;}
 return gOriginalSubmit();
};

// Shared portable receipt format. A checksum is not an authentication signature.
const Receipt = (()=>{
 const MAX_TEXT=240000, MAX_CODE=40000;
 const fail=m=>{throw Error(m);};
 const object=x=>x&&typeof x==='object'&&!Array.isArray(x);
 const sum=s=>{let h=2166136261;for(const b of new TextEncoder().encode(s)){h^=b;h=Math.imul(h,16777619);}return(h>>>0).toString(16).padStart(8,'0');};
 const b64=b=>{let s='';for(const x of b)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
 const un64=s=>{if(!/^[\w-]+$/.test(s)||s.length%4===1)fail('Nieprawidłowe kodowanie.');return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),x=>x.charCodeAt(0));};
 async function transform(bytes,kind){const stream=new Blob([bytes]).stream().pipeThrough(kind==='zip'?new CompressionStream('gzip'):new DecompressionStream('gzip'));const reader=stream.getReader();let n=0,parts=[];while(true){const r=await reader.read();if(r.done)break;n+=r.value.length;if(n>MAX_TEXT){await reader.cancel();fail('Zapis jest zbyt duży.');}parts.push(r.value);}const out=new Uint8Array(n);let k=0;for(const p of parts){out.set(p,k);k+=p.length;}return out;}
 async function encode(p){validate(p);const json=JSON.stringify(p),bytes=new TextEncoder().encode(json);if(bytes.length>MAX_TEXT)fail('Zapis jest zbyt obszerny. Zachowaj pełny JSON i skontaktuj się z prowadzącym.');const zip=typeof CompressionStream!=='undefined',body=b64(zip?await transform(bytes,'zip'):bytes),head='NPF1.'+(zip?'G':'J')+'.'+body,code=head+'.'+sum(head);if(code.length>MAX_CODE)fail('Kod przekracza 40 000 znaków. Zachowaj pełny JSON; nie skracaj kodu ręcznie.');return code;}
 async function decode(input){const s=input.replace(/\s/g,'');if(s.length>MAX_CODE)fail('Kod przekracza dopuszczalną długość.');const m=s.match(/^(NPF1\.(G|J)\.([\w-]+))\.([a-f0-9]{8})$/);if(!m)fail('To nie jest kod NPF1. Wklej cały kod ukończenia, nie plik JSON.');if(sum(m[1])!==m[4])fail('Suma kontrolna nie zgadza się — skopiuj kod ponownie.');let bytes=un64(m[3]);if(m[2]==='G'){if(typeof DecompressionStream==='undefined')fail('Otwórz dekoder w aktualnej przeglądarce obsługującej dekompresję gzip.');bytes=await transform(bytes,'unzip');}if(bytes.length>MAX_TEXT)fail('Zbyt duży zapis.');const p=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(bytes));return validate(p);}
 function validate(p){
  if(!object(p)||p.schema!==1||p.game!=='3.2'||p.key!=='NPF-20261029'||!['solo','team'].includes(p.mode))fail('Nieobsługiwana wersja lub tryb kodu.');
  if(typeof p.created!=='string'||p.created.length>80||!Number.isFinite(Date.parse(p.created))||typeof p.id!=='string'||p.id!==p.mode+'-'+p.program+'-'+p.created)fail('Nieprawidłowy identyfikator rozgrywki.');
  if(!object(p.state)||!object(p.score))fail('Brak zapisu lub wyniku.');
  let calculated,details=[];
  if(p.mode==='solo'){
   if(p.program!=='LIB'||!Array.isArray(p.state.answers)||p.state.answers.length!==SOLO.questions.length)fail('Niekompletny trening.');
   let first=0,final=0,help=0;
   SOLO.questions.forEach((q,i)=>{const a=p.state.answers[i];if(!object(a)||a.id!==q.id||!Number.isInteger(a.attempts)||a.attempts<1||a.attempts>999||typeof a.firstHelp!=='boolean'||![a.first,a.last].every(n=>Number.isInteger(n)&&n>=0&&n<q.options.length)||(a.attempts===1&&a.first!==a.last))fail('Nieprawidłowy zapis odpowiedzi '+q.id);first+=+(a.first===q.correct);final+=+(a.last===q.correct);help+=+a.firstHelp;details.push({question:q.id,topic:q.topic,first:a.first,last:a.last,firstText:q.options[a.first],lastText:q.options[a.last],correctText:q.options[q.correct],attempts:a.attempts,help:a.firstHelp,firstCorrect:a.first===q.correct,lastCorrect:a.last===q.correct});});calculated={first,final,total:5,help};
  }else{
   if(!PROGRAMS.includes(p.program)||!p.state.closed||!p.state.twist||p.state.created!==p.created)fail('Śledztwo nie jest ukończone.');
   // Reject oversize text instead of silently truncating submitted reasoning.
   for(const b of [p.state.board,p.state.first?.board])for(const h of ['H1','H2','H3'])if(typeof b?.[h]?.note!=='string'||b[h].note.length>4000)fail('Nieprawidłowa długość uzasadnienia.');
   if(typeof p.state.revision!=='string'||p.state.revision.length>16000)fail('Nieprawidłowa rewizja.');
   const s=validateDetective({selected:p.program,sessions:{[p.program]:p.state}}).sessions[p.program];
   if(!s.first.opened.every((x,i)=>s.opened[i]===x))fail('Niespójna kolejność zdobywania akt.');
   const r=dEvaluate(p.program,s);calculated={recon:r.recon,claims:r.claims,total:r.total,max:12};
   details=r.rows.map(row=>({hypothesis:row.h,before:s.first.board[row.h].verdict,after:s.board[row.h].verdict,expected:row.expected,points:row.score,firstEvidence:s.first.board[row.h].links,finalEvidence:s.board[row.h].links,firstNote:s.first.board[row.h].note,finalNote:s.board[row.h].note,revision:s.revision}));
  }
  const mismatch=Object.keys(calculated).some(k=>p.score[k]!==calculated[k]);return {payload:p,calculated,details,mismatch,fingerprint:sum(JSON.stringify(p))};
 }
 function parseCSV(text){if(text.length>20000000)fail('Plik CSV jest zbyt duży (limit 20 MB).');text=text.replace(/^\uFEFF/,'');const line=text.split(/\r?\n/)[0],sep=(line.match(/;/g)||[]).length>(line.match(/,/g)||[]).length?';':',';let rows=[],row=[],v='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){v+='"';i++;}else if(quoted)quoted=false;else if(v==='')quoted=true;else v+=c;}else if(!quoted&&(c===sep||c==='\n'||c==='\r')){row.push(v);v='';if(c!==sep){if(c==='\r'&&text[i+1]==='\n')i++;if(row.some(Boolean))rows.push(row);row=[];}}else v+=c;}if(quoted)fail('Niezamknięty cudzysłów w CSV.');row.push(v);if(row.some(Boolean))rows.push(row);return rows;}
 function csv(rows){return '\uFEFF'+rows.map(row=>row.map(v=>{let s=typeof v==='object'?JSON.stringify(v):String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');}
 return{encode,decode,validate,parseCSV,csv,sum};
})();

// NPF receipts: no student identity is collected by the game.
const RECEIPT_FORM='https://docs.google.com/forms/d/e/1FAIpQLSdb0oWIiDG7E0gY0PXgeZqsOVkQ2iZvrfeMb2A4fvbNSpfHKg/viewform';
function receiptPayload(){
 const isTeam=dActive(),mode=isTeam?'team':'solo',s=isTeam?ds():session();
 if(!s||(!isTeam&&db.selected!=='solo'))throw Error('Najpierw wybierz tryb gry.');
 let state,score,program;
 if(isTeam){if(!s.closed)throw Error('Najpierw przekaż raport do kontroli.');state=clone(s);state.notes='';program=dDB.selected;const r=dEvaluate(program,s);score={recon:r.recon,claims:r.claims,total:r.total,max:12};}
 else{const qs=bank('solo');if(!qs.every(q=>s.answers[q.id]?.attempts>0&&s.answers[q.id].selected===s.answers[q.id].checked))throw Error('Sprawdź odpowiedzi na wszystkie pięć pytań, w tym ostatnie zmiany.');state={answers:qs.map(q=>{const a=s.answers[q.id];return{id:q.id,first:a.firstSelected,last:a.checked,attempts:a.attempts,firstHelp:a.firstHelp};})};const t=stats('solo');score={first:t.first,final:t.final,total:t.total,help:t.helpFirst};program='LIB';}
 const p={schema:1,game:'3.2',key:'NPF-20261029',mode,program,id:mode+'-'+program+'-'+s.created,created:s.created,state,score};Receipt.validate(p);return p;
}
async function openReceipt(){
 try{const p=receiptPayload(),code=await Receipt.encode(p);dialog('Oddaj rozgrywkę',`<p><b>${p.mode==='solo'?'Trening indywidualny':'Śledztwo zespołowe — '+esc(p.program)}</b>. ${p.mode==='solo'?`Pierwsze trafne: ${p.score.first}/5; końcowe: ${p.score.final}/5.`:`Wynik: ${p.score.total}/12.`}</p><ol><li>Skopiuj cały kod poniżej.</li><li>Otwórz formularz i zaloguj się na konto UW.</li><li>Wklej kod i dopisz własną refleksję. Wyślij formularz.</li></ol><p class="small">${p.mode==='team'?'Każda osoba z zespołu przesyła ten sam kod, ale własną refleksję. Kod zawiera pierwszy i końcowy raport, uzasadnienia oraz historię działań.':'Kod zawiera pierwsze i końcowe odpowiedzi, liczbę prób i pomoc przed pierwszą próbą.'} Nie zawiera automatycznie nazwiska ani e-maila. E-mail zbierze formularz. Kodowanie nie jest szyfrowaniem.</p><label for="receiptCode"><b>Kod ukończenia — ${code.length} znaków</b></label><textarea id="receiptCode" readonly rows="4" spellcheck="false" style="width:100%;box-sizing:border-box;font-family:monospace;word-break:break-all"></textarea><div class="actions"><button id="copyReceipt" class="primary">Kopiuj kod</button><button id="downloadReceipt">Pobierz kod TXT</button><a class="button" href="${RECEIPT_FORM}" target="_blank" rel="noopener noreferrer">Otwórz formularz UW ↗</a></div><p id="receiptMessage" role="status">Samo wygenerowanie kodu nie wysyła pracy. Oddanie następuje w formularzu.</p><details><summary>Co przekazujesz prowadzącemu?</summary><p>Kod służy analizie wyborów. Wynik automatyczny nie ocenia uzasadnień i nie potwierdza samodzielności. Sprawdź, czy notatki nie zawierają danych osobowych.</p><pre id="receiptPreview" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></details>`);
 $('#receiptCode').value=code;$('#receiptPreview').textContent=JSON.stringify(p,null,2);
 $('#copyReceipt').onclick=async()=>{const box=$('#receiptCode');try{await navigator.clipboard.writeText(code);$('#receiptMessage').textContent='Kod skopiowany. Teraz wklej go do formularza i wyślij odpowiedź.';}catch{box.focus();box.select();$('#receiptMessage').textContent='Kod zaznaczony. Naciśnij Ctrl+C (na Macu ⌘C) lub użyj opcji kopiowania telefonu.';}};
 $('#downloadReceipt').onclick=()=>download('NPF_kod_'+p.mode+'_'+p.program+'.txt',code,'text/plain;charset=utf-8');
 }catch(e){dialog('Nie można przygotować kodu',`<p>${esc(e.message)}</p><p>Zachowaj kopię JSON. Nie skracaj ręcznie kodu ani uzasadnień.</p>`);}
}
function mountReceipt(){
 const host=dActive()&&ds().closed&&ds().screen==='report'?$('#detective .d-main'):!dActive()&&db.selected==='solo'&&view==='result'?$('#result'):null;
 if(!host||host.querySelector('.receipt-panel'))return;
 if(!dActive()&&!bank('solo').every(q=>session().answers[q.id]?.attempts>0&&session().answers[q.id].selected===session().answers[q.id].checked))return;
 document.querySelectorAll('.receipt-panel').forEach(p=>p.remove());
 const p=document.createElement('section');p.className='panel no-print receipt-panel';p.innerHTML='<h2>Oddaj rozgrywkę</h2><p>Przygotuj kod wyborów i wyniku do formularza UW. Wysłanie odbywa się dopiero w formularzu.</p><button class="primary" id="makeReceipt">Przygotuj kod ukończenia</button>';
 const lead=host.querySelector('.lead');if(lead)lead.after(p);else host.append(p);p.querySelector('button').onclick=openReceipt;
}
const receiptOldRender=renderResult;renderResult=function(...args){const r=receiptOldRender(...args);mountReceipt();return r;};
const receiptOldDetective=dRender;dRender=function(...args){const r=receiptOldDetective(...args);mountReceipt();return r;};
mountReceipt();
